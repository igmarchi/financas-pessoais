                      <button type="button" className="btn" disabled={savingProfile} onClick={saveImportProfile}>{savingProfile ? 'Salvando...' : 'Salvar como padrão deste cartão'}</button>
                      {hasSavedProfile && <button type="button" className="btn ghost" onClick={removeImportProfile}>Remover padrão salvo</button>}
                      {profileSavedMsg && <span style={{ color: 'var(--money)', fontSize: 13 }}>Padrão salvo.</span>}
                    </div>
                    <p className="page-sub" style={{ margin: '10px 0 0' }}>Esses ajustes já valem pro botão "Importar fatura" acima mesmo antes de salvar — teste à vontade antes de decidir gravar como padrão.</p>
                  </div>
                )}

                <Field label="Ou cole aqui o texto da fatura (opcional, se o PDF não for reconhecido)">
                  <textarea rows={4} value={impText} onChange={(e) => setImpText(e.target.value)}
                    placeholder={"10/08 UBER * TRIP SAO PAULO 23,90\n12/08 SUPERMERCADO BOM PRECO 3/6 145,00"}
                    style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 12.5, padding: '8px 10px', border: '1px solid var(--paper-line)', borderRadius: 7, resize: 'vertical' }} />
                </Field>
                {impBusy && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-faint)' }}>Lendo a fatura...</div>}
                {impError && <Banner type="error">{impError}</Banner>}
                {pdfNeedsPassword && (
                  <Field label="Senha do PDF"><input type="password" value={impPassword} placeholder="ex: primeiros dígitos do CPF" onChange={(e) => setImpPassword(e.target.value)} /></Field>
                )}

                {preview && (() => {
                  const nMatched = preview.filter((r) => r.reconcileStatus === 'matched').length;
                  const nMismatch = preview.filter((r) => r.reconcileStatus === 'mismatch').length;
                  const nNew = preview.filter((r) => r.reconcileStatus === 'new').length;
                  // Soma de TODOS os lançamentos que a leitura encontrou nessa fatura,
                  // independente do checkbox "incluir" — é o número que serve pra
                  // conferir contra o total impresso na fatura de verdade (se a leitura
                  // pulou ou duplicou alguma linha, esse total não vai bater). Já a soma
                  // "a importar" reflete só o que será de fato gravado, que pode ser menor
                  // quando parte do mês já tinha sido lançada manualmente antes.
                  const totalIdentificado = preview.reduce((s, r) => s + (toNumber(r.amount) || 0), 0);
                  const totalImportar = preview.filter((r) => r.include).reduce((s, r) => s + (toNumber(r.amount) || 0), 0);
                  return (
                  <div style={{ marginTop: 18 }}>
                    <h4 style={{ fontFamily: 'var(--font-display)', fontSize: 15, margin: '0 0 10px' }}>Revisar {preview.length} lançamento(s) encontrado(s)</h4>
                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                      {nMatched > 0 && <span className="pill money">✓ {nMatched} já lançado(s) certo</span>}
                      {nMismatch > 0 && <span className="pill spend">⚠ {nMismatch} com valor diferente</span>}
                      {nNew > 0 && <span className="pill gold">🆕 {nNew} novo(s)</span>}
                    </div>
                    <div className="grid grid-2" style={{ marginBottom: 16, maxWidth: 420 }}>
                      <div>
                        <p className="stat-label">Total identificado nesta fatura</p>
                        <p className="stat-value gold" style={{ fontSize: 19 }}>{fmtBRL(totalIdentificado)}</p>
                        <p className="page-sub" style={{ margin: '4px 0 0' }}>Confira com o total impresso na sua fatura.</p>
                      </div>
                      <div>
                        <p className="stat-label">Total a importar ({preview.filter((r) => r.include).length} marcado(s))</p>
                        <p className="stat-value money" style={{ fontSize: 19 }}>{fmtBRL(totalImportar)}</p>
                      </div>
                    </div>
                    <div style={{ overflowX: 'auto' }}>
                    <table>
                      <thead><tr><th></th><th>Status</th><th>Descrição</th><th>Categoria</th><th className="num">Parcela (R$)</th><th>Parcelas</th><th>Data</th><th>1ª fatura</th></tr></thead>
                      <tbody>
                        {preview.map((r, idx) => (
                          <tr className="row-hover" key={r._key}>
                            <td><input type="checkbox" checked={r.include} onChange={(e) => updatePreviewRow(idx, { include: e.target.checked })} /></td>
                            <td>
                              {r.reconcileStatus === 'matched' && <span className="pill money" style={{ whiteSpace: 'nowrap' }}>✓ Já lançado</span>}
                              {r.reconcileStatus === 'mismatch' && (
                                <span className="pill spend" style={{ whiteSpace: 'nowrap' }} title={`Já lançado com ${fmtBRL(r.matchedPurchase ? Number(r.matchedPurchase.amount) / Number(r.matchedPurchase.installments || 1) : 0)}`}>
                                  ⚠ Valor diferente
                                </span>
                              )}
                              {r.reconcileStatus === 'new' && <span className="pill gold" style={{ whiteSpace: 'nowrap' }}>🆕 Novo</span>}
                            </td>
                            <td><input type="text" value={r.description} style={{ minWidth: 160 }} onChange={(e) => updatePreviewRow(idx, { description: e.target.value })} /></td>
                            <td>
                              <CategorySelect value={r.category} onChange={(v) => updatePreviewRow(idx, { category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} />
                            </td>
                            <td className="num"><input type="text" inputMode="decimal" value={r.amount} style={{ width: 90, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { amount: e.target.value })} /></td>
                            <td><input type="number" min="1" max="48" value={r.installments} style={{ width: 60 }} onChange={(e) => updatePreviewRow(idx, { installments: parseInt(e.target.value) || 1 })} /></td>
                            <td><input type="date" value={r.purchaseDate || ''} style={{ width: 130 }} onChange={(e) => updatePreviewRow(idx, { purchaseDate: e.target.value })} /></td>
                            <td style={{ textAlign: 'right' }}><span className="pill" style={{ fontFamily: 'var(--font-mono)' }}>{shortMonthLabel(r.firstMonth)}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    </div>
                    <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                      <button className="btn" onClick={confirmImport}>Confirmar importação</button>
                      <button className="btn ghost" onClick={() => setPreview(null)}>Cancelar</button>
                    </div>
                  </div>
                  );
                })()}
              </div>

              <div className="card section-gap">
                <h3 className="section-title">Lançar compra — {selCard.name}</h3>
                <form className="entry-form cols-6" onSubmit={addPurchase}>
                  <Field label="Descrição"><input required value={pDesc} placeholder="Supermercado" onChange={(e) => setPDesc(e.target.value)} /></Field>
                  <Field label="Categoria"><CategorySelect value={pCat} onChange={setPCat} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
                  <Field label="Valor total (R$)"><input required type="text" inputMode="decimal" value={pAmount} placeholder="0,00" onChange={(e) => setPAmount(e.target.value)} /></Field>
                  <Field label="Data da compra"><input type="date" value={pDate} onChange={(e) => setPDate(e.target.value)} /></Field>
                  <Field label="Parcelas"><input required type="number" min="1" max="48" value={pInst} onChange={(e) => setPInst(e.target.value)} /></Field>
                  <Field label="1ª fatura"><input required type="month" value={pMonth} onChange={(e) => setPMonth(e.target.value)} /></Field>
                  <button type="submit" className="btn">Lançar</button>
                </form>
                <div className="entry-form ef-2col" style={{ marginTop: -8 }}>
                  <Field label="Observações (opcional)"><input value={pNotes} placeholder="ex: parcela 4/12, comprado com a Thais, etc." onChange={(e) => setPNotes(e.target.value)} /></Field>
                  <Field label="NF / comprovante (opcional)"><input type="file" accept="image/*,.pdf" ref={pReceiptRef} /></Field>
                </div>
              </div>
            </React.Fragment>
          )}
        </React.Fragment>
      )}

      {cards.length > 0 && (() => {
        const usingRange = histFrom || histTo;
        const historyEntries = [];
        if (usingRange) {
          let a = histFrom ? histFrom.slice(0, 7) : historyMonth;
          let b = histTo ? histTo.slice(0, 7) : historyMonth;
          if (a > b) { const t = a; a = b; b = t; }
          monthsBetween(a, b).forEach((m) => {
            purchases.forEach((p) => {
              const amt = cardInstallmentForMonth(p, m);
              // amt === 0 (não <= 0): um estorno de verdade tem valor
              // NEGATIVO neste mês e precisa aparecer no histórico (senão o
              // total mostrado fica maior que o real, sem descontar o
              // estorno) — só quando a parcela nem existe neste mês (fora do
              // intervalo) o valor é exatamente 0 e deve mesmo ficar de fora.
              if (amt === 0) return;
              const card = cards.find((c) => c.id === p.card_id);
              const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
              const [hy, hm] = m.split('-').map(Number);
              const idx = (hy - sy) * 12 + (hm - sm);
              historyEntries.push({ purchase: p, card, amount: amt, installIdx: idx + 1, invoiceMonth: m });
            });
          });
        } else {
          purchases.forEach((p) => {
            const amt = cardInstallmentForMonth(p, historyMonth);
            if (amt === 0) return;
            const card = cards.find((c) => c.id === p.card_id);
            const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
            const [hy, hm] = historyMonth.split('-').map(Number);
            const idx = (hy - sy) * 12 + (hm - sm);
            historyEntries.push({ purchase: p, card, amount: amt, installIdx: idx + 1, invoiceMonth: historyMonth });
          });
        }
        const filtered = historyEntries.filter((h) =>
          (!histCard || h.purchase.card_id === histCard) &&
          (!histDesc.trim() || h.purchase.description.toLowerCase().includes(histDesc.trim().toLowerCase())) &&
          (!histCat || h.purchase.category === histCat)
        );
        filtered.sort((a, b) => (b.invoiceMonth + (b.purchase.purchase_date || '')).localeCompare(a.invoiceMonth + (a.purchase.purchase_date || '')));
        const histTotal = filtered.reduce((s, h) => s + h.amount, 0);
        const histCats = [...new Set(purchases.map((p) => p.category))].sort();
        const filtersActive = histCard || histDesc || histCat || usingRange;

        return (
          <div className="card section-gap">
            <div className="page-head" style={{ marginBottom: 18 }}>
              <div><h3 className="section-title" style={{ margin: 0 }}>Histórico de compras</h3><div className="page-sub">Todos os cartões, por fatura</div></div>
              <div className="month-nav">
                <button onClick={() => setHistoryMonth(shiftMonth(historyMonth, -1))} disabled={usingRange}>&#8592;</button>
                <input type="month" value={historyMonth} onChange={(e) => e.target.value && setHistoryMonth(e.target.value)} disabled={usingRange}
                  style={{ fontFamily: 'var(--font-mono)', fontSize: 13, border: '1px solid var(--paper-line)', borderRadius: 7, padding: '5px 8px', textTransform: 'capitalize' }} />
                <button onClick={() => setHistoryMonth(shiftMonth(historyMonth, 1))} disabled={usingRange}>&#8594;</button>
              </div>
            </div>

            <div className="entry-form cols-6" style={{ marginBottom: 4 }}>
              <Field label="Cartão">
                <select value={histCard} onChange={(e) => setHistCard(e.target.value)}>
                  <option value="">Todos</option>
                  {cards.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </Field>
              <Field label="Descrição"><input value={histDesc} placeholder="buscar..." onChange={(e) => setHistDesc(e.target.value)} /></Field>
              <Field label="Categoria">
                <select value={histCat} onChange={(e) => setHistCat(e.target.value)}>
                  <option value="">Todas</option>
                  {histCats.map((c) => <option key={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Fatura de"><input type="month" value={histFrom} onChange={(e) => setHistFrom(e.target.value)} /></Field>
              <Field label="Fatura até"><input type="month" value={histTo} onChange={(e) => setHistTo(e.target.value)} /></Field>
              <button type="button" className="btn ghost" onClick={() => { setHistCard(''); setHistDesc(''); setHistCat(''); setHistFrom(''); setHistTo(''); }} disabled={!filtersActive}>Limpar</button>
            </div>
            {usingRange && <div className="page-sub" style={{ margin: '0 0 10px' }}>Mostrando o intervalo de faturas selecionado — a navegação por mês acima fica pausada até limpar os filtros.</div>}

            <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '14px 4px 14px' }}>
              <span className="page-sub" style={{ margin: 0 }}>{filtersActive ? 'TOTAL FILTRADO' : 'TOTAL DA FATURA'}</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(histTotal)}</span>
            </div>

            {filtered.length === 0 ? (
              <Empty title={filtersActive ? 'Nenhuma compra encontrada com esses filtros' : 'Nenhuma compra nesta fatura'} body={filtersActive ? 'Ajuste ou limpe os filtros acima.' : 'Navegue pelos meses acima ou lance uma nova compra em algum cartão.'} />
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table>
                  <thead><tr><th>Fatura</th><th>Cartão</th><th>Descrição</th><th>Categoria</th><th>Parcela</th><th className="num">Valor</th><th>Data da compra</th><th>Observações</th><th>NF</th><th></th></tr></thead>
                  <tbody>
                    {filtered.map((h, i) => editingPurchaseId === h.purchase.id ? (
                      <tr className="row-hover" key={h.purchase.id + '-' + h.invoiceMonth}>
                        <td><input type="month" value={editPurchase.first_month} style={{ width: 130 }} onChange={(e) => setEditPurchase({ ...editPurchase, first_month: e.target.value })} /></td>
                        <td><span className="pill gold">{h.card ? h.card.name : '—'}</span></td>
                        <td><input type="text" value={editPurchase.description} style={{ minWidth: 140 }} onChange={(e) => setEditPurchase({ ...editPurchase, description: e.target.value })} /></td>
                        <td><CategorySelect value={editPurchase.category} onChange={(v) => setEditPurchase({ ...editPurchase, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                        <td><input type="number" min="1" max="48" value={editPurchase.installments} style={{ width: 55 }} onChange={(e) => setEditPurchase({ ...editPurchase, installments: e.target.value })} /></td>
                        <td className="num"><input type="text" inputMode="decimal" value={editPurchase.amount} style={{ width: 90, textAlign: 'right' }} onChange={(e) => setEditPurchase({ ...editPurchase, amount: e.target.value })} /></td>
                        <td><input type="date" value={editPurchase.purchase_date} style={{ width: 135 }} onChange={(e) => setEditPurchase({ ...editPurchase, purchase_date: e.target.value })} /></td>
                        <td><input value={editPurchase.notes} style={{ minWidth: 100 }} onChange={(e) => setEditPurchase({ ...editPurchase, notes: e.target.value })} /></td>
                        <td colSpan={2} style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                          <button className="icon-btn" onClick={() => saveEditPurchase(h.purchase.id)}>Salvar</button>
                          <button className="icon-btn" onClick={cancelEditPurchase}>Cancelar</button>
                        </td>
                      </tr>
                    ) : (
                      <tr className="row-hover" key={h.purchase.id + '-' + h.invoiceMonth}>
                        <td>{shortMonthLabel(h.invoiceMonth)}</td>
                        <td><span className="pill gold">{h.card ? h.card.name : '—'}</span></td>
                        <td>{h.purchase.description}</td>
                        <td><span className="pill">{h.purchase.category}</span></td>
                        <td>{h.purchase.installments > 1 ? `${h.installIdx}/${h.purchase.installments}` : 'À vista'}</td>
                        <td className="num">{fmtBRL(h.amount)}</td>
                        <td>{h.purchase.purchase_date ? new Date(h.purchase.purchase_date + 'T00:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                        <td style={{ color: 'var(--ink-faint)' }}>{h.purchase.notes || '—'}</td>
                        <td>{h.purchase.receipt_path ? <button className="icon-btn" onClick={() => openPurchaseReceipt(h.purchase.receipt_path)}>Ver</button> : <span style={{ color: 'var(--ink-faint)' }}>—</span>}</td>
                        <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                          <button className="icon-btn" onClick={() => startEditPurchase(h.purchase)}>Editar</button>
                          {h.purchase.installments > 1 ? (
                            <React.Fragment>
                              <button className="icon-btn" title="Remove só a parcela deste mês — as de outros meses continuam" onClick={() => removeInstallmentMonth(h.purchase, h.invoiceMonth)}>Remover parcela</button>
                              <button className="icon-btn" title="Remove a compra inteira, todas as parcelas" onClick={() => deletePurchase(h.purchase)}>Remover tudo</button>
                            </React.Fragment>
                          ) : (
                            <button className="icon-btn" onClick={() => deletePurchase(h.purchase)}>Remover</button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })()}

      {cards.length > 0 && purchases.length > 0 && (() => {
        const startKeys = purchases.map((p) => toMonthKey(p.first_month)).filter(Boolean).sort();
        if (startKeys.length === 0) return null;
        const endKeys = cards.map((c) => currentInvoiceMonthKey(c));
        const startKey = startKeys[0];
        const endKey = endKeys.sort().reverse()[0];
        const allMonths = monthsBetween(startKey, endKey);
        const allRows = cards.map((c) => ({ card: c, values: allMonths.map((m) => cardTotalForMonth(purchases, c.id, m)) }));
        const allTotals = allMonths.map((m, i) => allRows.reduce((s, r) => s + r.values[i], 0));
        // Esconde meses sem lançamento algum nos cartões de hoje — ex.: meses
        // antes da primeira compra "de verdade" valer, que entravam no
        // intervalo só porque startKey vem do first_month mais antigo entre
        // as compras, mesmo quando nenhuma parcela cai de fato nesses meses.
        const visibleIdx = visibleMonthIndexes(allTotals);
        const months = visibleIdx.map((i) => allMonths[i]);
        const rows = allRows.map((r) => ({ card: r.card, values: visibleIdx.map((i) => r.values[i]) }));
        const totals = visibleIdx.map((i) => allTotals[i]);
        const stickyCell = { position: 'sticky', left: 0, background: 'var(--paper-raised)', whiteSpace: 'nowrap' };
        return (
          <div className="card section-gap">
            <h3 className="section-title">Histórico mensal por cartão</h3>
            <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Total de cada fatura, mês a mês, desde a primeira compra registrada — clique num cartão para ver por categoria</div>
            <div style={{ overflowX: 'auto' }}>
              <table>
                <thead>
                  <tr>
                    <th style={stickyCell}>Cartão</th>
                    <th className="num">Total</th>
                    {months.map((m) => <th key={m} className="num">{shortMonthLabel(m)}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row) => {
                    const isOpen = expandedCardHistory === row.card.id;
                    // Total da linha (soma de todos os meses do histórico, não só os
                    // visíveis sem rolar) — já reflete estorno corretamente, porque
                    // row.values vem de cardTotalForMonth, que já desconta estorno.
                    const rowTotal = row.values.reduce((s, v) => s + v, 0);
                    const catTotals = {};
                    if (isOpen) {
                      purchases.filter((p) => p.card_id === row.card.id).forEach((p) => {
                        if (!catTotals[p.category]) catTotals[p.category] = months.map(() => 0);
                        months.forEach((m, i) => { catTotals[p.category][i] += cardInstallmentForMonth(p, m); });
                      });
                    }
                    return (
                      <React.Fragment key={row.card.id}>
                        <tr className="row-hover" style={{ cursor: 'pointer', background: 'var(--paper-line)' }} onClick={() => setExpandedCardHistory(isOpen ? null : row.card.id)}>
                          <td style={{ ...stickyCell, background: 'var(--paper-line)' }}><span className="pill gold">{isOpen ? '▾' : '▸'} {row.card.name}</span></td>
                          <td className="num" style={{ fontWeight: 600 }}>{fmtBRL(rowTotal)}</td>
                          {row.values.map((v, i) => <td key={i} className="num">{v > 0 ? fmtBRL(v) : '—'}</td>)}
                        </tr>
                        {isOpen && Object.entries(catTotals).map(([cat, values]) => {
                          const catTotal = values.reduce((s, v) => s + v, 0);
                          return (
                            <tr key={row.card.id + '-' + cat} style={{ background: 'var(--paper-raised)' }}>
                              <td style={{ ...stickyCell, background: 'var(--paper-raised)', paddingLeft: 30, color: 'var(--ink-soft)', fontSize: 12.5 }}>{cat}</td>
                              <td className="num" style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{fmtBRL(catTotal)}</td>
                              {values.map((v, i) => <td key={i} className="num" style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{v > 0 ? fmtBRL(v) : '—'}</td>)}
                            </tr>
                          );
                        })}
                      </React.Fragment>
                    );
                  })}
                  <tr>
                    <td style={{ ...stickyCell, fontWeight: 600 }}>Total</td>
                    <td className="num" style={{ fontWeight: 600 }}>{fmtBRL(totals.reduce((s, v) => s + v, 0))}</td>
                    {totals.map((v, i) => <td key={i} className="num" style={{ fontWeight: 600 }}>{fmtBRL(v)}</td>)}
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ---------- Despesas (histórico, fixas + variáveis) ----------
function ExpenseHistoryTab({ session }) {
  const [list, setList] = useState([]);
  const [customCats, setCustomCats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [month, setMonth] = useState(monthKey(new Date()));

  const [date, setDate] = useState(todayLocalISO());
  const [desc, setDesc] = useState('');
  const [category, setCategory] = useState(CATS_EXP[0]);
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const [amount, setAmount] = useState('');
  const [installCount, setInstallCount] = useState('1');
  const [notes, setNotes] = useState('');
  const [uploading, setUploading] = useState(false);
  const receiptRef = useRef(null);
  const editReceiptRef = useRef(null);
  const allCats = [...CATS_EXP, ...customCats];

  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  const [filterDesc, setFilterDesc] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterPay, setFilterPay] = useState('');
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const filtersActive = filterDesc || filterCat || filterPay || filterFrom || filterTo;
  function clearFilters() { setFilterDesc(''); setFilterCat(''); setFilterPay(''); setFilterFrom(''); setFilterTo(''); }

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('expense_entries').select('*').order('entry_date', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function uploadReceipt(file) {
    const path = `${session.user.id}/${crypto.randomUUID()}-${file.name}`;
    const { error } = await sb.storage.from('comprovantes').upload(path, file);
    if (error) throw error;
    return path;
  }
  async function openReceipt(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir o comprovante.'); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = toNumber(amount);
    const inst = parseInt(installCount) || 1;
    if (!desc.trim() || !amt || !date) return;
    setUploading(true);
    let receiptPath = null;
    try {
      const file = receiptRef.current && receiptRef.current.files && receiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const perInstallment = Math.round((amt / inst) * 100) / 100;
    const rows = [];
    for (let i = 0; i < inst; i++) {
      rows.push({
        entry_date: addMonthsToDate(date, i),
        description: desc.trim() + (inst > 1 ? ` (${i + 1}/${inst})` : ''),
        category, payment_method: paymentMethod, amount: perInstallment,
        notes: notes.trim() || null,
        receipt_path: i === 0 ? receiptPath : null,
      });
    }
    const { error } = await sb.from('expense_entries').insert(rows);
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setDesc(''); setAmount(''); setNotes(''); setInstallCount('1');
    if (receiptRef.current) receiptRef.current.value = '';
    load();
  }
  async function remove(row) {
    if (row.receipt_path) await sb.storage.from('comprovantes').remove([row.receipt_path]);
    await sb.from('expense_entries').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ entry_date: row.entry_date, description: row.description, category: row.category, payment_method: row.payment_method || PAYMENT_METHODS[0], amount: row.amount, notes: row.notes || '', receipt_path: row.receipt_path || null });
  }
  function cancelEdit() { setEditingId(null); setEditRow(null); }
  async function saveEdit(id) {
    const amt = toNumber(editRow.amount);
    if (!editRow.description.trim() || !amt || !editRow.entry_date) return;
    setUploading(true);
    let receiptPath = editRow.receipt_path;
    try {
      const file = editReceiptRef.current && editReceiptRef.current.files && editReceiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('expense_entries').update({
      entry_date: editRow.entry_date, description: editRow.description.trim(), category: editRow.category,
      payment_method: editRow.payment_method, amount: amt, notes: editRow.notes.trim() || null, receipt_path: receiptPath,
    }).eq('id', id);
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const monthEntries = list.filter((e) => e.entry_date && e.entry_date.slice(0, 7) === month);
  const baseEntries = (filterFrom || filterTo)
    ? list.filter((e) => e.entry_date && (!filterFrom || e.entry_date >= filterFrom) && (!filterTo || e.entry_date <= filterTo))
    : monthEntries;
  const filteredEntries = baseEntries.filter((e) =>
    (!filterDesc.trim() || e.description.toLowerCase().includes(filterDesc.trim().toLowerCase())) &&
    (!filterCat || e.category === filterCat) &&
    (!filterPay || e.payment_method === filterPay)
  );
  const filteredTotal = filteredEntries.reduce((s, e) => s + Number(e.amount), 0);
  const filteredCardTotal = filteredEntries.filter((e) => e.payment_method === 'Cartão de crédito').reduce((s, e) => s + Number(e.amount), 0);
  const filteredCountedTotal = filteredTotal - filteredCardTotal;
  const allPaymentMethods = [...new Set([...PAYMENT_METHODS, ...list.map((e) => e.payment_method).filter(Boolean)])];

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Despesas</h1><div className="page-sub">Histórico de despesas fixas e variáveis, mês a mês</div></div>
        <div className="month-nav">
          <button onClick={() => setMonth(shiftMonth(month, -1))}>&#8592;</button>
          <span className="month-label">{monthLabel(month)}</span>
          <button onClick={() => setMonth(shiftMonth(month, 1))}>&#8594;</button>
        </div>
      </div>

      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Data"><input required type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Descrição"><input required value={desc} placeholder="Aluguel" onChange={(e) => setDesc(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <Field label="Valor total (R$)"><input required type="text" inputMode="decimal" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <button type="submit" className="btn" disabled={uploading}>{uploading ? 'Enviando...' : 'Adicionar'}</button>
        </form>
        <div className="entry-form ef-parcelas" style={{ marginTop: -8 }}>
          <Field label="Parcelas"><input type="number" min="1" max="48" value={installCount} onChange={(e) => setInstallCount(e.target.value)} /></Field>
          <Field label="Observações (opcional)"><input value={notes} placeholder="ex: nome de quem prestou o serviço, detalhe da compra..." onChange={(e) => setNotes(e.target.value)} /></Field>
          <Field label="Comprovante (opcional)"><input type="file" accept="image/*,.pdf" ref={receiptRef} /></Field>
        </div>
      </div>

      <div className="card section-gap">
        <div style={{ marginTop: 0, paddingTop: 0 }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--ink-faint)', marginBottom: 8 }}>Filtrar</div>
          <div className="entry-form cols-6" style={{ marginBottom: filtersActive ? 10 : 0 }}>
            <Field label="Descrição"><input value={filterDesc} placeholder="buscar..." onChange={(e) => setFilterDesc(e.target.value)} /></Field>
            <Field label="Categoria">
              <select value={filterCat} onChange={(e) => setFilterCat(e.target.value)}>
                <option value="">Todas</option>
                {allCats.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Forma de pagamento">
              <select value={filterPay} onChange={(e) => setFilterPay(e.target.value)}>
                <option value="">Todas</option>
                {allPaymentMethods.map((p) => <option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="De"><input type="date" value={filterFrom} onChange={(e) => setFilterFrom(e.target.value)} /></Field>
            <Field label="Até"><input type="date" value={filterTo} onChange={(e) => setFilterTo(e.target.value)} /></Field>
            <button type="button" className="btn ghost" onClick={clearFilters} disabled={!filtersActive}>Limpar</button>
          </div>
          {(filterFrom || filterTo) && (
            <div className="page-sub" style={{ margin: 0 }}>Mostrando o intervalo de datas selecionado — a navegação por mês acima fica pausada até limpar os filtros.</div>
          )}
        </div>

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '18px 4px 4px', flexWrap: 'wrap' }}>
          <span className="page-sub" style={{ margin: 0 }}>{filtersActive ? 'TOTAL FILTRADO (CONTA NO SALDO)' : 'TOTAL DO MÊS (CONTA NO SALDO)'}</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(filteredCountedTotal)}</span>
        </div>
        {filteredCardTotal > 0 && (
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 14px' }}>
            <span className="page-sub" style={{ margin: 0 }}>+ NO CARTÃO (NÃO CONTA AQUI)</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--ink-faint)' }}>{fmtBRL(filteredCardTotal)}</span>
          </div>
        )}

        {loading ? <Banner type="info">Carregando...</Banner> : filteredEntries.length === 0 ? (
          <Empty title={filtersActive ? 'Nenhuma despesa encontrada com esses filtros' : 'Nenhuma despesa lançada neste mês'} body={filtersActive ? 'Ajuste ou limpe os filtros acima para ver outros lançamentos.' : 'Preencha o formulário acima para lançar uma despesa fixa ou variável.'} />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma de pagamento</th><th className="num">Valor</th><th>Observações</th><th>Comprovante</th><th></th></tr></thead>
            <tbody>
              {filteredEntries.map((e) => editingId === e.id ? (
                <tr className="row-hover" key={e.id}>
                  <td><input type="date" value={editRow.entry_date} onChange={(ev) => setEditRow({ ...editRow, entry_date: ev.target.value })} style={{ width: 140 }} /></td>
                  <td><input value={editRow.description} onChange={(ev) => setEditRow({ ...editRow, description: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td>
                    <select value={editRow.payment_method} onChange={(ev) => setEditRow({ ...editRow, payment_method: ev.target.value })}>
                      {PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}
                    </select>
                  </td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input value={editRow.notes} onChange={(ev) => setEditRow({ ...editRow, notes: ev.target.value })} style={{ minWidth: 100 }} /></td>
                  <td>
                    {editRow.receipt_path && <div style={{ marginBottom: 4 }}><button type="button" className="icon-btn" onClick={() => openReceipt(editRow.receipt_path)}>Ver atual</button></div>}
                    <input type="file" accept="image/*,.pdf" ref={editReceiptRef} style={{ width: 140, fontSize: 11 }} />
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(e.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={e.id}>
                  <td>{new Date(e.entry_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td>
                    {e.description}
                    {e.fixed_expense_id && (
                      <div style={{ fontSize: 10.5, color: 'var(--ink-faint)', marginTop: 2 }} title="Gerado a partir de uma despesa fixa cadastrada — edite o valor se ele tiver sido diferente este mês.">
                        despesa fixa ⓘ
                      </div>
                    )}
                  </td>
                  <td><span className="pill">{e.category}</span></td>
                  <td>
                    {e.payment_method || '—'}
                    {e.payment_method === 'Cartão de crédito' && (
                      <div style={{ fontSize: 10.5, color: 'var(--ink-faint)', marginTop: 2 }} title="Este valor não entra no saldo geral nem no fluxo de caixa — quem soma gasto de cartão é a subaba Cartão de Crédito, dentro de Despesas. Lance a compra lá também se ainda não tiver feito.">
                        não soma no saldo ⓘ
                      </div>
                    )}
                  </td>
                  <td className="num">{fmtBRL(e.amount)}</td>
                  <td style={{ color: 'var(--ink-faint)' }}>{e.notes || '—'}</td>
                  <td>{e.receipt_path ? <button className="icon-btn" onClick={() => openReceipt(e.receipt_path)}>Ver</button> : <span style={{ color: 'var(--ink-faint)' }}>—</span>}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(e)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(e)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Supermercado ----------
function GroceryTab({ session }) {
  const [receipts, setReceipts] = useState([]);
  const [items, setItems] = useState([]);
  const [cards, setCards] = useState([]);
  const [linkedCardPurchases, setLinkedCardPurchases] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);

  const [preview, setPreview] = useState(null); // array de itens em revisão
  const [storeName, setStoreName] = useState('');
  const [purchaseDate, setPurchaseDate] = useState(todayLocalISO());
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const [selectedCardId, setSelectedCardId] = useState('');
  const [source, setSource] = useState('manual');
  const [saving, setSaving] = useState(false);
  const [editingReceiptId, setEditingReceiptId] = useState(null);
  const [existingPhotoPath, setExistingPhotoPath] = useState(null);
  const receiptFileRef = useRef(null);
  const reviewCardRef = useRef(null);
  // Clicar em "Editar" numa nota lá embaixo, na lista "Notas registradas",
  // abre o formulário de edição no topo da página — sem rolar a tela até lá,
  // parecia que o clique não tinha feito nada.
  useEffect(() => {
    if (editingReceiptId && reviewCardRef.current) {
      reviewCardRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, [editingReceiptId]);

  const [productListFilter, setProductListFilter] = useState('');
  const [brandListFilter, setBrandListFilter] = useState('');
  // Mês em exibição na lista "Notas registradas" — a lista cresce rápido (o
  // supermercado é lançado quase todo dia), então navegar mês a mês evita uma
  // tabela enorme com o histórico inteiro sempre visível.
  const [noteMonth, setNoteMonth] = useState(monthKey(new Date()));
  const [expandedReceipts, setExpandedReceipts] = useState(() => new Set());
  const [expandedProducts, setExpandedProducts] = useState(() => new Set());
  function toggleProductExpanded(key) {
    setExpandedProducts((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }
  function toggleReceiptExpanded(id) {
    setExpandedReceipts((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  async function load() {
    setLoading(true);
    const [r, i, c, cp] = await Promise.all([
      sb.from('grocery_receipts').select('*').order('purchase_date', { ascending: false }),
      sb.from('grocery_items').select('*').order('created_at', { ascending: false }),
      sb.from('cards').select('*').order('created_at'),
      sb.from('card_purchases').select('*').not('grocery_receipt_id', 'is', null),
    ]);
    if (c.data) setCards(c.data);
    if (cp.data) setLinkedCardPurchases(cp.data);
    if (r.error) setErro(r.error.message); else setReceipts(r.data || []);
    if (i.error) setErro(i.error.message); else setItems(i.data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function startNewNote() {
    setPreview([]);
    setStoreName('');
    setPurchaseDate(todayLocalISO());
    setPaymentMethod(PAYMENT_METHODS[0]);
    setSelectedCardId(cards.length === 1 ? cards[0].id : '');
    setSource('manual');
    setEditingReceiptId(null);
    setExistingPhotoPath(null);
  }
  function startEditReceipt(r) {
    const receiptItems = items.filter((it) => it.receipt_id === r.id);
    setPreview(receiptItems.map((it) => ({
      _key: crypto.randomUUID(),
      description: it.description, brand: it.brand || '', quantity: it.quantity, unit: it.unit || '',
      unitPrice: it.unit_price != null ? it.unit_price : '', totalPrice: it.total_price,
    })));
    setStoreName(r.store_name || '');
    setPurchaseDate(r.purchase_date);
    setPaymentMethod(PAYMENT_METHODS.includes(r.payment_method) ? r.payment_method : PAYMENT_METHODS[0]);
    const linked = linkedCardPurchases.find((cp) => cp.grocery_receipt_id === r.id);
    setSelectedCardId(linked ? linked.card_id : (cards.length === 1 ? cards[0].id : ''));
    setSource(r.source || 'manual');
    setEditingReceiptId(r.id);
    setExistingPhotoPath(r.receipt_photo_path || null);
    setErro(null);
  }
  function cancelReview() {
    setPreview(null); setEditingReceiptId(null); setExistingPhotoPath(null); setSelectedCardId('');
    if (receiptFileRef.current) receiptFileRef.current.value = '';
  }

  function updatePreviewRow(idx, patch) {
    setPreview((prev) => prev.map((r, i) => {
      if (i !== idx) return r;
      const merged = { ...r, ...patch };
      if ('quantity' in patch || 'unitPrice' in patch) {
        const qty = toNumber(merged.quantity) || 1;
        const price = toNumber(merged.unitPrice) || 0;
        merged.totalPrice = Math.round(qty * price * 100) / 100;
      }
      return merged;
    }));
  }
  function addManualRow() {
    setPreview((prev) => [...(prev || []), { _key: crypto.randomUUID(), description: '', brand: '', quantity: 1, unit: '', unitPrice: 0, totalPrice: 0 }]);
  }
  function removePreviewRow(idx) {
    setPreview((prev) => prev.filter((_, i) => i !== idx));
  }

  const previewTotal = (preview || []).reduce((s, r) => s + (toNumber(r.totalPrice) || 0), 0);

  async function saveReceipt() {
    if (!preview || preview.length === 0) { setErro('Adicione ao menos um item antes de salvar.'); return; }
    if (!purchaseDate) { setErro('Informe a data da compra.'); return; }
    if (paymentMethod === 'Cartão de crédito' && !selectedCardId) { setErro('Selecione qual cartão foi usado nesta compra.'); return; }
    setSaving(true); setErro(null);
    try {
      // Se uma foto nova foi escolhida, sobe e substitui a anterior (se houver).
      let receiptPhotoPath = existingPhotoPath;
      const receiptFile = receiptFileRef.current && receiptFileRef.current.files && receiptFileRef.current.files[0];
      if (receiptFile) {
        const path = `${session.user.id}/grocery/${crypto.randomUUID()}-${receiptFile.name}`;
        const { error: upErr } = await sb.storage.from('comprovantes').upload(path, receiptFile);
        if (upErr) throw new Error('Não foi possível salvar a foto da nota: ' + upErr.message);
        if (editingReceiptId && existingPhotoPath) await sb.storage.from('comprovantes').remove([existingPhotoPath]);
        receiptPhotoPath = path;
      }

      let receiptId = editingReceiptId;
      if (editingReceiptId) {
        const { error: upErr } = await sb.from('grocery_receipts').update({
          store_name: storeName.trim() || null, purchase_date: purchaseDate, total_amount: previewTotal,
          source, receipt_photo_path: receiptPhotoPath, payment_method: paymentMethod,
        }).eq('id', editingReceiptId);
        if (upErr) throw upErr;
        await sb.from('grocery_items').delete().eq('receipt_id', editingReceiptId);
      } else {
        const { data: receipt, error: rErr } = await sb.from('grocery_receipts').insert({
          store_name: storeName.trim() || null, purchase_date: purchaseDate, total_amount: previewTotal,
          source, receipt_photo_path: receiptPhotoPath, payment_method: paymentMethod,
        }).select().single();
        if (rErr) throw rErr;
        receiptId = receipt.id;
      }

      const itemRows = preview.map((r) => ({
        receipt_id: receiptId, description: r.description.trim(), brand: (r.brand || '').trim() || null, quantity: toNumber(r.quantity) || 1,
        unit: r.unit || null, unit_price: toNumber(r.unitPrice) || null, total_price: toNumber(r.totalPrice) || 0,
      }));
      const { error: iErr } = await sb.from('grocery_items').insert(itemRows);
      if (iErr) throw iErr;

      // Mantém a nota sincronizada com o resto do app, sem duplicar: se for
      // paga fora do cartão, vira uma linha em Despesas (soma no saldo). Se
      // for no cartão, vira um lançamento em Cartões, na fatura certa daquele
      // cartão (soma na fatura, não no saldo direto) — nunca as duas coisas
      // ao mesmo tempo, pra não contar o mesmo gasto duas vezes.
      const { data: existingExpense } = editingReceiptId
        ? await sb.from('expense_entries').select('id').eq('grocery_receipt_id', editingReceiptId).maybeSingle()
        : { data: null };
      const { data: existingCardPurchase } = editingReceiptId
        ? await sb.from('card_purchases').select('id').eq('grocery_receipt_id', editingReceiptId).maybeSingle()
        : { data: null };

      if (paymentMethod === 'Cartão de crédito') {
        if (existingExpense) await sb.from('expense_entries').delete().eq('id', existingExpense.id);
        const card = cards.find((c) => c.id === selectedCardId);
        const invoiceMonth = card ? currentInvoiceMonthKey(card, new Date(purchaseDate + 'T00:00:00')) : monthKey(new Date());
        const cardPurchasePayload = {
          card_id: selectedCardId, description: storeName.trim() || 'Supermercado', category: 'Alimentação',
          amount: previewTotal, installments: 1, first_month: monthKeyToDate(invoiceMonth), purchase_date: purchaseDate,
          notes: 'Nota de supermercado (' + preview.length + ' itens)', grocery_receipt_id: receiptId,
        };
        if (existingCardPurchase) await sb.from('card_purchases').update(cardPurchasePayload).eq('id', existingCardPurchase.id);
        else await sb.from('card_purchases').insert(cardPurchasePayload);
      } else {
        if (existingCardPurchase) await sb.from('card_purchases').delete().eq('id', existingCardPurchase.id);
        const expensePayload = {
          entry_date: purchaseDate, description: storeName.trim() || 'Supermercado', category: 'Alimentação',
          payment_method: paymentMethod, amount: previewTotal, notes: 'Nota de supermercado (' + preview.length + ' itens)',
          grocery_receipt_id: receiptId,
        };
        if (existingExpense) await sb.from('expense_entries').update(expensePayload).eq('id', existingExpense.id);
        else await sb.from('expense_entries').insert(expensePayload);
      }

      cancelReview();
      load();
    } catch (err) {
      setErro(err.message);
    }
    setSaving(false);
  }
  async function openReceiptPhoto(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir a foto da nota.'); return; }
    window.open(data.signedUrl, '_blank');
  }
  async function deleteReceipt(r) {
    if (r.receipt_photo_path) await sb.storage.from('comprovantes').remove([r.receipt_photo_path]);
    // A nota gera, ao salvar, uma linha espelhada em Despesas ou em Cartões
    // (ver saveReceipt) — sem apagar essa linha também, ela ficava "fantasma"
    // depois de remover a nota: continuava contando no saldo ou na fatura,
    // sem nenhum jeito de ver de onde tinha vindo.
    await sb.from('expense_entries').delete().eq('grocery_receipt_id', r.id);
    await sb.from('card_purchases').delete().eq('grocery_receipt_id', r.id);
    await sb.from('grocery_items').delete().eq('receipt_id', r.id);
    await sb.from('grocery_receipts').delete().eq('id', r.id);
    load();
  }


  // Radar de preços e "Todos os produtos": agrupa por produto + marca juntos —
  // "Barra proteica Pinati" e "Barra proteica" de outra marca são produtos
  // diferentes, com preços diferentes, e não devem se misturar.
  const productGroups = {};
  items.forEach((it) => {
    if (!it.unit_price) return;
    const r = receipts.find((rr) => rr.id === it.receipt_id);
    if (!r) return;
    const key = normalizeText(it.description) + '|' + normalizeText(it.brand || '');
    if (!productGroups[key]) productGroups[key] = [];
    productGroups[key].push({ ...it, receipt: r });
  });
  const radar = Object.values(productGroups)
    .filter((g) => g.length >= 3)
    .map((g) => {
      const sorted = [...g].sort((a, b) => a.receipt.purchase_date.localeCompare(b.receipt.purchase_date));
      const s = summarizeQtyPriceHistory(sorted);
      return { description: sorted[sorted.length - 1].description, brand: sorted[sorted.length - 1].brand || '', avg: s.avg, last: s.lastPrice, pct: s.pct, count: s.count, qtyUnit: s.qtyUnit };
    })
    .filter((r) => Math.abs(r.pct) >= 5)
    .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))
    .slice(0, 8);

  // Lista de todos os produtos já comprados, independente da nota/loja — cada
  // grupo mostra a descrição/marca mais recentes, quantas vezes foi comprado,
  // a quantidade total (somada na mesma unidade — ver qtyUnitFamily), o total
  // gasto, o preço médio por unidade-base e a variação do último preço em
  // relação à média. "purchases" guarda a lista compra a compra (já
  // ordenada), pra linha poder expandir com o histórico completo, do mesmo
  // jeito que uma nota expande pra mostrar os itens dela.
  const allProducts = Object.values(productGroups)
    .map((g) => {
      const sorted = [...g].sort((a, b) => a.receipt.purchase_date.localeCompare(b.receipt.purchase_date));
      const last = sorted[sorted.length - 1];
      const s = summarizeQtyPriceHistory(sorted);
      return {
        key: normalizeText(last.description) + '|' + normalizeText(last.brand || ''),
        description: last.description, brand: last.brand || '',
        count: s.count, lastDate: last.receipt.purchase_date,
        totalQty: s.totalQty, qtyUnit: s.qtyUnit, totalSpent: s.totalSpent,
        lastPrice: s.lastPrice, avg: s.avg, pct: s.pct, changePct: s.changePct,
        purchases: sorted,
      };
    })
    .sort((a, b) => b.lastDate.localeCompare(a.lastDate));

  if (loading) return <Banner type="info">Carregando...</Banner>;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Supermercado</h1><div className="page-sub">Cada item, para acompanhar preços e a inflação no seu bolso</div></div></div>
      {erro && <Banner type="error">{erro}</Banner>}

      {!preview && (
        <div className="card">
          <h3 className="section-title">Nova nota</h3>
          <button className="btn" onClick={startNewNote}>+ Lançar nota de supermercado</button>
        </div>
      )}

      {preview && (
        <div className="card" ref={reviewCardRef}>
          <h3 className="section-title">{editingReceiptId ? 'Editar nota' : 'Revisar nota'}</h3>
          <div className="entry-form cols-6" style={{ marginBottom: 16 }}>
            <Field label="Loja">
              <input value={storeName} placeholder="Supermercado ABC" list="store-names-list" onChange={(e) => setStoreName(e.target.value)} />
              <datalist id="store-names-list">
                {[...new Set(receipts.map((r) => r.store_name).filter(Boolean))].map((name) => <option key={name} value={name} />)}
              </datalist>
            </Field>
            <Field label="Data da compra"><input type="date" value={purchaseDate} onChange={(e) => setPurchaseDate(e.target.value)} /></Field>
            <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
            {paymentMethod === 'Cartão de crédito' && (
              <Field label="Cartão usado">
                <select value={selectedCardId} onChange={(e) => setSelectedCardId(e.target.value)}>
                  <option value="">Selecione...</option>
                  {cards.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </Field>
            )}
            <Field label="Foto da nota (opcional)">
              <input type="file" accept="image/*,.pdf" ref={receiptFileRef} />
              {existingPhotoPath && <div style={{ fontSize: 11, color: 'var(--ink-faint)', marginTop: 4 }}>Já existe uma foto anexada — escolher outra aqui substitui.</div>}
            </Field>
          </div>
          {paymentMethod === 'Cartão de crédito' && cards.length === 0 && (
            <Banner type="error">Você ainda não tem nenhum cartão cadastrado. Cadastre um na subaba Cartão de Crédito (dentro de Despesas) antes de salvar esta nota como paga no cartão.</Banner>
          )}
          {paymentMethod === 'Cartão de crédito' && cards.length > 0 && (
            <Banner type="info">
              Esta compra vai entrar de verdade na fatura do cartão escolhido — dá pra ver o detalhe completo na subaba Cartão de Crédito, dentro de Despesas. Ela não soma direto no saldo geral, mas conta na fatura, do mesmo jeito que qualquer outra compra no cartão.
            </Banner>
          )}

          {preview.length === 0 ? (
            <Empty title="Nenhum item ainda" body="Clique em “+ Adicionar item” para lançar cada produto." />
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table>
                <thead><tr><th>Descrição</th><th>Marca</th><th className="num">Qtd.</th><th>Unid.</th><th className="num">Preço unit.</th><th className="num">Total</th><th></th></tr></thead>
                <tbody>
                  {preview.map((r, idx) => (
                    <tr className="row-hover" key={r._key}>
                      <td><input type="text" value={r.description} style={{ minWidth: 180 }} onChange={(e) => updatePreviewRow(idx, { description: e.target.value })} /></td>
                      <td><input type="text" value={r.brand || ''} placeholder="opcional" style={{ minWidth: 100 }} onChange={(e) => updatePreviewRow(idx, { brand: e.target.value })} /></td>
                      <td className="num"><input type="text" inputMode="decimal" value={r.quantity} style={{ width: 70, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { quantity: e.target.value })} /></td>
                      <td><input type="text" value={r.unit || ''} placeholder="UN" style={{ width: 60 }} onChange={(e) => updatePreviewRow(idx, { unit: e.target.value })} /></td>
                      <td className="num"><input type="text" inputMode="decimal" value={r.unitPrice} style={{ width: 90, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { unitPrice: e.target.value })} /></td>
                      <td className="num"><input type="text" inputMode="decimal" value={r.totalPrice} style={{ width: 90, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { totalPrice: e.target.value })} /></td>
                      <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => removePreviewRow(idx)}>Remover</button></td>

          </div>

      {radar.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Radar de preços</h3>
          <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Produtos com pelo menos 3 compras, mais distantes da própria média histórica agora — pra cima ou pra baixo</div>
          <div style={{ overflowX: 'auto' }}>
            <table>
              <thead><tr><th>Produto</th><th className="num">Média</th><th className="num">Última compra</th><th className="num">Variação</th></tr></thead>

                {radar.map((r) => (
                  <tr className="row-hover" key={r.description + '|' + r.brand}>

                    <td className="num">{fmtBRL(r.avg)}/{r.qtyUnit}</td>

        <div className="page-head" style={{ marginBottom: 0 }}>

          const monthReceipts = receipts.filter((r) => r.purchase_date && r.purchase_date.slice(0, 7) === noteMonth);
          const receiptsTotal = monthReceipts.reduce((s, r) => s + Number(r.total_amount || 0), 0);

                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginTop: 4 }}>
                      <span className="page-sub" style={{ margin: 0 }}>+ NO CARTÃO (NÃO CONTA NO SALDO)</span>
                      <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--ink-faint)' }}>{fmtBRL(receiptsCardTotal)}</span>
                    </div>
                  )}

              )}
              {monthReceipts.length === 0 ? (
                receipts.length === 0 ? (
                  <Empty title="Nenhuma nota registrada ainda" body="Use uma das opções acima para lançar sua primeira nota de supermercado." />
                ) : (
                  <Empty title="Nenhuma nota neste mês" body="Use as setas acima para ver outro mês, ou lance uma nota nova." />

              ) : (
          <div style={{ overflowX: 'auto', marginTop: 12 }}>
            <table>
              <thead><tr><th></th><th>Data</th><th>Loja</th><th className="num">Itens</th><th className="num">Total</th><th>Forma de pagamento</th><th>Nota</th><th></th></tr></thead>
              <tbody>
                {monthReceipts.map((r) => {
                  const isOpen = expandedReceipts.has(r.id);
                  const receiptItems = items.filter((it) => it.receipt_id === r.id);
                  return (
                    <React.Fragment key={r.id}>
                      <tr className="row-hover" style={{ cursor: 'pointer', background: 'var(--paper-line)' }} onClick={() => toggleReceiptExpanded(r.id)}>

                        <td>{new Date(r.purchase_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                        <td style={{ fontWeight: 600 }}>{r.store_name || '—'}</td>
                        <td className="num">{receiptItems.length}</td>
                        <td className="num" style={{ fontWeight: 600 }}>{fmtBRL(r.total_amount)}</td>
                        <td>{r.payment_method || '—'}</td>
                        <td>{r.receipt_photo_path ? <button className="icon-btn" onClick={(e) => { e.stopPropagation(); openReceiptPhoto(r.receipt_photo_path); }}>Ver</button> : <span style={{ color: 'var(--ink-faint)' }}>—</span>}</td>
                        <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                          <button className="icon-btn" onClick={(e) => { e.stopPropagation(); startEditReceipt(r); }}>Editar</button>
                          <button className="icon-btn" onClick={(e) => { e.stopPropagation(); deleteReceipt(r); }}>Remover</button>

                          <td className="num" style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{it.quantity} {it.unit || ''}</td>
                          <td className="num" style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{fmtBRL(it.total_price)}</td>
                          <td colSpan={3} className="num" style={{ fontSize: 11.5, color: 'var(--ink-faint)' }}>{it.unit_price ? fmtBRL(it.unit_price) + '/un' : ''}</td>
                        </tr>
                      ))}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
              )}
            </React.Fragment>
          );
        })()}
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Todos os produtos</h3>
        <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Tudo que você já comprou, de qualquer loja — clique num produto para ver o histórico completo dele, compra a compra</div>
        <div className="entry-form ef-2col">
          <Field label="Filtrar por produto"><input value={productListFilter} placeholder="ex: arroz, leite..." onChange={(e) => setProductListFilter(e.target.value)} /></Field>
          <Field label="Filtrar por marca"><input value={brandListFilter} placeholder="ex: Camil" onChange={(e) => setBrandListFilter(e.target.value)} /></Field>
        </div>
        {allProducts.length === 0 ? (
          <Empty title="Nenhum produto registrado ainda" body="Os produtos aparecem aqui conforme você lança notas de supermercado." />
        ) : (() => {
          const filtered = allProducts.filter((p) =>
            (!productListFilter.trim() || normalizeText(p.description).includes(normalizeText(productListFilter))) &&
            (!brandListFilter.trim() || normalizeText(p.brand).includes(normalizeText(brandListFilter)))
          );
          return filtered.length === 0 ? (
            <Empty title="Nenhum produto encontrado" body="Tente outro termo de busca." />
          ) : (
            <div style={{ overflowX: 'auto', marginTop: 14 }}>
              <table>
                <thead><tr><th></th><th>Produto</th><th>Marca</th><th className="num">Compras</th><th className="num" title="Soma de tudo que você já comprou desse produto, na mesma unidade (kg, L ou unidade)">Quantidade total</th><th>Última vez</th><th className="num" title="Preço por kg, L ou unidade, conforme como o produto é comprado">Último preço</th><th className="num" title="Preço médio por kg, L ou unidade, conforme como o produto é comprado">Preço médio</th><th className="num">Variação</th><th className="num">Total gasto</th></tr></thead>
                <tbody>
                  {filtered.map((p) => {
                    const isOpen = expandedProducts.has(p.key);
                    return (
                      <React.Fragment key={p.key}>

                          <td className="num">

                          </td>

                        {isOpen && p.changePct !== null && (

                            <td colSpan={9} style={{ fontSize: 12.5, color: 'var(--ink-soft)', paddingTop: 10 }}>

                        {isOpen && p.purchases.map((it) => (

                            <td colSpan={2} style={{ paddingLeft: 26, color: 'var(--ink-soft)', fontSize: 12.5 }}>

                            <td className="num" style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>{it.total_price ? fmtBRL(it.total_price) : '—'}</td>
