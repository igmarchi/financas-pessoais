<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tonus Financeiro — Controle Financeiro Pessoal</title>
<meta name="description" content="Tonus Financeiro: despesas fixas, cartões de crédito, receitas e fluxo de caixa — equilíbrio para suas finanças pessoais.">
<meta name="theme-color" content="#1B3A5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EF;
    --paper-raised:#FFFFFF;
    --paper-line:#E4DFD3;
    --ink:#0D1117;
    --ink-soft:#3B3F47;
    --ink-faint:#7A8090;
    --cover:#1B3A5C;
    --cover-soft:#24496F;
    --cover-line:#2E4D70;
    --cream-on-cover:#F7F4EF;
    --cream-on-cover-soft:#A9BBCE;
    --money:#C8973A;
    --money-strong:#9C7526;
    --money-soft:#F3E6C7;
    --spend:#5C1F3A;
    --spend-strong:#421530;
    --spend-soft:#EEDCE3;
    --gold:#1B3A5C;
    --gold-strong:#14283F;
    --gold-soft:#E3E9F0;
    --font-display:'Lora',Georgia,serif;
    --font-body:'DM Sans',sans-serif;
    --font-mono:'Courier New',Courier,monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    display:flex;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
  }
  ::selection{background:var(--gold-soft);}

  /* ---------- Sidebar / ledger cover ---------- */
  #sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--cover);
    color:var(--cream-on-cover);
    padding:28px 0 20px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:0 24px 22px;
    border-bottom:1px solid var(--cover-line);
    margin-bottom:8px;
  }
  .brand-mark{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.01em;
    line-height:1.15;
    color:var(--cream-on-cover);
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--cream-on-cover-soft);
    margin-top:5px;
  }
  nav{display:flex;flex-direction:column;margin-top:6px;}
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 22px 13px 24px;
    font-size:14px;
    color:var(--cream-on-cover-soft);
    cursor:pointer;
    border:none;
    background:none;
    text-align:left;
    font-family:var(--font-body);
    transition:background .12s ease, color .12s ease;
  }
  .tab .num{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--cream-on-cover-soft);
    opacity:.7;
    width:16px;
  }
  .tab:hover{background:var(--cover-soft);color:var(--cream-on-cover);}
  .tab.active{
    background:var(--paper);
    color:var(--cover);
    border-radius:8px 0 0 8px;
    margin-right:0;
  }
  .tab.active .num{color:var(--spend-strong);opacity:1;}
  .sidebar-foot{
    margin-top:auto;
    padding:16px 24px 0;
    border-top:1px solid var(--cover-line);
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--cream-on-cover-soft);
    line-height:1.6;
  }

  /* ---------- Main ---------- */
  main{
    flex:1;
    min-width:0;
    padding:34px 40px 60px;
  }
  .page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:26px;
    gap:16px;
    flex-wrap:wrap;
  }
  .page-title{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .page-sub{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:20px 22px;
  }
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-2{grid-template-columns:1fr;}}

  .stat-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 8px;
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:23px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    margin:0;
  }
  .stat-value.money{color:var(--money-strong);}
  .stat-value.spend{color:var(--spend-strong);}
  .stat-value.gold{color:var(--gold-strong);}

  h3.section-title{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--ink);
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:0 10px 9px;
    border-bottom:1px solid var(--paper-line);
  }
  td{
    padding:11px 10px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .row-hover:hover{background:rgba(180,134,42,.06);}

  .pill{
    display:inline-block;
    padding:3px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-family:var(--font-body);
    background:var(--paper-line);
    color:var(--ink-soft);
  }
  .pill.money{background:var(--money-soft);color:var(--money-strong);}
  .pill.spend{background:var(--spend-soft);color:var(--spend-strong);}
  .pill.gold{background:var(--gold-soft);color:var(--gold-strong);}

  button.btn{
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--cover);
    background:var(--cover);
    color:var(--cream-on-cover);
    cursor:pointer;
  }
  button.btn:hover{background:var(--cover-soft);}
  button.btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--paper-line);
  }
  button.btn.ghost:hover{background:var(--paper-line);}
  button.btn.danger{
    background:transparent;
    border:1px solid var(--spend-soft);
    color:var(--spend-strong);
    padding:5px 10px;
    font-size:12px;
  }
  button.btn.danger:hover{background:var(--spend-soft);}
  button.icon-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);
    font-family:var(--font-mono);font-size:12px;padding:4px 8px;
  }
  button.icon-btn:hover{color:var(--spend-strong);}

  .entry-form{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:10px;
    align-items:end;
    margin-bottom:22px;
  }
  .entry-form.cols-6{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;}
  @media (max-width:900px){.entry-form, .entry-form.cols-6{grid-template-columns:1fr 1fr;}}
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:5px;
  }
  input,select{
    width:100%;
    font-family:var(--font-body);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
  input[type=number]{font-family:var(--font-mono);}

  .empty{
    text-align:center;
    padding:44px 20px;
    color:var(--ink-faint);
  }
  .empty .empty-title{font-family:var(--font-display);font-size:17px;color:var(--ink-soft);margin-bottom:6px;}
  .empty .empty-body{font-size:13px;}

  .section-gap{margin-top:26px;}

  /* Card chips for credit cards */
  .card-chip{
    border-radius:12px;
    padding:16px 18px;
    color:#fff;
    cursor:pointer;
    border:2px solid transparent;
    min-width:180px;
    flex-shrink:0;
  }
  .card-chip .cc-name{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .card-chip .cc-info{font-family:var(--font-mono);font-size:11px;opacity:.85;margin-top:10px;}
  .card-chip .cc-total{font-family:var(--font-mono);font-size:19px;margin-top:12px;font-variant-numeric:tabular-nums;}
  .card-chip.selected{border-color:var(--gold);}
  .cc-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:120px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:9px;background:var(--paper-line);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-value{width:132px;text-align:right;font-family:var(--font-mono);font-size:12.5px;flex-shrink:0;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    background:var(--paper-raised);border:1px solid var(--paper-line);
    width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:14px;
  }
  .month-nav button:hover{background:var(--paper-line);}
  .month-label{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;
    min-width:150px;text-align:center;text-transform:capitalize;
  }
  .balance-strip{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-radius:12px;margin-bottom:20px;
  }
  .balance-strip.pos{background:var(--money-soft);}
  .balance-strip.neg{background:var(--spend-soft);}
  .balance-strip .label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;}
  .balance-strip .value{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:4px;}

  @media (max-width:760px){
    #app{flex-direction:column;}
    #sidebar{
      width:100%;height:auto;position:sticky;top:0;z-index:10;
      flex-direction:row;align-items:center;padding:10px 8px;overflow-x:auto;
    }
    .brand{display:none;}
    nav{flex-direction:row;margin-top:0;}
    .tab{padding:9px 14px;white-space:nowrap;border-radius:8px !important;}
    .sidebar-foot{display:none;}
    main{padding:20px 16px 50px;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// Preencha com os dados do seu projeto (Project Settings > API)
// ============================================================
const SUPABASE_URL = "https://hdbhoquhszehzbhtwdui.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkYmhvcXVoc3plaHpiaHR3ZHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MTg2MDIsImV4cCI6MjEwMjE5NDYwMn0.J9pFtSUonUGykoBXood1Q1sgchi2ndvi0X3zDDJQoW4";

const supabaseReady = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
// Sessão em localStorage (não sessionStorage): este é um app pessoal no
// próprio celular/computador da pessoa, então o login deve persistir
// entre aberturas do app, ao contrário de um sistema de balcão compartilhado.
const sb = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    storage: window.localStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
  },
}) : null;

const CATS_EXP = ['Moradia','Transporte','Alimentação','Saúde','Educação','Lazer','Assinaturas','Cuidado pessoal','Outros'];
const CATS_INC = ['Salário','Freelance / PJ','Investimentos','Reembolso','Outros'];
const PAYMENT_METHODS = ['Débito automático','Boleto','PIX','Cartão de crédito','Transferência'];
const CARD_COLORS = ['#1B3A5C','#5C1F3A','#14283F','#2E4D70'];
const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

// ---------- helpers puros (sem dependência de React) ----------
function fmtBRL(v) {
  const n = Number(v) || 0;
  return (n < 0 ? '-' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return MONTH_NAMES[m - 1] + ' de ' + y;
}
function shortMonthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return MONTH_NAMES[m - 1].slice(0, 3) + '/' + y;
}
function shiftMonth(key, delta) {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return y + '-' + String(m).padStart(2, '0');
}
function toMonthKey(dateStr) { return dateStr ? dateStr.slice(0, 7) : null; }
function monthKeyToDate(key) { return key + '-01'; }

function incomeForMonth(incomeList, key) {
  let total = 0;
  incomeList.forEach((inc) => {
    if (inc.recurring) total += Number(inc.amount);
    else if (inc.income_date && inc.income_date.slice(0, 7) === key) total += Number(inc.amount);
  });
  return total;
}
function fixedTotalMonthly(fixedList) {
  return fixedList.filter((e) => e.active).reduce((s, e) => s + Number(e.amount), 0);
}
function cardInstallmentForMonth(purchase, key) {
  const install = Number(purchase.amount) / Number(purchase.installments || 1);
  const [sy, sm] = toMonthKey(purchase.first_month).split('-').map(Number);
  const [ky, km] = key.split('-').map(Number);
  const idx = (ky - sy) * 12 + (km - sm);
  if (idx >= 0 && idx < Number(purchase.installments || 1)) return install;
  return 0;
}
function cardTotalForMonth(purchases, cardId, key) {
  return purchases.filter((p) => p.card_id === cardId).reduce((s, p) => s + cardInstallmentForMonth(p, key), 0);
}
function allCardsTotalForMonth(purchases, key) {
  return purchases.reduce((s, p) => s + cardInstallmentForMonth(p, key), 0);
}
function categoryBreakdownForMonth(fixedList, purchases, key) {
  const map = {};
  fixedList.filter((e) => e.active).forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount); });
  purchases.forEach((p) => {
    const amt = cardInstallmentForMonth(p, key);
    if (amt > 0) map[p.category] = (map[p.category] || 0) + amt;
  });
  return map;
}

function monthsBetween(startKey, endKey) {
  const out = [];
  let cur = startKey;
  while (true) {
    out.push(cur);
    if (cur === endKey) break;
    cur = shiftMonth(cur, 1);
  }
  return out;
}
// Monta a tabela de categoria x mês, do primeiro lançamento registrado até o mês atual.
function buildCategoryPivot(entries) {
  const withDate = entries.filter((e) => e.entry_date);
  if (withDate.length === 0) return { months: [], pivot: [], totals: [] };
  const startKey = withDate.map((e) => e.entry_date.slice(0, 7)).sort()[0];
  const endKey = monthKey(new Date());
  const months = monthsBetween(startKey, endKey);
  const cats = [...new Set(withDate.map((e) => e.category))].sort();
  const pivot = cats.map((cat) => ({
    cat,
    values: months.map((m) => withDate.filter((e) => e.category === cat && e.entry_date.slice(0, 7) === m).reduce((s, e) => s + Number(e.amount), 0)),
  }));
  const totals = months.map((m, i) => pivot.reduce((s, row) => s + row.values[i], 0));
  return { months, pivot, totals };
}

// ---------- importação de fatura ----------
const CATEGORY_KEYWORDS = {
  'Alimentação': ['ifood','restaurante','mercado','supermerc','padaria','lanchonete','pizzaria','burger','acougue','açougue','hortifruti','emporio','empório'],
  'Transporte': ['uber','99app','99*','99pop','posto ','combustivel','combustível','estacionamento','pedagio','pedágio','metro','metrô','onibus','ônibus','localiza','movida'],
  'Saúde': ['farmacia','farmácia','drogaria','clinica','clínica','hospital','laboratorio','laboratório','academia','panvel','drogasil','raia'],
  'Assinaturas': ['netflix','spotify','amazon prime','disney','hbo','youtube premium','icloud','google *','google one','apple.com/bill','claude.ai','openai','office 365'],
  'Lazer': ['cinema','ingresso','steam','playstation','xbox','balada','sympla','ingresso.com'],
  'Educação': ['escola','faculdade','curso','udemy','alura','colegio','colégio'],
  'Moradia': ['condominio','condomínio','energia','sabesp','cemig','copel','enel',' luz ','agua ','água ',' gas ',' gás ','imobiliaria','imobiliária'],
};
function guessCategory(desc) {
  const d = ' ' + desc.toLowerCase() + ' ';
  for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) {
    if (words.some((w) => d.includes(w))) return cat;
  }
  return 'Outros';
}
const INVOICE_SKIP_KEYWORDS = ['saldo anterior','pagamento efetuado','pagamento recebido','total desta fatura','total da fatura','limite dispon','limite total','valor minimo','valor mínimo','encargos de atraso','saldo em aberto','fatura fechada','vencimento da fatura','juros rotativo','pagto ','pagamento em '];
const INVOICE_LINE_RE = /^(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;

async function extractLinesFromPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let allLines = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const byY = {};
    content.items.forEach((it) => {
      const y = Math.round(it.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push(it);
    });
    const ys = Object.keys(byY).map(Number).sort((a, b) => b - a);
    ys.forEach((y) => {
      const lineText = byY[y].sort((a, b) => a.transform[4] - b.transform[4]).map((it) => it.str).join(' ').replace(/\s+/g, ' ').trim();
      if (lineText) allLines.push(lineText);
    });
  }
  return allLines;
}
function parseInvoiceLines(lines) {
  const results = [];
  lines.forEach((rawLine) => {
    const m = rawLine.match(INVOICE_LINE_RE);
    if (!m) return;
    const descRaw = m[2].trim();
    const lower = descRaw.toLowerCase();
    if (INVOICE_SKIP_KEYWORDS.some((k) => lower.includes(k))) return;
    let installCurrent = null, installTotal = null;
    const instMatch = descRaw.match(/(\d{1,2})\s*\/\s*(\d{1,2})\b/);
    if (instMatch) {
      const cur = parseInt(instMatch[1]), tot = parseInt(instMatch[2]);
      if (tot >= cur && tot <= 48 && cur >= 1) { installCurrent = cur; installTotal = tot; }
    }
    const amount = parseFloat(m[3].replace(/\./g, '').replace(',', '.'));
    if (isNaN(amount) || amount <= 0) return;
    results.push({ description: descRaw, category: guessCategory(descRaw), amount, installCurrent, installTotal });
  });
  return results;
}

// Select de categoria com opção de criar uma nova sem sair do formulário.
// options: lista de nomes já disponíveis (padrão + personalizadas do usuário).
// kind: 'expense' | 'income' — define em qual lista a nova categoria é salva.
// onCreated: chamado com o nome novo depois de salvar, para o componente pai
// atualizar sua lista de categorias personalizadas.
function CategorySelect({ value, onChange, options, kind, onCreated }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState('');

  async function commit() {
    const name = newName.trim();
    setAdding(false);
    setNewName('');
    if (!name) return;
    const alreadyExists = options.some((o) => o.toLowerCase() === name.toLowerCase());
    if (alreadyExists) { onChange(name); return; }
    const { error } = await sb.from('custom_categories').insert({ name, kind });
    if (error && error.code !== '23505') { onChange(options[0] || ''); return; }
    onCreated(name);
    onChange(name);
  }

  if (adding) {
    return (
      <input
        autoFocus
        value={newName}
        placeholder="Nome da nova categoria"
        onChange={(e) => setNewName(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { setAdding(false); setNewName(''); }
        }}
      />
    );
  }

  return (
    <select
      value={value}
      onChange={(e) => (e.target.value === '__new__' ? setAdding(true) : onChange(e.target.value))}
    >
      {options.map((c) => <option key={c}>{c}</option>)}
      <option value="__new__">+ Nova categoria...</option>
    </select>
  );
}

      setLoading(false);

function AuthGate({ children }) {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    if (!supabaseReady) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (!supabaseReady) {
    return (
      <div style={{ maxWidth: 520, margin: '60px auto', padding: '0 20px' }}>
        <Banner type="info">Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do script, dentro do index.html, para habilitar o login.</Banner>

    );
  }
  if (session === undefined) return null;
  if (session === null) return <LoginScreen />;
  return children(session);
}

        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
        sb.from('expense_entries').select('*'),
      ]);
      if (!active) return;
      setData({
        fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [], expenseEntries: exp.data || [],
      });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const key = monthKey(new Date());
  const inc = incomeForMonth(data.income, key);
  const fixed = fixedTotalMonthly(data.fixedExpenses);
  const cardsTotal = allCardsTotalForMonth(data.purchases, key);
  const balance = inc - fixed - cardsTotal;
  const breakdown = categoryBreakdownForMonth(data.fixedExpenses, data.purchases, key);
  const entries = Object.entries(breakdown).sort((a, b) => b[1] - a[1]);
  const maxVal = entries.length ? entries[0][1] : 1;

  const today = new Date().getDate();
  let upcoming = data.fixedExpenses.filter((e) => e.active).map((e) => ({ name: e.name, day: Number(e.due_day), amount: Number(e.amount) }));
  data.cards.forEach((c) => {
    const total = cardTotalForMonth(data.purchases, c.id, key);
    if (total > 0) upcoming.push({ name: 'Fatura ' + c.name, day: Number(c.due_day), amount: total });
  });
  upcoming.sort((a, b) => {
    const da = a.day >= today ? a.day : a.day + 31;
    const db = b.day >= today ? b.day : b.day + 31;
    return da - db;
  });
  upcoming = upcoming.slice(0, 6);

  return (
    <div>

        <div className="card"><p className="stat-label">Saldo projetado</p><p className={'stat-value ' + (balance >= 0 ? 'money' : 'spend')}>{fmtBRL(balance)}</p></div>
      </div>
      <div className="grid grid-2 section-gap">
        <div className="card">
          <h3 className="section-title">Gastos por categoria</h3>
          {entries.length === 0 ? <Empty title="Nada lançado ainda" body="Cadastre despesas fixas ou compras no cartão para ver a distribuição aqui." /> : entries.map(([cat, val]) => (
            <div className="bar-row" key={cat}>

function FixedExpensesTab() {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [category, setCategory] = useState(CATS_EXP[0]);
  const [customCats, setCustomCats] = useState([]);
  const [amount, setAmount] = useState('');
  const [dueDay, setDueDay] = useState('');
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const allCats = [...CATS_EXP, ...customCats];

  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('fixed_expenses').select('*').order('due_day'),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = parseFloat(amount), day = parseInt(dueDay);
    if (!name.trim() || !amt || !day) return;
    const { error } = await sb.from('fixed_expenses').insert({ name: name.trim(), category, amount: amt, due_day: day, payment_method: paymentMethod });
    if (error) { setErro(error.message); return; }
    setName(''); setAmount(''); setDueDay('');
    load();
  }
  async function toggleActive(row) {
    await sb.from('fixed_expenses').update({ active: !row.active }).eq('id', row.id);
    load();
  }
  async function remove(row) {
    await sb.from('fixed_expenses').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, category: row.category, amount: row.amount, due_day: row.due_day, payment_method: row.payment_method || PAYMENT_METHODS[0] });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const amt = parseFloat(editRow.amount), day = parseInt(editRow.due_day);
    if (!editRow.name.trim() || !amt || !day) return;
    const { error } = await sb.from('fixed_expenses').update({
      name: editRow.name.trim(), category: editRow.category, amount: amt, due_day: day, payment_method: editRow.payment_method,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const total = fixedTotalMonthly(list);
  const sortedList = [...list].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

  // Evolução do total comprometido: soma acumulada por mês de cadastro das
  // despesas ativas — cresce conforme novas despesas fixas vão sendo adicionadas.
  const growthByMonth = {};
  list.filter((e) => e.active).forEach((e) => {
    const mk = e.created_at ? e.created_at.slice(0, 7) : monthKey(new Date());
    growthByMonth[mk] = (growthByMonth[mk] || 0) + Number(e.amount);
  });
  const growthMonths = Object.keys(growthByMonth).sort();
  let runningTotal = 0;
  const growthSeries = growthMonths.map((m) => { runningTotal += growthByMonth[m]; return { m, total: runningTotal }; });
  const growthMax = Math.max(1, ...growthSeries.map((g) => g.total));

  // Total por categoria, só entre as despesas ativas.
  const catTotals = {};
  list.filter((e) => e.active).forEach((e) => { catTotals[e.category] = (catTotals[e.category] || 0) + Number(e.amount); });
  const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const catMax = catEntries.length ? catEntries[0][1] : 1;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Despesas fixas</h1><div className="page-sub">Contas que se repetem todo mês</div></div></div>

        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Aluguel" onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="number" step="0.01" min="0" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <Field label="Dia venc."><input required type="number" min="1" max="31" value={dueDay} placeholder="10" onChange={(e) => setDueDay(e.target.value)} /></Field>
          <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>

        <div style={{ display: 'flex', justifyContent: 'space-between', margin: '0 4px 14px' }}>
          <span className="page-sub" style={{ margin: 0 }}>TOTAL MENSAL (ATIVAS)</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(total)}</span>
        </div>
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nenhuma despesa fixa cadastrada" body="Comece adicionando aluguel, internet, escola ou outras contas recorrentes." />
        ) : (
          <table>
            <thead><tr><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th className="num">% do total</th><th>Vencimento</th><th>Forma de pagamento</th><th>Registrada em</th><th></th><th></th></tr></thead>
            <tbody>
              {sortedList.map((e) => editingId === e.id ? (
                <tr className="row-hover" key={e.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td className="num"><input type="number" step="0.01" min="0" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td></td>
                  <td><input type="number" min="1" max="31" value={editRow.due_day} onChange={(ev) => setEditRow({ ...editRow, due_day: ev.target.value })} style={{ width: 60 }} /></td>
                  <td>
                    <select value={editRow.payment_method} onChange={(ev) => setEditRow({ ...editRow, payment_method: ev.target.value })}>
                      {PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}
                    </select>
                  </td>
                  <td></td>
                  <td></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(e.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={e.id}>
                  <td>{e.name}</td>
                  <td><span className="pill">{e.category}</span></td>
                  <td className="num">{fmtBRL(e.amount)}</td>
                  <td className="num">{e.active ? (Number(e.amount) / total * 100).toFixed(1) + '%' : '—'}</td>
                  <td>Dia {String(e.due_day).padStart(2, '0')}</td>
                  <td>{e.payment_method || '—'}</td>
                  <td>{e.created_at ? shortMonthLabel(e.created_at.slice(0, 7)) : '—'}</td>
                  <td><span className={'pill ' + (e.active ? 'money' : '')}>{e.active ? 'Ativa' : 'Pausada'}</span></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(e)}>Editar</button>
                    <button className="icon-btn" onClick={() => toggleActive(e)}>{e.active ? 'Pausar' : 'Ativar'}</button>
                    <button className="icon-btn" onClick={() => remove(e)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {catEntries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Despesas fixas por categoria</h3>

            <div className="bar-row" key={cat}>
              <div className="bar-label">{cat}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / catMax) * 100) + '%', background: 'var(--spend)' }}></div></div>

        <div className="card section-gap">
          <h3 className="section-title">Evolução do total comprometido</h3>
          <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Soma acumulada das despesas fixas ativas, por mês em que cada uma foi cadastrada</div>
          <div style={{ overflowX: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 120, paddingTop: 10, width: 'max-content', minWidth: '100%' }}>
              {growthSeries.map((g) => {
                const h = Math.max(3, Math.round((g.total / growthMax) * 90));
                return (
                  <div key={g.m} style={{ flex: '0 0 44px', width: 44, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>

                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    const recurring = type === 'rec';
    if (!recurring && !date) return;
    const { error } = await sb.from('income').insert({ name: name.trim(), category, amount: amt, recurring, income_date: recurring ? null : date });
    if (error) { setErro(error.message); return; }
    setName(''); setAmount(''); setDate('');
    load();
  }
  async function remove(row) {
    await sb.from('income').delete().eq('id', row.id);
    load();
  }

  const totalRec = list.filter((i) => i.recurring).reduce((s, i) => s + Number(i.amount), 0);

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Receitas</h1><div className="page-sub">Fixas (recorrentes) ou avulsas</div></div></div>
      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Salário" onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="income" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="number" step="0.01" min="0" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <Field label="Tipo">
            <select value={type} onChange={(e) => setType(e.target.value)}>
              <option value="rec">Recorrente (todo mês)</option>
              <option value="one">Avulsa (data única)</option>
            </select>
          </Field>
          {type === 'one' && <Field label="Data"><input required type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>}
          <button type="submit" className="btn">Adicionar</button>
        </form>
        <div style={{ display: 'flex', justifyContent: 'space-between', margin: '0 4px 14px' }}>
          <span className="page-sub" style={{ margin: 0 }}>TOTAL RECORRENTE MENSAL</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--money-strong)' }}>{fmtBRL(totalRec)}</span>
        </div>
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nenhuma receita cadastrada" body="Adicione seu salário ou outras fontes de renda para começar." />
        ) : (
          <table>
            <thead><tr><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th>Recorrência</th><th></th></tr></thead>
            <tbody>
              {list.map((i) => (
                <tr className="row-hover" key={i.id}>
                  <td>{i.name}</td>
                  <td><span className="pill">{i.category}</span></td>
                  <td className="num">{fmtBRL(i.amount)}</td>
                  <td>{i.recurring ? 'Todo mês' : new Date(i.income_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => remove(i)}>Remover</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ---------- Cartões de crédito ----------
function CardsTab() {
  const [cards, setCards] = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [selectedId, setSelectedId] = useState(null);

  const [ccName, setCcName] = useState('');
  const [ccClose, setCcClose] = useState('');
  const [ccDue, setCcDue] = useState('');
  const [ccLimit, setCcLimit] = useState('');

  const [pDesc, setPDesc] = useState('');
  const [pCat, setPCat] = useState(CATS_EXP[0]);
  const [customCats, setCustomCats] = useState([]);
  const [pAmount, setPAmount] = useState('');
  const [pInst, setPInst] = useState('1');
  const [pMonth, setPMonth] = useState(monthKey(new Date()));
  const allCats = [...CATS_EXP, ...customCats];

  const [impMonth, setImpMonth] = useState(monthKey(new Date()));
  const [impText, setImpText] = useState('');
  const [impBusy, setImpBusy] = useState(false);
  const [impError, setImpError] = useState(null);
  const [preview, setPreview] = useState(null);
  const fileRef = useRef(null);

  async function load() {
    setLoading(true);
    const [c, p, cats] = await Promise.all([
      sb.from('cards').select('*').order('created_at'),
      sb.from('card_purchases').select('*').order('first_month', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (c.error) setErro(c.error.message); else setCards(c.data || []);
    if (p.error) setErro(p.error.message); else setPurchases(p.data || []);
    if (cats.data) setCustomCats(cats.data.map((c2) => c2.name));
    setLoading(false);
    if (!selectedId && c.data && c.data.length) setSelectedId(c.data[0].id);
  }
  useEffect(() => { load(); }, []);

  async function addCard(ev) {
    ev.preventDefault();
    const closingDay = parseInt(ccClose), dueDay = parseInt(ccDue);
    if (!ccName.trim() || !closingDay || !dueDay) return;
    const { data, error } = await sb.from('cards').insert({
      name: ccName.trim(), closing_day: closingDay, due_day: dueDay,
      limit_amount: parseFloat(ccLimit) || null, color: CARD_COLORS[cards.length % CARD_COLORS.length],
    }).select().single();
    if (error) { setErro(error.message); return; }
    setCcName(''); setCcClose(''); setCcDue(''); setCcLimit('');
    setSelectedId(data.id);
    load();
  }
  async function deleteCard(card) {
    await sb.from('cards').delete().eq('id', card.id);
    setSelectedId(null);
    load();
  }
  async function addPurchase(ev) {
    ev.preventDefault();
    const amt = parseFloat(pAmount), inst = parseInt(pInst) || 1;
    if (!pDesc.trim() || !amt || !pMonth) return;
    const { error } = await sb.from('card_purchases').insert({
      card_id: selectedId, description: pDesc.trim(), category: pCat, amount: amt, installments: inst, first_month: monthKeyToDate(pMonth),
    });
    if (error) { setErro(error.message); return; }
    setPDesc(''); setPAmount(''); setPInst('1');
    load();
  }
  async function deletePurchase(p) {
    await sb.from('card_purchases').delete().eq('id', p.id);
    load();
  }

  async function handleExtract() {
    if (!impMonth) { setImpError('Selecione o mês da fatura antes de importar.'); return; }
    setImpBusy(true); setImpError(null); setPreview(null);
    try {
      let lines = [];
      const file = fileRef.current && fileRef.current.files && fileRef.current.files[0];
      if (file) {
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (!isPdf) throw new Error('Envie um arquivo em PDF, ou cole o texto da fatura no campo abaixo.');
        if (!window.pdfjsLib) throw new Error('Não foi possível carregar o leitor de PDF. Tente colar o texto da fatura.');
        lines = await extractLinesFromPDF(file);
      } else if (impText.trim()) {
        lines = impText.split('\n');
      } else {
        throw new Error('Selecione um PDF ou cole o texto da fatura.');
      }
      const parsed = parseInvoiceLines(lines);
      if (parsed.length === 0) throw new Error('Não encontrei lançamentos reconhecíveis. Tente colar o texto da fatura manualmente.');
      setPreview(parsed.map((p, idx) => ({
        _key: idx + '-' + Date.now(),
        description: p.description, category: p.category, amount: p.amount,
        installments: p.installTotal || 1,
        firstMonth: shiftMonth(impMonth, -(((p.installCurrent || 1) - 1))),
        include: true,
      })));
    } catch (err) {
      setImpError(err.message || 'Não consegui ler a fatura.');
    }
    setImpBusy(false);
  }
  function updatePreviewRow(idx, patch) {
    setPreview((prev) => prev.map((r, i) => (i === idx ? { ...r, ...patch } : r)));
  }
  async function confirmImport() {
    const rows = preview.filter((r) => r.include).map((r) => ({
      card_id: selectedId, description: r.description, category: r.category && r.category.trim() ? r.category.trim() : 'Outros',
      amount: Number(r.amount) * Number(r.installments || 1), installments: Number(r.installments) || 1,
      first_month: monthKeyToDate(r.firstMonth),
    }));
    if (rows.length === 0) { setPreview(null); return; }
    const { error } = await sb.from('card_purchases').insert(rows);
    if (error) { setImpError(error.message); return; }
    setPreview(null); setImpText('');
    if (fileRef.current) fileRef.current.value = '';
    load();
  }

  if (loading) return <Banner type="info">Carregando...</Banner>;

  const selCard = cards.find((c) => c.id === selectedId);
  const key = monthKey(new Date());

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Cartões de crédito</h1><div className="page-sub">Cadastre quantos cartões precisar</div></div></div>
      {erro && <Banner type="error">{erro}</Banner>}

      <div className="card">
        <h3 className="section-title">Novo cartão</h3>
        <form className="entry-form" onSubmit={addCard}>
          <Field label="Nome do cartão"><input required value={ccName} placeholder="Nubank" onChange={(e) => setCcName(e.target.value)} /></Field>
          <Field label="Fechamento"><input required type="number" min="1" max="31" value={ccClose} placeholder="20" onChange={(e) => setCcClose(e.target.value)} /></Field>
          <Field label="Vencimento"><input required type="number" min="1" max="31" value={ccDue} placeholder="27" onChange={(e) => setCcDue(e.target.value)} /></Field>
          <Field label="Limite (R$)"><input type="number" step="0.01" min="0" value={ccLimit} placeholder="opcional" onChange={(e) => setCcLimit(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar cartão</button>
        </form>
      </div>

      {cards.length === 0 ? (
        <div className="card section-gap"><Empty title="Nenhum cartão cadastrado" body="Adicione seu primeiro cartão acima para começar a lançar compras." /></div>
      ) : (
        <React.Fragment>
          <div className="cc-row section-gap">
            {cards.map((c) => {
              const total = cardTotalForMonth(purchases, c.id, key);
              return (
                <div key={c.id} className={'card-chip' + (c.id === selectedId ? ' selected' : '')} style={{ background: c.color }} onClick={() => setSelectedId(c.id)}>
                  <div className="cc-name">{c.name}</div>
                  <div className="cc-info">Fecha dia {c.closing_day} · vence dia {c.due_day}</div>
                  <div className="cc-total">{fmtBRL(total)}</div>
                </div>
              );
            })}
          </div>

          {selCard && (
            <React.Fragment>
              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                  <h3 className="section-title" style={{ margin: 0 }}>Importar fatura — {selCard.name}</h3>
                  <button className="btn danger" onClick={() => deleteCard(selCard)}>Remover cartão</button>
                </div>
                <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Envie o PDF da fatura ou cole o texto copiado. Os lançamentos aparecem para revisão antes de entrar na conta.</div>
                <div className="entry-form" style={{ gridTemplateColumns: '1fr 1.4fr auto' }}>
                  <Field label="Mês da fatura"><input type="month" value={impMonth} onChange={(e) => setImpMonth(e.target.value)} /></Field>
                  <Field label="Arquivo PDF da fatura"><input type="file" accept=".pdf,application/pdf" ref={fileRef} /></Field>
                  <button type="button" className="btn" onClick={handleExtract}>Importar fatura</button>
                </div>
                <Field label="Ou cole aqui o texto da fatura (opcional, se o PDF não for reconhecido)">
                  <textarea rows={4} value={impText} onChange={(e) => setImpText(e.target.value)}
                    placeholder={"10/08 UBER * TRIP SAO PAULO 23,90\n12/08 SUPERMERCADO BOM PRECO 3/6 145,00"}
                    style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 12.5, padding: '8px 10px', border: '1px solid var(--paper-line)', borderRadius: 7, resize: 'vertical' }} />
                </Field>
                {impBusy && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-faint)' }}>Lendo a fatura...</div>}
                {impError && <Banner type="error">{impError}</Banner>}

                {preview && (
                  <div style={{ marginTop: 18 }}>
                    <h4 style={{ fontFamily: 'var(--font-display)', fontSize: 15, margin: '0 0 10px' }}>Revisar {preview.length} lançamento(s) encontrado(s)</h4>
                    <table>
                      <thead><tr><th></th><th>Descrição</th><th>Categoria</th><th className="num">Parcela (R$)</th><th>Parcelas</th><th>1ª fatura</th></tr></thead>
                      <tbody>
                        {preview.map((r, idx) => (
                          <tr className="row-hover" key={r._key}>
                            <td><input type="checkbox" checked={r.include} onChange={(e) => updatePreviewRow(idx, { include: e.target.checked })} /></td>
                            <td><input type="text" value={r.description} style={{ minWidth: 160 }} onChange={(e) => updatePreviewRow(idx, { description: e.target.value })} /></td>
                            <td>
                              <CategorySelect value={r.category} onChange={(v) => updatePreviewRow(idx, { category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} />
                            </td>
                            <td className="num"><input type="number" step="0.01" value={r.amount} style={{ width: 90, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { amount: parseFloat(e.target.value) || 0 })} /></td>
                            <td><input type="number" min="1" max="48" value={r.installments} style={{ width: 60 }} onChange={(e) => updatePreviewRow(idx, { installments: parseInt(e.target.value) || 1 })} /></td>
                            <td style={{ textAlign: 'right' }}><span className="pill" style={{ fontFamily: 'var(--font-mono)' }}>{shortMonthLabel(r.firstMonth)}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                      <button className="btn" onClick={confirmImport}>Confirmar importação</button>
                      <button className="btn ghost" onClick={() => setPreview(null)}>Cancelar</button>
                    </div>
                  </div>
                )}
              </div>

              <div className="card section-gap">
                <h3 className="section-title">Lançar compra — {selCard.name}</h3>
                <form className="entry-form cols-6" onSubmit={addPurchase}>
                  <Field label="Descrição"><input required value={pDesc} placeholder="Supermercado" onChange={(e) => setPDesc(e.target.value)} /></Field>
                  <Field label="Categoria"><CategorySelect value={pCat} onChange={setPCat} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
                  <Field label="Valor total (R$)"><input required type="number" step="0.01" min="0" value={pAmount} placeholder="0,00" onChange={(e) => setPAmount(e.target.value)} /></Field>
                  <Field label="Parcelas"><input required type="number" min="1" max="48" value={pInst} onChange={(e) => setPInst(e.target.value)} /></Field>
                  <Field label="1ª fatura"><input required type="month" value={pMonth} onChange={(e) => setPMonth(e.target.value)} /></Field>
                  <button type="submit" className="btn">Lançar</button>
                </form>
                {(() => {
                  const cardPurchases = purchases.filter((p) => p.card_id === selCard.id);
                  if (cardPurchases.length === 0) return <Empty title="Nenhuma compra lançada neste cartão" body="Lance a primeira compra acima — parcelas são divididas automaticamente pelas faturas seguintes." />;
                  return (
                    <table>
                      <thead><tr><th>Compra</th><th>Categoria</th><th className="num">Total</th><th>Parcelas</th><th>1ª fatura</th><th></th></tr></thead>
                      <tbody>
                        {cardPurchases.map((p) => (
                          <tr className="row-hover" key={p.id}>
                            <td>{p.description}</td>
                            <td><span className="pill">{p.category}</span></td>
                            <td className="num">{fmtBRL(p.amount)}</td>
                            <td>{p.installments}x de {fmtBRL(p.amount / p.installments)}</td>
                            <td>{monthLabel(toMonthKey(p.first_month))}</td>
                            <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => deletePurchase(p)}>Remover</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  );
                })()}
              </div>
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

// ---------- Despesas (histórico, fixas + variáveis) ----------
function ExpenseHistoryTab({ session }) {
  const [list, setList] = useState([]);
  const [customCats, setCustomCats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [month, setMonth] = useState(monthKey(new Date()));

  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [desc, setDesc] = useState('');
  const [category, setCategory] = useState(CATS_EXP[0]);
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const [amount, setAmount] = useState('');
  const [notes, setNotes] = useState('');
  const [uploading, setUploading] = useState(false);
  const receiptRef = useRef(null);
  const editReceiptRef = useRef(null);
  const allCats = [...CATS_EXP, ...customCats];

  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  const [filterDesc, setFilterDesc] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterPay, setFilterPay] = useState('');
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const filtersActive = filterDesc || filterCat || filterPay || filterFrom || filterTo;
  function clearFilters() { setFilterDesc(''); setFilterCat(''); setFilterPay(''); setFilterFrom(''); setFilterTo(''); }

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('expense_entries').select('*').order('entry_date', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function uploadReceipt(file) {
    const path = `${session.user.id}/${crypto.randomUUID()}-${file.name}`;
    const { error } = await sb.storage.from('comprovantes').upload(path, file);
    if (error) throw error;
    return path;
  }
  async function openReceipt(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir o comprovante.'); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = parseFloat(amount);
    if (!desc.trim() || !amt || !date) return;
    setUploading(true);
    let receiptPath = null;
    try {
      const file = receiptRef.current && receiptRef.current.files && receiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('expense_entries').insert({
      entry_date: date, description: desc.trim(), category, payment_method: paymentMethod, amount: amt, notes: notes.trim() || null, receipt_path: receiptPath,
    });
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setDesc(''); setAmount(''); setNotes('');
    if (receiptRef.current) receiptRef.current.value = '';
    load();
  }
  async function remove(row) {
    if (row.receipt_path) await sb.storage.from('comprovantes').remove([row.receipt_path]);
    await sb.from('expense_entries').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ entry_date: row.entry_date, description: row.description, category: row.category, payment_method: row.payment_method || PAYMENT_METHODS[0], amount: row.amount, notes: row.notes || '', receipt_path: row.receipt_path || null });
  }
  function cancelEdit() { setEditingId(null); setEditRow(null); }
  async function saveEdit(id) {
    const amt = parseFloat(editRow.amount);
    if (!editRow.description.trim() || !amt || !editRow.entry_date) return;
    setUploading(true);
    let receiptPath = editRow.receipt_path;
    try {
      const file = editReceiptRef.current && editReceiptRef.current.files && editReceiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('expense_entries').update({
      entry_date: editRow.entry_date, description: editRow.description.trim(), category: editRow.category,
      payment_method: editRow.payment_method, amount: amt, notes: editRow.notes.trim() || null, receipt_path: receiptPath,
    }).eq('id', id);
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const monthEntries = list.filter((e) => e.entry_date && e.entry_date.slice(0, 7) === month);
  const baseEntries = (filterFrom || filterTo)
    ? list.filter((e) => e.entry_date && (!filterFrom || e.entry_date >= filterFrom) && (!filterTo || e.entry_date <= filterTo))
    : monthEntries;
  const filteredEntries = baseEntries.filter((e) =>
    (!filterDesc.trim() || e.description.toLowerCase().includes(filterDesc.trim().toLowerCase())) &&
    (!filterCat || e.category === filterCat) &&
    (!filterPay || e.payment_method === filterPay)
  );
  const filteredTotal = filteredEntries.reduce((s, e) => s + Number(e.amount), 0);
  const allPaymentMethods = [...new Set([...PAYMENT_METHODS, ...list.map((e) => e.payment_method).filter(Boolean)])];

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Despesas</h1><div className="page-sub">Histórico de despesas fixas e variáveis, mês a mês</div></div>
        <div className="month-nav">
          <button onClick={() => setMonth(shiftMonth(month, -1))}>&#8592;</button>
          <span className="month-label">{monthLabel(month)}</span>
          <button onClick={() => setMonth(shiftMonth(month, 1))}>&#8594;</button>
        </div>
      </div>

      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Data"><input required type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Descrição"><input required value={desc} placeholder="Aluguel" onChange={(e) => setDesc(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <Field label="Valor (R$)"><input required type="number" step="0.01" min="0" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <button type="submit" className="btn" disabled={uploading}>{uploading ? 'Enviando...' : 'Adicionar'}</button>
        </form>
        <div className="entry-form" style={{ gridTemplateColumns: '1fr 2fr', marginTop: -8 }}>
          <Field label="Observações (opcional)"><input value={notes} placeholder="ex: nome de quem prestou o serviço, detalhe da compra..." onChange={(e) => setNotes(e.target.value)} /></Field>
          <Field label="Comprovante (opcional)"><input type="file" accept="image/*,.pdf" ref={receiptRef} /></Field>
        </div>
      </div>

      <div className="card section-gap">
        <div style={{ marginTop: 0, paddingTop: 0 }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--ink-faint)', marginBottom: 8 }}>Filtrar</div>
          <div className="entry-form cols-6" style={{ marginBottom: filtersActive ? 10 : 0 }}>
            <Field label="Descrição"><input value={filterDesc} placeholder="buscar..." onChange={(e) => setFilterDesc(e.target.value)} /></Field>
            <Field label="Categoria">
              <select value={filterCat} onChange={(e) => setFilterCat(e.target.value)}>
                <option value="">Todas</option>
                {allCats.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Forma de pagamento">
              <select value={filterPay} onChange={(e) => setFilterPay(e.target.value)}>
                <option value="">Todas</option>
                {allPaymentMethods.map((p) => <option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="De"><input type="date" value={filterFrom} onChange={(e) => setFilterFrom(e.target.value)} /></Field>
            <Field label="Até"><input type="date" value={filterTo} onChange={(e) => setFilterTo(e.target.value)} /></Field>
            <button type="button" className="btn ghost" onClick={clearFilters} disabled={!filtersActive}>Limpar</button>
          </div>
          {(filterFrom || filterTo) && (
            <div className="page-sub" style={{ margin: 0 }}>Mostrando o intervalo de datas selecionado — a navegação por mês acima fica pausada até limpar os filtros.</div>
          )}
        </div>

        <div style={{ display: 'flex', justifyContent: 'space-between', margin: '18px 4px 14px' }}>
          <span className="page-sub" style={{ margin: 0 }}>{filtersActive ? 'TOTAL FILTRADO' : 'TOTAL DO MÊS'}</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(filteredTotal)}</span>
        </div>

        {loading ? <Banner type="info">Carregando...</Banner> : filteredEntries.length === 0 ? (
          <Empty title={filtersActive ? 'Nenhuma despesa encontrada com esses filtros' : 'Nenhuma despesa lançada neste mês'} body={filtersActive ? 'Ajuste ou limpe os filtros acima para ver outros lançamentos.' : 'Preencha o formulário acima para lançar uma despesa fixa ou variável.'} />
        ) : (
          <table>
            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma de pagamento</th><th className="num">Valor</th><th>Observações</th><th>Comprovante</th><th></th></tr></thead>
            <tbody>
              {filteredEntries.map((e) => editingId === e.id ? (
                <tr className="row-hover" key={e.id}>
                  <td><input type="date" value={editRow.entry_date} onChange={(ev) => setEditRow({ ...editRow, entry_date: ev.target.value })} style={{ width: 140 }} /></td>
                  <td><input value={editRow.description} onChange={(ev) => setEditRow({ ...editRow, description: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td>
                    <select value={editRow.payment_method} onChange={(ev) => setEditRow({ ...editRow, payment_method: ev.target.value })}>
                      {PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}
                    </select>
                  </td>
                  <td className="num"><input type="number" step="0.01" min="0" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input value={editRow.notes} onChange={(ev) => setEditRow({ ...editRow, notes: ev.target.value })} style={{ minWidth: 100 }} /></td>
                  <td>
                    {editRow.receipt_path && <div style={{ marginBottom: 4 }}><button type="button" className="icon-btn" onClick={() => openReceipt(editRow.receipt_path)}>Ver atual</button></div>}
                    <input type="file" accept="image/*,.pdf" ref={editReceiptRef} style={{ width: 140, fontSize: 11 }} />
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(e.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={e.id}>
                  <td>{new Date(e.entry_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td>{e.description}</td>
                  <td><span className="pill">{e.category}</span></td>
                  <td>{e.payment_method || '—'}</td>
                  <td className="num">{fmtBRL(e.amount)}</td>
                  <td style={{ color: 'var(--ink-faint)' }}>{e.notes || '—'}</td>
                  <td>{e.receipt_path ? <button className="icon-btn" onClick={() => openReceipt(e.receipt_path)}>Ver</button> : <span style={{ color: 'var(--ink-faint)' }}>—</span>}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(e)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(e)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ---------- Fluxo de caixa ----------
function CashflowTab({ cashflowMonth, setCashflowMonth }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let active = true;
    (async () => {
      const [fx, inc, crd, pur] = await Promise.all([
        sb.from('fixed_expenses').select('*'),
        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
      ]);
      if (!active) return;
      setData({ fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [] });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const key = cashflowMonth;
  let entries = [];
  data.income.forEach((inc) => {
    if (inc.recurring) entries.push({ desc: inc.name, cat: inc.category, day: 1, amount: Number(inc.amount), kind: 'in' });
    else if (inc.income_date && inc.income_date.slice(0, 7) === key) entries.push({ desc: inc.name, cat: inc.category, day: Number(inc.income_date.slice(8, 10)), amount: Number(inc.amount), kind: 'in' });
  });
  data.fixedExpenses.filter((e) => e.active).forEach((e) => {
    entries.push({ desc: e.name, cat: e.category, day: Number(e.due_day), amount: Number(e.amount), kind: 'out' });
  });
  data.purchases.forEach((p) => {
    const amt = cardInstallmentForMonth(p, key);
    if (amt > 0) {
      const card = data.cards.find((c) => c.id === p.card_id);
      const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
      const [ky, km] = key.split('-').map(Number);
      const idx = (ky - sy) * 12 + (km - sm);
      entries.push({
        desc: p.description + (p.installments > 1 ? ` (${idx + 1}/${p.installments})` : ''),
        cat: 'Cartão · ' + (card ? card.name : ''), day: card ? Number(card.due_day) : 1, amount: amt, kind: 'out',
      });
    }
  });
  entries.sort((a, b) => a.day - b.day);

  const totalIn = entries.filter((e) => e.kind === 'in').reduce((s, e) => s + e.amount, 0);
  const totalOut = entries.filter((e) => e.kind === 'out').reduce((s, e) => s + e.amount, 0);
  const net = totalIn - totalOut;

  const months = [];
  for (let i = 5; i >= 0; i--) months.push(shiftMonth(key, -i));
  const nets = months.map((m) => {
    const inc = incomeForMonth(data.income, m);
    const fx = fixedTotalMonthly(data.fixedExpenses);
    const cd = allCardsTotalForMonth(data.purchases, m);
    return { m, val: inc - fx - cd };
  });
  const maxAbs = Math.max(1, ...nets.map((n) => Math.abs(n.val)));

  let runningBalance = 0;

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Fluxo de caixa</h1><div className="page-sub">Entradas e saídas mês a mês</div></div>
        <div className="month-nav">
          <button onClick={() => setCashflowMonth(shiftMonth(key, -1))}>&#8592;</button>
          <span className="month-label">{monthLabel(key)}</span>
          <button onClick={() => setCashflowMonth(shiftMonth(key, 1))}>&#8594;</button>
        </div>
      </div>

      <div className={'balance-strip ' + (net >= 0 ? 'pos' : 'neg')}>
        <span className="label">Saldo do mês</span><span className="value">{fmtBRL(net)}</span>
      </div>
      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total de entradas</p><p className="stat-value money">{fmtBRL(totalIn)}</p></div>
        <div className="card"><p className="stat-label">Total de saídas</p><p className="stat-value spend">{fmtBRL(totalOut)}</p></div>
      </div>

      <div className="card">
        <h3 className="section-title">Saldo — últimos 6 meses</h3>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 120, paddingTop: 10 }}>
          {nets.map((n) => {
            const h = Math.max(3, Math.round((Math.abs(n.val) / maxAbs) * 90));
            const color = n.val >= 0 ? 'var(--money)' : 'var(--spend)';
            return (
              <div key={n.m} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginBottom: 4 }}>{fmtBRL(n.val)}</div>
                <div style={{ width: '100%', maxWidth: 34, height: h, background: color, borderRadius: '4px 4px 0 0' }}></div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginTop: 6, textTransform: 'capitalize' }}>{MONTH_NAMES[Number(n.m.split('-')[1]) - 1].slice(0, 3)}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Lançamentos do mês</h3>
        {entries.length === 0 ? <Empty title="Sem lançamentos neste mês" body="Cadastre receitas, despesas fixas ou compras no cartão para ver o fluxo aqui." /> : (
          <table>
            <thead><tr><th>Dia</th><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th className="num">Saldo acum.</th></tr></thead>
            <tbody>
              {entries.map((e, i) => {
                runningBalance += e.kind === 'in' ? e.amount : -e.amount;
                return (
                  <tr className="row-hover" key={i}>
                    <td>Dia {String(e.day).padStart(2, '0')}</td>
                    <td>{e.desc}</td>
                    <td><span className={'pill ' + (e.kind === 'in' ? 'money' : 'spend')}>{e.cat}</span></td>
                    <td className="num" style={{ color: e.kind === 'in' ? 'var(--money-strong)' : 'var(--spend-strong)' }}>{e.kind === 'in' ? '+' : '−'} {fmtBRL(e.amount)}</td>
                    <td className="num">{fmtBRL(runningBalance)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ---------- App shell ----------
const TABS = [
  { id: 'dashboard', label: 'Dashboard', n: '01' },
  { id: 'fixed', label: 'Despesas fixas', n: '02' },
  { id: 'expenses', label: 'Despesas', n: '03' },
  { id: 'cards', label: 'Cartões de crédito', n: '04' },
  { id: 'income', label: 'Receitas', n: '05' },
  { id: 'cashflow', label: 'Fluxo de caixa', n: '06' },
];

function App({ session }) {
  const [tab, setTab] = useState('dashboard');
  const [cashflowMonth, setCashflowMonth] = useState(monthKey(new Date()));

  return (
    <div id="app">
      <aside id="sidebar">
        <div className="brand">
          <img src="logo-icon.png" alt="Tonus" style={{ height: 30, marginBottom: 12, display: 'block' }} />
          <div className="brand-mark">Tonus Financeiro</div>
          <div className="brand-sub">Equilíbrio para suas finanças</div>
        </div>
        <nav>
          {TABS.map((t) => (
            <button key={t.id} className={'tab' + (tab === t.id ? ' active' : '')} onClick={() => setTab(t.id)}>
              <span className="num">{t.n}</span><span>{t.label}</span>
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          {session.user.email}
          <br /><button className="icon-btn" style={{ padding: '6px 0', color: 'var(--cream-on-cover-soft)' }} onClick={() => sb.auth.signOut()}>Sair</button>
        </div>
      </aside>
      <main id="main">
        {tab === 'dashboard' && <DashboardTab />}
        {tab === 'fixed' && <FixedExpensesTab />}
        {tab === 'expenses' && <ExpenseHistoryTab session={session} />}
        {tab === 'cards' && <CardsTab />}
        {tab === 'income' && <IncomeTab />}
        {tab === 'cashflow' && <CashflowTab cashflowMonth={cashflowMonth} setCashflowMonth={setCashflowMonth} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthGate>{(session) => <App session={session} />}</AuthGate>
);

</script>
