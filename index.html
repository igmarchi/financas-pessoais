<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tonus Financeiro — Controle Financeiro Pessoal</title>
<meta name="description" content="Tonus Financeiro: despesas fixas, cartões de crédito, receitas e fluxo de caixa — equilíbrio para suas finanças pessoais.">
<meta name="theme-color" content="#1B3A5C">
<script>
// Aplica o tema salvo ANTES da página desenhar qualquer coisa — assim não
// pisca claro e depois escurece (ou vice-versa) toda vez que o app abre.
(function () {
  try {
    if (localStorage.getItem('tonusTheme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#F7F4EF;
    --paper-raised:#FFFFFF;
    --paper-line:#E4DFD3;
    --ink:#0D1117;
    --ink-soft:#3B3F47;
    --ink-faint:#7A8090;
    --cover:#1B3A5C;
    --cover-soft:#24496F;
    --cover-line:#2E4D70;
    --cream-on-cover:#F7F4EF;
    --cream-on-cover-soft:#A9BBCE;
    --money:#C8973A;
    --money-strong:#9C7526;
    --money-soft:#F3E6C7;
    --spend:#5C1F3A;
    --spend-strong:#421530;
    --spend-soft:#EEDCE3;
    --gold:#1B3A5C;
    --gold-strong:#14283F;
    --gold-soft:#E3E9F0;
    /* Só usadas no gráfico de faixa da aba Projeção, pra diferenciar as 3
       linhas de cenário (conservador/moderado/otimista) sem introduzir uma
       cor nova "gritante" — mesma família do --money, só a claridade muda
       (rampa ordinal: conservador e otimista mais escuros que o moderado,
       que continua sendo o --money de sempre). */
    --scenario-conservador:#A37929;
    --scenario-otimista:#725318;
    /* Cores de identidade (uma por conta) do gráfico "Histórico mensal por
       conta" — ordem fixa, nunca ciclada (a mesma conta sempre usa o mesmo
       slot; se houver mais de 6 contas, as excedentes entram juntas no slot
       "outras", em cinza). Validadas com scripts/validate_palette.js da
       skill de dataviz contra a superfície real usada pelos cards do app
       (--paper-raised) nos dois modos — todos os pares adjacentes passam
       CVD e visão normal; 3 dos 6 slots claros (aqua/amarelo/magenta) ficam
       abaixo de 3:1 de contraste (esperado pra cores vivas em fundo claro) —
       por isso o gráfico sempre vem com legenda + rótulo direto na linha +
       tabela ao lado, nunca só a cor pra identificar uma conta. */
    --account-series-1:#2a78d6;
    --account-series-2:#eb6834;
    --account-series-3:#1baf7a;
    --account-series-4:#eda100;
    --account-series-5:#e87ba4;
    --account-series-6:#008300;
    /* Dourado da barra lateral (números e títulos de grupo do menu): fixo,
       igual nos dois modos — a barra lateral (--cover) é sempre azul-marinho
       independente do tema, então usar --money (que muda de tom conforme o
       modo, pensado pra contraste contra o fundo claro/creme) deixava o
       dourado apagado no modo claro (4,4:1 de contraste). Este valor é o
       mesmo --money do modo escuro, que já testava bem contra o azul-marinho
       (5,4:1) nos dois casos. */
    --sidebar-gold:#D9A94E;
    --btn-glow: rgba(200,151,58,.35);
    --font-display:'Lora',Georgia,serif;
    --font-body:'DM Sans',sans-serif;
    --font-mono:'Courier New',Courier,monospace;
    --radius:10px;
  }
  /* Modo escuro — ativado pelo botão no rodapé do menu (guarda a escolha por
     aparelho, não muda sozinho pela hora do dia nem pelo tema do sistema). A
     área de conteúdo vira um cinza-chumbo neutro (bom pra leitura à noite),
     mas a barra lateral/botões (--cover) mantêm o mesmo azul Tonus do modo
     claro, pra marca continuar visível mesmo no escuro. */
  html[data-theme="dark"]{
    color-scheme: dark;
    --paper:#12161D;
    --paper-raised:#1B212B;
    --paper-line:#2C333F;
    --ink:#EDEFF3;
    --ink-soft:#B7BEC9;
    --ink-faint:#7C8494;
    --cover:#1B3A5C;
    --cover-soft:#24496F;
    --cover-line:#2E4D70;
    --cream-on-cover:#F0EEE7;
    --cream-on-cover-soft:#93A6BC;
    --money:#D9A94E;
    --money-strong:#F0C978;
    --money-soft:#3A2E14;
    --spend:#E28FAE;
    --spend-strong:#F2B8CE;
    --spend-soft:#3A1B26;
    --gold:#6E9BC9;
    --gold-strong:#9CC0E8;
    --gold-soft:#1C2E42;
    --scenario-conservador:#A67D30;
    --scenario-otimista:#EBCB8E;
    --account-series-1:#3987e5;
    --account-series-2:#d95926;
    --account-series-3:#199e70;
    --account-series-4:#c98500;
    --account-series-5:#d55181;
    --account-series-6:#008300;
    --sidebar-gold:#D9A94E;
    --btn-glow: rgba(217,169,78,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;max-width:100%;overflow-x:hidden;}
  body{background:var(--paper);}
  #app, input, select, .card-chip, #sidebar{transition:background-color .15s ease, color .15s ease, border-color .15s ease;}
  #app{
    display:flex;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
  }
  ::selection{background:var(--gold-soft);}

  /* ---------- Sidebar / ledger cover ---------- */
  #sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--cover);
    color:var(--cream-on-cover);
    padding:28px 0 20px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    padding:0 24px 22px;
    border-bottom:1px solid var(--cover-line);
    margin-bottom:8px;
  }
  .brand-mark{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.01em;
    line-height:1.15;
    color:var(--cream-on-cover);
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--cream-on-cover-soft);
    margin-top:5px;
  }
  nav{display:flex;flex-direction:column;margin-top:6px;}
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 22px 13px 24px;
    font-size:14px;
    color:var(--cream-on-cover-soft);
    cursor:pointer;
    border:none;
    background:none;
    text-align:left;
    font-family:var(--font-body);
    transition:background .12s ease, color .12s ease;
  }
  .tab .num{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--sidebar-gold);
    width:16px;
  }
  .tab:hover{background:var(--cover-soft);color:var(--cream-on-cover);}
  .tab.active{
    background:var(--paper);
    color:var(--gold-strong);
    border-radius:8px 0 0 8px;
    margin-right:0;
  }
  .tab.active .num{color:var(--spend-strong);opacity:1;}
  .nav-group-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--sidebar-gold);
    padding:16px 24px 6px;
  }
  .nav-group-label:first-child{padding-top:2px;}
  .nav-divider{border-top:1px solid var(--cover-line);margin:10px 24px 6px;}
  .sidebar-foot{
    margin-top:auto;
    padding:16px 24px 0;
    border-top:1px solid var(--cover-line);
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--cream-on-cover-soft);
    line-height:1.6;
  }

  /* ---------- Main ---------- */
  main{
    flex:1;
    min-width:0;
    padding:34px 40px 60px;
  }
  .page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:26px;
    gap:16px;
    flex-wrap:wrap;
  }
  .subtabs{
    display:flex;
    gap:4px;
    margin-bottom:26px;
    border-bottom:1px solid var(--paper-line);
    flex-wrap:wrap;
  }
  .subtab{
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    padding:10px 16px;
    border:none;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .12s ease, border-color .12s ease;
  }
  .subtab:hover{color:var(--ink);}
  .subtab.active{color:var(--gold-strong);border-bottom-color:var(--money);}
  .page-title{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .page-sub{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:20px 22px;
  }
  .card.auth-card{
    padding:36px 32px;
    border-radius:18px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.28);
  }
  html[data-theme="dark"] .card.auth-card{
    box-shadow:0 24px 60px -24px rgba(0,0,0,.65);
  }
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .grid-5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  @media (max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-5{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;}}

  .stat-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 8px;
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:23px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    margin:0;
  }
  .stat-value.money{color:var(--money-strong);}
  .stat-value.spend{color:var(--spend-strong);}
  .stat-value.gold{color:var(--gold-strong);}

  h3.section-title{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--ink);
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:0 10px 9px;
    border-bottom:1px solid var(--paper-line);
  }
  td{
    padding:11px 10px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row-hover:hover{background:rgba(180,134,42,.06);}

  .pill{
    display:inline-block;
    padding:3px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-family:var(--font-body);
    background:var(--paper-line);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .pill.money{background:var(--money-soft);color:var(--money-strong);}
  .pill.spend{background:var(--spend-soft);color:var(--spend-strong);}
  .pill.gold{background:var(--gold-soft);color:var(--gold-strong);}

  button.btn{
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--cover);
    background:var(--cover);
    color:var(--cream-on-cover);
    cursor:pointer;
  }
  button.btn:hover{background:var(--cover-soft);}
  button.btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--paper-line);
  }
  button.btn.ghost:hover{background:var(--paper-line);}
  button.btn.danger{
    background:transparent;
    border:1px solid var(--spend-soft);
    color:var(--spend-strong);
    padding:5px 10px;
    font-size:12px;
  }
  button.btn.danger:hover{background:var(--spend-soft);}
  button.btn.btn-hero{
    width:100%;
    padding:15px 18px;
    font-size:14.5px;
    font-weight:600;
    border-radius:11px;
    border:none;
    background:linear-gradient(135deg, var(--cover) 0%, var(--cover-soft) 100%);
    color:var(--cream-on-cover);
    box-shadow:0 12px 28px -8px var(--btn-glow), 0 2px 8px rgba(0,0,0,.16);
    letter-spacing:.01em;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  button.btn.btn-hero:hover{filter:brightness(1.08);}
  button.btn.btn-hero:active{transform:translateY(1px);}
  button.btn.btn-hero:disabled{opacity:.6;filter:none;box-shadow:none;cursor:default;transform:none;}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .auth-divider::before, .auth-divider::after{content:'';flex:1;height:1px;background:var(--paper-line);}
  button.icon-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);
    font-family:var(--font-mono);font-size:12px;padding:4px 8px;
  }
  button.icon-btn:hover{color:var(--spend-strong);}

  .entry-form{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:10px;
    align-items:end;
    margin-bottom:22px;
  }
  .entry-form.cols-6{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;}
  .entry-form.ef-fixed{grid-template-columns:1.3fr 0.9fr 0.8fr 0.85fr 0.9fr 0.9fr auto;}
  .entry-form.ef-import{grid-template-columns:1fr 1.4fr auto;}
  .entry-form.ef-2col{grid-template-columns:1fr 1fr;}
  .entry-form.ef-parcelas{grid-template-columns:0.6fr 1fr 1.4fr;}
  .entry-form.ef-photo{grid-template-columns:1fr auto;}
  @media (max-width:900px){
    .entry-form, .entry-form.cols-6, .entry-form.ef-fixed, .entry-form.ef-import, .entry-form.ef-2col, .entry-form.ef-parcelas, .entry-form.ef-photo{
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    }
  }
  .field{min-width:0;}
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:5px;
  }
  input,select{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    font-family:var(--font-body);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:var(--paper-raised);
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
  input[type=number]{font-family:var(--font-mono);}
  input[type=checkbox],input[type=radio]{width:auto;flex:none;}
  .consent-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:12px 14px;
    background:var(--paper-line);
    border-radius:8px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .consent-row input[type=checkbox]{margin-top:2px;}

  .empty{
    text-align:center;
    padding:44px 20px;
    color:var(--ink-faint);
  }
  .empty .empty-title{font-family:var(--font-display);font-size:17px;color:var(--ink-soft);margin-bottom:6px;}
  .empty .empty-body{font-size:13px;}

  .section-gap{margin-top:26px;}

  /* Card chips for credit cards */
  .card-chip{
    border-radius:12px;
    padding:16px 18px;
    color:#fff;
    cursor:pointer;
    border:2px solid transparent;
    min-width:180px;
    flex-shrink:0;
  }
  .card-chip .cc-name{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .card-chip .cc-info{font-family:var(--font-mono);font-size:11px;opacity:.85;margin-top:10px;}
  .card-chip .cc-total{font-family:var(--font-mono);font-size:19px;margin-top:12px;font-variant-numeric:tabular-nums;}
  .card-chip.selected{border-color:var(--gold);}
  .cc-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:120px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:9px;background:var(--paper-line);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-value{width:132px;text-align:right;font-family:var(--font-mono);font-size:12.5px;flex-shrink:0;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    background:var(--paper-raised);border:1px solid var(--paper-line);
    width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:14px;
  }
  .month-nav button:hover{background:var(--paper-line);}
  .month-label{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;
    min-width:150px;text-align:center;text-transform:capitalize;
  }
  .balance-strip{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-radius:12px;margin-bottom:20px;
  }
  .balance-strip.pos{background:var(--money-soft);}
  .balance-strip.neg{background:var(--spend-soft);}
  .balance-strip .label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;}
  .balance-strip .value{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:4px;}

  @media (max-width:760px){
    #app{flex-direction:column;}
    #sidebar{
      width:100%;height:auto;position:sticky;top:0;z-index:10;
      flex-direction:row;align-items:center;padding:10px 8px;overflow-x:auto;
    }
    .brand{display:none;}
    nav{flex-direction:row;margin-top:0;}
    .tab{padding:9px 14px;white-space:nowrap;border-radius:8px !important;}
    .nav-group-label,.nav-divider{display:none;}
    .sidebar-foot{display:none;}
    main{padding:20px 16px 50px;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (para JSX) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<!-- Leitor de PDF (importação de fatura) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>
<!-- Gerador de PDF (Relatório mensal, no Dashboard) e de planilha Excel
     (export de dados, na aba Privacidade) — ambos rodam só no navegador,
     sem nenhum serviço pago por trás. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// Preencha com os dados do seu projeto (Project Settings > API)

// ---------- helpers puros (sem dependência de React) ----------
// Converte texto digitado pela pessoa (aceita tanto vírgula quanto ponto como
// separador decimal) em número — os campos de valor/quantidade são type="text"
// de propósito, porque type="number" do navegador rejeita vírgula digitada.
function toNumber(v) {
  if (v === null || v === undefined || v === '') return NaN;
  return parseFloat(String(v).replace(',', '.'));
}
function fmtBRL(v) {
  const n = Number(v) || 0;
  return (n < 0 ? '-' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Versão compacta pra rótulos de eixo em gráficos (ex.: "R$ 350 mil", "R$ 1,8
// mi") — abaixo de mil usa o formato completo normal, pra não arredondar
// valores pequenos de forma enganosa.
function fmtBRLCompact(v) {
  const n = Number(v) || 0;
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1000000) return sign + 'R$ ' + (abs / 1000000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mi';
  if (abs >= 1000) return sign + 'R$ ' + Math.round(abs / 1000).toLocaleString('pt-BR') + ' mil';
  return fmtBRL(n);
}
function fmtQty(v) {

}
// Descobre a "família" da unidade de um item de supermercado, pra poder somar
// quantidades do mesmo produto mesmo quando ele foi registrado em unidades
// diferentes em compras diferentes (ex: banana às vezes em KG, às vezes em G
// — sem isso, a soma bruta de "0,523 + 523" ficaria sem sentido nenhum).
// Peso e volume sempre convertem pra uma unidade-base (KG e L); qualquer
// outra unidade (UN, CX, PC...) é tratada como contagem, sem conversão.
function qtyUnitFamily(unit) {
  const u = (unit || '').trim().toUpperCase();
  if (['G', 'GR', 'GRS', 'GRAMA', 'GRAMAS'].includes(u)) return { family: 'peso', base: 'KG', factor: 1 / 1000 };
  if (['KG', 'KILO', 'KILOS', 'QUILO', 'QUILOS'].includes(u)) return { family: 'peso', base: 'KG', factor: 1 };
  if (['ML', 'MILILITRO', 'MILILITROS'].includes(u)) return { family: 'volume', base: 'L', factor: 1 / 1000 };
  if (['L', 'LT', 'LITRO', 'LITROS'].includes(u)) return { family: 'volume', base: 'L', factor: 1 };
  return { family: 'un:' + (u || 'UN'), base: u || 'UN', factor: 1 };
}
// Resume o histórico de compras de um produto (já ordenado por data): soma
// de quantidade na unidade dominante, total gasto, preço médio e último
// preço por unidade-base, e variação do primeiro/último preço em relação à
// média — tudo levando em conta a conversão de unidade acima. Usado em todo
// lugar que resume um produto (lista "Todos os produtos", "Radar de preços"
// e o histórico de preço por item), pra não ter três lógicas ligeiramente
// diferentes de "preço médio" espalhadas pelo código.
function summarizeQtyPriceHistory(sortedItems) {
  if (!sortedItems || sortedItems.length === 0) return null;
  const last = sortedItems[sortedItems.length - 1];
  const normed = sortedItems.map((it) => {
    const q = Number(it.quantity) || 1;
    const { family, base, factor } = qtyUnitFamily(it.unit);
    return { ...it, qtyBase: q * factor, family, base };
  });
  let dominantFamily = normed[normed.length - 1].family;
  let bestCount = 0;
  const familiesSeen = new Set();
  normed.forEach((n) => {
    if (familiesSeen.has(n.family)) return;
    familiesSeen.add(n.family);
    const cnt = normed.filter((x) => x.family === n.family).length;
    if (cnt > bestCount) { bestCount = cnt; dominantFamily = n.family; }
  });
  const dominantItems = normed.filter((n) => n.family === dominantFamily);
  const totalQty = dominantItems.reduce((s, n) => s + n.qtyBase, 0);
  const spentDominant = dominantItems.reduce((s, n) => s + (Number(n.total_price) || 0), 0);
  const avg = totalQty > 0 ? spentDominant / totalQty : null;
  const totalSpent = sortedItems.reduce((s, it) => s + (Number(it.total_price) || 0), 0);
  const qtyUnit = dominantItems.length ? dominantItems[0].base : '';
  // preço por unidade-base de um item específico (o primeiro ou o último da
  // lista) — usa o total realmente pago dividido pela quantidade já
  // convertida, em vez de confiar no unit_price bruto (que pode estar numa
  // escala diferente, ex: preço por grama numa nota e por kg noutra).
  const perUnitPrice = (n) => (n.family === dominantFamily && n.qtyBase > 0) ? Number(n.total_price) / n.qtyBase : Number(n.unit_price);
  const firstNormed = normed[0];
  const lastNormed = normed[normed.length - 1];
  const firstPrice = perUnitPrice(firstNormed);
  const lastPrice = perUnitPrice(lastNormed);
  const pct = (sortedItems.length > 1 && avg) ? ((lastPrice - avg) / avg) * 100 : null;
  const changePct = (sortedItems.length > 1 && firstPrice) ? ((lastPrice - firstPrice) / firstPrice) * 100 : null;
  return { count: sortedItems.length, totalQty, qtyUnit, totalSpent, avg, firstPrice, lastPrice, pct, changePct, last, first: sortedItems[0] };
}
function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

// pré-preenchida com dia 1º do mês seguinte, mudando o mês sem o usuário notar.
function todayLocalISO() {

}
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return MONTH_NAMES[m - 1] + ' de ' + y;
}
function shortMonthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return MONTH_NAMES[m - 1].slice(0, 3) + '/' + y;
}
function shiftMonth(key, delta) {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return y + '-' + String(m).padStart(2, '0');
}
function toMonthKey(dateStr) { return dateStr ? dateStr.slice(0, 7) : null; }
function monthKeyToDate(key) { return key + '-01'; }
// Soma N meses a uma data (YYYY-MM-DD), mantendo o mesmo dia quando possível
// e ajustando pro último dia do mês quando ele não existir (ex: 31/01 + 1 mês = 28/02).
function addMonthsToDate(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  let ny = y, nm = m + n;
  while (nm > 12) { nm -= 12; ny++; }
  const lastDay = new Date(ny, nm, 0).getDate();
  const day = Math.min(d, lastDay);
  return ny + '-' + String(nm).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}
// Quantos meses faltam (arredondado pra cima) entre hoje e uma data-alvo (YYYY-MM-DD).
// Usado nas Metas pra sugerir "guarde R$X/mês" — negativo/zero quando a data já passou.
function monthsUntil(dateStr) {
  const [ty, tm, td] = dateStr.split('-').map(Number);
  const now = new Date();
  let months = (ty - now.getFullYear()) * 12 + (tm - (now.getMonth() + 1));
  if (td > now.getDate()) months += 1;
  return months;
}

// Simulador de quitação de dívidas — "bola de neve" (menor saldo primeiro) ou
// "avalanche" (maior taxa de juros primeiro). Mês a mês: cobra juros sobre o
// saldo, aplica o pagamento mínimo de cada dívida, e joga o aporte extra —
// somado aos mínimos já liberados de dívidas quitadas — na primeira dívida
// da ordem da estratégia que ainda tiver saldo. Simplificação assumida: um
// mínimo se libera para virar "extra" já no mesmo mês em que a dívida zera.
// Trava em 600 meses (50 anos) pra nunca travar o app numa dívida que nunca
// se paga sozinha (juros > pagamento mínimo).
function simulateQuitacao(debts, extraMensal, strategy) {
  const CAP = 600;
  let state = debts.map((d) => ({ id: d.id, saldo: Number(d.saldo_devedor), taxa: Number(d.taxa_juros) / 100, minimo: Number(d.pagamento_minimo) }));
  const order = [...state].sort((a, b) => (strategy === 'neve' ? a.saldo - b.saldo : b.taxa - a.taxa)).map((d) => d.id);
  let totalJuros = 0;
  let mes = 0;
  while (state.some((d) => d.saldo > 0.01) && mes < CAP) {
    mes++;
    state.forEach((d) => {
      if (d.saldo <= 0) return;
      const juros = d.saldo * d.taxa;
      totalJuros += juros;
      d.saldo += juros;
      d.saldo -= Math.min(d.minimo, d.saldo);
    });
    let poolExtra = extraMensal + state.filter((d) => d.saldo <= 0).reduce((s, d) => s + d.minimo, 0);
    for (const id of order) {
      if (poolExtra <= 0) break;
      const d = state.find((x) => x.id === id);
      if (!d || d.saldo <= 0) continue;
      const abatimento = Math.min(poolExtra, d.saldo);
      d.saldo -= abatimento;
      poolExtra -= abatimento;
    }
  }
  const quitado = state.every((d) => d.saldo <= 0.01);
  return { meses: quitado ? mes : null, totalJuros: quitado ? totalJuros : null, estourou: !quitado, ordem: order };
}
// Qual fatura (identificada pelo mês de VENCIMENTO) está em aberto agora,
// acumulando novas compras, para um cartão específico — baseado no dia de
// fechamento e vencimento dele, não no mês do calendário.
function currentInvoiceMonthKey(card, today) {
  today = today || new Date();
  const todayKey = monthKey(today);
  const closingMonthKey = today.getDate() <= card.closing_day ? todayKey : shiftMonth(todayKey, 1);
  return card.due_day < card.closing_day ? shiftMonth(closingMonthKey, 1) : closingMonthKey;
}

function incomeForMonth(incomeList, key) {

}

function lastDayOfMonth(key) {
  const [y, m] = key.split('-').map(Number);

const WEEKDAY_NAMES = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
function weekdayOfDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}
// Todas as datas (YYYY-MM-DD) dentro do mês `key` em que cai um determinado
// dia da semana — ex.: todas as terças de agosto/2026. Uma despesa semanal
// tem tipicamente 4 ou 5 dessas por mês, nunca 1 só.
function weeklyOccurrencesInMonth(weekday, key) {
  const days = lastDayOfMonth(key);
  const out = [];
  for (let d = 1; d <= days; d++) {
    const dateStr = key + '-' + String(d).padStart(2, '0');
    if (weekdayOfDate(dateStr) === Number(weekday)) out.push(dateStr);
  }
  return out;
}
// Todas as datas dentro do mês `key` que caem a cada 14 dias a partir de uma
// data de referência (devem existir ocorrências passadas E futuras — a
// referência pode ser qualquer uma delas, o cálculo funciona nos dois
// sentidos). Isso é "quinzenal" no sentido de "a cada 15 dias" (ex.:
// faxineira ou diarista quinzenal) — diferente de "duas vezes por mês em
// dias fixos" (dia 5 e dia 20), que este app não modela por enquanto.
function biweeklyOccurrencesInMonth(referenceDate, key) {
  const ref = new Date(referenceDate + 'T00:00:00');
  const monthStart = new Date(key + '-01T00:00:00');
  const monthEnd = new Date(key + '-' + String(lastDayOfMonth(key)).padStart(2, '0') + 'T00:00:00');
  const diffDays = Math.round((monthStart - ref) / 86400000);
  let k = Math.ceil(diffDays / 14);
  const out = [];
  while (true) {
    const d = new Date(ref.getTime() + k * 14 * 86400000);
    if (d > monthEnd) break;
    if (d >= monthStart) out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    k++;
  }
  return out;
}
// Datas esperadas de uma despesa fixa dentro do mês `key`, de acordo com a
// frequência cadastrada: 1 data no dia de vencimento (mensal), 1 data por
// semana em que o dia da semana cadastrado cai (semanal), ou 1 data a cada
// 14 dias a partir da data de referência (quinzenal) — é isso que permite
// modelar corretamente algo como uma terapia semanal (4-5 ocorrências reais
// por mês) ou uma diarista quinzenal, em vez de forçá-las como 1 parcela
// mensal única.
function fixedExpenseOccurrencesInMonth(fx, key) {
  if (fx.frequency === 'semanal') return weeklyOccurrencesInMonth(fx.due_weekday, key);
  if (fx.frequency === 'quinzenal') return biweeklyOccurrencesInMonth(fx.due_date, key);
  return [dueDateForMonth(fx.due_day, key)];
}
// Estimativa do quanto uma despesa fixa representa no mês `key` — o valor

// Próxima data (a partir de hoje, inclusive) em que uma despesa fixa deveria

function nextFixedExpenseOccurrence(fx, today) {
  today = today || new Date();
  const todayISO = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  if (fx.frequency === 'semanal') {
    for (let i = 0; i < 14; i++) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      if (d.getDay() === Number(fx.due_weekday)) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  if (fx.frequency === 'quinzenal') {
    const ref = new Date(fx.due_date + 'T00:00:00');
    for (let i = 0; i < 14; i++) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      const diffDays = Math.round((d - ref) / 86400000);
      if (((diffDays % 14) + 14) % 14 === 0) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    return todayISO;

  const key = monthKey(today);

// Compara a descrição de um lançamento com o nome de uma despesa fixa de

const FIXED_MATCH_WINDOW_DAYS = 3;

    // tinha começado a usar o app ainda. A ideia do card é servir de

    if (fx.created_at && key < fx.created_at.slice(0, 7)) return;

    // já lançado pode fazer ele "pular" pra uma ocorrência errada (ex.: uma
    // despesa semanal com 4-5 datas no mês) e deixar a ocorrência certa
    // aparecendo como pendente de novo. Resolvemos isso como um casamento
    // guloso por menor distância: ordena todos os pares (data, lançamento)
    // por proximidade e vai atribuindo os mais próximos primeiro.
    const linkedEntries = inMonth.filter((e) => e.fixed_expense_id === fx.id);
    const pairs = [];
    dates.forEach((expectedDate, di) => {
      linkedEntries.forEach((e) => { pairs.push({ di, entry: e, dist: Math.abs(daysBetween(expectedDate, e.entry_date)) }); });
    });
    pairs.sort((a, b) => a.dist - b.dist);
    const assignment = new Array(dates.length).fill(null);
    const entryClaimed = new Set();
    pairs.forEach((p) => {
      if (assignment[p.di] || entryClaimed.has(p.entry.id)) return;
      assignment[p.di] = p.entry;
      entryClaimed.add(p.entry.id);
    });
    dates.forEach((expectedDate, di) => {
      const base = { fixedExpenseId: fx.id, name: fx.name, category: fx.category, paymentMethod: fx.payment_method, estimatedAmount: Number(fx.amount), expectedDate };
      const linked = assignment[di];
      if (linked) {
        claimed.add(linked.id);
        occurrences.push({ ...base, status: 'linked', entry: linked });
        return;
      }
      const candidates = inMonth.filter((e) => !e.fixed_expense_id && !claimed.has(e.id) && e.category === fx.category && e.payment_method === fx.payment_method && descriptionsMatch(e.description, fx.name) && Math.abs(daysBetween(expectedDate, e.entry_date)) <= FIXED_MATCH_WINDOW_DAYS);
      if (candidates.length === 1) {
        occurrences.push({ ...base, status: 'suggested', candidate: candidates[0] });
      } else if (candidates.length > 1) {
        occurrences.push({ ...base, status: 'ambiguous', candidates });
      } else {
        occurrences.push({ ...base, status: 'pending' });
      }
    });
  });
  return occurrences.sort((a, b) => a.expectedDate < b.expectedDate ? -1 : a.expectedDate > b.expectedDate ? 1 : 0);
}
function cardInstallmentForMonth(purchase, key) {
  const install = Number(purchase.amount) / Number(purchase.installments || 1);
  const [sy, sm] = toMonthKey(purchase.first_month).split('-').map(Number);
  const [ky, km] = key.split('-').map(Number);
  const idx = (ky - sy) * 12 + (km - sm);
  if (idx < 0 || idx >= Number(purchase.installments || 1)) return 0;
  // excluded_months: meses em que essa parcela específica foi removida "de
  // forma desintegrada" (só aquele mês, sem mexer nos outros) pelo botão
  // "Remover parcela" no Histórico de compras — tratado igual a "fora do
  // intervalo" (0), pelo mesmo motivo: as parcelas de outros meses (antes e
  // depois) continuam existindo e mantêm sua própria numeração (ex.: se a
  // parcela 2/3 é removida, a 1/3 e a 3/3 continuam aparecendo como 1/3 e
  // 3/3, não viram 1/2 e 2/2).
  if (Array.isArray(purchase.excluded_months) && purchase.excluded_months.includes(key)) return 0;
  return install;
}
function cardTotalForMonth(purchases, cardId, key) {
  return purchases.filter((p) => p.card_id === cardId).reduce((s, p) => s + cardInstallmentForMonth(p, key), 0);
}
function allCardsTotalForMonth(purchases, key) {
  return purchases.reduce((s, p) => s + cardInstallmentForMonth(p, key), 0);
}
// Índices dos meses em que o total (já calculado por quem chama) é diferente
// de zero — usado pra esconder da tabela "Histórico mensal por cartão"
// colunas inteiras de "—" (ex.: meses antes da primeira compra "de verdade"
// valer, que hoje entravam no intervalo só porque monthsBetween cobre do
// primeiro first_month até o mês atual). Recebe os totais já prontos (não
// as purchases cruas) de propósito: o critério tem que bater exatamente com
// o que a tabela está mostrando, considerando só os cartões que existem
// hoje — se calculasse de novo a partir de todas as purchases, uma compra
// "órfã" de um cartão já excluído (deleteCard apaga só o registro em
// `cards`, não as card_purchases que apontam pra ele) ficaria contando como
// "atividade" mesmo sem aparecer em nenhuma linha nem no Total da tela.
// Compara com uma tolerância pequena (meio centavo) em vez de "!== 0" direto
// por causa de resíduo de ponto flutuante ao somar várias parcelas.
function visibleMonthIndexes(totalsByMonth) {
  const idx = [];
  totalsByMonth.forEach((v, i) => { if (Math.abs(v) > 0.005) idx.push(i); });
  return idx;
}
// Lançamentos da aba Despesas cuja forma de pagamento NÃO é cartão de crédito —
// esses somam no saldo/fluxo de caixa. Os pagos no cartão ficam de fora dessa
// soma de propósito: quem representa gasto de cartão nos totais é a aba
// Cartões (card_purchases), pra nunca contar duas vezes o mesmo gasto.
function nonCardExpenseEntriesForMonth(expenseEntries, key) {
  return (expenseEntries || []).filter((e) => e.entry_date && e.entry_date.slice(0, 7) === key && e.payment_method !== 'Cartão de crédito');
}
function nonCardExpenseTotalForMonth(expenseEntries, key) {
  return nonCardExpenseEntriesForMonth(expenseEntries, key).reduce((s, e) => s + Number(e.amount), 0);
}
// Saldo calculado de uma conta corrente/poupança: parte do saldo inicial
// (numa data de referência) e só soma/subtrai o que de fato foi lançado
// DEPOIS dessa data e está marcado como pertencente a essa conta.
// Receita recorrente fica de fora de propósito — é um valor esperado todo
// mês, sem uma data de lançamento concreta pra comparar com
// initial_balance_date (mesmo princípio já usado em lifetimeTotals: só
// entra no cálculo o que é lançamento real e datado, nunca projeção).
// Despesa no cartão de crédito também fica de fora — quem sai da conta não
// é a compra em si, é o pagamento da fatura, que este app ainda não
// rastreia por conta.
function accountBalance(account, incomeList, expenseEntries) {
  const from = account.initial_balance_date;
  const receitas = (incomeList || [])
    .filter((i) => !i.recurring && i.account_id === account.id && i.income_date && i.income_date >= from)
    .reduce((s, i) => s + Number(i.amount), 0);
  const despesas = (expenseEntries || [])
    .filter((e) => e.account_id === account.id && e.payment_method !== 'Cartão de crédito' && e.entry_date && e.entry_date >= from)
    .reduce((s, e) => s + Number(e.amount), 0);
  return Number(account.initial_balance) + receitas - despesas;
}
// Saldo da conta no FIM de um mês específico — mesma regra de accountBalance
// (fora receita recorrente e despesa no cartão), só que olhando só até o
// último dia do mês `key`, não até hoje. É o que monta a série mensal do
// "Histórico mensal por conta": cada ponto é "quanto essa conta tinha no
// fim daquele mês", regime de caixa, cumulativo desde initial_balance_date.
function accountBalanceThroughMonth(account, incomeList, expenseEntries, key) {
  const from = account.initial_balance_date;
  const upTo = key + '-' + String(lastDayOfMonth(key)).padStart(2, '0');
  const receitas = (incomeList || [])
    .filter((i) => !i.recurring && i.account_id === account.id && i.income_date && i.income_date >= from && i.income_date <= upTo)
    .reduce((s, i) => s + Number(i.amount), 0);
  const despesas = (expenseEntries || [])
    .filter((e) => e.account_id === account.id && e.payment_method !== 'Cartão de crédito' && e.entry_date && e.entry_date >= from && e.entry_date <= upTo)
    .reduce((s, e) => s + Number(e.amount), 0);
  return Number(account.initial_balance) + receitas - despesas;
}
// Nota: as compras de cartão entram aqui pela PARCELA que cai no mês `key`
// (mesmo critério de allCardsTotalForMonth) — não pela fatura em aberto hoje.
// Isso é o que permite este breakdown ser usado corretamente para qualquer
// mês, passado ou presente, e não só para "agora".
function categoryBreakdownForMonth(fixedList, purchases, cards, expenseEntries, key) {
  const map = {};
  // Mesma regra de pendingFixedOccurrencesForMonth: só entra a estimativa
  // "achatada" de uma ocorrência se ela ainda não tem nenhum lançamento real
  // (vinculado ou candidato) que já a represente — esse lançamento real já é
  // contado logo abaixo via nonCardExpenseEntriesForMonth, e somar os dois
  // duplicaria a categoria — e só pro mês atual em diante (mês passado usa
  // só o realizado).
  pendingFixedOccurrencesForMonth(fixedList, expenseEntries, key).forEach((occ) => {
    map[occ.category] = (map[occ.category] || 0) + occ.estimatedAmount;
  });
  (purchases || []).forEach((p) => {
    const amt = cardInstallmentForMonth(p, key);
    // amt === 0 (não > 0): um estorno/devolução de verdade tem valor
    // NEGATIVO neste mês e deve DESCONTAR da categoria, não ser ignorado —
    // só uma parcela que nem existe neste mês (fora do intervalo) tem amt
    // exatamente 0 e deve mesmo ficar de fora.
    if (amt !== 0) map[p.category] = (map[p.category] || 0) + amt;
  });
  if (expenseEntries && key) {
    nonCardExpenseEntriesForMonth(expenseEntries, key).forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount); });
  }
  return map;
}

function monthsBetween(startKey, endKey) {
  const out = [];
  let cur = startKey;
  while (true) {
    out.push(cur);
    if (cur === endKey) break;
    cur = shiftMonth(cur, 1);
  }
  return out;
}
// Monta a tabela de categoria x mês, do primeiro lançamento registrado até o mês atual.
function buildCategoryPivot(entries) {
  const withDate = entries.filter((e) => e.entry_date);
  if (withDate.length === 0) return { months: [], pivot: [], totals: [] };
  const startKey = withDate.map((e) => e.entry_date.slice(0, 7)).sort()[0];
  const endKey = monthKey(new Date());
  const months = monthsBetween(startKey, endKey);
  const cats = [...new Set(withDate.map((e) => e.category))].sort();
  const pivot = cats.map((cat) => ({
    cat,
    values: months.map((m) => withDate.filter((e) => e.category === cat && e.entry_date.slice(0, 7) === m).reduce((s, e) => s + Number(e.amount), 0)),
  }));
  const totals = months.map((m, i) => pivot.reduce((s, row) => s + row.values[i], 0));
  return { months, pivot, totals };
}

// Indicadores de saúde financeira (comprometimento de renda e taxa de
// poupança), mês a mês, para o Dashboard. Despesas fixas usam o total ATUAL
// aplicado a todos os meses do período — o app não guarda histórico de
// quando cada conta fixa mudou de valor; já cartão e despesas variáveis
// usam os valores realmente lançados em cada mês (dados históricos de verdade).
// Todos os meses entre o primeiro lançamento com data (receita avulsa,
// despesa variável ou compra no cartão) e o mês atual — o "desde o início"
// usado tanto no resumo geral do Dashboard quanto na tendência recente.
function allMonthsSinceStart(data) {
  const dated = [];
  (data.income || []).forEach((i) => { if (!i.recurring && i.income_date) dated.push(i.income_date.slice(0, 7)); });
  (data.expenseEntries || []).forEach((e) => { if (e.entry_date) dated.push(e.entry_date.slice(0, 7)); });
  (data.purchases || []).forEach((p) => { if (p.first_month) dated.push(toMonthKey(p.first_month)); });
  const endKey = monthKey(new Date());
  const startKey = dated.length ? dated.sort()[0] : endKey;
  return monthsBetween(startKey, endKey);
}
function healthTrendMonths(data) {
  return allMonthsSinceStart(data).slice(-6);
}
// Total recebido e total gasto desde o primeiro lançamento até hoje.
// totalGasto conta só o que foi REALMENTE lançado — cartão (card_purchases)
// e despesas em Despesas > Lançamentos (fixas ou variáveis, uma vez que
// viram um lançamento de verdade, com data e tudo, entram aqui igual) — e
// NÃO soma fixedContributionForMonth (a estimativa de despesa fixa "pendente"
// que ainda não virou lançamento). Antes somava as duas coisas, o que fazia
// uma despesa fixa cadastrada hoje "gastar" retroativo em meses antes dela
// existir, e continuar contando gasto em qualquer mês em que a pessoa
// simplesmente não pagou aquela conta (nunca lançou). totalRecebido continua
// usando o valor atual da receita recorrente aplicado a todo o período — não
// existe hoje uma forma de saber se uma receita recorrente foi "de verdade"
// recebida mês a mês (não tem lançamento equivalente ao de despesas fixas).
function lifetimeTotals(data) {
  const months = allMonthsSinceStart(data);
  let totalRecebido = 0, totalGasto = 0;
  months.forEach((m) => {
    totalRecebido += incomeForMonth(data.income, m);
    totalGasto += allCardsTotalForMonth(data.purchases, m) + nonCardExpenseTotalForMonth(data.expenseEntries, m);
  });
  return { totalRecebido, totalGasto, months };
}
function healthIndicatorsForMonth(data, key) {
  const incMes = incomeForMonth(data.income, key);
  const despMes = fixedContributionForMonth(data.fixedExpenses, data.expenseEntries, key) + allCardsTotalForMonth(data.purchases, key) + nonCardExpenseTotalForMonth(data.expenseEntries, key);
  return {
    comprometimento: incMes > 0 ? (despMes / incMes) * 100 : null,
    poupanca: incMes > 0 ? ((incMes - despMes) / incMes) * 100 : null,
  };
}

// Alertas de variação: compara o gasto de cada categoria neste mês com a
// própria média dos 3 meses anteriores (mesmo espírito do "Radar de preços"
// do Supermercado, aplicado a categorias de despesa). Só alerta categoria
// com histórico de verdade (média > 0) e gasto atual acima de um piso mínimo,
// pra não avisar sobre uma compra pequena e isolada. Retorna as maiores
// variações primeiro, limitado a 5 pra não virar uma lista enorme.
function categoryVarianceAlerts(data, key) {
  const atual = categoryBreakdownForMonth(data.fixedExpenses, data.purchases, data.cards, data.expenseEntries, key);
  const prevMonths = [shiftMonth(key, -1), shiftMonth(key, -2), shiftMonth(key, -3)];
  const prevBreakdowns = prevMonths.map((m) => categoryBreakdownForMonth(data.fixedExpenses, data.purchases, data.cards, data.expenseEntries, m));
  const PISO = 50;
  const LIMIAR = 30;
  const alerts = Object.entries(atual)
    .map(([cat, val]) => {
      const media = prevBreakdowns.reduce((s, b) => s + (b[cat] || 0), 0) / prevBreakdowns.length;
      const pct = media > 0 ? ((val - media) / media) * 100 : null;
      return { cat, val, media, pct };
    })
    .filter((a) => a.pct !== null && a.val >= PISO && Math.abs(a.pct) >= LIMIAR)
    .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))
    .slice(0, 5);
  return alerts;
}

// Projeção de saldo pros próximos N meses: renda recorrente (a única parte
// previsível de receita), despesas fixas e parcelas de cartão já lançadas
// (esses dois são dados reais, já agendados) somados a uma ESTIMATIVA de
// despesas variáveis com base na média dos últimos 3 meses — sinalizado
// como estimativa, não promessa, porque gasto variável futuro não dá pra saber.
function projectBalance(data, months) {
  const nowKey = monthKey(new Date());
  const last3 = [shiftMonth(nowKey, -2), shiftMonth(nowKey, -1), nowKey];
  const avgVariable = last3.reduce((s, m) => s + nonCardExpenseTotalForMonth(data.expenseEntries, m), 0) / 3;
  const rendaRecorrente = incomeForMonth(data.income, nowKey);
  const out = [];
  for (let i = 1; i <= months; i++) {
    const m = shiftMonth(nowKey, i);
    // Recalcula a estimativa das fixas em CADA mês futuro (não uma vez só) —
    // despesas semanais têm 4 ou 5 ocorrências dependendo do mês.
    const despesa = nonCardFixedTotal(data.fixedExpenses, m) + allCardsTotalForMonth(data.purchases, m) + avgVariable;
    out.push({ m, saldo: rendaRecorrente - despesa });
  }
  return out;
}

// Simulador "e se eu financiar isso": tabela Price (parcelas fixas), padrão
// no crédito ao consumidor brasileiro. taxaMensalPct=0 vira parcelamento
// simples sem juros (valor financiado / número de parcelas).
function pmtFixedInstallment(valorFinanciado, taxaMensalPct, parcelas) {
  const i = taxaMensalPct / 100;
  if (i === 0) return valorFinanciado / parcelas;
  return (valorFinanciado * i) / (1 - Math.pow(1 + i, -parcelas));
}

// ---------- Projeção de longo prazo (patrimônio, fluxo de caixa, aposentadoria) ----------
// Tudo aqui trabalha em termos REAIS (poder de compra de hoje), não nominais —
// a taxa de retorno que a pessoa informa já é a taxa esperada DESCONTADA a
// inflação. Isso evita números nominais gigantes e confusos numa projeção de
// décadas (ex.: "aluguel de R$50 mil/mês em 2056") e mantém tudo diretamente
// comparável com o que já aparece hoje no app.

// Soma de proventos recebidos de UM investimento (histórico completo, não só
// um total acumulado) — usada pra calcular o retorno TOTAL (preço + provento).
function investmentDividendsSum(dividends, investmentId) {
  return (dividends || []).filter((d) => d.investment_id === investmentId).reduce((s, d) => s + Number(d.amount), 0);
}
// Retorno total de um investimento: ganho de capital (valor atual - valor
// investido) + proventos recebidos até hoje. Sem isso, um investimento que
// distribui dividendo pra conta corrente (não reinvestido) parece "no
// vermelho" mesmo tendo dado lucro de verdade.
function investmentTotalReturn(investment, dividends) {
  const invested = Number(investment.invested_value);
  const gainCapital = Number(investment.current_value) - invested;
  const gainDividends = investmentDividendsSum(dividends, investment.id);
  const gainTotal = gainCapital + gainDividends;
  return { gainCapital, gainDividends, gainTotal, pctCapital: invested > 0 ? (gainCapital / invested) * 100 : 0, pctDividendos: invested > 0 ? (gainDividends / invested) * 100 : 0, pctTotal: invested > 0 ? (gainTotal / invested) * 100 : 0 };
}
// Poupança anual "hoje": média dos últimos 3 meses de (renda - despesas
// fixas ainda não confirmadas - cartão - despesas reais não-cartão) vezes 12
// — mesmo critério de projectBalance, mas anualizado e usando o total de
// despesa (não só a variável), pra servir de ponto de partida realista da
// projeção de longo prazo em vez do saldo de um único mês (que pode estar no
// meio do mês, com poucas despesas lançadas ainda).
function annualSavingsCapacity(data) {
  const nowKey = monthKey(new Date());
  const last3 = [shiftMonth(nowKey, -2), shiftMonth(nowKey, -1), nowKey];
  const avgRenda = incomeForMonth(data.income, nowKey);
  const avgDespesa = last3.reduce((s, m) => s + fixedContributionForMonth(data.fixedExpenses, data.expenseEntries, m) + allCardsTotalForMonth(data.purchases, m) + nonCardExpenseTotalForMonth(data.expenseEntries, m), 0) / 3;
  return { rendaAnual: avgRenda * 12, despesaAnual: avgDespesa * 12, sobraAnual: (avgRenda - avgDespesa) * 12 };
}
// Os 3 cenários variam só a taxa de retorno dos investimentos — o principal
// fator de incerteza numa projeção de décadas — em ±2 pontos percentuais em
// torno da taxa "moderada" informada. Renda e despesa não têm cenário
// próprio (ver income/expenseRealGrowthRate em projectNetWorth).
const SCENARIO_SPREAD_PP = 2;
function investmentReturnScenarios(moderateRatePct) {
  return { conservador: moderateRatePct - SCENARIO_SPREAD_PP, moderado: moderateRatePct, otimista: moderateRatePct + SCENARIO_SPREAD_PP };
}
// Fração da dívida total já quitada no ano Y, aproximada em LINHA RETA de
// hoje até o mês em que simulateQuitacao projeta ela zerar (extraMensal=0 —
// só pagamento mínimo, pra não contar o mesmo dinheiro 2x como aporte extra
// de dívida E como poupança reinvestida). É uma aproximação deliberada da
// curva real de amortização (que quita mais rápido no fim, por efeito bola
// de neve/avalanche) — suficiente pra um gráfico de décadas, mas dito aqui
// com todas as letras em vez de fingir precisão que não existe.
function debtRemainingAtYear(totalDebtToday, payoffMonths, year) {
  if (totalDebtToday <= 0) return 0;
  // Nunca quita dentro do horizonte simulado (simulateQuitacao "estourou") —
  // fica constante no valor de hoje (pior caso), não desaparece sozinha.
  if (!payoffMonths) return totalDebtToday;
  const payoffYears = payoffMonths / 12;
  if (year >= payoffYears) return 0;
  return totalDebtToday * (1 - year / payoffYears);
}
// Projeção de patrimônio líquido ano a ano, em termos reais, pra 1 cenário de
// taxa de retorno. O patrimônio não-investido (imóveis, veículos, reserva em
// conta etc.) fica constante em termos reais — só o saldo investido cresce
// composto e recebe a poupança anual (reinvestida por completo); a dívida
// (se houver) é abatida pela aproximação linear de debtRemainingAtYear.
function projectNetWorth(params) {
  const { nonInvestedNetWorth, investedToday, annualIncomeToday, annualExpenseToday, incomeRealGrowthRate = 0, expenseRealGrowthRate = 0, returnRatePct, debtToday = 0, debtPayoffMonths = null, years } = params;
  const r = returnRatePct / 100;
  const gInc = incomeRealGrowthRate / 100;
  const gExp = expenseRealGrowthRate / 100;
  const out = [];
  let invested = investedToday;
  for (let year = 0; year <= years; year++) {
    const renda = annualIncomeToday * Math.pow(1 + gInc, year);
    const despesa = annualExpenseToday * Math.pow(1 + gExp, year);
    const sobra = renda - despesa;
    const dividaRestante = debtRemainingAtYear(debtToday, debtPayoffMonths, year);
    out.push({ year, investido: invested, naoInvestido: nonInvestedNetWorth, dividaRestante, sobraAnual: sobra, patrimonio: invested + nonInvestedNetWorth - dividaRestante });
    invested = invested * (1 + r) + sobra;
  }
  return out;
}
// Quanto tempo o patrimônio investido projetado sustenta um gasto mensal real
// constante a partir da aposentadoria (retirada no início de cada ano,
// remanescente rende a mesma taxa do cenário durante a aposentadoria).
// "duraParaSempre" quando o rendimento anual supera o gasto anual e o saldo
// nunca deixa de crescer — não é o mesmo que "sobra dinheiro", é sustentável
// indefinidamente com a taxa assumida.
function retirementRunway(patrimonioNaAposentadoria, monthlyExpenseReal, returnRatePct, maxYears = 60) {
  const r = returnRatePct / 100;
  const annualExpense = monthlyExpenseReal * 12;
  let saldo = patrimonioNaAposentadoria;
  if (saldo <= 0) return { duraParaSempre: false, anosCobertos: 0 };
  for (let year = 0; year < maxYears; year++) {
    saldo = saldo - annualExpense;
    if (saldo <= 0) return { duraParaSempre: false, anosCobertos: year + 1 };
    saldo = saldo * (1 + r);
  }
  const rendaAnualDoSaldo = saldo * r;
  return { duraParaSempre: rendaAnualDoSaldo >= annualExpense, anosCobertos: maxYears };
}

// ---------- importação de fatura ----------
const CATEGORY_KEYWORDS = {
  'Alimentação': ['ifood','restaurante','mercado','supermerc','padaria','lanchonete','pizzaria','burger','acougue','açougue','hortifruti','emporio','empório'],
  'Transporte': ['uber','99app','99*','99pop','posto ','combustivel','combustível','estacionamento','pedagio','pedágio','metro','metrô','onibus','ônibus','localiza','movida'],

function guessCategory(desc) {
  const d = ' ' + desc.toLowerCase() + ' ';
  for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) {
    if (words.some((w) => d.includes(w))) return cat;
  }

}
function normalizeText(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
// Compara os lançamentos extraídos da fatura com o que já foi lançado manualmente
// nesse cartão/fatura, para não duplicar o que já está certo e avisar sobre o
// que estiver diferente.
function reconcilePreview(parsedRows, existingForCardMonth) {
  return parsedRows.map((row) => {
    const normDesc = normalizeText(row.description);
    let status = 'new', matched = null;
    for (const ep of existingForCardMonth) {
      const epNorm = normalizeText(ep.description);
      if (!epNorm || !(normDesc.includes(epNorm) || epNorm.includes(normDesc))) continue;
      const existingInstallAmount = Number(ep.amount) / Number(ep.installments || 1);
      // Compara em CENTAVOS (inteiro), não em ponto flutuante direto: bancos
      // (XP, por exemplo) não cobram o mesmo valor exato em toda parcela de
      // uma compra parcelada — o arredondamento da divisão do total muda a
      // parcela em 1-2 centavos mês a mês (ex: parcela 1 = R$140,05, parcela
      // 2 = R$140,03, mesma compra). A tolerância de 2 centavos já existia
      // pra cobrir isso, mas Math.abs(140.05 - 140.03) dá
      // 0.020000000000010232 em ponto flutuante — passa ligeiramente de 0.02
      // e cai em "valor diferente" (mismatch) em vez de "já lançado"
      // (matched). Um usuário revisando a importação pode achar que esse
      // aviso significa "compra nova" e marcar pra incluir, duplicando uma
      // parcela que já existia (bug real visto pelo usuário comparando
      // faturas de fev/mar de 2026).
      const diffCents = Math.round(Math.abs(existingInstallAmount - row.amount) * 100);
      if (diffCents <= 2) { status = 'matched'; matched = ep; break; }
      status = 'mismatch'; matched = ep;
    }
    return { ...row, reconcileStatus: status, matchedPurchase: matched };
  });
}
const INVOICE_SKIP_KEYWORDS = ['saldo anterior','pagamento efetuado','pagamento recebido','pagamentos validos','pagamentos válidos','total desta fatura','total da fatura','limite dispon','limite total','valor minimo','valor mínimo','encargos de atraso','saldo em aberto','fatura fechada','vencimento da fatura','juros rotativo','pagto ','pagamento em '];
// Não ancora no fim da linha: quando duas colunas do PDF grudam na mesma
// linha de texto (ex: uma compra seguida de um trecho de outra seção que
// caiu na mesma altura), a linha real de compra termina logo depois do
// valor — o que vem depois é lixo de outra coluna e deve ser ignorado, não
// fazer a linha inteira falhar o casamento.
const INVOICE_LINE_RE = /^(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})(?=\s|$)/;

// ---------- interpretação de cupom fiscal (aba Supermercado) ----------
const GROCERY_SKIP_KEYWORDS = ['valor total','forma de pagamento','forma pagto','troco','desconto','acrescimo','tributos totais','cupom fiscal','consumidor','cnpj','inscricao estadual',' ie:','endereco','dinheiro','cartao de credito','cartao de debito',' pix ','total r$','qtd. total de itens','valor a pagar','consulte pela chave','chave de acesso','protocolo de autorizacao','via consumidor','ambiente de',' danfe','nfc-e'];
const GROCERY_LINE_RE = /^(.+?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
const GROCERY_QTY_RE = /(\d+(?:[.,]\d+)?)\s*(UN|KG|LT|L|CX|PC|UND|G|ML|UNID|UNIDADE)?\s*[xX]\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i;

function parseGroceryLines(lines) {
  const results = [];
  lines.forEach((raw) => {
    const line = (raw || '').trim();
    if (!line) return;
    const lower = line.toLowerCase();
    if (GROCERY_SKIP_KEYWORDS.some((k) => lower.includes(k))) return;
    const m = line.match(GROCERY_LINE_RE);
    if (!m) return;
    let desc = m[1].trim();
    const total = parseFloat(m[2].replace(/\./g, '').replace(',', '.'));
    if (isNaN(total) || total <= 0) return;
    let quantity = 1, unit = null, unitPrice = total;
    const qm = desc.match(GROCERY_QTY_RE);
    if (qm) {
      quantity = parseFloat(qm[1].replace(',', '.')) || 1;
      unit = qm[2] ? qm[2].toUpperCase() : null;
      unitPrice = parseFloat(qm[3].replace(/\./g, '').replace(',', '.')) || total;
      desc = desc.slice(0, qm.index).trim();
    }
    if (!desc || desc.length < 2) return;
    results.push({ description: desc, quantity, unit, unitPrice, totalPrice: total });
  });
  return results;
}

// Alguns bancos (ex: XP) geram o PDF com pequenos ajustes de espaçamento
// entre certos caracteres (kerning), o que faz o leitor de PDF devolver
// "27 / 06 / 25" e "29 , 90" em vez de "27/06/25" e "29,90" — com espaço
// sobrando em volta de barra, vírgula e ponto de milhar. Sem corrigir isso,
// nem a data nem o valor batem com o formato que o resto do código espera,
// e a fatura inteira é descartada. Aqui a gente cola de volta esses espaços
// que não deveriam existir, sem mexer no resto do texto.
function normalizeNumericSpacing(text) {
  let t = text;
  t = t.replace(/(\d)\s*\/\s*(\d)/g, '$1/$2');
  t = t.replace(/(\d)\s*,\s*(\d)/g, '$1,$2');
  t = t.replace(/(\d)\s*\.\s*(\d{3}\b)/g, '$1.$2');
  // sinal de negativo (ex: linha de pagamento "-8.271,38") separado do valor
  // por espaço — sem isso, o "-" fica preso na descrição e o valor entra
  // como positivo (ex: um pagamento sendo contado como se fosse uma compra)
  t = t.replace(/-\s+(\d)/g, '-$1');
  // nomes de estabelecimento com "*" ou abreviações com ponto (ex:
  // "SHOPEE*LOJA", "S.A.") também sofrem o mesmo espaçamento indevido —
  // não afeta valores, só deixa a descrição mais fiel ao nome real
  t = t.replace(/([A-Za-zÀ-ÿ0-9])\s*\*\s*([A-Za-zÀ-ÿ0-9])/g, '$1*$2');
  t = t.replace(/([A-Z])\s*\.\s*([A-Z])(?=[.\s]|$)/g, '$1.$2');
  return t;
}
// Quantas vezes uma mesma posição X de data precisa se repetir numa página
// pra ser considerada "início de coluna" (fatura com cartão adicional lado a
// lado). O padrão (3+) evita falso positivo em faturas de 1 coluna só; uma
// fatura MUITO curta (poucas compras) pode não repetir 3x nem tendo colunas
// de verdade — pra esses casos existe o ajuste manual "força colunas lado a
// lado" salvo no padrão de leitura do cartão, que baixa a exigência pra 2x.
function columnStartThreshold(forceMultiColumn) {
  return forceMultiColumn ? 2 : 3;
}
async function extractLinesFromPDF(file, password, opts) {
  opts = opts || {};
  const buf = await file.arrayBuffer();
  const params = { data: buf };
  if (password) params.password = password;
  const pdf = await pdfjsLib.getDocument(params).promise;
  let allLines = [];
  // Faturas com cartões adicionais (ex: Itaú) imprimem as compras de cada
  // cartão em colunas lado a lado, na MESMA altura da página — se a gente só
  // agrupar por altura (Y), o texto de colunas diferentes gruda numa linha só
  // e embaralha tudo (uma compra "rouba" a data/valor da compra vizinha).
  // Não dá pra separar por um espaço horizontal grande genérico: o espaço
  // ANTES do valor (alinhado à direita) de uma compra normal também é
  // grande, às vezes maior que o espaço entre colunas de verdade. Em vez
  // disso, usamos dois sinais bem específicos desse tipo de fatura pra saber
  // onde uma coluna nova realmente começa:
  //  1) uma data (DD/MM) que se repete na mesma posição horizontal em várias
  //     linhas da página — é o começo de coluna. Uma data de parcela (ex.
  //     "02/02" dentro da descrição) aparece em posições horizontais
  //     diferentes a cada linha, porque vem depois de nomes de
  //     estabelecimento com tamanhos diferentes, então nunca repete X.
  //  2) o texto "Lançamentos..." que aparece como cabeçalho/rodapé de cada
  //     coluna (ex: "Lançamentos no cartão (final 1670) 1.224,14") — nunca é
  //     parte de uma compra, então também marca início de um novo pedaço.
  const DATE_TOKEN_RE = /^\d{2}\/\d{2}$/;
  const SEGMENT_BREAK_RE = /^lançamentos/i;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let currentRow = [];
    let lastY = null;
    const rows = [];
    content.items.forEach((it) => {
      const text = (it.str || '').trim();
      if (!text) return; // ignora itens que são só espaço
      const y = it.transform[5];
      const x = it.transform[4];
      if (lastY !== null && Math.abs(y - lastY) > 2) {
        rows.push(currentRow);
        currentRow = [];
      }
      currentRow.push({ text, x });
      lastY = y;
    });
    if (currentRow.length) rows.push(currentRow);
    rows.forEach((row) => row.sort((a, b) => a.x - b.x));

    // descobre quais posições X de datas realmente se repetem (início de coluna)
    const dateXCounts = {};
    rows.forEach((row) => {
      row.forEach((item) => {
        if (DATE_TOKEN_RE.test(item.text)) {
          const bucket = Math.round(item.x / 2) * 2;
          dateXCounts[bucket] = (dateXCounts[bucket] || 0) + 1;
        }
      });
    });
    const columnStartXs = Object.keys(dateXCounts)
      .map(Number)
      .filter((x) => dateXCounts[x] >= columnStartThreshold(opts.forceMultiColumn));
    const isColumnStart = (x) => columnStartXs.some((cx) => Math.abs(cx - x) <= 2);

    rows.forEach((row) => {
      let segments = [[]];
      row.forEach((item, idx) => {
        const isNewColumnDate = DATE_TOKEN_RE.test(item.text) && isColumnStart(item.x);
        const isSegmentBreak = SEGMENT_BREAK_RE.test(item.text);
        if (idx > 0 && (isNewColumnDate || isSegmentBreak)) {
          segments.push([]);
        }
        segments[segments.length - 1].push(item);
      });
      segments.forEach((seg) => {
        let text = seg.map((it) => it.text).join(' ').replace(/\s+/g, ' ').trim();
        text = normalizeNumericSpacing(text);
        // Marca de qual "coluna" da página essa linha veio (posição X do
        // primeiro item do trecho, arredondada) — faturas com vários cartões
        // adicionais podem ter mais de uma coluna de lançamentos na mesma
        // página, cada uma com seu próprio trecho de "compras parceladas /
        // próximas faturas". Sem saber a coluna de origem, um aviso desses
        // numa coluna acaba cortando por engano os lançamentos de verdade
        // que ainda vêm depois na OUTRA coluna (visto numa fatura real).
        if (text) allLines.push({ text, col: seg[0] ? Math.round(seg[0].x / 50) * 50 : 0 });
      });
    });
  }
  return allLines;
}
function buildDateFromInvoiceLine(dateStr, invoiceMonthKey) {
  const parts = dateStr.split('/');
  const day = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10);
  let year;
  if (parts[2]) {
    year = parts[2].length === 2 ? 2000 + parseInt(parts[2], 10) : parseInt(parts[2], 10);
  } else {
    // sem ano na fatura: usa o ano da fatura como referência, mas corrige pra
    // trás sempre que o mês da compra é MAIOR que o mês da fatura — não só na
    // virada exata dez/jan. Uma parcela antiga (ex: parcela 4/4 iniciada há
    // vários meses) pode aparecer numa fatura de março com data "28/11" sem
    // ano: 11 (novembro) é maior que 3 (março), então só pode ser novembro do
    // ano ANTERIOR — nunca novembro do mesmo ano da fatura (isso seria uma
    // data no futuro). Bug real visto no Histórico de compras: uma parcela
    // 4/4 ficou registrada como 28/11/2026 (ano da fatura) em vez de
    // 28/11/2025, porque o código antigo só tratava o caso adjacente exato
    // (mês=12 e mês da fatura=1), deixando qualquer outro mês "mais à frente"
    // sem corrigir o ano.
    const [invYear, invMonth] = invoiceMonthKey.split('-').map(Number);
    year = invYear;
    if (month > invMonth) year = invYear - 1;
    // Caso oposto (fatura de dezembro cujo fechamento cai depois da virada,
    // trazendo um lançamento de janeiro): esse janeiro é do ano SEGUINTE ao
    // da fatura, não do mesmo ano — mantido como caso específico porque não é
    // o espelho do "mês maior" acima (janeiro é o menor mês possível).
    else if (month === 1 && invMonth === 12) year = invYear + 1;
  }
  if (!day || !month || month < 1 || month > 12 || day < 1 || day > 31) return null;
  return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}
// opts.extraSkipKeywords: frases extras (o "padrão de leitura" salvo por
// cartão em card_import_profiles) que, além das palavras genéricas de
// INVOICE_SKIP_KEYWORDS, também fazem uma linha ser ignorada — pra cobrir
// textos de rodapé/aviso específicos de um banco que a lista genérica não
// prevê, sem precisar editar código pra cada banco novo.
function parseInvoiceLines(lines, invoiceMonthKey, opts) {
  opts = opts || {};
  const extraSkip = (opts.extraSkipKeywords || []).map((k) => k.toLowerCase().trim()).filter(Boolean);
  const results = [];
  // Algumas faturas (Itaú, por exemplo) trazem, no fim, uma seção de "prévia
  // das próximas faturas" — mostra parcelas futuras de compras que JÁ estão
  // na fatura atual. Isso não é uma compra nova, é a mesma compra parcelada;
  // se a gente ler essa seção também, a parcela seguinte entraria como se
  // fosse outra compra, duplicando o valor nos meses seguintes. Assim que
  // bater numa dessas seções, para de ler o resto — mas só da MESMA coluna
  // da página onde apareceu o aviso (lines pode vir como string simples, sem
  // coluna — texto colado à mão ou fixtures antigas — ou como { text, col }
  // vindo de extractLinesFromPDF). Faturas com vários cartões adicionais têm
  // mais de uma coluna de lançamentos na mesma página, cada uma com seu
  // próprio trecho de "compras parceladas"; se o corte fosse global, o aviso
  // de uma coluna descartava por engano lançamentos de verdade que ainda
  // vinham depois na OUTRA coluna (bug real visto numa fatura com 5 cartões).
  const CUTOFF_RE = /compras parceladas|pr[oó]ximas faturas|demais faturas/i;
  const cutoffCols = new Set();
  // Não existe dedup por conteúdo/repetição de linha bruta aqui — já
  // tentamos duas versões disso (por data+descrição+valor em toda a fatura,
  // depois só por repetição IMEDIATA da linha anterior) e as DUAS causaram
  // bugs reais de compras de verdade sumindo: a primeira derrubou duas
  // cobranças de pedágio "TagItau*IGORMARCHI 50,00" no mesmo dia; a segunda
  // derrubou 2 das 3 cobranças reais de "HTM*129M LTDA 583,25", que
  // aparecem adjacentes e idênticas na fatura de maio/2026 por serem
  // mesmo 3 cobranças de verdade, não um glitch de leitura do PDF — e isso
  // derrubou o total da fatura em R$ 1.166,50 sem nenhum aviso. Não dá pra
  // diferenciar "o PDF duplicou a leitura" de "são 3 compras de verdade
  // iguaizinhas" só pelo texto da linha, então cada linha que casa com o
  // formato de compra conta como uma compra. O único tipo de duplicata
  // removido é o caso específico e seguro da prévia de parcela futura, mais
  // abaixo (mesma descrição + valor de parcela + total de parcelas, fica só
  // a de menor número).
  for (const entry of lines) {
    const rawLine = typeof entry === 'string' ? entry : entry.text;
    const col = typeof entry === 'string' ? 0 : (entry.col || 0);
    if (CUTOFF_RE.test(rawLine)) { cutoffCols.add(col); continue; }
    if (cutoffCols.has(col)) continue;
    const m = rawLine.match(INVOICE_LINE_RE);
    if (!m) continue;
    const descRaw = m[2].trim();
    const lower = descRaw.toLowerCase();
    if (INVOICE_SKIP_KEYWORDS.some((k) => lower.includes(k))) continue;
    if (extraSkip.some((k) => lower.includes(k))) continue;
    // Linha de resumo da capa da fatura (ex: "Vencimento Pagamento total
    // Pagamento mínimo" seguida de "05/04/2026 R$ 8.450,06 R$ 1.267,51") casa
    // com o mesmo formato "data + texto + valor" de uma compra de verdade,
    // mas nenhuma descrição de estabelecimento contém "R$" — é sempre esse
    // resumo. Sem esse filtro, o valor do pagamento mínimo entra como se
    // fosse uma compra.
    if (/R\$/i.test(descRaw)) continue;
    let installCurrent = null, installTotal = null;
    let description = descRaw;
    const instMatch = descRaw.match(/(\d{1,2})\s*\/\s*(\d{1,2})\b/);
    if (instMatch) {
      const cur = parseInt(instMatch[1]), tot = parseInt(instMatch[2]);
      if (tot >= cur && tot <= 48 && cur >= 1) {
        installCurrent = cur; installTotal = tot;
        // Tira o "NN/MM" da descrição guardada — esse número é a parcela
        // ATUAL, e o banco reimprime a mesma compra parcelada todo mês com
        // um número diferente (ex: "FARM ECOMMERCE CM 02/04" em janeiro,
        // "FARM ECOMMERCE CM 03/04" em fevereiro). O número já fica salvo à
        // parte em installCurrent/installTotal; mantê-lo dentro do texto da
        // descrição fazia a reconciliação (que compara descrição pra saber
        // se uma compra já foi lançada) nunca reconhecer o mês seguinte como
        // "a mesma compra" — e lançava de novo, duplicando a parcela (bug
        // real: parcelas de janeiro duplicaram ao importar fevereiro).
        description = (descRaw.slice(0, instMatch.index) + descRaw.slice(instMatch.index + instMatch[0].length)).replace(/\s+/g, ' ').trim();
      }
    }
    const amount = parseFloat(m[3].replace(/\./g, '').replace(',', '.'));
    // amount === 0 (não <= 0): um estorno/devolução de verdade vem com valor
    // NEGATIVO na fatura (ex: "PETLOVE SAUD*Petlove S -109,86") e é um
    // lançamento legítimo que reduz o total — descartar tudo que não é
    // positivo também jogava fora estornos de verdade, não só lixo de
    // valor zero (bug real: um estorno sumiu da importação).
    if (isNaN(amount) || amount === 0) continue;
    const purchaseDate = buildDateFromInvoiceLine(m[1], invoiceMonthKey);
    results.push({ description, category: guessCategory(description), amount, installCurrent, installTotal, purchaseDate });
  }
  // Algumas faturas mostram a MESMA compra parcelada duas vezes: uma vez
  // como a parcela do mês atual, e de novo na seção de prévia de próximas
  // faturas (que deveria ter sido cortada pelo corte por coluna acima, mas
  // o pdf.js às vezes devolve o texto dessa fatura fora da ordem visual da
  // página, e a linha de prévia escapa do corte). Isso já causou uma fatura
  // real somar R$ 580 a mais do que o valor impresso. Correção que não
  // depende da ordem de leitura: quando a mesma descrição + valor da
  // parcela + total de parcelas aparece mais de uma vez, só a de MENOR
  // número de parcela é a de verdade deste mês — a prévia sempre mostra um
  // número de parcela maior (é sempre um mês futuro), nunca menor.
  const bestByIdentity = new Map();
  results.forEach((r) => {
    if (r.installCurrent == null || r.installTotal == null) return;
    const identKey = normalizeText(r.description) + '|' + r.installTotal + '|' + r.amount.toFixed(2);
    const current = bestByIdentity.get(identKey);
    if (!current || r.installCurrent < current) bestByIdentity.set(identKey, r.installCurrent);
  });
  return results.filter((r) => {
    if (r.installCurrent == null || r.installTotal == null) return true;
    const identKey = normalizeText(r.description) + '|' + r.installTotal + '|' + r.amount.toFixed(2);
    return r.installCurrent === bestByIdentity.get(identKey);
  });
}

              <tr className="row-hover" key={row.cat}>
                <td style={{ ...stickyCell, minWidth: 130 }}><span className="pill">{row.cat}</span></td>
                {row.values.map((v, i) => <td key={i} className="num" style={{ minWidth: 96 }}>{v > 0 ? fmtBRL(v) : '—'}</td>)}
              </tr>
            ))}
            <tr>
              <td style={{ ...stickyCell, fontWeight: 600, minWidth: 130 }}>Total</td>
              {totals.map((v, i) => <td key={i} className="num" style={{ fontWeight: 600, minWidth: 96 }}>{fmtBRL(v)}</td>)}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Select de categoria com opção de criar uma nova sem sair do formulário.
// options: lista de nomes já disponíveis (padrão + personalizadas do usuário).
// kind: 'expense' | 'income' — define em qual lista a nova categoria é salva.
// onCreated: chamado com o nome novo depois de salvar, para o componente pai
// atualizar sua lista de categorias personalizadas.
function CategorySelect({ value, onChange, options, kind, onCreated }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState('');

  async function commit() {
    const name = newName.trim();
    setAdding(false);
    setNewName('');
    if (!name) return;
    // Se já existe uma categoria igual (ignorando maiúsculas/minúsculas e
    // espaços), usa a grafia JÁ CADASTRADA — nunca a que a pessoa acabou de
    // digitar. Sem isso, digitar "internet" quando já existe "Internet"
    // criava um rótulo levemente diferente que nunca se somava ao original,
    // duplicando a categoria em "Gastos por categoria" e nos alertas.
    const existing = options.find((o) => o.toLowerCase() === name.toLowerCase());
    if (existing) { onChange(existing); return; }
    const { error } = await sb.from('custom_categories').insert({ name, kind });
    if (error && error.code !== '23505') { onChange(options[0] || ''); return; }
    onCreated(name);
    onChange(name);
  }

  if (adding) {
    return (
      <input
        autoFocus
        value={newName}
        placeholder="Nome da nova categoria"
        onChange={(e) => setNewName(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { setAdding(false); setNewName(''); }
        }}
      />
    );
  }

  return (
    <select
      value={value}
      onChange={(e) => (e.target.value === '__new__' ? setAdding(true) : onChange(e.target.value))}
    >
      {options.map((c) => <option key={c}>{c}</option>)}
      <option value="__new__">+ Nova categoria...</option>
    </select>
  );
}

function getTheme() {
  try { return localStorage.getItem('tonusTheme') === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; }
}
function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('tonusTheme', theme); } catch (e) {}
  const meta = document.querySelector('meta[name="theme-color"]');

function LoginScreen() {
  const [mode, setMode] = useState('login');

  const [agreed, setAgreed] = useState(false);
