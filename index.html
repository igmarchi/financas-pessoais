<style>
  :root{
    color-scheme: light;
    --paper:#F7F4EF;
    --paper-raised:#FFFFFF;
    --paper-line:#E4DFD3;
    --ink:#0D1117;
    --ink-soft:#3B3F47;
    --ink-faint:#7A8090;
    --cover:#1B3A5C;
    --cover-soft:#24496F;
    --cover-line:#2E4D70;
    --cream-on-cover:#F7F4EF;
    --cream-on-cover-soft:#A9BBCE;
    --money:#C8973A;
    --money-strong:#9C7526;
    --money-soft:#F3E6C7;
    --spend:#5C1F3A;
    --spend-strong:#421530;
    --spend-soft:#EEDCE3;
    --gold:#1B3A5C;
    --gold-strong:#14283F;
    --gold-soft:#E3E9F0;
    --btn-glow: rgba(200,151,58,.35);
    --font-display:'Lora',Georgia,serif;
    --font-body:'DM Sans',sans-serif;
    --font-mono:'Courier New',Courier,monospace;
    --radius:10px;
  }
  /* Modo escuro — ativado pelo botão no rodapé do menu (guarda a escolha por
     aparelho, não muda sozinho pela hora do dia nem pelo tema do sistema). A
     barra lateral (--cover) já era escura no modo claro, então muda pouco;
     o que realmente inverte é o fundo/texto da área de conteúdo. */
  html[data-theme="dark"]{
    color-scheme: dark;
    --paper:#12161D;
    --paper-raised:#1B212B;
    --paper-line:#2C333F;
    --ink:#EDEFF3;
    --ink-soft:#B7BEC9;
    --ink-faint:#7C8494;
    --cover:#101E30;
    --cover-soft:#182C46;
    --cover-line:#223A57;
    --cream-on-cover:#F0EEE7;
    --cream-on-cover-soft:#93A6BC;
    --money:#D9A94E;
    --money-strong:#F0C978;
    --money-soft:#3A2E14;
    --spend:#E28FAE;
    --spend-strong:#F2B8CE;
    --spend-soft:#3A1B26;
    --gold:#6E9BC9;
    --gold-strong:#9CC0E8;
    --gold-soft:#1C2E42;
    --btn-glow: rgba(217,169,78,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;max-width:100%;overflow-x:hidden;}
  body{background:var(--paper);}
  #app, input, select, .card-chip, #sidebar{transition:background-color .15s ease, color .15s ease, border-color .15s ease;}
  #app{
    display:flex;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
  }
  ::selection{background:var(--gold-soft);}

  /* ---------- Sidebar / ledger cover ---------- */
  #sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--cover);
    color:var(--cream-on-cover);
    padding:28px 0 20px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:0 24px 22px;
    border-bottom:1px solid var(--cover-line);
    margin-bottom:8px;
  }
  .brand-mark{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.01em;
    line-height:1.15;
    color:var(--cream-on-cover);
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--cream-on-cover-soft);
    margin-top:5px;
  }
  nav{display:flex;flex-direction:column;margin-top:6px;}
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 22px 13px 24px;
    font-size:14px;
    color:var(--cream-on-cover-soft);
    cursor:pointer;
    border:none;
    background:none;
    text-align:left;
    font-family:var(--font-body);
    transition:background .12s ease, color .12s ease;
  }
  .tab .num{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--cream-on-cover-soft);
    opacity:.7;
    width:16px;
  }
  .tab:hover{background:var(--cover-soft);color:var(--cream-on-cover);}
  .tab.active{
    background:var(--paper);
    color:var(--gold-strong);
    border-radius:8px 0 0 8px;
    margin-right:0;
  }
  .tab.active .num{color:var(--spend-strong);opacity:1;}
  .sidebar-foot{
    margin-top:auto;
    padding:16px 24px 0;
    border-top:1px solid var(--cover-line);
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--cream-on-cover-soft);
    line-height:1.6;
  }

  /* ---------- Main ---------- */
  main{
    flex:1;
    min-width:0;
    padding:34px 40px 60px;
  }
  .page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:26px;
    gap:16px;
    flex-wrap:wrap;
  }
  .subtabs{
    display:flex;
    gap:4px;
    margin-bottom:26px;
    border-bottom:1px solid var(--paper-line);
    flex-wrap:wrap;
  }
  .subtab{
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    padding:10px 16px;
    border:none;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .12s ease, border-color .12s ease;
  }
  .subtab:hover{color:var(--ink);}
  .subtab.active{color:var(--gold-strong);border-bottom-color:var(--money);}
  .page-title{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .page-sub{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:20px 22px;
  }
  .card.auth-card{
    padding:36px 32px;
    border-radius:18px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.28);
  }
  html[data-theme="dark"] .card.auth-card{
    box-shadow:0 24px 60px -24px rgba(0,0,0,.65);
  }
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .grid-5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-5{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-2{grid-template-columns:1fr;}}

  .stat-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 8px;
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:23px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    margin:0;
  }
  .stat-value.money{color:var(--money-strong);}
  .stat-value.spend{color:var(--spend-strong);}
  .stat-value.gold{color:var(--gold-strong);}

  h3.section-title{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--ink);
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:0 10px 9px;
    border-bottom:1px solid var(--paper-line);
  }
  td{
    padding:11px 10px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .row-hover:hover{background:rgba(180,134,42,.06);}

  .pill{
    display:inline-block;
    padding:3px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-family:var(--font-body);
    background:var(--paper-line);
    color:var(--ink-soft);
  }
  .pill.money{background:var(--money-soft);color:var(--money-strong);}
  .pill.spend{background:var(--spend-soft);color:var(--spend-strong);}
  .pill.gold{background:var(--gold-soft);color:var(--gold-strong);}

  button.btn{
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--cover);
    background:var(--cover);
    color:var(--cream-on-cover);
    cursor:pointer;
  }
  button.btn:hover{background:var(--cover-soft);}
  button.btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--paper-line);
  }
  button.btn.ghost:hover{background:var(--paper-line);}
  button.btn.danger{
    background:transparent;
    border:1px solid var(--spend-soft);
    color:var(--spend-strong);
    padding:5px 10px;
    font-size:12px;
  }
  button.btn.danger:hover{background:var(--spend-soft);}
  button.btn.btn-hero{
    width:100%;
    padding:15px 18px;
    font-size:14.5px;
    font-weight:600;
    border-radius:11px;
    border:none;
    background:linear-gradient(135deg, var(--cover) 0%, var(--cover-soft) 100%);
    color:var(--cream-on-cover);
    box-shadow:0 12px 28px -8px var(--btn-glow), 0 2px 8px rgba(0,0,0,.16);
    letter-spacing:.01em;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  button.btn.btn-hero:hover{filter:brightness(1.08);}
  button.btn.btn-hero:active{transform:translateY(1px);}
  button.btn.btn-hero:disabled{opacity:.6;filter:none;box-shadow:none;cursor:default;transform:none;}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .auth-divider::before, .auth-divider::after{content:'';flex:1;height:1px;background:var(--paper-line);}
  button.icon-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);
    font-family:var(--font-mono);font-size:12px;padding:4px 8px;
  }
  button.icon-btn:hover{color:var(--spend-strong);}

  .entry-form{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:10px;
    align-items:end;
    margin-bottom:22px;
  }
  .entry-form.cols-6{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;}
  .entry-form.ef-import{grid-template-columns:1fr 1.4fr auto;}
  .entry-form.ef-2col{grid-template-columns:1fr 1fr;}
  .entry-form.ef-parcelas{grid-template-columns:0.6fr 1fr 1.4fr;}
  .entry-form.ef-photo{grid-template-columns:1fr auto;}
  @media (max-width:900px){
    .entry-form, .entry-form.cols-6, .entry-form.ef-import, .entry-form.ef-2col, .entry-form.ef-parcelas, .entry-form.ef-photo{
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    }
  }
  .field{min-width:0;}
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:5px;
  }
  input,select{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    font-family:var(--font-body);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:var(--paper-raised);
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
  input[type=number]{font-family:var(--font-mono);}

  .empty{
    text-align:center;
    padding:44px 20px;
    color:var(--ink-faint);
  }
  .empty .empty-title{font-family:var(--font-display);font-size:17px;color:var(--ink-soft);margin-bottom:6px;}
  .empty .empty-body{font-size:13px;}

  .section-gap{margin-top:26px;}

  /* Card chips for credit cards */
  .card-chip{
    border-radius:12px;
    padding:16px 18px;
    color:#fff;
    cursor:pointer;
    border:2px solid transparent;
    min-width:180px;
    flex-shrink:0;
  }
  .card-chip .cc-name{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .card-chip .cc-info{font-family:var(--font-mono);font-size:11px;opacity:.85;margin-top:10px;}
  .card-chip .cc-total{font-family:var(--font-mono);font-size:19px;margin-top:12px;font-variant-numeric:tabular-nums;}
  .card-chip.selected{border-color:var(--gold);}
  .cc-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:120px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:9px;background:var(--paper-line);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-value{width:132px;text-align:right;font-family:var(--font-mono);font-size:12.5px;flex-shrink:0;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    background:var(--paper-raised);border:1px solid var(--paper-line);
    width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:14px;
  }
  .month-nav button:hover{background:var(--paper-line);}
  .month-label{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;
    min-width:150px;text-align:center;text-transform:capitalize;
  }
  .balance-strip{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-radius:12px;margin-bottom:20px;
  }
  .balance-strip.pos{background:var(--money-soft);}
  .balance-strip.neg{background:var(--spend-soft);}
  .balance-strip .label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;}
  .balance-strip .value{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:4px;}

  @media (max-width:760px){
    #app{flex-direction:column;}
    #sidebar{
      width:100%;height:auto;position:sticky;top:0;z-index:10;
      flex-direction:row;align-items:center;padding:10px 8px;overflow-x:auto;
    }
    .brand{display:none;}
    nav{flex-direction:row;margin-top:0;}
    .tab{padding:9px 14px;white-space:nowrap;border-radius:8px !important;}
    .sidebar-foot{display:none;}
    main{padding:20px 16px 50px;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// Preencha com os dados do seu projeto (Project Settings > API)
// ============================================================
const SUPABASE_URL = "https://hdbhoquhszehzbhtwdui.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkYmhvcXVoc3plaHpiaHR3ZHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MTg2MDIsImV4cCI6MjEwMjE5NDYwMn0.J9pFtSUonUGykoBXood1Q1sgchi2ndvi0X3zDDJQoW4";

const supabaseReady = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
// Sessão em sessionStorage (não localStorage): isso faz o login "sumir"
// sozinho quando a aba/janela do navegador é fechada de vez, então da
// próxima vez que o app for aberto ele pede login de novo — mesmo que a
// pessoa não tenha clicado em "Sair". Pra não precisar digitar e-mail/senha
// toda hora, existe o login por biometria (passkey) logo abaixo.
const sb = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    // Login por biometria (Face ID/Touch ID/impressão digital), recurso
    // experimental do Supabase — precisa desse opt-in explícito.
    experimental: { passkey: true },
  },
}) : null;

const CATS_EXP = ['Moradia','Transporte','Alimentação','Saúde','Educação','Lazer','Assinaturas','Cuidado pessoal','Outros'];
const CATS_INC = ['Salário','Freelance / PJ','Investimentos','Reembolso','Outros'];
const PAYMENT_METHODS = ['Débito automático','Boleto','PIX','Cartão de crédito','Transferência'];
const CARD_COLORS = ['#1B3A5C','#5C1F3A','#14283F','#2E4D70'];
const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

// ---------- helpers puros (sem dependência de React) ----------
// Converte texto digitado pela pessoa (aceita tanto vírgula quanto ponto como
// separador decimal) em número — os campos de valor/quantidade são type="text"
// de propósito, porque type="number" do navegador rejeita vírgula digitada.
function toNumber(v) {
  if (v === null || v === undefined || v === '') return NaN;
  return parseFloat(String(v).replace(',', '.'));
}
function fmtBRL(v) {
  const n = Number(v) || 0;
  return (n < 0 ? '-' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtQty(v) {
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
}
// Descobre a "família" da unidade de um item de supermercado, pra poder somar
// quantidades do mesmo produto mesmo quando ele foi registrado em unidades
// diferentes em compras diferentes (ex: banana às vezes em KG, às vezes em G
// — sem isso, a soma bruta de "0,523 + 523" ficaria sem sentido nenhum).
// Peso e volume sempre convertem pra uma unidade-base (KG e L); qualquer
// outra unidade (UN, CX, PC...) é tratada como contagem, sem conversão.
function qtyUnitFamily(unit) {
  const u = (unit || '').trim().toUpperCase();
  if (['G', 'GR', 'GRS', 'GRAMA', 'GRAMAS'].includes(u)) return { family: 'peso', base: 'KG', factor: 1 / 1000 };
  if (['KG', 'KILO', 'KILOS', 'QUILO', 'QUILOS'].includes(u)) return { family: 'peso', base: 'KG', factor: 1 };
  if (['ML', 'MILILITRO', 'MILILITROS'].includes(u)) return { family: 'volume', base: 'L', factor: 1 / 1000 };
  if (['L', 'LT', 'LITRO', 'LITROS'].includes(u)) return { family: 'volume', base: 'L', factor: 1 };
  return { family: 'un:' + (u || 'UN'), base: u || 'UN', factor: 1 };
}
// Resume o histórico de compras de um produto (já ordenado por data): soma
// de quantidade na unidade dominante, total gasto, preço médio e último
// preço por unidade-base, e variação do primeiro/último preço em relação à
// média — tudo levando em conta a conversão de unidade acima. Usado em todo
// lugar que resume um produto (lista "Todos os produtos", "Radar de preços"

function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

function monthsBetween(startKey, endKey) {
  const out = [];
  let cur = startKey;
  while (true) {
    out.push(cur);
    if (cur === endKey) break;
    cur = shiftMonth(cur, 1);
  }
  return out;
}
// Monta a tabela de categoria x mês, do primeiro lançamento registrado até o mês atual.
function buildCategoryPivot(entries) {
  const withDate = entries.filter((e) => e.entry_date);
  if (withDate.length === 0) return { months: [], pivot: [], totals: [] };
  const startKey = withDate.map((e) => e.entry_date.slice(0, 7)).sort()[0];
  const endKey = monthKey(new Date());
  const months = monthsBetween(startKey, endKey);
  const cats = [...new Set(withDate.map((e) => e.category))].sort();
  const pivot = cats.map((cat) => ({
    cat,
    values: months.map((m) => withDate.filter((e) => e.category === cat && e.entry_date.slice(0, 7) === m).reduce((s, e) => s + Number(e.amount), 0)),
  }));
  const totals = months.map((m, i) => pivot.reduce((s, row) => s + row.values[i], 0));
  return { months, pivot, totals };
}

const INVOICE_SKIP_KEYWORDS = ['saldo anterior','pagamento efetuado','pagamento recebido','total desta fatura','total da fatura','limite dispon','limite total','valor minimo','valor mínimo','encargos de atraso','saldo em aberto','fatura fechada','vencimento da fatura','juros rotativo','pagto ','pagamento em '];

function parseGroceryLines(lines) {
  const results = [];
  lines.forEach((raw) => {
    const line = (raw || '').trim();
    if (!line) return;
    const lower = line.toLowerCase();
    if (GROCERY_SKIP_KEYWORDS.some((k) => lower.includes(k))) return;
    const m = line.match(GROCERY_LINE_RE);
    if (!m) return;
    let desc = m[1].trim();
    const total = parseFloat(m[2].replace(/\./g, '').replace(',', '.'));
    if (isNaN(total) || total <= 0) return;
    let quantity = 1, unit = null, unitPrice = total;
    const qm = desc.match(GROCERY_QTY_RE);
    if (qm) {
      quantity = parseFloat(qm[1].replace(',', '.')) || 1;

      unitPrice = parseFloat(qm[3].replace(/\./g, '').replace(',', '.')) || total;

// Alguns bancos (ex: XP) geram o PDF com pequenos ajustes de espaçamento
// entre certos caracteres (kerning), o que faz o leitor de PDF devolver
// "27 / 06 / 25" e "29 , 90" em vez de "27/06/25" e "29,90" — com espaço
// sobrando em volta de barra, vírgula e ponto de milhar. Sem corrigir isso,
// nem a data nem o valor batem com o formato que o resto do código espera,
// e a fatura inteira é descartada. Aqui a gente cola de volta esses espaços
// que não deveriam existir, sem mexer no resto do texto.
function normalizeNumericSpacing(text) {
  let t = text;
  t = t.replace(/(\d)\s*\/\s*(\d)/g, '$1/$2');
  t = t.replace(/(\d)\s*,\s*(\d)/g, '$1,$2');
  t = t.replace(/(\d)\s*\.\s*(\d{3}\b)/g, '$1.$2');
  // sinal de negativo (ex: linha de pagamento "-8.271,38") separado do valor
  // por espaço — sem isso, o "-" fica preso na descrição e o valor entra
  // como positivo (ex: um pagamento sendo contado como se fosse uma compra)
  t = t.replace(/-\s+(\d)/g, '-$1');

  // "SHOPEE*LOJA", "S.A.") também sofrem o mesmo espaçamento indevido —
  // não afeta valores, só deixa a descrição mais fiel ao nome real
  t = t.replace(/([A-Za-zÀ-ÿ0-9])\s*\*\s*([A-Za-zÀ-ÿ0-9])/g, '$1*$2');

}
async function extractLinesFromPDF(file, password) {
  const buf = await file.arrayBuffer();
  const params = { data: buf };
  if (password) params.password = password;
  const pdf = await pdfjsLib.getDocument(params).promise;
  let allLines = [];
  // Faturas com cartões adicionais (ex: Itaú) imprimem as compras de cada
  // cartão em colunas lado a lado, na MESMA altura da página — se a gente só
  // agrupar por altura (Y), o texto de colunas diferentes gruda numa linha só
  // e embaralha tudo (uma compra "rouba" a data/valor da compra vizinha).
  // Não dá pra separar por um espaço horizontal grande genérico: o espaço
  // ANTES do valor (alinhado à direita) de uma compra normal também é
  // grande, às vezes maior que o espaço entre colunas de verdade. Em vez
  // disso, usamos dois sinais bem específicos desse tipo de fatura pra saber
  // onde uma coluna nova realmente começa:
  //  1) uma data (DD/MM) que se repete na mesma posição horizontal em várias
  //     linhas da página — é o começo de coluna. Uma data de parcela (ex.
  //     "02/02" dentro da descrição) aparece em posições horizontais
  //     diferentes a cada linha, porque vem depois de nomes de
  //     estabelecimento com tamanhos diferentes, então nunca repete X.
  //  2) o texto "Lançamentos..." que aparece como cabeçalho/rodapé de cada
  //     coluna (ex: "Lançamentos no cartão (final 1670) 1.224,14") — nunca é
  //     parte de uma compra, então também marca início de um novo pedaço.
  const DATE_TOKEN_RE = /^\d{2}\/\d{2}$/;
  const SEGMENT_BREAK_RE = /^lançamentos/i;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let currentRow = [];
    let lastY = null;
    const rows = [];
    content.items.forEach((it) => {
      const text = (it.str || '').trim();
      if (!text) return; // ignora itens que são só espaço
      const y = it.transform[5];
      const x = it.transform[4];
      if (lastY !== null && Math.abs(y - lastY) > 2) {
        rows.push(currentRow);
        currentRow = [];
      }
      currentRow.push({ text, x });
      lastY = y;
    });
    if (currentRow.length) rows.push(currentRow);
    rows.forEach((row) => row.sort((a, b) => a.x - b.x));

    // descobre quais posições X de datas realmente se repetem (início de coluna)
    const dateXCounts = {};
    rows.forEach((row) => {
      row.forEach((item) => {
        if (DATE_TOKEN_RE.test(item.text)) {
          const bucket = Math.round(item.x / 2) * 2;
          dateXCounts[bucket] = (dateXCounts[bucket] || 0) + 1;
        }
      });
    });
    const columnStartXs = Object.keys(dateXCounts)
      .map(Number)
      .filter((x) => dateXCounts[x] >= 3);
    const isColumnStart = (x) => columnStartXs.some((cx) => Math.abs(cx - x) <= 2);

    rows.forEach((row) => {
      let segments = [[]];
      row.forEach((item, idx) => {
        const isNewColumnDate = DATE_TOKEN_RE.test(item.text) && isColumnStart(item.x);
        const isSegmentBreak = SEGMENT_BREAK_RE.test(item.text);
        if (idx > 0 && (isNewColumnDate || isSegmentBreak)) {
          segments.push([]);
        }
        segments[segments.length - 1].push(item.text);
      });
      segments.forEach((seg) => {
        let text = seg.join(' ').replace(/\s+/g, ' ').trim();
        text = normalizeNumericSpacing(text);
        if (text) allLines.push(text);
      });
    });
  }
  return allLines;
}
function buildDateFromInvoiceLine(dateStr, invoiceMonthKey) {
  const parts = dateStr.split('/');
  const day = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10);
  let year;
  if (parts[2]) {
    year = parts[2].length === 2 ? 2000 + parseInt(parts[2], 10) : parseInt(parts[2], 10);
  } else {
    // sem ano na fatura: usa o ano da fatura, ajustando na virada dez/jan
    const [invYear, invMonth] = invoiceMonthKey.split('-').map(Number);
    year = invYear;
    if (month === 12 && invMonth === 1) year = invYear - 1;
    else if (month === 1 && invMonth === 12) year = invYear + 1;
  }
  if (!day || !month || month < 1 || month > 12 || day < 1 || day > 31) return null;
  return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}
function parseInvoiceLines(lines, invoiceMonthKey) {
  const results = [];
  const seen = new Set(); // evita contar duas vezes uma compra que aparece repetida no PDF
  // Algumas faturas (Itaú, por exemplo) trazem, no fim, uma seção de "prévia
  // das próximas faturas" — mostra parcelas futuras de compras que JÁ estão
  // na fatura atual. Isso não é uma compra nova, é a mesma compra parcelada;
  // se a gente ler essa seção também, a parcela seguinte entraria como se
  // fosse outra compra, duplicando o valor nos meses seguintes. Assim que
  // bater numa dessas seções, para de ler o resto da fatura.
  const CUTOFF_RE = /compras parceladas|pr[oó]ximas faturas|demais faturas/i;
  for (const rawLine of lines) {
    if (CUTOFF_RE.test(rawLine)) break;
    const m = rawLine.match(INVOICE_LINE_RE);
    if (!m) continue;
    const descRaw = m[2].trim();
    const lower = descRaw.toLowerCase();
    if (INVOICE_SKIP_KEYWORDS.some((k) => lower.includes(k))) continue;
    // Linha de resumo da capa da fatura (ex: "Vencimento Pagamento total
    // Pagamento mínimo" seguida de "05/04/2026 R$ 8.450,06 R$ 1.267,51") casa
    // com o mesmo formato "data + texto + valor" de uma compra de verdade,
    // mas nenhuma descrição de estabelecimento contém "R$" — é sempre esse
    // resumo. Sem esse filtro, o valor do pagamento mínimo entra como se
    // fosse uma compra.
    if (/R\$/i.test(descRaw)) continue;
    let installCurrent = null, installTotal = null;
    const instMatch = descRaw.match(/(\d{1,2})\s*\/\s*(\d{1,2})\b/);
    if (instMatch) {
      const cur = parseInt(instMatch[1]), tot = parseInt(instMatch[2]);
      if (tot >= cur && tot <= 48 && cur >= 1) { installCurrent = cur; installTotal = tot; }
    }
    const amount = parseFloat(m[3].replace(/\./g, '').replace(',', '.'));
    if (isNaN(amount) || amount <= 0) continue;
    const dedupKey = m[1] + '|' + lower + '|' + amount.toFixed(2);
    if (seen.has(dedupKey)) continue;
    seen.add(dedupKey);
    const purchaseDate = buildDateFromInvoiceLine(m[1], invoiceMonthKey);
    results.push({ description: descRaw, category: guessCategory(descRaw), amount, installCurrent, installTotal, purchaseDate });
  }
  return results;
}

// Select de categoria com opção de criar uma nova sem sair do formulário.
// options: lista de nomes já disponíveis (padrão + personalizadas do usuário).
// kind: 'expense' | 'income' — define em qual lista a nova categoria é salva.
// onCreated: chamado com o nome novo depois de salvar, para o componente pai
// atualizar sua lista de categorias personalizadas.
function CategorySelect({ value, onChange, options, kind, onCreated }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState('');

  async function commit() {
    const name = newName.trim();
    setAdding(false);
    setNewName('');
    if (!name) return;
    const alreadyExists = options.some((o) => o.toLowerCase() === name.toLowerCase());
    if (alreadyExists) { onChange(name); return; }
    const { error } = await sb.from('custom_categories').insert({ name, kind });
    if (error && error.code !== '23505') { onChange(options[0] || ''); return; }
    onCreated(name);
    onChange(name);
  }

  if (adding) {
    return (
      <input
        autoFocus
        value={newName}
        placeholder="Nome da nova categoria"
        onChange={(e) => setNewName(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { setAdding(false); setNewName(''); }
        }}
      />
    );
  }

  return (
    <select
      value={value}
      onChange={(e) => (e.target.value === '__new__' ? setAdding(true) : onChange(e.target.value))}
    >
      {options.map((c) => <option key={c}>{c}</option>)}
      <option value="__new__">+ Nova categoria...</option>
    </select>
  );
}

function getTheme() {

function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('tonusTheme', theme); } catch (e) {}

function LoginScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [agreed, setAgreed] = useState(false);
  const [erro, setErro] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingBiometria, setLoadingBiometria] = useState(false);
  const [openDoc, setOpenDoc] = useState(null);
  // Só mostra o botão se o navegador/aparelho suporta WebAuthn de verdade
  // (a maioria dos celulares e computadores modernos suporta).
  const suportaBiometria = typeof window !== 'undefined' && !!window.PublicKeyCredential;

  async function handleSubmit(ev) {
    ev.preventDefault();
    setErro(null); setAviso(null);
    if (mode === 'signup' && !agreed) {
      setErro('Para criar sua conta, é preciso ler e aceitar a Política de Privacidade e os Termos de Uso.');
      return;
    }
    setLoading(true);
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      setLoading(false);
      if (error) setErro(error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : error.message);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: senha });
      setLoading(false);
      if (error) { setErro(error.message); return; }
      if (data.session) return;
      setAviso('Conta criada. Verifique seu e-mail para confirmar antes de entrar.');
    }
  }

  async function handleBiometria() {
    setErro(null); setAviso(null);
    setLoadingBiometria(true);
    const { error } = await sb.auth.signInWithPasskey();
    setLoadingBiometria(false);
    if (error) {
      const mensagens = {
        passkey_disabled: 'Login por biometria ainda não está ativado neste sistema.',
        webauthn_credential_not_found: 'Nenhuma biometria cadastrada neste aparelho. Entre com e-mail e senha e ative a biometria depois, na aba Privacidade.',
        webauthn_challenge_expired: 'Demorou demais para confirmar. Tenta de novo.',
      };
      setErro(mensagens[error.code] || 'Não foi possível entrar com biometria. Tenta com e-mail e senha.');
      return;
    }
    // sucesso: o onAuthStateChange do AuthGate já pega a nova sessão sozinho
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--paper)', padding: 20 }}>
      <div className="card auth-card" style={{ width: '100%', maxWidth: 380 }}>
        <div style={{ textAlign: 'center', marginBottom: 24 }}>
          <img src="logo-icon.png" alt="Tonus" style={{ height: 40, margin: '0 auto 14px', display: 'block' }} />
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 24, fontWeight: 600, marginBottom: 2 }}>Tonus Financeiro</div>
          <div className="page-sub">{mode === 'login' ? 'Entrar na sua conta' : 'Criar uma conta'}</div>
        </div>
        {erro && <Banner type="error">{erro}</Banner>}
        {aviso && <Banner type="success">{aviso}</Banner>}
        {mode === 'login' && suportaBiometria && (
          <React.Fragment>
            <button type="button" className="btn btn-hero" onClick={handleBiometria} disabled={loadingBiometria}>
              {loadingBiometria ? 'Verificando...' : '🔐 Entrar com biometria'}
            </button>
            <div className="auth-divider">ou entre com e-mail e senha</div>
          </React.Fragment>
        )}
        <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Field label="E-mail">
            <input type="email" required value={email} placeholder="voce@email.com" onChange={(e) => setEmail(e.target.value)} />
          </Field>
          <Field label="Senha">
            <input type="password" required minLength={6} value={senha} placeholder="••••••••" onChange={(e) => setSenha(e.target.value)} />
          </Field>
          {mode === 'signup' && (
            <label style={{ display: 'flex', gap: 8, alignItems: 'flex-start', fontSize: 12.5, color: 'var(--ink-soft)', lineHeight: 1.4 }}>
              <input type="checkbox" checked={agreed} onChange={(e) => setAgreed(e.target.checked)} style={{ marginTop: 2 }} />
              <span>
                Li e aceito a{' '}
                <a href="#" onClick={(e) => { e.preventDefault(); setOpenDoc('privacy'); }} style={{ color: 'var(--cover)' }}>Política de Privacidade</a>
                {' '}e os{' '}
                <a href="#" onClick={(e) => { e.preventDefault(); setOpenDoc('terms'); }} style={{ color: 'var(--cover)' }}>Termos de Uso</a>.
              </span>
            </label>
          )}
          <button type="submit" className="btn btn-hero" disabled={loading}>
            {loading ? 'Enviando...' : mode === 'login' ? 'Entrar' : 'Criar conta'}
          </button>
        </form>
        <button className="icon-btn" style={{ marginTop: 14, width: '100%', textAlign: 'center' }} onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setErro(null); setAviso(null); }}>
          {mode === 'login' ? 'Não tem conta? Criar uma' : 'Já tem conta? Entrar'}
        </button>
      </div>
      <PolicyModal doc={openDoc} onClose={() => setOpenDoc(null)} />
    </div>
  );
}

function AuthGate({ children }) {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    if (!supabaseReady) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (!supabaseReady) {
    return (
      <div style={{ maxWidth: 520, margin: '60px auto', padding: '0 20px' }}>
        <Banner type="info">Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do script, dentro do index.html, para habilitar o login.</Banner>
      </div>
    );
  }
  if (session === undefined) return null;
  if (session === null) return <LoginScreen />;
  return children(session);
}

function DashboardTab() {

      ]);
      if (!active) return;
      setData({
        fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [], expenseEntries: exp.data || [],
      });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const key = monthKey(new Date());
  const inc = incomeForMonth(data.income, key);
  const fixed = nonCardFixedTotal(data.fixedExpenses);
  const cardsTotal = data.cards.reduce((s, c) => s + cardTotalForMonth(data.purchases, c.id, currentInvoiceMonthKey(c)), 0);
  const variableTotal = nonCardExpenseTotalForMonth(data.expenseEntries, key);
  const balance = inc - fixed - cardsTotal - variableTotal;
  const breakdown = categoryBreakdownForMonth(data.fixedExpenses, data.purchases, data.cards, data.expenseEntries, key);
  const entries = Object.entries(breakdown).sort((a, b) => b[1] - a[1]);
  const maxVal = entries.length ? entries[0][1] : 1;

  const today = new Date().getDate();
  let upcoming = data.fixedExpenses.filter((e) => e.active).map((e) => ({ name: e.name, day: Number(e.due_day), amount: Number(e.amount) }));
  data.cards.forEach((c) => {
    const total = cardTotalForMonth(data.purchases, c.id, currentInvoiceMonthKey(c));
    if (total > 0) upcoming.push({ name: 'Fatura ' + c.name, day: Number(c.due_day), amount: total });
  });
  upcoming.sort((a, b) => {
    const da = a.day >= today ? a.day : a.day + 31;
    const db = b.day >= today ? b.day : b.day + 31;
    return da - db;
  });
  upcoming = upcoming.slice(0, 6);

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Dashboard</h1><div className="page-sub">{monthLabel(key)}</div></div>
      </div>
      <div className="grid grid-5">

        <div className="card"><p className="stat-label">Despesas fixas</p><p className="stat-value spend">{fmtBRL(fixed)}</p></div>
        <div className="card"><p className="stat-label">Despesas variáveis</p><p className="stat-value spend">{fmtBRL(variableTotal)}</p></div>
        <div className="card"><p className="stat-label">Faturas de cartão</p><p className="stat-value gold">{fmtBRL(cardsTotal)}</p></div>
        <div className="card"><p className="stat-label">Saldo projetado</p><p className={'stat-value ' + (balance >= 0 ? 'money' : 'spend')}>{fmtBRL(balance)}</p></div>
      </div>
      <div className="grid grid-2 section-gap">
        <div className="card">
          <h3 className="section-title">Gastos por categoria</h3>
          {entries.length === 0 ? <Empty title="Nada lançado ainda" body="Cadastre despesas fixas ou compras no cartão para ver a distribuição aqui." /> : entries.map(([cat, val]) => (
            <div className="bar-row" key={cat}>
              <div className="bar-label">{cat}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / maxVal) * 100) + '%', background: 'var(--spend)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)}</div>
            </div>
          ))}
        </div>
        <div className="card">
          <h3 className="section-title">Próximos vencimentos</h3>
          {upcoming.length === 0 ? <Empty title="Sem contas cadastradas" body="Adicione despesas fixas ou cartões para ver os vencimentos." /> : (
            <div style={{ overflowX: 'auto' }}>
            <table><tbody>
              {upcoming.map((u, i) => (
                <tr key={i}><td>Dia {String(u.day).padStart(2, '0')}</td><td>{u.name}</td><td className="num">{fmtBRL(u.amount)}</td></tr>
              ))}
            </tbody></table>
            </div>
          )}
        </div>
      </div>
      <CategoryPivotCard entries={data.expenseEntries} />
    </div>
  );
}

  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [category, setCategory] = useState(CATS_EXP[0]);
  const [customCats, setCustomCats] = useState([]);
  const [amount, setAmount] = useState('');
  const [dueDay, setDueDay] = useState('');
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const allCats = [...CATS_EXP, ...customCats];

  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('fixed_expenses').select('*').order('due_day'),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = toNumber(amount), day = parseInt(dueDay);
    if (!name.trim() || !amt || !day) return;
    const { error } = await sb.from('fixed_expenses').insert({ name: name.trim(), category, amount: amt, due_day: day, payment_method: paymentMethod });
    if (error) { setErro(error.message); return; }
    setName(''); setAmount(''); setDueDay('');
    load();
  }
  async function toggleActive(row) {
    await sb.from('fixed_expenses').update({ active: !row.active }).eq('id', row.id);
    load();
  }
  async function remove(row) {
    await sb.from('fixed_expenses').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, category: row.category, amount: row.amount, due_day: row.due_day, payment_method: row.payment_method || PAYMENT_METHODS[0] });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const amt = toNumber(editRow.amount), day = parseInt(editRow.due_day);
    if (!editRow.name.trim() || !amt || !day) return;
    const { error } = await sb.from('fixed_expenses').update({
      name: editRow.name.trim(), category: editRow.category, amount: amt, due_day: day, payment_method: editRow.payment_method,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const total = fixedTotalMonthly(list);
  const sortedList = [...list].sort((a, b) => {
    const pay = (a.payment_method || '').localeCompare(b.payment_method || '', 'pt-BR');
    return pay !== 0 ? pay : a.name.localeCompare(b.name, 'pt-BR');
  });

  // Evolução do total comprometido: soma acumulada por mês de cadastro das
  // despesas ativas — cresce conforme novas despesas fixas vão sendo adicionadas.
  const growthByMonth = {};
  list.filter((e) => e.active).forEach((e) => {
    const mk = e.created_at ? e.created_at.slice(0, 7) : monthKey(new Date());
    growthByMonth[mk] = (growthByMonth[mk] || 0) + Number(e.amount);
  });
  const growthMonths = Object.keys(growthByMonth).sort();
  let runningTotal = 0;
  const growthSeries = growthMonths.map((m) => { runningTotal += growthByMonth[m]; return { m, total: runningTotal }; });
  const growthMax = Math.max(1, ...growthSeries.map((g) => g.total));

  // Total por categoria, só entre as despesas ativas.
  const catTotals = {};
  list.filter((e) => e.active).forEach((e) => { catTotals[e.category] = (catTotals[e.category] || 0) + Number(e.amount); });
  const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const catMax = catEntries.length ? catEntries[0][1] : 1;

  // Total por forma de pagamento, só entre as despesas ativas.
  const payTotals = {};
  list.filter((e) => e.active).forEach((e) => { const p = e.payment_method || 'Não informada'; payTotals[p] = (payTotals[p] || 0) + Number(e.amount); });
  const payEntries = Object.entries(payTotals).sort((a, b) => b[1] - a[1]);
  const payMax = payEntries.length ? payEntries[0][1] : 1;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Fixas</h1><div className="page-sub">Contas que se repetem todo mês</div></div></div>
      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Aluguel" onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="text" inputMode="decimal" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <Field label="Dia venc."><input required type="number" min="1" max="31" value={dueDay} placeholder="10" onChange={(e) => setDueDay(e.target.value)} /></Field>
          <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 4px', flexWrap: 'wrap' }}>
          <span className="page-sub" style={{ margin: 0 }}>TOTAL MENSAL (PREVISIBILIDADE)</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(nonCardFixedTotal(list))}</span>
        </div>
        {cardFixedTotal(list) > 0 && (
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 14px' }}>
            <span className="page-sub" style={{ margin: 0 }}>+ NO CARTÃO (NÃO CONTA AQUI)</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--ink-faint)' }}>{fmtBRL(cardFixedTotal(list))}</span>
          </div>
        )}
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nenhuma despesa fixa cadastrada" body="Comece adicionando aluguel, internet, escola ou outras contas recorrentes." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th className="num" title="% do total de todas as despesas fixas ativas, incluindo as pagas no cartão — por isso pode não bater com o TOTAL MENSAL (PREVISIBILIDADE) acima, que exclui o que é pago no cartão">% do total ⓘ</th><th>Vencimento</th><th>Forma de pagamento</th><th>Registrada em</th><th></th><th></th></tr></thead>
            <tbody>
              {sortedList.map((e) => editingId === e.id ? (
                <tr className="row-hover" key={e.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td></td>
                  <td><input type="number" min="1" max="31" value={editRow.due_day} onChange={(ev) => setEditRow({ ...editRow, due_day: ev.target.value })} style={{ width: 60 }} /></td>
                  <td>
                    <select value={editRow.payment_method} onChange={(ev) => setEditRow({ ...editRow, payment_method: ev.target.value })}>
                      {PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}
                    </select>
                  </td>
                  <td></td>
                  <td></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(e.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={e.id}>
                  <td>{e.name}</td>
                  <td><span className="pill">{e.category}</span></td>
                  <td className="num">{fmtBRL(e.amount)}</td>
                  <td className="num">{e.active ? (Number(e.amount) / total * 100).toFixed(1) + '%' : '—'}</td>
                  <td>Dia {String(e.due_day).padStart(2, '0')}</td>
                  <td>{e.payment_method || '—'}</td>
                  <td>{e.created_at ? shortMonthLabel(e.created_at.slice(0, 7)) : '—'}</td>
                  <td><span className={'pill ' + (e.active ? 'money' : '')}>{e.active ? 'Ativa' : 'Pausada'}</span></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(e)}>Editar</button>
                    <button className="icon-btn" onClick={() => toggleActive(e)}>{e.active ? 'Pausar' : 'Ativar'}</button>
                    <button className="icon-btn" onClick={() => remove(e)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>

      {catEntries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Despesas fixas por categoria</h3>
          {catEntries.map(([cat, val]) => (
            <div className="bar-row" key={cat}>
              <div className="bar-label">{cat}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / catMax) * 100) + '%', background: 'var(--spend)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)} <span style={{ color: 'var(--ink-faint)' }}>({(val / total * 100).toFixed(0)}%)</span></div>
            </div>
          ))}
        </div>
      )}

      {payEntries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Despesas fixas por forma de pagamento</h3>
          {payEntries.map(([pay, val]) => (
            <div className="bar-row" key={pay}>
              <div className="bar-label">{pay}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / payMax) * 100) + '%', background: 'var(--gold)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)} <span style={{ color: 'var(--ink-faint)' }}>({(val / total * 100).toFixed(0)}%)</span></div>
            </div>
          ))}
        </div>
      )}

      {growthSeries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Evolução do total comprometido</h3>
          <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Soma acumulada das despesas fixas ativas, por mês em que cada uma foi cadastrada</div>
          <div style={{ overflowX: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 120, paddingTop: 10, width: 'max-content', minWidth: '100%' }}>
              {growthSeries.map((g) => {
                const h = Math.max(3, Math.round((g.total / growthMax) * 90));
                return (
                  <div key={g.m} style={{ flex: '0 0 84px', width: 84, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginBottom: 4, whiteSpace: 'nowrap', textAlign: 'center' }}>{fmtBRL(g.total)}</div>
                    <div style={{ width: 34, height: h, background: 'var(--spend)', borderRadius: '4px 4px 0 0' }}></div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginTop: 6, whiteSpace: 'nowrap', textAlign: 'center' }}>{shortMonthLabel(g.m)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Receitas ----------
function IncomeTab() {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [category, setCategory] = useState(CATS_INC[0]);
  const [customCats, setCustomCats] = useState([]);
  const [amount, setAmount] = useState('');
  const [type, setType] = useState('rec');
  const [date, setDate] = useState('');
  const allCats = [...CATS_INC, ...customCats];

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('income').select('*').order('created_at', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'income').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = toNumber(amount);
    if (!name.trim() || !amt) return;
    const recurring = type === 'rec';
    if (!recurring && !date) return;
    const { error } = await sb.from('income').insert({ name: name.trim(), category, amount: amt, recurring, income_date: recurring ? null : date });
    if (error) { setErro(error.message); return; }
    setName(''); setAmount(''); setDate('');
    load();
  }
  async function remove(row) {
    await sb.from('income').delete().eq('id', row.id);
    load();
  }

  const totalRec = list.filter((i) => i.recurring).reduce((s, i) => s + Number(i.amount), 0);

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Receitas</h1><div className="page-sub">Fixas (recorrentes) ou avulsas</div></div></div>
      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Salário" onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="income" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="text" inputMode="decimal" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <Field label="Tipo">
            <select value={type} onChange={(e) => setType(e.target.value)}>
              <option value="rec">Recorrente (todo mês)</option>
              <option value="one">Avulsa (data única)</option>
            </select>
          </Field>
          {type === 'one' && <Field label="Data"><input required type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>}
          <button type="submit" className="btn">Adicionar</button>
        </form>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 14px' }}>
          <span className="page-sub" style={{ margin: 0 }}>TOTAL RECORRENTE MENSAL</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--money-strong)' }}>{fmtBRL(totalRec)}</span>
        </div>
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nenhuma receita cadastrada" body="Adicione seu salário ou outras fontes de renda para começar." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th>Recorrência</th><th></th></tr></thead>
            <tbody>
              {list.map((i) => (
                <tr className="row-hover" key={i.id}>
                  <td>{i.name}</td>
                  <td><span className="pill">{i.category}</span></td>
                  <td className="num">{fmtBRL(i.amount)}</td>
                  <td>{i.recurring ? 'Todo mês' : new Date(i.income_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => remove(i)}>Remover</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Cartões de crédito ----------
function CardsTab({ session }) {
  const [cards, setCards] = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [selectedId, setSelectedId] = useState(null);

  const [ccName, setCcName] = useState('');
  const [ccClose, setCcClose] = useState('');
  const [ccDue, setCcDue] = useState('');
  const [ccLimit, setCcLimit] = useState('');

  const [pDesc, setPDesc] = useState('');
  const [pCat, setPCat] = useState(CATS_EXP[0]);
  const [customCats, setCustomCats] = useState([]);
  const [pAmount, setPAmount] = useState('');
  const [pInst, setPInst] = useState('1');
  const [pMonth, setPMonth] = useState(monthKey(new Date()));
  const [pDate, setPDate] = useState(todayLocalISO());
  const [pNotes, setPNotes] = useState('');
  const pReceiptRef = useRef(null);
  const allCats = [...CATS_EXP, ...customCats];

  const [impMonth, setImpMonth] = useState(monthKey(new Date()));
  const [impText, setImpText] = useState('');
  const [impPassword, setImpPassword] = useState('');
  const [pdfNeedsPassword, setPdfNeedsPassword] = useState(false);
  const [impBusy, setImpBusy] = useState(false);
  const [impError, setImpError] = useState(null);
  const [preview, setPreview] = useState(null);
  const fileRef = useRef(null);

  const [historyMonth, setHistoryMonth] = useState(monthKey(new Date()));
  const [histCard, setHistCard] = useState('');
  const [histDesc, setHistDesc] = useState('');
  const [histCat, setHistCat] = useState('');
  const [histFrom, setHistFrom] = useState('');
  const [expandedCardHistory, setExpandedCardHistory] = useState(null);
  const [histTo, setHistTo] = useState('');

  async function load() {
    setLoading(true);
    const [c, p, cats] = await Promise.all([
      sb.from('cards').select('*').order('created_at'),
      sb.from('card_purchases').select('*').order('first_month', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (c.error) setErro(c.error.message); else setCards(c.data || []);
    if (p.error) setErro(p.error.message); else setPurchases(p.data || []);
    if (cats.data) setCustomCats(cats.data.map((c2) => c2.name));
    setLoading(false);
    if (!selectedId && c.data && c.data.length) setSelectedId(c.data[0].id);
  }
  useEffect(() => { load(); }, []);

  // O mês da fatura de importação segue sempre a fatura em aberto hoje, pois é
  // sobre isso que trata a importação de fatura fechada.
  useEffect(() => {
    const c = cards.find((c2) => c2.id === selectedId);
    if (c) setImpMonth(currentInvoiceMonthKey(c));
  }, [selectedId, cards.length]);

  // Já a "1ª fatura" do lançamento manual segue a DATA DA COMPRA informada
  // (não o dia de hoje) — importante para lançar compras retroativas certas.
  useEffect(() => {
    const c = cards.find((c2) => c2.id === selectedId);
    if (c && pDate) {
      const d = new Date(pDate + 'T00:00:00');
      if (!isNaN(d.getTime())) setPMonth(currentInvoiceMonthKey(c, d));
    }
  }, [selectedId, cards.length, pDate]);

  // O histórico de compras também abre direto na fatura em aberto (não no mês
  // do calendário), assim que os cartões carregam pela primeira vez.
  const historyInitRef = useRef(false);
  useEffect(() => {
    if (!historyInitRef.current && cards.length > 0) {
      historyInitRef.current = true;
      setHistoryMonth(currentInvoiceMonthKey(cards[0]));
    }
  }, [cards.length]);

  async function addCard(ev) {
    ev.preventDefault();
    const closingDay = parseInt(ccClose), dueDay = parseInt(ccDue);
    if (!ccName.trim() || !closingDay || !dueDay) return;
    const { data, error } = await sb.from('cards').insert({
      name: ccName.trim(), closing_day: closingDay, due_day: dueDay,
      limit_amount: toNumber(ccLimit) || null, color: CARD_COLORS[cards.length % CARD_COLORS.length],
    }).select().single();
    if (error) { setErro(error.message); return; }
    setCcName(''); setCcClose(''); setCcDue(''); setCcLimit('');
    setSelectedId(data.id);
    load();
  }
  async function deleteCard(card) {
    await sb.from('cards').delete().eq('id', card.id);
    setSelectedId(null);
    load();
  }
  async function addPurchase(ev) {
    ev.preventDefault();
    const amt = toNumber(pAmount), inst = parseInt(pInst) || 1;
    if (!pDesc.trim() || !amt || !pMonth) return;
    let receiptPath = null;
    const file = pReceiptRef.current && pReceiptRef.current.files && pReceiptRef.current.files[0];
    if (file) {
      const path = `${session.user.id}/cards/${crypto.randomUUID()}-${file.name}`;
      const { error: upErr } = await sb.storage.from('comprovantes').upload(path, file);
      if (upErr) { setErro('Não foi possível salvar a NF: ' + upErr.message); return; }
      receiptPath = path;
    }
    const { error } = await sb.from('card_purchases').insert({
      card_id: selectedId, description: pDesc.trim(), category: pCat, amount: amt, installments: inst, first_month: monthKeyToDate(pMonth), purchase_date: pDate || null, notes: pNotes.trim() || null, receipt_path: receiptPath,
    });
    if (error) { setErro(error.message); return; }
    setPDesc(''); setPAmount(''); setPInst('1'); setPNotes('');
    if (pReceiptRef.current) pReceiptRef.current.value = '';
    load();
  }
  async function deletePurchase(p) {
    if (p.receipt_path) await sb.storage.from('comprovantes').remove([p.receipt_path]);
    await sb.from('card_purchases').delete().eq('id', p.id);
    load();
  }
  async function openPurchaseReceipt(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir a NF.'); return; }
    window.open(data.signedUrl, '_blank');
  }

  const [editingPurchaseId, setEditingPurchaseId] = useState(null);
  const [editPurchase, setEditPurchase] = useState(null);
  function startEditPurchase(p) {
    setEditingPurchaseId(p.id);
    setEditPurchase({
      description: p.description, category: p.category, amount: p.amount, installments: p.installments,
      first_month: toMonthKey(p.first_month), purchase_date: p.purchase_date || '', notes: p.notes || '',
    });
  }
  function cancelEditPurchase() { setEditingPurchaseId(null); setEditPurchase(null); }
  async function saveEditPurchase(id) {
    const amt = toNumber(editPurchase.amount), inst = parseInt(editPurchase.installments) || 1;
    if (!editPurchase.description.trim() || !amt || !editPurchase.first_month) return;
    const { error } = await sb.from('card_purchases').update({
      description: editPurchase.description.trim(), category: editPurchase.category, amount: amt, installments: inst,
      first_month: monthKeyToDate(editPurchase.first_month), purchase_date: editPurchase.purchase_date || null, notes: editPurchase.notes.trim() || null,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingPurchaseId(null); setEditPurchase(null);
    load();
  }

  async function handleExtract() {
    if (!impMonth) { setImpError('Selecione o mês da fatura antes de importar.'); return; }
    setImpBusy(true); setImpError(null); setPreview(null);
    try {
      let lines = [];
      const file = fileRef.current && fileRef.current.files && fileRef.current.files[0];
      if (file) {
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (!isPdf) throw new Error('Envie um arquivo em PDF, ou cole o texto da fatura no campo abaixo.');
        if (!window.pdfjsLib) throw new Error('Não foi possível carregar o leitor de PDF. Tente colar o texto da fatura.');
        lines = await extractLinesFromPDF(file, impPassword);
        setPdfNeedsPassword(false);
      } else if (impText.trim()) {
        lines = impText.split('\n');
      } else {
        throw new Error('Selecione um PDF ou cole o texto da fatura.');
      }
      const parsed = parseInvoiceLines(lines, impMonth);
      if (parsed.length === 0) {
        setImpText(lines.join('\n'));
        if (fileRef.current) fileRef.current.value = '';
        throw new Error('Não consegui reconhecer as linhas automaticamente nesse PDF. Mas o texto foi extraído certinho — dá uma olhada na caixa abaixo, ajuste o formato de cada linha para "DD/MM Descrição Valor" (ex: 10/08 Uber 23,90), e clique em "Importar fatura" de novo.');
      }
      const existingForCardMonth = purchases.filter((p) => p.card_id === selectedId && cardInstallmentForMonth(p, impMonth) > 0);
      const reconciled = reconcilePreview(parsed, existingForCardMonth);
      setPreview(reconciled.map((p, idx) => ({
        _key: idx + '-' + Date.now(),
        description: p.description, category: p.category, amount: p.amount,
        installments: p.installTotal || 1,
        firstMonth: shiftMonth(impMonth, -(((p.installCurrent || 1) - 1))),
        purchaseDate: p.purchaseDate,
        reconcileStatus: p.reconcileStatus,
        matchedPurchase: p.matchedPurchase,
        include: p.reconcileStatus === 'new',
      })));
    } catch (err) {
      if (err && err.name === 'PasswordException') {
        setPdfNeedsPassword(true);
        setImpError(impPassword ? 'Senha incorreta. Tente novamente.' : 'Esta fatura está protegida por senha. Digite a senha abaixo (geralmente os primeiros dígitos do CPF do titular) e clique em "Importar fatura" de novo.');
      } else {
        setImpError(err.message || 'Não consegui ler a fatura.');
      }
    }
    setImpBusy(false);
  }
  function updatePreviewRow(idx, patch) {
    setPreview((prev) => prev.map((r, i) => (i === idx ? { ...r, ...patch } : r)));
  }
  async function confirmImport() {
    const rows = preview.filter((r) => r.include).map((r) => ({
      card_id: selectedId, description: r.description, category: r.category && r.category.trim() ? r.category.trim() : 'Outros',
      amount: toNumber(r.amount) * Number(r.installments || 1), installments: Number(r.installments) || 1,
      first_month: monthKeyToDate(r.firstMonth), purchase_date: r.purchaseDate || null,
    }));
    if (rows.length === 0) { setPreview(null); return; }
    const { error } = await sb.from('card_purchases').insert(rows);
    if (error) { setImpError(error.message); return; }
    setPreview(null); setImpText(''); setImpPassword(''); setPdfNeedsPassword(false);
    if (fileRef.current) fileRef.current.value = '';
    load();
  }

  if (loading) return <Banner type="info">Carregando...</Banner>;

  const selCard = cards.find((c) => c.id === selectedId);

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Cartão de Crédito</h1><div className="page-sub">Cadastre quantos cartões precisar</div></div></div>
      {erro && <Banner type="error">{erro}</Banner>}

      <div className="card">
        <h3 className="section-title">Novo cartão</h3>
        <form className="entry-form" onSubmit={addCard}>
          <Field label="Nome do cartão"><input required value={ccName} placeholder="Nubank" onChange={(e) => setCcName(e.target.value)} /></Field>
          <Field label="Fechamento"><input required type="number" min="1" max="31" value={ccClose} placeholder="20" onChange={(e) => setCcClose(e.target.value)} /></Field>
          <Field label="Vencimento"><input required type="number" min="1" max="31" value={ccDue} placeholder="27" onChange={(e) => setCcDue(e.target.value)} /></Field>
          <Field label="Limite (R$)"><input type="text" inputMode="decimal" value={ccLimit} placeholder="opcional" onChange={(e) => setCcLimit(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar cartão</button>
        </form>
      </div>

      {cards.length === 0 ? (
        <div className="card section-gap"><Empty title="Nenhum cartão cadastrado" body="Adicione seu primeiro cartão acima para começar a lançar compras." /></div>
      ) : (
        <React.Fragment>
          <div className="cc-row section-gap">
            {cards.map((c) => {
              const cardInvoiceKey = currentInvoiceMonthKey(c);
              const total = cardTotalForMonth(purchases, c.id, cardInvoiceKey);
              const pct = c.limit_amount ? Math.min(100, (total / Number(c.limit_amount)) * 100) : null;
              const barColor = pct === null ? 'rgba(255,255,255,0.5)' : pct >= 90 ? '#E0574B' : pct >= 70 ? '#E0B84B' : 'rgba(255,255,255,0.75)';
              return (
                <div key={c.id} className={'card-chip' + (c.id === selectedId ? ' selected' : '')} style={{ background: c.color }} onClick={() => setSelectedId(c.id)}>
                  <div className="cc-name">{c.name}</div>
                  <div className="cc-info">Fecha dia {c.closing_day} · vence dia {c.due_day}</div>
                  <div className="cc-total">{fmtBRL(total)}</div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'rgba(255,255,255,0.65)', marginTop: 3 }}>fatura de {shortMonthLabel(cardInvoiceKey)}</div>
                  {pct !== null && (
                    <div style={{ marginTop: 10 }}>
                      <div style={{ height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.18)', overflow: 'hidden' }}>
                        <div style={{ width: pct + '%', height: '100%', background: barColor, borderRadius: 3 }}></div>
                      </div>
                      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'rgba(255,255,255,0.75)', marginTop: 4 }}>
                        {pct.toFixed(0)}% do limite ({fmtBRL(c.limit_amount)})
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {selCard && (
            <React.Fragment>
              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                  <h3 className="section-title" style={{ margin: 0 }}>Importar fatura — {selCard.name}</h3>
                  <button className="btn danger" onClick={() => deleteCard(selCard)}>Remover cartão</button>
                </div>
                <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Ideal depois que a fatura fechar: envie o PDF (ou cole o texto) e o app confere contra o que você já lançou no mês — o que já está certo não duplica, o que tiver valor diferente é sinalizado, e só o que faltar entra como novo.</div>
                <div className="entry-form ef-import">
                  <Field label="Mês da fatura"><input type="month" value={impMonth} onChange={(e) => setImpMonth(e.target.value)} /></Field>
                  <Field label="Arquivo PDF da fatura"><input type="file" accept=".pdf,application/pdf" ref={fileRef} /></Field>
                  <button type="button" className="btn" onClick={handleExtract}>Importar fatura</button>
                </div>
                <Field label="Ou cole aqui o texto da fatura (opcional, se o PDF não for reconhecido)">
                  <textarea rows={4} value={impText} onChange={(e) => setImpText(e.target.value)}
                    placeholder={"10/08 UBER * TRIP SAO PAULO 23,90\n12/08 SUPERMERCADO BOM PRECO 3/6 145,00"}
                    style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 12.5, padding: '8px 10px', border: '1px solid var(--paper-line)', borderRadius: 7, resize: 'vertical' }} />
                </Field>
                {impBusy && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-faint)' }}>Lendo a fatura...</div>}
                {impError && <Banner type="error">{impError}</Banner>}
                {pdfNeedsPassword && (
                  <Field label="Senha do PDF"><input type="password" value={impPassword} placeholder="ex: primeiros dígitos do CPF" onChange={(e) => setImpPassword(e.target.value)} /></Field>
                )}

                {preview && (() => {
                  const nMatched = preview.filter((r) => r.reconcileStatus === 'matched').length;
                  const nMismatch = preview.filter((r) => r.reconcileStatus === 'mismatch').length;
                  const nNew = preview.filter((r) => r.reconcileStatus === 'new').length;
                  return (
                  <div style={{ marginTop: 18 }}>
                    <h4 style={{ fontFamily: 'var(--font-display)', fontSize: 15, margin: '0 0 10px' }}>Revisar {preview.length} lançamento(s) encontrado(s)</h4>
                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                      {nMatched > 0 && <span className="pill money">✓ {nMatched} já lançado(s) certo</span>}
                      {nMismatch > 0 && <span className="pill spend">⚠ {nMismatch} com valor diferente</span>}
                      {nNew > 0 && <span className="pill gold">🆕 {nNew} novo(s)</span>}
                    </div>
                    <div style={{ overflowX: 'auto' }}>
                    <table>
                      <thead><tr><th></th><th>Status</th><th>Descrição</th><th>Categoria</th><th className="num">Parcela (R$)</th><th>Parcelas</th><th>Data</th><th>1ª fatura</th></tr></thead>
                      <tbody>
                        {preview.map((r, idx) => (
                          <tr className="row-hover" key={r._key}>
                            <td><input type="checkbox" checked={r.include} onChange={(e) => updatePreviewRow(idx, { include: e.target.checked })} /></td>
                            <td>
                              {r.reconcileStatus === 'matched' && <span className="pill money" style={{ whiteSpace: 'nowrap' }}>✓ Já lançado</span>}
                              {r.reconcileStatus === 'mismatch' && (
                                <span className="pill spend" style={{ whiteSpace: 'nowrap' }} title={`Já lançado com ${fmtBRL(r.matchedPurchase ? Number(r.matchedPurchase.amount) / Number(r.matchedPurchase.installments || 1) : 0)}`}>
                                  ⚠ Valor diferente
                                </span>
                              )}
                              {r.reconcileStatus === 'new' && <span className="pill gold" style={{ whiteSpace: 'nowrap' }}>🆕 Novo</span>}
                            </td>
                            <td><input type="text" value={r.description} style={{ minWidth: 160 }} onChange={(e) => updatePreviewRow(idx, { description: e.target.value })} /></td>
                            <td>
                              <CategorySelect value={r.category} onChange={(v) => updatePreviewRow(idx, { category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} />
                            </td>
                            <td className="num"><input type="text" inputMode="decimal" value={r.amount} style={{ width: 90, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { amount: e.target.value })} /></td>
                            <td><input type="number" min="1" max="48" value={r.installments} style={{ width: 60 }} onChange={(e) => updatePreviewRow(idx, { installments: parseInt(e.target.value) || 1 })} /></td>
                            <td><input type="date" value={r.purchaseDate || ''} style={{ width: 130 }} onChange={(e) => updatePreviewRow(idx, { purchaseDate: e.target.value })} /></td>
                            <td style={{ textAlign: 'right' }}><span className="pill" style={{ fontFamily: 'var(--font-mono)' }}>{shortMonthLabel(r.firstMonth)}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    </div>
                    <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                      <button className="btn" onClick={confirmImport}>Confirmar importação</button>
                      <button className="btn ghost" onClick={() => setPreview(null)}>Cancelar</button>
                    </div>
                  </div>
                  );
                })()}
              </div>

              <div className="card section-gap">
                <h3 className="section-title">Lançar compra — {selCard.name}</h3>
                <form className="entry-form cols-6" onSubmit={addPurchase}>
                  <Field label="Descrição"><input required value={pDesc} placeholder="Supermercado" onChange={(e) => setPDesc(e.target.value)} /></Field>
                  <Field label="Categoria"><CategorySelect value={pCat} onChange={setPCat} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
                  <Field label="Valor total (R$)"><input required type="text" inputMode="decimal" value={pAmount} placeholder="0,00" onChange={(e) => setPAmount(e.target.value)} /></Field>
                  <Field label="Data da compra"><input type="date" value={pDate} onChange={(e) => setPDate(e.target.value)} /></Field>
                  <Field label="Parcelas"><input required type="number" min="1" max="48" value={pInst} onChange={(e) => setPInst(e.target.value)} /></Field>
                  <Field label="1ª fatura"><input required type="month" value={pMonth} onChange={(e) => setPMonth(e.target.value)} /></Field>
                  <button type="submit" className="btn">Lançar</button>
                </form>
                <div className="entry-form ef-2col" style={{ marginTop: -8 }}>
                  <Field label="Observações (opcional)"><input value={pNotes} placeholder="ex: parcela 4/12, comprado com a Thais, etc." onChange={(e) => setPNotes(e.target.value)} /></Field>
                  <Field label="NF / comprovante (opcional)"><input type="file" accept="image/*,.pdf" ref={pReceiptRef} /></Field>
                </div>
              </div>
            </React.Fragment>
          )}
        </React.Fragment>
      )}

      {cards.length > 0 && (() => {
        const usingRange = histFrom || histTo;
        const historyEntries = [];
        if (usingRange) {
          let a = histFrom ? histFrom.slice(0, 7) : historyMonth;
          let b = histTo ? histTo.slice(0, 7) : historyMonth;
          if (a > b) { const t = a; a = b; b = t; }
          monthsBetween(a, b).forEach((m) => {
            purchases.forEach((p) => {
              const amt = cardInstallmentForMonth(p, m);
              if (amt <= 0) return;
              const card = cards.find((c) => c.id === p.card_id);
              const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
              const [hy, hm] = m.split('-').map(Number);
              const idx = (hy - sy) * 12 + (hm - sm);
              historyEntries.push({ purchase: p, card, amount: amt, installIdx: idx + 1, invoiceMonth: m });
            });
          });
        } else {
          purchases.forEach((p) => {
            const amt = cardInstallmentForMonth(p, historyMonth);
            if (amt <= 0) return;
            const card = cards.find((c) => c.id === p.card_id);
            const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
            const [hy, hm] = historyMonth.split('-').map(Number);
            const idx = (hy - sy) * 12 + (hm - sm);
            historyEntries.push({ purchase: p, card, amount: amt, installIdx: idx + 1, invoiceMonth: historyMonth });
          });
        }
        const filtered = historyEntries.filter((h) =>
          (!histCard || h.purchase.card_id === histCard) &&
          (!histDesc.trim() || h.purchase.description.toLowerCase().includes(histDesc.trim().toLowerCase())) &&
          (!histCat || h.purchase.category === histCat)
        );
