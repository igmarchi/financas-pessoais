                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={d.id}>
                  <td>{d.name}</td>
                  <td><span className="pill">{d.category}</span></td>
                  <td className="num">{fmtBRL(d.saldo_devedor)}</td>
                  <td className="num">{Number(d.taxa_juros).toFixed(2)}%</td>
                  <td className="num">{fmtBRL(d.pagamento_minimo)}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(d)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(d)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Contas correntes ----------
// Registro leve (nome, instituição, saldo inicial numa data de referência) —
// não é um "livro" novo pra digitar de novo: o saldo de cada conta é sempre
// calculado (accountBalance) a partir do que já é lançado em Despesas e
// Receitas, atribuindo cada lançamento a uma conta (campo opcional). Deletar
// uma conta nunca deixa lançamento "órfão" travado: o account_id no banco
// usa "on delete set null", então o lançamento só volta a ficar sem conta.
// Cores de identidade do gráfico de histórico de contas — ordem fixa (nunca
// ciclada), validadas com a skill de dataviz contra a superfície real do
// app (--paper-raised) nos dois modos claro/escuro (ver comentário junto às
// variáveis --account-series-N no <style>). Além da 6ª conta, tudo entra
// junto na cor cinza de "Outras contas".
const ACCOUNT_SERIES_COLORS = ['var(--account-series-1)', 'var(--account-series-2)', 'var(--account-series-3)', 'var(--account-series-4)', 'var(--account-series-5)', 'var(--account-series-6)'];
const ACCOUNT_OTHER_COLOR = 'var(--ink-faint)';

// Gráfico de linha (SVG puro, mesmo padrão do ProjectionChart) com uma linha
// por conta. Cada série pode ter `null` nos meses anteriores à própria
// conta existir — o traçado quebra em segmentos nesses buracos em vez de
// ligar reto por cima (o que inventaria saldo que a conta nunca teve).
// Sempre vem com legenda (abaixo) + rótulo direto na ponta da linha (até 4
// séries) + crosshair/tooltip no hover — nunca só a cor pra identificar uma
// conta, e a tabela logo abaixo no AccountsTab cobre o "ver os números
// exatos" e serve de alívio pras 3 cores do palette que ficam abaixo de
// 3:1 de contraste no modo claro (aqua/amarelo/magenta).
function AccountHistoryChart({ months, series }) {
  const [hover, setHover] = useState(null);
  const W = 640, H = 260;
  const M = { top: 16, right: 12, bottom: 26, left: 68 };
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;
  const n = months.length;
  const allVals = series.flatMap((s) => s.values.filter((v) => v != null));
  const yMin = Math.min(0, ...allVals);
  const yMax = Math.max(1, ...allVals);
  const range = (yMax - yMin) || 1;
  const xAt = (i) => (n <= 1 ? M.left + plotW / 2 : M.left + (i / (n - 1)) * plotW);
  const yAt = (val) => M.top + plotH - ((val - yMin) / range) * plotH;

  function pathsForSeries(values) {
    const segments = [];
    let cur = [];
    values.forEach((v, i) => {
      if (v == null) { if (cur.length) segments.push(cur); cur = []; }
      else cur.push([i, v]);
    });
    if (cur.length) segments.push(cur);
    return segments.map((seg) => seg.map(([i, v], idx) => `${idx === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)}`).join(' '));
  }

  const step = n > 18 ? Math.ceil(n / 9) : (n > 9 ? 2 : 1);
  const xTicks = [];
  for (let i = 0; i < n; i += step) xTicks.push(i);
  if (xTicks[xTicks.length - 1] !== n - 1) xTicks.push(n - 1);

  function handleMove(ev) {
    const rect = ev.currentTarget.getBoundingClientRect();
    const relX = ((ev.clientX - rect.left) / rect.width) * W;
    const idx = Math.round(((relX - M.left) / plotW) * (n - 1));
    setHover(Math.max(0, Math.min(n - 1, idx)));
  }

  return (
    <div style={{ position: 'relative' }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}
        onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
        <line x1={M.left} y1={yAt(0)} x2={W - M.right} y2={yAt(0)} stroke="var(--paper-line)" strokeWidth="1" strokeDasharray={yMin < 0 ? '4 3' : undefined} />
        {xTicks.map((i) => (
          <g key={i}>
            <line x1={xAt(i)} y1={M.top} x2={xAt(i)} y2={H - M.bottom} stroke="var(--paper-line)" strokeWidth="1" opacity="0.45" />
            <text x={xAt(i)} y={H - 8} fontSize="11" fill="var(--ink-faint)" textAnchor="middle">{shortMonthLabel(months[i])}</text>
          </g>
        ))}
        <text x={M.left - 8} y={M.top + 4} fontSize="11" fill="var(--ink-faint)" textAnchor="end">{fmtBRLCompact(yMax)}</text>
        <text x={M.left - 8} y={H - M.bottom} fontSize="11" fill="var(--ink-faint)" textAnchor="end">{fmtBRLCompact(yMin)}</text>
        {series.map((s) => pathsForSeries(s.values).map((d, i) => (
          <path key={s.name + '-' + i} d={d} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        )))}
        {series.length <= 4 && series.map((s) => {
          let lastIdx = -1;
          for (let i = s.values.length - 1; i >= 0; i--) { if (s.values[i] != null) { lastIdx = i; break; } }
          if (lastIdx < 0) return null;
          return <text key={'lbl-' + s.name} x={xAt(lastIdx) + 4} y={yAt(s.values[lastIdx]) + 3} fontSize="10.5" fill={s.color}>{s.name}</text>;
        })}
        {hover != null && (
          <g>
            <line x1={xAt(hover)} y1={M.top} x2={xAt(hover)} y2={H - M.bottom} stroke="var(--ink-faint)" strokeWidth="1" strokeDasharray="3 3" />
            {series.map((s) => s.values[hover] != null && (
              <circle key={'pt-' + s.name} cx={xAt(hover)} cy={yAt(s.values[hover])} r="3.5" fill={s.color} stroke="var(--paper-raised)" strokeWidth="1.5" />
            ))}
          </g>
        )}
      </svg>
      {hover != null && (
        <div style={{ position: 'absolute', top: 4, right: 4, background: 'var(--paper-raised)', border: '1px solid var(--paper-line)', borderRadius: 8, padding: '8px 12px', fontSize: 12.5, boxShadow: '0 2px 8px rgba(0,0,0,.12)', pointerEvents: 'none', minWidth: 150 }}>
          <div style={{ fontWeight: 600, marginBottom: 4 }}>{monthLabel(months[hover])}</div>
          {series.map((s) => s.values[hover] != null && (
            <div key={'row-' + s.name} style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
              <span style={{ color: 'var(--ink-soft)' }}><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 4, background: s.color, marginRight: 5 }}></span>{s.name}</span>
              <span style={{ fontFamily: 'var(--font-mono)' }}>{fmtBRL(s.values[hover])}</span>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px 16px', marginTop: 10 }}>
        {series.map((s) => (
          <div key={'leg-' + s.name} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--ink-soft)' }}>
            <span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: 5, background: s.color }}></span>
            {s.name}
          </div>
        ))}
      </div>
    </div>
  );
}

function AccountsTab() {
  const [list, setList] = useState([]);
  const [incomeList, setIncomeList] = useState([]);
  const [expenseEntries, setExpenseEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);

  const [name, setName] = useState('');
  const [institution, setInstitution] = useState('');
  const [initialBalance, setInitialBalance] = useState('');
  const [initialBalanceDate, setInitialBalanceDate] = useState(todayLocalISO());
  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  async function load() {
    setLoading(true);
    const [rows, inc, exp] = await Promise.all([
      sb.from('bank_accounts').select('*').order('created_at', { ascending: false }),
      sb.from('income').select('id, account_id, amount, recurring, income_date'),
      sb.from('expense_entries').select('id, account_id, amount, payment_method, entry_date'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (inc.data) setIncomeList(inc.data);
    if (exp.data) setExpenseEntries(exp.data);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleAdd(ev) {
    ev.preventDefault();
    const saldo = toNumber(initialBalance);
    if (!name.trim() || !initialBalanceDate) return;
    const { error } = await sb.from('bank_accounts').insert({
      name: name.trim(), institution: institution.trim() || null, initial_balance: saldo || 0, initial_balance_date: initialBalanceDate,
    });
    if (error) { setErro(error.message); return; }
    setName(''); setInstitution(''); setInitialBalance(''); setInitialBalanceDate(todayLocalISO());
    load();
  }
  async function remove(row) {
    await sb.from('bank_accounts').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, institution: row.institution || '', initialBalance: String(row.initial_balance), initialBalanceDate: row.initial_balance_date });
  }
  function cancelEdit() { setEditingId(null); setEditRow(null); }
  async function saveEdit(id) {
    const saldo = toNumber(editRow.initialBalance);
    if (!editRow.name.trim() || !editRow.initialBalanceDate) return;
    const { error } = await sb.from('bank_accounts').update({
      name: editRow.name.trim(), institution: editRow.institution.trim() || null, initial_balance: saldo || 0, initial_balance_date: editRow.initialBalanceDate,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const saldoTotal = list.reduce((s, a) => s + accountBalance(a, incomeList, expenseEntries), 0);
  const semContaCount =
    incomeList.filter((i) => !i.recurring && !i.account_id).length +
    expenseEntries.filter((e) => e.payment_method !== 'Cartão de crédito' && !e.account_id).length;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Contas</h1><div className="page-sub">Contas correntes e poupança — saldo calculado a partir do que você lança em Despesas e Receitas</div></div></div>

      <Banner type="info">
        Cadastre aqui cada conta (Nubank, Itaú, poupança...) com o saldo numa data de referência. Depois, ao lançar receitas avulsas ou despesas (fora do cartão de crédito) em Despesas/Receitas, escolha a conta — o saldo atual é sempre recalculado a partir disso, sem precisar digitar de novo. Enquanto o Open Finance não chega, é tudo manual; e mesmo quando chegar, nada aqui vai te obrigar a usar automação — pode continuar alimentando manualmente se preferir.
      </Banner>

      <div className="card section-gap">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Nome"><input required value={name} placeholder="Nubank, Itaú..." onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Instituição (opcional)"><input value={institution} placeholder="Banco..." onChange={(e) => setInstitution(e.target.value)} /></Field>
          <Field label="Saldo inicial (R$)"><input type="text" inputMode="decimal" value={initialBalance} placeholder="0,00" onChange={(e) => setInitialBalance(e.target.value)} /></Field>
          <Field label="Data do saldo inicial"><input required type="date" value={initialBalanceDate} onChange={(e) => setInitialBalanceDate(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>
      </div>

      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Saldo total</p><p className="stat-value money">{fmtBRL(saldoTotal)}</p></div>
        <div className="card"><p className="stat-label">Lançamentos sem conta atribuída</p><p className="stat-value">{semContaCount}</p></div>
      </div>

      {list.length === 0 ? (
        <div className="card"><Empty title="Nenhuma conta cadastrada" body="Adicione suas contas correntes e poupança para acompanhar o saldo de cada uma." /></div>
      ) : (
        <div className="card section-gap">
          <h3 className="section-title">Suas contas</h3>
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Nome</th><th>Instituição</th><th className="num">Saldo inicial</th><th>Data ref.</th><th className="num">Saldo atual</th><th></th></tr></thead>
            <tbody>
              {list.map((a) => editingId === a.id ? (
                <tr className="row-hover" key={a.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><input value={editRow.institution} onChange={(ev) => setEditRow({ ...editRow, institution: ev.target.value })} style={{ minWidth: 100 }} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.initialBalance} onChange={(ev) => setEditRow({ ...editRow, initialBalance: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input type="date" value={editRow.initialBalanceDate} onChange={(ev) => setEditRow({ ...editRow, initialBalanceDate: ev.target.value })} style={{ width: 140 }} /></td>
                  <td className="num">{fmtBRL(accountBalance({ ...a, initial_balance: toNumber(editRow.initialBalance) || 0, initial_balance_date: editRow.initialBalanceDate }, incomeList, expenseEntries))}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(a.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={a.id}>
                  <td>{a.name}</td>
                  <td>{a.institution || '—'}</td>
                  <td className="num">{fmtBRL(a.initial_balance)}</td>
                  <td>{new Date(a.initial_balance_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td className="num">{fmtBRL(accountBalance(a, incomeList, expenseEntries))}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(a)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(a)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        </div>
      )}

      {list.length > 0 && (() => {
        // Uma linha por conta, desde a data do SEU PRÓPRIO saldo inicial (não
        // uma data compartilhada) — contas cadastradas com datas diferentes
        // simplesmente têm colunas iniciais em branco até a delas começar.
        // Ordena por created_at ASCENDENTE (a mais antiga primeiro) só pra
        // dar uma cor estável a cada conta enquanto ela existir: a cor segue
        // a conta, não a posição dela numa lista que pode ser reordenada.
        const sorted = [...list].sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
        const startKey = sorted.reduce((min, a) => {
          const k = toMonthKey(a.initial_balance_date);
          return !min || k < min ? k : min;
        }, null);
        if (!startKey) return null;
        const endKey = monthKey(new Date());
        const months = monthsBetween(startKey, endKey);
        const withValues = sorted.map((a) => {
          const startM = toMonthKey(a.initial_balance_date);
          const values = months.map((m) => (m < startM ? null : accountBalanceThroughMonth(a, incomeList, expenseEntries, m)));
          return { name: a.name, values };
        });
        // No máximo 6 cores fixas — nunca cicladas. Da 7ª conta em diante,
        // some tudo numa linha "Outras contas" cinza, em vez de reciclar uma
        // cor já usada por outra conta (regra da skill de dataviz: uma
        // identidade a mais nunca reaproveita uma cor já atribuída).
        const primary = withValues.slice(0, 6).map((s, i) => ({ ...s, color: ACCOUNT_SERIES_COLORS[i] }));
        const rest = withValues.slice(6);
        const series = [...primary];
        if (rest.length) {
          const restValues = months.map((_, i) => {
            const vals = rest.map((s) => s.values[i]).filter((v) => v != null);
            return vals.length ? vals.reduce((s2, v) => s2 + v, 0) : null;
          });
          series.push({ name: `Outras contas (${rest.length})`, color: ACCOUNT_OTHER_COLOR, values: restValues });
        }
        return (
          <div className="card section-gap">
            <h3 className="section-title">Histórico mensal por conta</h3>
            <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Saldo de cada conta no fim de cada mês, desde a data do saldo inicial cadastrado</div>
            <AccountHistoryChart months={months} series={series} />
            <div style={{ overflowX: 'auto', marginTop: 18 }}>
              <table>
                <thead>
                  <tr>
                    <th style={{ position: 'sticky', left: 0, background: 'var(--paper-raised)' }}>Conta</th>
                    {months.map((m) => <th key={m} className="num">{shortMonthLabel(m)}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {series.map((s) => (
                    <tr className="row-hover" key={s.name}>
                      <td style={{ position: 'sticky', left: 0, background: 'var(--paper-raised)', whiteSpace: 'nowrap' }}>
                        <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 4, background: s.color, marginRight: 6 }}></span>
                        {s.name}
                      </td>
                      {s.values.map((v, i) => <td key={i} className="num">{v == null ? '—' : fmtBRL(v)}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ---------- Simulador ----------
function SimuladorTab() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  const [valorCompra, setValorCompra] = useState('');
  const [entrada, setEntrada] = useState('');
  const [taxaJuros, setTaxaJuros] = useState('');
  const [parcelas, setParcelas] = useState('12');

  useEffect(() => {
    let active = true;
    (async () => {
      const [fx, inc, crd, pur, exp] = await Promise.all([
        sb.from('fixed_expenses').select('*'),
        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
        sb.from('expense_entries').select('*'),
      ]);
      if (!active) return;
      setData({ fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [], expenseEntries: exp.data || [] });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const key = monthKey(new Date());
  const renda = incomeForMonth(data.income, key);
  const despesaAtual = fixedContributionForMonth(data.fixedExpenses, data.expenseEntries, key) + data.cards.reduce((s, c) => s + cardTotalForMonth(data.purchases, c.id, currentInvoiceMonthKey(c)), 0) + nonCardExpenseTotalForMonth(data.expenseEntries, key);
  const comprometimentoAtual = renda > 0 ? (despesaAtual / renda) * 100 : null;

  const compra = toNumber(valorCompra) || 0;
  const entradaVal = toNumber(entrada) || 0;
  const taxa = toNumber(taxaJuros) || 0;
  const nParcelas = parseInt(parcelas) || 0;
  const financiado = Math.max(0, compra - entradaVal);
  const temSimulacao = compra > 0 && nParcelas > 0;
  const pmt = temSimulacao ? (financiado > 0 ? pmtFixedInstallment(financiado, taxa, nParcelas) : 0) : 0;
  const totalPago = temSimulacao ? pmt * nParcelas + entradaVal : 0;
  const totalJuros = temSimulacao ? totalPago - compra : 0;
  const comprometimentoDepois = temSimulacao && renda > 0 ? ((despesaAtual + pmt) / renda) * 100 : null;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Simulador</h1><div className="page-sub">Veja o impacto antes de decidir, não depois</div></div></div>

      <Banner type="info">
        Simule uma compra parcelada ou financiada e veja o quanto ela pesa no seu orçamento — antes de fechar negócio. Nada aqui é salvo; é só uma calculadora.
      </Banner>

      <div className="card section-gap">
        <form className="entry-form cols-6" onSubmit={(e) => e.preventDefault()}>
          <Field label="Valor da compra (R$)"><input type="text" inputMode="decimal" value={valorCompra} placeholder="0,00" onChange={(e) => setValorCompra(e.target.value)} /></Field>
          <Field label="Entrada (R$, opcional)"><input type="text" inputMode="decimal" value={entrada} placeholder="0,00" onChange={(e) => setEntrada(e.target.value)} /></Field>
          <Field label="Juros (% ao mês)"><input type="text" inputMode="decimal" value={taxaJuros} placeholder="0,00" onChange={(e) => setTaxaJuros(e.target.value)} /></Field>
          <Field label="Nº de parcelas"><input type="number" min="1" value={parcelas} onChange={(e) => setParcelas(e.target.value)} /></Field>
        </form>
      </div>

      {!temSimulacao ? (
        <div className="card"><Empty title="Preencha os campos acima" body="Informe pelo menos o valor da compra e o número de parcelas para ver a simulação." /></div>
      ) : (
        <div>
          <div className="grid grid-3" style={{ marginBottom: 22 }}>
            <div className="card"><p className="stat-label">Parcela mensal</p><p className="stat-value spend">{fmtBRL(pmt)}</p></div>
            <div className="card"><p className="stat-label">Total pago (com entrada)</p><p className="stat-value">{fmtBRL(totalPago)}</p></div>
            <div className="card"><p className="stat-label">Total de juros</p><p className="stat-value spend">{fmtBRL(totalJuros)}</p></div>
          </div>
          <div className="card section-gap">
            <h3 className="section-title">Impacto no seu orçamento</h3>
            {renda === 0 ? (
              <p style={{ color: 'var(--ink-faint)', fontSize: 13 }}>Cadastre sua renda em Receitas para ver o impacto no comprometimento de renda.</p>
            ) : (
              <div>
                <div className="grid grid-2" style={{ marginBottom: 10 }}>
                  <div><p className="stat-label">Comprometimento de renda hoje</p><p className="stat-value">{comprometimentoAtual.toFixed(0)}%</p></div>
                  <div><p className="stat-label">Comprometimento com essa parcela</p><p className={'stat-value' + (comprometimentoDepois <= 50 ? ' money' : comprometimentoDepois <= 70 ? ' gold' : ' spend')}>{comprometimentoDepois.toFixed(0)}%</p></div>
                </div>
                <p style={{ fontSize: 13, color: 'var(--ink-soft)' }}>Essa parcela representa {((pmt / renda) * 100).toFixed(1)}% da sua renda mensal por {nParcelas} {nParcelas === 1 ? 'mês' : 'meses'}.</p>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Gráfico de projeção (linha única ou faixa conservador–otimista +
// linha moderada), em SVG puro — sem biblioteca externa. Reutilizado tanto
// pro patrimônio (com faixa) quanto pro fluxo de caixa (sem faixa, 1 linha
// só, já que sobra anual não varia por cenário de retorno). ----------
function ProjectionChart({ points, lineKey, lineColor, bandLowKey, bandHighKey, bandColor, bandLowColor, bandHighColor, tooltipRows }) {
  const [hover, setHover] = useState(null);
  const W = 640, H = 260;
  const M = { top: 16, right: 12, bottom: 26, left: 68 };
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;
  const maxYear = points[points.length - 1].year;
  const allVals = points.flatMap((p) => bandLowKey ? [p[bandLowKey], p[lineKey], p[bandHighKey]] : [p[lineKey]]);
  const yMin = Math.min(0, ...allVals);
  const yMax = Math.max(1, ...allVals);
  const range = (yMax - yMin) || 1;
  const xAt = (year) => M.left + (maxYear === 0 ? 0 : (year / maxYear) * plotW);
  const yAt = (val) => M.top + plotH - ((val - yMin) / range) * plotH;

  const pathFor = (key) => points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(p.year).toFixed(1)} ${yAt(p[key]).toFixed(1)}`).join(' ');
  const linePath = pathFor(lineKey);
  const lowPath = bandLowKey ? pathFor(bandLowKey) : null;
  const highPath = bandHighKey ? pathFor(bandHighKey) : null;
  const bandPath = bandLowKey ? (
    points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(p.year).toFixed(1)} ${yAt(p[bandHighKey]).toFixed(1)}`).join(' ')
    + ' ' + [...points].reverse().map((p) => `L ${xAt(p.year).toFixed(1)} ${yAt(p[bandLowKey]).toFixed(1)}`).join(' ')
    + ' Z'
  ) : null;

  const step = maxYear > 30 ? 10 : 5;
  const xTicks = [];
  for (let y = 0; y <= maxYear; y += step) xTicks.push(y);
  if (xTicks[xTicks.length - 1] !== maxYear) xTicks.push(maxYear);

  function handleMove(ev) {
    const rect = ev.currentTarget.getBoundingClientRect();
    const relX = ((ev.clientX - rect.left) / rect.width) * W;
    const yearAtX = Math.round(((relX - M.left) / plotW) * maxYear);
    setHover(Math.max(0, Math.min(maxYear, yearAtX)));
  }

  const hp = hover != null ? points.find((p) => p.year === hover) : null;

  return (
    <div style={{ position: 'relative' }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}
        onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
        <line x1={M.left} y1={yAt(0)} x2={W - M.right} y2={yAt(0)} stroke="var(--paper-line)" strokeWidth="1" strokeDasharray={yMin < 0 ? '4 3' : undefined} />
        {xTicks.map((y) => (
          <g key={y}>
            <line x1={xAt(y)} y1={M.top} x2={xAt(y)} y2={H - M.bottom} stroke="var(--paper-line)" strokeWidth="1" opacity="0.45" />
            <text x={xAt(y)} y={H - 8} fontSize="11" fill="var(--ink-faint)" textAnchor="middle">{y === 0 ? 'hoje' : `+${y}a`}</text>
          </g>
        ))}
        <text x={M.left - 8} y={M.top + 4} fontSize="11" fill="var(--ink-faint)" textAnchor="end">{fmtBRLCompact(yMax)}</text>
        <text x={M.left - 8} y={H - M.bottom} fontSize="11" fill="var(--ink-faint)" textAnchor="end">{fmtBRLCompact(yMin)}</text>
        {bandPath && <path d={bandPath} fill={bandColor} stroke="none" />}
        {lowPath && <path d={lowPath} fill="none" stroke={bandLowColor} strokeWidth="1.5" strokeDasharray="4 3" strokeLinecap="round" strokeLinejoin="round" />}
        {highPath && <path d={highPath} fill="none" stroke={bandHighColor} strokeWidth="1.5" strokeDasharray="4 3" strokeLinecap="round" strokeLinejoin="round" />}
        <path d={linePath} fill="none" stroke={lineColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {hp && (
          <g>
            <line x1={xAt(hp.year)} y1={M.top} x2={xAt(hp.year)} y2={H - M.bottom} stroke="var(--ink-faint)" strokeWidth="1" strokeDasharray="3 3" />
            {bandLowKey && <circle cx={xAt(hp.year)} cy={yAt(hp[bandHighKey])} r="3" fill={bandHighColor} stroke="var(--paper-raised)" strokeWidth="1" />}
            {bandLowKey && <circle cx={xAt(hp.year)} cy={yAt(hp[bandLowKey])} r="3" fill={bandLowColor} stroke="var(--paper-raised)" strokeWidth="1" />}
            <circle cx={xAt(hp.year)} cy={yAt(hp[lineKey])} r="4" fill={lineColor} stroke="var(--paper-raised)" strokeWidth="1.5" />
          </g>
        )}
      </svg>
      {hp && (
        <div style={{ position: 'absolute', top: 4, right: 4, background: 'var(--paper-raised)', border: '1px solid var(--paper-line)', borderRadius: 8, padding: '8px 12px', fontSize: 12.5, boxShadow: '0 2px 8px rgba(0,0,0,.12)', pointerEvents: 'none' }}>
          <div style={{ fontWeight: 600, marginBottom: 4 }}>{hp.year === 0 ? 'Hoje' : `Daqui a ${hp.year} ${hp.year === 1 ? 'ano' : 'anos'}`}</div>
          {tooltipRows(hp)}
        </div>
      )}
    </div>
  );
}

// ---------- Projeção de longo prazo ----------
// Aba dedicada a responder "quanto vou ter daqui a 10, 20, 30 anos", "minha
// reserva dura até a aposentadoria?" e "meus investimentos estão dando lucro
// de verdade (preço + dividendo)?" — em vez de só olhar "quanto gastei este
// mês", que é o que o resto do app já cobre bem.
const PROJECTION_MIN_YEARS = 30;
function ProjecaoTab() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [form, setForm] = useState({ currentAge: '', retirementAge: '', retirementMonthlyExpense: '', investmentReturnRate: '5', incomeRealGrowthRate: '0', expenseRealGrowthRate: '0' });
  const [hasSettings, setHasSettings] = useState(false);
  const [saving, setSaving] = useState(false);
  const [savedMsg, setSavedMsg] = useState(false);

  async function load() {
    setLoading(true);
    const [fx, inc, pur, exp, assets, inv, divs, debts, proj] = await Promise.all([
      sb.from('fixed_expenses').select('*'),
      sb.from('income').select('*'),
      sb.from('card_purchases').select('*'),
      sb.from('expense_entries').select('*'),
      sb.from('assets').select('*'),
      sb.from('investments').select('*'),
      sb.from('investment_dividends').select('*'),
      sb.from('debts').select('*'),
      sb.from('financial_projection_settings').select('*').maybeSingle(),
    ]);
    const firstError = [fx, inc, pur, exp, assets, inv, divs, debts].find((r) => r.error);
    if (firstError) setErro(firstError.error.message);
    setData({
      fixedExpenses: fx.data || [], income: inc.data || [], purchases: pur.data || [], expenseEntries: exp.data || [],
      assets: assets.data || [], investments: inv.data || [], dividends: divs.data || [], debts: debts.data || [],
    });
    if (proj.data) {
      setHasSettings(true);
      setForm({
        currentAge: proj.data.current_age != null ? String(proj.data.current_age) : '',
        retirementAge: proj.data.retirement_age != null ? String(proj.data.retirement_age) : '',
        retirementMonthlyExpense: proj.data.retirement_monthly_expense != null ? String(proj.data.retirement_monthly_expense) : '',
        investmentReturnRate: String(proj.data.investment_return_rate),
        incomeRealGrowthRate: String(proj.data.income_real_growth_rate),
        expenseRealGrowthRate: String(proj.data.expense_real_growth_rate),
      });
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleSave(ev) {
    ev.preventDefault();
    setSaving(true);
    setSavedMsg(false);
    const payload = {
      current_age: form.currentAge ? parseInt(form.currentAge, 10) : null,
      retirement_age: form.retirementAge ? parseInt(form.retirementAge, 10) : null,
      retirement_monthly_expense: form.retirementMonthlyExpense ? (toNumber(form.retirementMonthlyExpense) || 0) : null,
      investment_return_rate: toNumber(form.investmentReturnRate) || 0,
      income_real_growth_rate: toNumber(form.incomeRealGrowthRate) || 0,
      expense_real_growth_rate: toNumber(form.expenseRealGrowthRate) || 0,
    };
    const { error } = await sb.from('financial_projection_settings').upsert(payload);
    setSaving(false);
    if (error) { setErro(error.message); return; }
    setHasSettings(true);
    setSavedMsg(true);
    setTimeout(() => setSavedMsg(false), 2500);
  }

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const ativos = data.assets.filter((a) => a.kind === 'ativo');
  const passivosSimples = data.assets.filter((a) => a.kind === 'passivo');
  const investedToday = data.investments.reduce((s, i) => s + Number(i.current_value), 0);
  const nonInvestedNetWorth = ativos.reduce((s, a) => s + Number(a.value), 0) - passivosSimples.reduce((s, a) => s + Number(a.value), 0);
  const debtToday = data.debts.reduce((s, d) => s + Number(d.saldo_devedor), 0);
  const debtSim = data.debts.length > 0 ? simulateQuitacao(data.debts, 0, 'avalanche') : null;
  const debtPayoffMonths = debtSim && !debtSim.estourou ? debtSim.meses : null;
  const capacidade = annualSavingsCapacity(data);

  const returnRate = toNumber(form.investmentReturnRate) || 0;
  const incomeGrowth = toNumber(form.incomeRealGrowthRate) || 0;
  const expenseGrowth = toNumber(form.expenseRealGrowthRate) || 0;
  const currentAge = form.currentAge ? parseInt(form.currentAge, 10) : null;
  const retirementAge = form.retirementAge ? parseInt(form.retirementAge, 10) : null;
  const retirementExpense = form.retirementMonthlyExpense ? (toNumber(form.retirementMonthlyExpense) || 0) : null;
  const yearsToRetirement = (currentAge != null && retirementAge != null && retirementAge > currentAge) ? (retirementAge - currentAge) : null;

  const projectionYears = Math.max(PROJECTION_MIN_YEARS, yearsToRetirement || 0);
  const scenarios = investmentReturnScenarios(returnRate);
  const baseParams = { nonInvestedNetWorth, investedToday, annualIncomeToday: capacidade.rendaAnual, annualExpenseToday: capacidade.despesaAnual, incomeRealGrowthRate: incomeGrowth, expenseRealGrowthRate: expenseGrowth, debtToday, debtPayoffMonths, years: projectionYears };
  const projConservador = projectNetWorth({ ...baseParams, returnRatePct: scenarios.conservador });
  const projModerado = projectNetWorth({ ...baseParams, returnRatePct: scenarios.moderado });
  const projOtimista = projectNetWorth({ ...baseParams, returnRatePct: scenarios.otimista });

  const patrimonioPoints = projModerado.map((p, i) => ({ year: p.year, conservador: projConservador[i].patrimonio, moderado: p.patrimonio, otimista: projOtimista[i].patrimonio }));
  const fluxoPoints = projModerado.map((p) => ({ year: p.year, sobra: p.sobraAnual }));

  const checkpoints = [10, 20, 30].filter((y) => y <= projectionYears);
  const findYear = (arr, y) => arr.find((p) => p.year === y);

  // Reserva na aposentadoria: usa só o saldo INVESTIDO (não o patrimônio não-
  // investido, que costuma ser ilíquido — imóvel, veículo) como base pra
  // simular o quanto dura sendo consumido mês a mês, na taxa real de cada
  // cenário. Simplificação deliberada, na mesma linha da dívida linear acima.
  let runway = null;
  if (yearsToRetirement != null && retirementExpense) {
    const idx = Math.min(yearsToRetirement, projectionYears);
    runway = {
      conservador: retirementRunway(projConservador[idx].investido, retirementExpense, scenarios.conservador),
      moderado: retirementRunway(projModerado[idx].investido, retirementExpense, scenarios.moderado),
      otimista: retirementRunway(projOtimista[idx].investido, retirementExpense, scenarios.otimista),
    };
  }

  function runwayText(r) {
    if (!r) return '—';
    if (r.duraParaSempre) return 'Dura indefinidamente';
    return `Dura ${r.anosCobertos} ${r.anosCobertos === 1 ? 'ano' : 'anos'}`;
  }

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Projeção</h1><div className="page-sub">Não só quanto você gastou — quanto você vai ter</div></div></div>

      <Banner type="info">
        Tudo aqui está em <strong>valores de hoje</strong> (já descontada a inflação) — a taxa de retorno que você informa abaixo já deve ser a taxa <strong>real</strong> esperada (acima da inflação), não a taxa nominal do seu investimento. Isso evita números nominais enganosos numa projeção de décadas e mantém tudo comparável com o que já aparece no resto do app. Os 3 cenários variam só essa taxa (±2 pontos percentuais); o patrimônio não-investido (imóveis, veículos, reserva) é mantido estável em termos reais, e uma eventual dívida é abatida numa aproximação linear até a data em que a aba Dívidas projeta ela quitada.
      </Banner>

      <div className="card section-gap">
        {erro && <Banner type="error">{erro}</Banner>}
        <h3 className="section-title">Suas premissas</h3>
        <form className="entry-form cols-6" onSubmit={handleSave}>
          <Field label="Idade atual"><input type="number" min="0" max="119" value={form.currentAge} placeholder="ex: 35" onChange={(e) => setForm({ ...form, currentAge: e.target.value })} /></Field>
          <Field label="Idade de aposentadoria"><input type="number" min="0" max="119" value={form.retirementAge} placeholder="ex: 60" onChange={(e) => setForm({ ...form, retirementAge: e.target.value })} /></Field>
          <Field label="Gasto mensal na aposentadoria (R$ de hoje)"><input type="text" inputMode="decimal" value={form.retirementMonthlyExpense} placeholder="0,00" onChange={(e) => setForm({ ...form, retirementMonthlyExpense: e.target.value })} /></Field>
          <Field label="Retorno real moderado (% ao ano)"><input required type="text" inputMode="decimal" value={form.investmentReturnRate} placeholder="ex: 5" onChange={(e) => setForm({ ...form, investmentReturnRate: e.target.value })} /></Field>
          <Field label="Crescimento real da renda (% a.a., opcional)"><input type="text" inputMode="decimal" value={form.incomeRealGrowthRate} placeholder="0" onChange={(e) => setForm({ ...form, incomeRealGrowthRate: e.target.value })} /></Field>
          <Field label="Crescimento real da despesa (% a.a., opcional)"><input type="text" inputMode="decimal" value={form.expenseRealGrowthRate} placeholder="0" onChange={(e) => setForm({ ...form, expenseRealGrowthRate: e.target.value })} /></Field>
          <button type="submit" className="btn" disabled={saving}>{saving ? 'Salvando...' : 'Salvar premissas'}</button>
        </form>
        {savedMsg && <p style={{ color: 'var(--money)', fontSize: 13, marginTop: 8 }}>Premissas salvas.</p>}
        {!hasSettings && <p style={{ color: 'var(--ink-faint)', fontSize: 12.5, marginTop: 8 }}>Usando 5% ao ano como retorno moderado até você salvar suas próprias premissas.</p>}
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Poupança anual de hoje (ponto de partida da projeção)</h3>
        <div className="grid grid-3">
          <div><p className="stat-label">Renda anual</p><p className="stat-value money">{fmtBRL(capacidade.rendaAnual)}</p></div>
          <div><p className="stat-label">Despesa anual</p><p className="stat-value spend">{fmtBRL(capacidade.despesaAnual)}</p></div>
          <div><p className="stat-label">Sobra anual (reinvestida)</p><p className={'stat-value ' + (capacidade.sobraAnual >= 0 ? 'money' : 'spend')}>{fmtBRL(capacidade.sobraAnual)}</p></div>
        </div>
        <p className="page-sub" style={{ margin: '10px 0 0' }}>Média dos últimos 3 meses de despesa (fixas ainda não lançadas + cartão + variáveis), anualizada. Renda considera receitas recorrentes de hoje.</p>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Projeção de patrimônio</h3>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', marginBottom: 10, fontSize: 12.5, flexWrap: 'wrap' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}><span style={{ width: 14, height: 3, background: 'var(--scenario-conservador)', display: 'inline-block', borderRadius: 2 }}></span>Conservador</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}><span style={{ width: 14, height: 3, background: 'var(--money)', display: 'inline-block', borderRadius: 2 }}></span>Moderado</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}><span style={{ width: 14, height: 3, background: 'var(--scenario-otimista)', display: 'inline-block', borderRadius: 2 }}></span>Otimista</span>
        </div>
        <ProjectionChart
          points={patrimonioPoints}
          lineKey="moderado" lineColor="var(--money)"
          bandLowKey="conservador" bandHighKey="otimista" bandColor="var(--money-soft)"
          bandLowColor="var(--scenario-conservador)" bandHighColor="var(--scenario-otimista)"
          tooltipRows={(hp) => (
            <div>
              <div>Otimista: <strong style={{ color: 'var(--scenario-otimista)' }}>{fmtBRL(hp.otimista)}</strong></div>
              <div>Moderado: <strong style={{ color: 'var(--money)' }}>{fmtBRL(hp.moderado)}</strong></div>
              <div>Conservador: <strong style={{ color: 'var(--scenario-conservador)' }}>{fmtBRL(hp.conservador)}</strong></div>
            </div>
          )}
        />
        <div className="grid grid-3" style={{ marginTop: 16 }}>
          {checkpoints.map((y) => (
            <div key={y} className="card" style={{ background: 'var(--paper)' }}>
              <p className="stat-label">Patrimônio em {y} anos</p>
              <p className="stat-value">{fmtBRL(findYear(patrimonioPoints, y).moderado)}</p>
              <p className="page-sub" style={{ margin: '4px 0 0' }}>Entre {fmtBRLCompact(findYear(patrimonioPoints, y).conservador)} (conservador) e {fmtBRLCompact(findYear(patrimonioPoints, y).otimista)} (otimista)</p>
            </div>
          ))}
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Projeção de fluxo de caixa (sobra anual)</h3>
        <p className="page-sub" style={{ margin: '0 0 10px' }}>Não varia por cenário de retorno — só pelo crescimento real de renda/despesa que você informou acima.</p>
        <ProjectionChart
          points={fluxoPoints}
          lineKey="sobra" lineColor="var(--gold)"
          tooltipRows={(hp) => (<div>Sobra no ano: <strong className={hp.sobra >= 0 ? 'money' : 'spend'}>{fmtBRL(hp.sobra)}</strong></div>)}
        />
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Sua reserva dura até a aposentadoria?</h3>
        {!yearsToRetirement || !retirementExpense ? (
          <Empty title="Preencha idade atual, idade de aposentadoria e gasto mensal esperado" body="Com esses 3 dados, calculamos quanto tempo o seu saldo investido sustenta o gasto mensal que você espera ter, em cada cenário de retorno." />
        ) : (
          <div>
            <p className="page-sub" style={{ margin: '0 0 12px' }}>Considerando só o saldo investido (não o patrimônio não-investido, geralmente ilíquido) na data da aposentadoria, sendo consumido pelo gasto mensal informado e rendendo à taxa real de cada cenário.</p>
            <div className="grid grid-3">
              <div className="card" style={{ background: 'var(--paper)' }}><p className="stat-label">Conservador ({scenarios.conservador}% a.a.)</p><p className="stat-value">{runwayText(runway.conservador)}</p></div>
              <div className="card" style={{ background: 'var(--paper)' }}><p className="stat-label">Moderado ({scenarios.moderado}% a.a.)</p><p className="stat-value">{runwayText(runway.moderado)}</p></div>
              <div className="card" style={{ background: 'var(--paper)' }}><p className="stat-label">Otimista ({scenarios.otimista}% a.a.)</p><p className="stat-value">{runwayText(runway.otimista)}</p></div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- App shell ----------
// Cada aba carrega o grupo a que pertence — usado só pra desenhar os
// rótulos de seção no menu lateral (ver render de `nav` em App). Privacidade
// fica de fora dessa lista de propósito: ela mora perto de "Modo escuro" e
// "Sair", no rodapé do menu, por ser uma aba de configuração, não de uso do
// dia a dia.
// "Contas" (Contas correntes) fica fora do menu por enquanto — a pessoa
// pediu pra tirar do ar depois de avaliarmos juntos que um saldo por conta
// alimentado manualmente é frágil (um lançamento esquecido deixa o saldo
// errado pra sempre, sem se autocorrigir) e que faz mais sentido retomar
// isso quando o Open Finance entrar (aí a conta certa e a transferência
// entre contas ficam automáticas, direto do banco, sem depender de
// disciplina manual). Nada foi apagado: AccountsTab, AccountHistoryChart,
// accountBalance/accountBalanceThroughMonth e a migração SQL
// (supabase_bank_accounts.sql) continuam no projeto, prontos pra voltar —
// só não estão pendurados no menu nem alimentados pelos formulários de
// Despesas/Receitas.
const TABS = [
  { id: 'dashboard', label: 'Dashboard', n: '01', group: 'Visão geral' },
  { id: 'expenses', label: 'Despesas', n: '02', group: 'Movimento do dia a dia' },
  { id: 'income', label: 'Receitas', n: '03', group: 'Movimento do dia a dia' },
  { id: 'cashflow', label: 'Fluxo de caixa', n: '04', group: 'Movimento do dia a dia' },
  { id: 'patrimonio', label: 'Patrimônio', n: '05', group: 'Patrimônio e futuro' },
  { id: 'investimentos', label: 'Investimentos', n: '06', group: 'Patrimônio e futuro' },
  { id: 'metas', label: 'Metas', n: '07', group: 'Patrimônio e futuro' },
  { id: 'dividas', label: 'Dívidas', n: '08', group: 'Patrimônio e futuro' },
  { id: 'projecao', label: 'Projeção', n: '09', group: 'Patrimônio e futuro' },
  { id: 'simulador', label: 'Simulador', n: '10', group: 'Ferramentas' },
];

// "Despesas" reúne, em subabas, os quatro jeitos de registrar/ver despesa:
// lançamentos avulsos (o que já era a aba "Despesas"), contas fixas, cartão
// de crédito e supermercado — antes eram 4 abas separadas no menu principal.
const EXPENSE_SUBTABS = [
  { id: 'general', label: 'Lançamentos' },
  { id: 'fixed', label: 'Fixas' },
  { id: 'cards', label: 'Cartão de Crédito' },
  { id: 'grocery', label: 'Supermercado' },
];

function DespesasSection({ session }) {
  const [sub, setSub] = useState('general');
  return (
    <div>
      <div className="subtabs">
        {EXPENSE_SUBTABS.map((t) => (
          <button key={t.id} className={'subtab' + (sub === t.id ? ' active' : '')} onClick={() => setSub(t.id)}>
            {t.label}
          </button>
        ))}
      </div>
      {sub === 'general' && <ExpenseHistoryTab session={session} />}
      {sub === 'fixed' && <FixedExpensesTab />}
      {sub === 'cards' && <CardsTab session={session} />}
      {sub === 'grocery' && <GroceryTab session={session} />}
    </div>
  );
}

// ---------- Privacidade (LGPD) ----------
function PrivacyTab({ session }) {
  const [openDoc, setOpenDoc] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [exportingXlsx, setExportingXlsx] = useState(false);
  const [exportError, setExportError] = useState(null);
  const [deleteStep, setDeleteStep] = useState('idle'); // idle | confirming | scheduling
  const [deleteConfirmText, setDeleteConfirmText] = useState('');
  const [deleteError, setDeleteError] = useState(null);
  const [pendingDeletionAt, setPendingDeletionAt] = useState(undefined); // undefined = carregando
  const [cancelling, setCancelling] = useState(false);
  const [registrandoBiometria, setRegistrandoBiometria] = useState(false);
  const [biometriaMsg, setBiometriaMsg] = useState(null); // { type: 'success'|'error', text }

  useEffect(() => {
    sb.from('profiles').select('pending_deletion_at').eq('id', session.user.id).maybeSingle()
      .then(({ data }) => setPendingDeletionAt(data ? data.pending_deletion_at : null));
  }, [session.user.id]);

  // Busca TODAS as tabelas com dado seu — usada tanto no "Baixar meus
  // dados" (JSON) quanto na planilha Excel, pra nunca ficar dessincronizado
  // entre os dois formatos. Antes só cobria 6 tabelas (despesas fixas,
  // receitas, cartões, compras no cartão, despesas lançadas, categorias) —
  // faltava Patrimônio, Dívidas, Metas, Supermercado, Investimentos e os
  // perfis de importação de fatura, então o botão não entregava de fato
  // "todos os seus dados" como a Política de Privacidade promete. bank_accounts
  // fica de fora de propósito: é a aba Contas, guardada mas ainda sem a
  // tabela criada no banco (ver decisão de deixar isso pro Open Finance).
  const EXPORT_LABELS = {
    despesas_fixas: 'Despesas fixas',
    receitas: 'Receitas',
    cartoes: 'Cartões',
    compras_cartao: 'Compras no cartão',
    despesas_lancadas: 'Despesas lançadas',
    categorias_personalizadas: 'Categorias personalizadas',
    patrimonio: 'Patrimônio',
    dividas: 'Dívidas',
    metas: 'Metas',
    notas_supermercado: 'Notas de supermercado',
    itens_supermercado: 'Itens de supermercado',
    investimentos: 'Investimentos',
    dividendos_investimentos: 'Dividendos',
    configuracoes_projecao: 'Config. de projeção',
    perfis_importacao_fatura: 'Perfis de importação',
  };
  async function fetchAllUserData() {
    const [fx, inc, crd, pur, exp, cats, ast, dbt, gls, gr, gi, inv, div, proj, cip] = await Promise.all([
      sb.from('fixed_expenses').select('*'),
      sb.from('income').select('*'),
      sb.from('cards').select('*'),
      sb.from('card_purchases').select('*'),
      sb.from('expense_entries').select('*'),
      sb.from('custom_categories').select('*'),
      sb.from('assets').select('*'),
      sb.from('debts').select('*'),
      sb.from('goals').select('*'),
      sb.from('grocery_receipts').select('*'),
      sb.from('grocery_items').select('*'),
      sb.from('investments').select('*'),
      sb.from('investment_dividends').select('*'),
      sb.from('financial_projection_settings').select('*'),
      sb.from('card_import_profiles').select('*'),
    ]);
    return {
      despesas_fixas: fx.data || [], receitas: inc.data || [], cartoes: crd.data || [],
      compras_cartao: pur.data || [], despesas_lancadas: exp.data || [], categorias_personalizadas: cats.data || [],
      patrimonio: ast.data || [], dividas: dbt.data || [], metas: gls.data || [],
      notas_supermercado: gr.data || [], itens_supermercado: gi.data || [],
      investimentos: inv.data || [], dividendos_investimentos: div.data || [],
      configuracoes_projecao: proj.data || [], perfis_importacao_fatura: cip.data || [],
    };
  }

  async function handleExport() {
    setExporting(true);
    setExportError(null);
    try {
      const dados = await fetchAllUserData();
      const payload = { exportado_em: new Date().toISOString(), conta: session.user.email, ...dados };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tonus-financeiro-meus-dados-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      setExportError('Não foi possível gerar o arquivo: ' + err.message);
    }
    setExporting(false);
  }

  // Mesmos dados do JSON acima, só que numa planilha Excel (uma aba por
  // tabela) — formato bem mais fácil de abrir/filtrar/somar fora do app do
  // que um JSON. Roda inteiro no navegador (biblioteca SheetJS via CDN),
  // sem nenhum serviço pago por trás.
  async function handleExportXlsx() {
    setExportingXlsx(true);
    setExportError(null);
    try {
      if (!window.XLSX) {
        await ensureLibLoaded(() => !!window.XLSX, 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      }
      const dados = await fetchAllUserData();
      const wb = XLSX.utils.book_new();
      Object.entries(dados).forEach(([key, rows]) => {
        // Mesmo uma tabela vazia ganha aba própria (só um aviso) — melhor
        // do que ela sumir silenciosamente da planilha.
        const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['(nenhum registro)']]);
        const label = (EXPORT_LABELS[key] || key).slice(0, 31); // limite de 31 caracteres do Excel pro nome da aba
        XLSX.utils.book_append_sheet(wb, ws, label);
      });
      XLSX.writeFile(wb, `tonus-financeiro-meus-dados-${new Date().toISOString().slice(0, 10)}.xlsx`);
    } catch (err) {
      setExportError('Não foi possível gerar a planilha: ' + err.message);
    }
    setExportingXlsx(false);
  }

  async function handleScheduleDeletion() {
    setDeleteStep('scheduling');
    setDeleteError(null);
    const when = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();
    const { error } = await sb.from('profiles').update({ pending_deletion_at: when }).eq('id', session.user.id);
    if (error) { setDeleteError(error.message); setDeleteStep('confirming'); return; }
    setPendingDeletionAt(when);
    setDeleteStep('idle');
    setDeleteConfirmText('');
  }

  async function handleCancelDeletion() {
    setCancelling(true);
    const { error } = await sb.from('profiles').update({ pending_deletion_at: null }).eq('id', session.user.id);
    setCancelling(false);
    if (!error) setPendingDeletionAt(null);
  }

  async function handleRegisterPasskey() {
    setRegistrandoBiometria(true);
    setBiometriaMsg(null);
    const { error } = await sb.auth.registerPasskey();
    setRegistrandoBiometria(false);
    if (error) {
      const mensagens = {
        webauthn_credential_exists: 'Este aparelho já está com biometria ativada pra essa conta.',
        too_many_passkeys: 'Limite de biometrias cadastradas atingido pra essa conta.',
      };
      setBiometriaMsg({ type: 'error', text: mensagens[error.code] || `Não foi possível ativar a biometria: ${error.message}` });
      return;
    }
    setBiometriaMsg({ type: 'success', text: 'Biometria ativada neste aparelho! Da próxima vez que abrir o app, use "Entrar com biometria" na tela de login.' });
  }

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Privacidade</h1><div className="page-sub">Seus direitos sobre os seus dados, conforme a LGPD</div></div></div>

      <div className="card">
        <h3 className="section-title">Login por biometria</h3>
        <p style={{ fontSize: 13.5, color: 'var(--ink-soft)', margin: '0 0 14px' }}>
          Toda vez que você fecha o app de vez, ele desloga sozinho — da próxima vez, é preciso confirmar de novo (e-mail/senha ou biometria). Ativando aqui, você usa Face ID/digital pra entrar, sem precisar digitar a senha toda hora. Isso fica salvo neste aparelho/navegador (em outro aparelho, ative de novo).
        </p>
        {biometriaMsg && <Banner type={biometriaMsg.type}>{biometriaMsg.text}</Banner>}
        <button className="btn" onClick={handleRegisterPasskey} disabled={registrandoBiometria}>
          {registrandoBiometria ? 'Ativando...' : '🔐 Ativar biometria neste aparelho'}
        </button>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Documentos</h3>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn ghost" onClick={() => setOpenDoc('privacy')}>Ver Política de Privacidade</button>
          <button className="btn ghost" onClick={() => setOpenDoc('terms')}>Ver Termos de Uso</button>
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Baixar meus dados</h3>
        <p style={{ fontSize: 13.5, color: 'var(--ink-soft)', margin: '0 0 14px' }}>
          Gera um arquivo com tudo que você cadastrou no Tonus Financeiro — despesas, receitas, cartões, patrimônio, dívidas, metas, supermercado e investimentos — para você guardar ou levar a outro serviço.
        </p>
        {exportError && <Banner type="error">{exportError}</Banner>}
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn" onClick={handleExport} disabled={exporting}>{exporting ? 'Gerando arquivo...' : 'Baixar meus dados (JSON)'}</button>
          <button className="btn ghost" onClick={handleExportXlsx} disabled={exportingXlsx}>{exportingXlsx ? 'Gerando planilha...' : 'Baixar meus dados (planilha Excel)'}</button>
        </div>
        <p style={{ fontSize: 12, color: 'var(--ink-faint)', margin: '10px 0 0' }}>
          O JSON é o formato mais completo e fácil de importar em outro sistema; a planilha Excel abre direto no Excel/Google Sheets, com uma aba para cada tipo de dado. Nenhum dos dois inclui os arquivos de comprovante/foto anexados — só os dados, com o caminho de cada anexo.
        </p>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Excluir minha conta</h3>

        {pendingDeletionAt ? (
          <div>
            <Banner type="error">
              Sua conta está agendada para exclusão definitiva em <strong>{new Date(pendingDeletionAt).toLocaleDateString('pt-BR')}</strong>. Até lá, você pode cancelar quando quiser — inclusive basta entrar de novo com seu login que isso é feito automaticamente.
            </Banner>
            <button className="btn ghost" onClick={handleCancelDeletion} disabled={cancelling}>{cancelling ? 'Cancelando...' : 'Cancelar exclusão agora'}</button>
          </div>
        ) : (
          <React.Fragment>
            <p style={{ fontSize: 13.5, color: 'var(--ink-soft)', margin: '0 0 14px' }}>
              Ao confirmar, sua conta entra num prazo de carência de <strong>7 dias</strong>. Se você não entrar novamente nesse período, ao final dele sua conta, login e todos os dados cadastrados — despesas, receitas, cartões e comprovantes — são apagados permanentemente, sem possibilidade de recuperação. Entrar novamente antes do prazo cancela a exclusão automaticamente. Depois de excluída, você pode se cadastrar de novo quando quiser — só que como uma conta nova, sem o histórico de antes.
            </p>
            {deleteStep === 'idle' && (
              <button className="btn danger" onClick={() => setDeleteStep('confirming')}>Excluir minha conta</button>
            )}
            {deleteStep === 'confirming' && (
              <div>
                {deleteError && <Banner type="error">{deleteError}</Banner>}
                <p style={{ fontSize: 13, color: 'var(--spend-strong)', marginBottom: 10 }}>
                  Para confirmar, digite seu e-mail (<strong>{session.user.email}</strong>) no campo abaixo:
                </p>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <input value={deleteConfirmText} onChange={(e) => setDeleteConfirmText(e.target.value)} placeholder={session.user.email} style={{ maxWidth: 260 }} />
                  <button className="btn danger" disabled={deleteConfirmText !== session.user.email} onClick={handleScheduleDeletion}>
                    Confirmar exclusão (em 7 dias)
                  </button>
                  <button className="btn ghost" onClick={() => { setDeleteStep('idle'); setDeleteConfirmText(''); setDeleteError(null); }}>Cancelar</button>
                </div>
              </div>
            )}
            {deleteStep === 'scheduling' && <Banner type="info">Agendando...</Banner>}
          </React.Fragment>
        )}
      </div>

      <PolicyModal doc={openDoc} onClose={() => setOpenDoc(null)} />
    </div>
  );
}


function App({ session }) {
  const [tab, setTab] = useState('dashboard');
  const [cashflowMonth, setCashflowMonth] = useState(monthKey(new Date()));
  const [deletionCancelledNotice, setDeletionCancelledNotice] = useState(false);
  const [theme, setTheme] = useState(() => getTheme());

  function toggleTheme() {
    const next = theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    setTheme(next);
  }

  useEffect(() => {
    // Garante que exista um registro de consentimento para esta conta — cobre
    // tanto quem aceitou e já entrou direto quanto quem precisou confirmar o
    // e-mail antes do primeiro login.
    (async () => {
      const { data: existing } = await sb.from('profiles').select('id, pending_deletion_at').eq('id', session.user.id).maybeSingle();
      if (!existing) {
        await sb.from('profiles').insert({
          id: session.user.id,
          terms_accepted_at: new Date().toISOString(),
          privacy_accepted_at: new Date().toISOString(),
          policy_version: POLICY_VERSION,
        });
      } else if (existing.pending_deletion_at) {
        // A pessoa tinha pedido exclusão da conta e entrou de novo dentro do
        // prazo de carência — cancela automaticamente, como prometido a ela.
        await sb.from('profiles').update({ pending_deletion_at: null }).eq('id', session.user.id);
        setDeletionCancelledNotice(true);
      }
    })();
  }, [session.user.id]);

  // Nota: a sincronização de despesas fixas com o mês corrente deixou de
  // rodar sozinha em segundo plano aqui — virou o painel "Contas do mês",
  // visível dentro da aba Despesas > Fixas (FixedExpensesTab), onde cada
  // vínculo/lançamento é 1 clique explícito da pessoa em vez de mágica
  // invisível. Ver planFixedExpenseReview.

  return (
    <div id="app">
      <aside id="sidebar">
        <div className="brand">
          <img src="logo-icon.png" alt="Tonus" style={{ height: 30, marginBottom: 12, display: 'block' }} />
          <div className="brand-mark">Tonus Financeiro</div>
          <div className="brand-sub">Equilíbrio para suas finanças</div>
        </div>
        <nav>
          {TABS.map((t, i) => (
            <React.Fragment key={t.id}>
              {(i === 0 || t.group !== TABS[i - 1].group) && <div className="nav-group-label">{t.group}</div>}
              <button className={'tab' + (tab === t.id ? ' active' : '')} onClick={() => setTab(t.id)}>
                <span className="num">{t.n}</span><span>{t.label}</span>
              </button>
            </React.Fragment>
          ))}
          <div className="nav-divider"></div>
          <button className={'tab' + (tab === 'privacy' ? ' active' : '')} onClick={() => setTab('privacy')}>
            <span className="num">🔒</span><span>Privacidade</span>
          </button>
          <button className="tab" onClick={toggleTheme} title="Trocar entre modo claro e escuro">
            <span className="num">{theme === 'dark' ? '☀️' : '🌙'}</span><span>{theme === 'dark' ? 'Modo claro' : 'Modo escuro'}</span>
          </button>
        </nav>
        <div className="sidebar-foot">
          {session.user.email}
          <br /><button className="icon-btn" style={{ padding: '6px 0', color: 'var(--cream-on-cover-soft)' }} onClick={() => sb.auth.signOut()}>Sair</button>
        </div>
      </aside>
      <main id="main">
        {deletionCancelledNotice && (
          <div style={{ marginBottom: 20 }}>
            <Banner type="success">
              Sua exclusão de conta foi cancelada automaticamente porque você entrou novamente. Seus dados continuam intactos.
              <button className="icon-btn" style={{ marginLeft: 10 }} onClick={() => setDeletionCancelledNotice(false)}>Dispensar</button>
            </Banner>
          </div>
        )}
        {tab === 'dashboard' && <DashboardTab />}
        {tab === 'expenses' && <DespesasSection session={session} />}
        {tab === 'income' && <IncomeTab session={session} />}
        {tab === 'cashflow' && <CashflowTab cashflowMonth={cashflowMonth} setCashflowMonth={setCashflowMonth} />}
        {tab === 'patrimonio' && <PatrimonioTab />}
        {tab === 'investimentos' && <InvestimentosTab />}
        {tab === 'metas' && <MetasTab />}
        {tab === 'dividas' && <DividasTab />}
        {tab === 'projecao' && <ProjecaoTab />}
        {tab === 'simulador' && <SimuladorTab />}
        {tab === 'privacy' && <PrivacyTab session={session} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthGate>{(session) => <App session={session} />}</AuthGate>
);

</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
