                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

// ---------- Fluxo de caixa ----------
function CashflowTab({ cashflowMonth, setCashflowMonth }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [expandedDays, setExpandedDays] = useState(() => new Set());
  function toggleDayExpanded(day) {
    setExpandedDays((prev) => {
      const next = new Set(prev);
      if (next.has(day)) next.delete(day); else next.add(day);
      return next;
    });
  }

  useEffect(() => {
    let active = true;
    (async () => {
      const [fx, inc, crd, pur, exp] = await Promise.all([
        sb.from('fixed_expenses').select('*'),
        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
        sb.from('expense_entries').select('*'),
      ]);
      if (!active) return;
      setData({ fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [], expenseEntries: exp.data || [] });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const key = cashflowMonth;
  let entries = [];
  data.income.forEach((inc) => {
    if (inc.recurring) entries.push({ desc: inc.name, cat: inc.category, day: 1, amount: Number(inc.amount), kind: 'in' });
    else if (inc.income_date && inc.income_date.slice(0, 7) === key) entries.push({ desc: inc.name, cat: inc.category, day: Number(inc.income_date.slice(8, 10)), amount: Number(inc.amount), kind: 'in' });
  });
  // Só injeta a linha "achatada" (estimativa) de uma ocorrência de despesa
  // fixa se ela ainda não tem lançamento real (vinculado ou candidato) que já
  // a represente — esse lançamento real já aparece abaixo como uma linha de
  // Despesas (lançado à mão ou confirmado no painel "Contas do mês") — e só
  // pro mês atual em diante (mês passado fechado usa só o realizado, mesma
  // regra de pendingFixedOccurrencesForMonth).
  pendingFixedOccurrencesForMonth(data.fixedExpenses, data.expenseEntries, key).forEach((occ) => {
    entries.push({ desc: occ.name, cat: occ.category, day: Number(occ.expectedDate.slice(8, 10)), amount: occ.estimatedAmount, kind: 'out' });
  });
  // Cartão entra como UMA linha por cartão, no dia do vencimento da fatura —
  // não uma linha por compra. É isso que de fato sai da conta nesse dia; o
  // detalhe de cada compra já pode ser visto na aba Cartões.
  data.cards.forEach((c) => {
    const amt = cardTotalForMonth(data.purchases, c.id, key);
    if (amt > 0) {
      entries.push({ desc: 'Fatura ' + c.name, cat: 'Cartão de crédito', day: Number(c.due_day), amount: amt, kind: 'out' });
    }
  });
  nonCardExpenseEntriesForMonth(data.expenseEntries, key).forEach((e) => {
    entries.push({ desc: e.description, cat: e.category, day: Number(e.entry_date.slice(8, 10)), amount: Number(e.amount), kind: 'out' });
  });
  entries.sort((a, b) => a.day - b.day);

  // Agrupa por dia — cada dia vira uma linha (entradas e saídas juntas);
  // clicar expande e mostra os lançamentos daquele dia, um a um.
  const dayMap = new Map();
  entries.forEach((e) => {
    if (!dayMap.has(e.day)) dayMap.set(e.day, []);
    dayMap.get(e.day).push(e);
  });
  const days = Array.from(dayMap.keys()).sort((a, b) => a - b);

  const totalIn = entries.filter((e) => e.kind === 'in').reduce((s, e) => s + e.amount, 0);
  const totalOut = entries.filter((e) => e.kind === 'out').reduce((s, e) => s + e.amount, 0);
  const net = totalIn - totalOut;

  const months = [];
  for (let i = 5; i >= 0; i--) months.push(shiftMonth(key, -i));
  const nets = months.map((m) => {
    const inc = incomeForMonth(data.income, m);
    const fx = fixedContributionForMonth(data.fixedExpenses, data.expenseEntries, m);
    const cd = allCardsTotalForMonth(data.purchases, m);
    const vr = nonCardExpenseTotalForMonth(data.expenseEntries, m);
    return { m, val: inc - fx - cd - vr };
  });
  const maxAbs = Math.max(1, ...nets.map((n) => Math.abs(n.val)));

  let runningBalance = 0;

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Fluxo de caixa</h1><div className="page-sub">Entradas e saídas mês a mês</div></div>
        <div className="month-nav">
          <button onClick={() => setCashflowMonth(shiftMonth(key, -1))}>&#8592;</button>
          <span className="month-label">{monthLabel(key)}</span>
          <button onClick={() => setCashflowMonth(shiftMonth(key, 1))}>&#8594;</button>
        </div>
      </div>

      <div className={'balance-strip ' + (net >= 0 ? 'pos' : 'neg')}>
        <span className="label">Saldo do mês</span><span className="value">{fmtBRL(net)}</span>
      </div>
      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total de entradas</p><p className="stat-value money">{fmtBRL(totalIn)}</p></div>
        <div className="card"><p className="stat-label">Total de saídas</p><p className="stat-value spend">{fmtBRL(totalOut)}</p></div>
      </div>

      <div className="card">
        <h3 className="section-title">Saldo — últimos 6 meses</h3>
        <div style={{ overflowX: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 120, paddingTop: 10, width: 'max-content', minWidth: '100%' }}>
            {nets.map((n) => {
              const h = Math.max(3, Math.round((Math.abs(n.val) / maxAbs) * 90));
              const color = n.val >= 0 ? 'var(--money)' : 'var(--spend)';
              return (
                <div key={n.m} style={{ flex: '0 0 80px', width: 80, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginBottom: 4, whiteSpace: 'nowrap', textAlign: 'center' }}>{fmtBRL(n.val)}</div>
                  <div style={{ width: 34, height: h, background: color, borderRadius: '4px 4px 0 0' }}></div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginTop: 6, textTransform: 'capitalize', whiteSpace: 'nowrap', textAlign: 'center' }}>{MONTH_NAMES[Number(n.m.split('-')[1]) - 1].slice(0, 3)}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Lançamentos do mês</h3>
        {days.length === 0 ? <Empty title="Sem lançamentos neste mês" body="Cadastre receitas, despesas fixas ou compras no cartão para ver o fluxo aqui." /> : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th></th><th>Dia</th><th>Lançamentos</th><th className="num">Valor do dia</th><th className="num">Saldo acum.</th></tr></thead>
            <tbody>
              {days.map((day) => {
                const dayEntries = dayMap.get(day);
                const dayIn = dayEntries.filter((e) => e.kind === 'in').reduce((s, e) => s + e.amount, 0);
                const dayOut = dayEntries.filter((e) => e.kind === 'out').reduce((s, e) => s + e.amount, 0);
                const dayNet = dayIn - dayOut;
                runningBalance += dayNet;
                const isOpen = expandedDays.has(day);
                return (
                  <React.Fragment key={day}>
                    <tr className="row-hover" style={{ cursor: 'pointer', background: 'var(--paper-line)' }} onClick={() => toggleDayExpanded(day)}>
                      <td style={{ width: 20 }}>{isOpen ? '▾' : '▸'}</td>
                      <td>Dia {String(day).padStart(2, '0')}</td>
                      <td style={{ color: 'var(--ink-soft)' }}>{dayEntries.length} lançamento{dayEntries.length > 1 ? 's' : ''}</td>
                      <td className="num" style={{ fontWeight: 600, color: dayNet >= 0 ? 'var(--money-strong)' : 'var(--spend-strong)' }}>{dayNet >= 0 ? '+' : '−'} {fmtBRL(Math.abs(dayNet))}</td>
                      <td className="num" style={{ fontWeight: 600 }}>{fmtBRL(runningBalance)}</td>
                    </tr>
                    {isOpen && dayEntries.map((e, i) => (
                      <tr key={i} style={{ background: 'var(--paper-raised)' }}>
                        <td></td>
                        <td colSpan={2} style={{ paddingLeft: 26, color: 'var(--ink-soft)', fontSize: 12.5 }}>
                          {e.desc} <span className={'pill ' + (e.kind === 'in' ? 'money' : 'spend')} style={{ marginLeft: 6 }}>{e.cat}</span>
                        </td>
                        <td className="num" style={{ fontSize: 12.5, color: e.kind === 'in' ? 'var(--money-strong)' : 'var(--spend-strong)' }}>{e.kind === 'in' ? '+' : '−'} {fmtBRL(e.amount)}</td>
                        <td></td>
                      </tr>
                    ))}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Patrimônio ----------
function PatrimonioTab() {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [kind, setKind] = useState('ativo'); // 'ativo' | 'passivo'
  const [category, setCategory] = useState(CATS_ATIVO[0]);
  const [amount, setAmount] = useState('');
  const [customAtivo, setCustomAtivo] = useState([]);
  const [customPassivo, setCustomPassivo] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);
  const [investTotal, setInvestTotal] = useState(0);
  const [debtRows, setDebtRows] = useState([]);

  async function load() {
    setLoading(true);
    const [rows, catsA, catsP, investRows, debts] = await Promise.all([
      sb.from('assets').select('*').order('created_at', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'asset').order('created_at'),
      sb.from('custom_categories').select('name').eq('kind', 'liability').order('created_at'),
      sb.from('investments').select('current_value'),
      sb.from('debts').select('category, saldo_devedor'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (catsA.data) setCustomAtivo(catsA.data.map((c) => c.name));
    if (catsP.data) setCustomPassivo(catsP.data.map((c) => c.name));
    if (investRows.data) setInvestTotal(investRows.data.reduce((s, r) => s + Number(r.current_value), 0));
    if (debts.data) setDebtRows(debts.data);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const allCats = kind === 'ativo' ? [...CATS_ATIVO, ...customAtivo] : [...CATS_PASSIVO, ...customPassivo];

  function changeKind(next) {
    setKind(next);
    setCategory((next === 'ativo' ? [...CATS_ATIVO, ...customAtivo] : [...CATS_PASSIVO, ...customPassivo])[0]);
  }

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = toNumber(amount);
    if (!name.trim() || !amt) return;
    const { error } = await sb.from('assets').insert({ name: name.trim(), category, kind, value: amt });
    if (error) { setErro(error.message); return; }
    setName(''); setAmount('');
    load();
  }
  async function remove(row) {
    await sb.from('assets').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, category: row.category, kind: row.kind, value: String(row.value) });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const amt = toNumber(editRow.value);
    if (!editRow.name.trim() || !amt) return;
    const { error } = await sb.from('assets').update({
      name: editRow.name.trim(), category: editRow.category, kind: editRow.kind, value: amt,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const ativos = list.filter((a) => a.kind === 'ativo');
  const passivos = list.filter((a) => a.kind === 'passivo');
  const debtTotal = debtRows.reduce((s, d) => s + Number(d.saldo_devedor), 0);
  const totalAtivos = ativos.reduce((s, a) => s + Number(a.value), 0) + investTotal;
  const totalPassivos = passivos.reduce((s, a) => s + Number(a.value), 0) + debtTotal;
  const patrimonioLiquido = totalAtivos - totalPassivos;

  const ativoCatTotals = {};
  ativos.forEach((a) => { ativoCatTotals[a.category] = (ativoCatTotals[a.category] || 0) + Number(a.value); });
  if (investTotal > 0) ativoCatTotals['Investimentos'] = (ativoCatTotals['Investimentos'] || 0) + investTotal;
  const ativoCatEntries = Object.entries(ativoCatTotals).sort((a, b) => b[1] - a[1]);
  const ativoCatMax = ativoCatEntries.length ? ativoCatEntries[0][1] : 1;

  const passivoCatTotals = {};
  passivos.forEach((a) => { passivoCatTotals[a.category] = (passivoCatTotals[a.category] || 0) + Number(a.value); });
  debtRows.forEach((d) => { passivoCatTotals[d.category] = (passivoCatTotals[d.category] || 0) + Number(d.saldo_devedor); });
  const passivoCatEntries = Object.entries(passivoCatTotals).sort((a, b) => b[1] - a[1]);
  const passivoCatMax = passivoCatEntries.length ? passivoCatEntries[0][1] : 1;

  const sortedList = [...list].sort((a, b) => {
    if (a.kind !== b.kind) return a.kind === 'ativo' ? -1 : 1;
    return Number(b.value) - Number(a.value);
  });

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Patrimônio</h1><div className="page-sub">Tudo que você tem — e tudo que você deve</div></div></div>

      <Banner type="info">
        <strong>Ativo</strong> é tudo que você possui e tem valor — dinheiro em conta, imóvel, veículo. <strong>Passivo</strong> é tudo que você deve — financiamento, empréstimo, dívida no cartão. A diferença entre os dois é o seu <strong>patrimônio líquido</strong>: o que sobraria se você vendesse tudo o que tem e pagasse tudo o que deve, hoje. Suas aplicações (ações, renda fixa, cripto...) entram automaticamente aqui, somadas da aba <strong>Investimentos</strong>, e dívidas com juros cadastradas na aba <strong>Dívidas</strong> entram automaticamente em Passivos — não é preciso cadastrar de novo em nenhum dos dois casos.
      </Banner>

      <div className="card section-gap">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Apartamento, poupança, financiamento..." onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Tipo">
            <select value={kind} onChange={(e) => changeKind(e.target.value)}>
              <option value="ativo">Ativo (o que você tem)</option>
              <option value="passivo">Passivo (o que você deve)</option>
            </select>
          </Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind={kind === 'ativo' ? 'asset' : 'liability'} onCreated={(n) => kind === 'ativo' ? setCustomAtivo((prev) => [...prev, n]) : setCustomPassivo((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="text" inputMode="decimal" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>
      </div>

      <div className={'balance-strip section-gap ' + (patrimonioLiquido >= 0 ? 'pos' : 'neg')}>
        <span className="label">Patrimônio líquido</span><span className="value">{fmtBRL(patrimonioLiquido)}</span>
      </div>
      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total de ativos</p><p className="stat-value money">{fmtBRL(totalAtivos)}</p></div>
        <div className="card"><p className="stat-label">Total de passivos (dívidas)</p><p className="stat-value spend">{fmtBRL(totalPassivos)}</p></div>
      </div>

      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card">
          <h3 className="section-title">Ativos por categoria</h3>
          {ativoCatEntries.length === 0 ? <Empty title="Nenhum ativo cadastrado" body="Adicione contas, imóveis ou outros bens — e cadastre suas aplicações na aba Investimentos." /> : ativoCatEntries.map(([cat, val]) => (
            <div className="bar-row" key={cat}>
              <div className="bar-label">{cat}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / ativoCatMax) * 100) + '%', background: 'var(--money)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)}</div>
            </div>
          ))}
        </div>
        <div className="card">
          <h3 className="section-title">Passivos por categoria</h3>
          {passivoCatEntries.length === 0 ? <Empty title="Nenhum passivo cadastrado" body="Dívidas com juros? Cadastre na aba Dívidas. Algo mais simples? Cadastre aqui mesmo." /> : passivoCatEntries.map(([cat, val]) => (
            <div className="bar-row" key={cat}>
              <div className="bar-label">{cat}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / passivoCatMax) * 100) + '%', background: 'var(--spend)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Itens do patrimônio</h3>
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nada cadastrado ainda" body="Liste suas contas, investimentos, imóveis, veículos e dívidas para ver seu patrimônio líquido." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Descrição</th><th>Tipo</th><th>Categoria</th><th className="num">Valor</th><th></th></tr></thead>
            <tbody>
              {sortedList.map((a) => editingId === a.id ? (
                <tr className="row-hover" key={a.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td>
                    <select value={editRow.kind} onChange={(ev) => setEditRow({ ...editRow, kind: ev.target.value, category: (ev.target.value === 'ativo' ? [...CATS_ATIVO, ...customAtivo] : [...CATS_PASSIVO, ...customPassivo])[0] })} style={{ width: 'auto' }}>
                      <option value="ativo">Ativo</option>
                      <option value="passivo">Passivo</option>
                    </select>
                  </td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={editRow.kind === 'ativo' ? [...CATS_ATIVO, ...customAtivo] : [...CATS_PASSIVO, ...customPassivo]} kind={editRow.kind === 'ativo' ? 'asset' : 'liability'} onCreated={(n) => editRow.kind === 'ativo' ? setCustomAtivo((prev) => [...prev, n]) : setCustomPassivo((prev) => [...prev, n])} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.value} onChange={(ev) => setEditRow({ ...editRow, value: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(a.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={a.id}>
                  <td>{a.name}</td>
                  <td><span className={'pill ' + (a.kind === 'ativo' ? 'money' : 'spend')}>{a.kind === 'ativo' ? 'Ativo' : 'Passivo'}</span></td>
                  <td><span className="pill">{a.category}</span></td>
                  <td className="num">{fmtBRL(a.value)}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(a)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(a)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Investimentos ----------
function InvestimentosTab() {
  const [list, setList] = useState([]);
  const [dividends, setDividends] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [type, setType] = useState(CATS_INVEST[0]);
  const [broker, setBroker] = useState('');
  const [investedValue, setInvestedValue] = useState('');
  const [currentValue, setCurrentValue] = useState('');
  const [customTypes, setCustomTypes] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  // ---------- Proventos: histórico completo (data + valor) por investimento,
  // não só um total acumulado — é isso que permite mostrar o retorno TOTAL
  // (valorização de preço + provento recebido), não só o preço. ----------
  const [expandedDividends, setExpandedDividends] = useState(() => new Set());
  const [divDate, setDivDate] = useState(todayLocalISO());
  const [divAmount, setDivAmount] = useState('');
  const [divNotes, setDivNotes] = useState('');

  async function load() {
    setLoading(true);
    const [rows, cats, divs] = await Promise.all([
      sb.from('investments').select('*').order('created_at', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'investment').order('created_at'),
      sb.from('investment_dividends').select('*').order('received_date', { ascending: false }),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomTypes(cats.data.map((c) => c.name));
    if (divs.data) setDividends(divs.data);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function toggleDividends(id) {
    setExpandedDividends((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }
  async function addDividend(investmentId) {
    const amt = toNumber(divAmount);
    if (!amt || !divDate) return;
    const { error } = await sb.from('investment_dividends').insert({
      investment_id: investmentId, received_date: divDate, amount: amt, notes: divNotes.trim() || null,
    });
    if (error) { setErro(error.message); return; }
    setDivAmount(''); setDivNotes('');
    load();
  }
  async function removeDividend(id) {
    await sb.from('investment_dividends').delete().eq('id', id);
    load();
  }

  const allTypes = [...CATS_INVEST, ...customTypes];

  async function handleAdd(ev) {
    ev.preventDefault();
    const invested = toNumber(investedValue);
    const current = toNumber(currentValue);
    if (!name.trim() || !invested) return;
    const { error } = await sb.from('investments').insert({
      name: name.trim(), type, broker: broker.trim() || null, invested_value: invested, current_value: current || invested,
    });
    if (error) { setErro(error.message); return; }
    setName(''); setBroker(''); setInvestedValue(''); setCurrentValue('');
    load();
  }
  async function remove(row) {
    await sb.from('investments').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, type: row.type, broker: row.broker || '', investedValue: String(row.invested_value), currentValue: String(row.current_value) });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const invested = toNumber(editRow.investedValue);
    const current = toNumber(editRow.currentValue);
    if (!editRow.name.trim() || !invested) return;
    const { error } = await sb.from('investments').update({
      name: editRow.name.trim(), type: editRow.type, broker: editRow.broker.trim() || null,
      invested_value: invested, current_value: current || invested,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const totalInvestido = list.reduce((s, i) => s + Number(i.invested_value), 0);
  const totalAtual = list.reduce((s, i) => s + Number(i.current_value), 0);
  const totalDividendos = dividends.reduce((s, d) => s + Number(d.amount), 0);
  const resultadoCapital = totalAtual - totalInvestido;
  const resultadoTotal = resultadoCapital + totalDividendos;
  const rentabilidadeCapital = totalInvestido > 0 ? (resultadoCapital / totalInvestido) * 100 : 0;
  const rentabilidadeTotal = totalInvestido > 0 ? (resultadoTotal / totalInvestido) * 100 : 0;

  const typeTotals = {};
  list.forEach((i) => { typeTotals[i.type] = (typeTotals[i.type] || 0) + Number(i.current_value); });
  const typeEntries = Object.entries(typeTotals).sort((a, b) => b[1] - a[1]);
  const typeMax = typeEntries.length ? typeEntries[0][1] : 1;

  const sortedList = [...list].sort((a, b) => Number(b.current_value) - Number(a.current_value));

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Investimentos</h1><div className="page-sub">Sua carteira, tudo num só lugar</div></div></div>

      <Banner type="info">
        Cadastre cada posição com o quanto você já investiu (aporte) e o valor atual dela hoje. O app calcula sozinho o resultado e a rentabilidade — e o total aparece automaticamente na aba <strong>Patrimônio</strong>, dentro de Ativos. Registre também os proventos/dividendos recebidos em cada posição (mesmo os que caíram na conta e não foram reinvestidos) — sem isso, um investimento que já te deu lucro em dividendo pode aparecer "no vermelho" só porque o preço caiu.
      </Banner>

      <div className="card section-gap">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Nome do investimento"><input required value={name} placeholder="Tesouro Selic 2029, PETR4..." onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Tipo"><CategorySelect value={type} onChange={setType} options={allTypes} kind="investment" onCreated={(n) => setCustomTypes((prev) => [...prev, n])} /></Field>
          <Field label="Corretora (opcional)"><input value={broker} placeholder="XP, Nubank..." onChange={(e) => setBroker(e.target.value)} /></Field>
          <Field label="Valor investido (R$)"><input required type="text" inputMode="decimal" value={investedValue} placeholder="0,00" onChange={(e) => setInvestedValue(e.target.value)} /></Field>
          <Field label="Valor atual (R$)"><input type="text" inputMode="decimal" value={currentValue} placeholder="igual ao investido" onChange={(e) => setCurrentValue(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>
      </div>

      <div className={'balance-strip section-gap ' + (resultadoTotal >= 0 ? 'pos' : 'neg')}>
        <span className="label">Resultado total (valorização + proventos)</span><span className="value">{fmtBRL(resultadoTotal)}</span>
      </div>
      <div className="grid grid-4" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total investido</p><p className="stat-value">{fmtBRL(totalInvestido)}</p></div>
        <div className="card"><p className="stat-label">Valor atual (patrimônio investido)</p><p className="stat-value money">{fmtBRL(totalAtual)}</p></div>
        <div className="card"><p className="stat-label">Proventos recebidos</p><p className="stat-value money">{fmtBRL(totalDividendos)}</p></div>
        <div className="card">
          <p className="stat-label">Rentabilidade total</p>
          <p className={'stat-value ' + (rentabilidadeTotal >= 0 ? 'money' : 'spend')}>{rentabilidadeTotal >= 0 ? '+' : ''}{rentabilidadeTotal.toFixed(2)}%</p>
          <p className="page-sub" style={{ margin: '2px 0 0' }}>dos quais {rentabilidadeCapital >= 0 ? '+' : ''}{rentabilidadeCapital.toFixed(2)}% em valorização de preço</p>
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Alocação por tipo</h3>
        {typeEntries.length === 0 ? <Empty title="Nenhum investimento cadastrado" body="Adicione ações, fundos, renda fixa, cripto ou qualquer outra aplicação." /> : typeEntries.map(([t, val]) => (
          <div className="bar-row" key={t}>
            <div className="bar-label">{t}</div>
            <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / typeMax) * 100) + '%', background: 'var(--money)' }}></div></div>
            <div className="bar-value">{fmtBRL(val)}</div>
          </div>
        ))}
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Suas posições</h3>
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nada cadastrado ainda" body="Liste suas ações, fundos, renda fixa e outras aplicações para ver sua carteira consolidada." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Nome</th><th>Tipo</th><th>Corretora</th><th className="num">Investido</th><th className="num">Atual</th><th className="num">Proventos</th><th className="num">Rentab. total</th><th></th></tr></thead>
            <tbody>
              {sortedList.map((i) => {
                const ret = investmentTotalReturn(i, dividends);
                const myDividends = dividends.filter((d) => d.investment_id === i.id);
                const isExpanded = expandedDividends.has(i.id);
                return editingId === i.id ? (
                <tr className="row-hover" key={i.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.type} onChange={(v) => setEditRow({ ...editRow, type: v })} options={allTypes} kind="investment" onCreated={(n) => setCustomTypes((prev) => [...prev, n])} /></td>
                  <td><input value={editRow.broker} onChange={(ev) => setEditRow({ ...editRow, broker: ev.target.value })} style={{ width: 90 }} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.investedValue} onChange={(ev) => setEditRow({ ...editRow, investedValue: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.currentValue} onChange={(ev) => setEditRow({ ...editRow, currentValue: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td className="num">—</td>
                  <td className="num">—</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(i.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <React.Fragment key={i.id}>
                <tr className="row-hover">
                  <td>{i.name}</td>
                  <td><span className="pill">{i.type}</span></td>
                  <td>{i.broker || '—'}</td>
                  <td className="num">{fmtBRL(i.invested_value)}</td>
                  <td className="num">{fmtBRL(i.current_value)}</td>
                  <td className="num">
                    <button className="icon-btn" onClick={() => toggleDividends(i.id)}>{fmtBRL(ret.gainDividends)} {isExpanded ? '▲' : '▼'}</button>
                  </td>
                  <td className="num">
                    <span className={ret.pctTotal >= 0 ? 'money' : 'spend'}>{ret.pctTotal >= 0 ? '+' : ''}{ret.pctTotal.toFixed(2)}%</span>
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(i)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(i)}>Remover</button>
                  </td>
                </tr>
                {isExpanded && (
                  <tr>
                    <td colSpan="8" style={{ background: 'var(--paper-alt, rgba(0,0,0,0.02))', padding: '10px 14px' }}>
                      <div style={{ fontWeight: 500, marginBottom: 6 }}>Proventos de {i.name}</div>
                      {myDividends.length === 0 ? (
                        <div className="page-sub" style={{ margin: '0 0 8px' }}>Nenhum provento registrado ainda.</div>
                      ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 10 }}>
                          {myDividends.map((d) => (
                            <div key={d.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }}>
                              <span style={{ fontFamily: 'var(--font-mono)', color: 'var(--ink-faint)' }}>{new Date(d.received_date + 'T00:00:00').toLocaleDateString('pt-BR')}</span>
                              <span className="money" style={{ fontFamily: 'var(--font-mono)' }}>{fmtBRL(d.amount)}</span>
                              {d.notes && <span className="page-sub" style={{ margin: 0 }}>{d.notes}</span>}
                              <button className="icon-btn" onClick={() => removeDividend(d.id)}>Remover</button>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'flex-end' }}>
                        <Field label="Data"><input type="date" value={divDate} onChange={(e) => setDivDate(e.target.value)} style={{ width: 140 }} /></Field>
                        <Field label="Valor (R$)"><input type="text" inputMode="decimal" value={divAmount} placeholder="0,00" onChange={(e) => setDivAmount(e.target.value)} style={{ width: 100 }} /></Field>
                        <Field label="Nota (opcional)"><input value={divNotes} placeholder="ex: dividendo trimestral" onChange={(e) => setDivNotes(e.target.value)} style={{ width: 180 }} /></Field>
                        <button type="button" className="btn" onClick={() => addDividend(i.id)}>Registrar provento</button>
                      </div>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
              })}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Metas ----------
function MetasTab() {
  const [goals, setGoals] = useState([]);
  const [assets, setAssets] = useState([]);
  const [fixedExpenses, setFixedExpenses] = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [expenseEntries, setExpenseEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);

  const [name, setName] = useState('');
  const [targetValue, setTargetValue] = useState('');
  const [targetDate, setTargetDate] = useState('');
  const [currentValue, setCurrentValue] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  const [reservaInput, setReservaInput] = useState('');
  const [editingReserva, setEditingReserva] = useState(false);
  const [reservaEditValue, setReservaEditValue] = useState('');

  async function load() {
    setLoading(true);
    const [g, a, fx, pur, exp] = await Promise.all([
      sb.from('goals').select('*').order('created_at', { ascending: false }),
      sb.from('assets').select('*'),
      sb.from('fixed_expenses').select('*'),
      sb.from('card_purchases').select('*'),
      sb.from('expense_entries').select('*'),
    ]);
    if (g.error) setErro(g.error.message); else setGoals(g.data || []);
    setAssets(a.data || []);
    setFixedExpenses(fx.data || []);
    setPurchases(pur.data || []);
    setExpenseEntries(exp.data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const reservaAtual = assets.filter((x) => x.kind === 'ativo' && x.category === 'Reserva de emergência').reduce((s, x) => s + Number(x.value), 0);
  const reservaGoal = goals.find((g) => g.kind === 'reserva');
  const customGoals = goals.filter((g) => g.kind === 'meta');

  // Sugestão de alvo pra reserva: 6x a média de despesas dos últimos 3 meses.
  const nowKey = monthKey(new Date());
  const last3 = [shiftMonth(nowKey, -2), shiftMonth(nowKey, -1), nowKey];
  const avgDespesa = last3.reduce((s, m) => s + fixedContributionForMonth(fixedExpenses, expenseEntries, m) + allCardsTotalForMonth(purchases, m) + nonCardExpenseTotalForMonth(expenseEntries, m), 0) / 3;
  const sugestaoReserva = avgDespesa * 6;

  async function criarReserva(ev) {
    ev.preventDefault();
    const alvo = toNumber(reservaInput) || sugestaoReserva;
    if (!alvo) return;
    const { error } = await sb.from('goals').insert({ name: 'Reserva de emergência', kind: 'reserva', target_value: alvo, current_value: 0 });
    if (error) { setErro(error.message); return; }
    load();
  }
  function startEditReserva() {
    setEditingReserva(true);
    setReservaEditValue(String(reservaGoal.target_value));
  }
  async function saveReserva() {
    const alvo = toNumber(reservaEditValue);
    if (!alvo) return;
    const { error } = await sb.from('goals').update({ target_value: alvo }).eq('id', reservaGoal.id);
    if (error) { setErro(error.message); return; }
    setEditingReserva(false);
    load();
  }

  async function handleAdd(ev) {
    ev.preventDefault();
    const alvo = toNumber(targetValue);
    const atual = toNumber(currentValue) || 0;
    if (!name.trim() || !alvo) return;
    const { error } = await sb.from('goals').insert({ name: name.trim(), kind: 'meta', target_value: alvo, target_date: targetDate || null, current_value: atual });
    if (error) { setErro(error.message); return; }
    setName(''); setTargetValue(''); setTargetDate(''); setCurrentValue('');
    load();
  }
  async function remove(row) {
    await sb.from('goals').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, targetValue: String(row.target_value), targetDate: row.target_date || '', currentValue: String(row.current_value) });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const alvo = toNumber(editRow.targetValue);
    const atual = toNumber(editRow.currentValue) || 0;
    if (!editRow.name.trim() || !alvo) return;
    const { error } = await sb.from('goals').update({
      name: editRow.name.trim(), target_value: alvo, target_date: editRow.targetDate || null, current_value: atual,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  function ProgressBar({ atual, alvo }) {
    const pct = alvo > 0 ? Math.min(100, (atual / alvo) * 100) : 0;
    return (
      <div className="bar-track" style={{ height: 10 }}>
        <div className="bar-fill" style={{ width: Math.round(pct) + '%', background: 'var(--money)' }}></div>
      </div>
    );
  }

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Metas</h1><div className="page-sub">Reserva de emergência e seus objetivos</div></div></div>

      <Banner type="info">
        Defina um valor-alvo e acompanhe o progresso. A <strong>Reserva de emergência</strong> é especial: o valor guardado vem automaticamente da aba Patrimônio (você edita por lá) — aqui você só define a meta. Já as outras metas (viagem, carro, entrada de imóvel...) você atualiza direto aqui.
      </Banner>

      {erro && <Banner type="error">{erro}</Banner>}

      <div className="card section-gap">
        <h3 className="section-title">Reserva de emergência</h3>
        {!reservaGoal ? (
          <form onSubmit={criarReserva}>
            <p style={{ color: 'var(--ink-soft)', fontSize: 14, marginBottom: 10 }}>
              Sugestão: 6 vezes sua despesa média mensal (últimos 3 meses) = <strong>{fmtBRL(sugestaoReserva)}</strong>. Pode ajustar antes de criar.
            </p>
            <div className="entry-form cols-6">
              <Field label="Valor-alvo (R$)"><input type="text" inputMode="decimal" value={reservaInput} placeholder={fmtBRL(sugestaoReserva)} onChange={(e) => setReservaInput(e.target.value)} /></Field>
              <button type="submit" className="btn">Criar meta de reserva</button>
            </div>
          </form>
        ) : (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8, flexWrap: 'wrap', gap: 8 }}>
              <span style={{ fontFamily: 'var(--font-mono)' }}>{fmtBRL(reservaAtual)} <span style={{ color: 'var(--ink-faint)' }}>de</span> {editingReserva ? (
                <input type="text" inputMode="decimal" value={reservaEditValue} onChange={(e) => setReservaEditValue(e.target.value)} style={{ width: 110, display: 'inline-block' }} />
              ) : fmtBRL(reservaGoal.target_value)}</span>
              <span>
                {reservaGoal.target_value > 0 && <span className="pill money">{Math.round(Math.min(100, (reservaAtual / reservaGoal.target_value) * 100))}% coberto</span>}
                {' '}
                {editingReserva ? (
                  <>
                    <button className="icon-btn" onClick={saveReserva}>Salvar</button>
                    <button className="icon-btn" onClick={() => setEditingReserva(false)}>Cancelar</button>
                  </>
                ) : (
                  <>
                    <button className="icon-btn" onClick={startEditReserva}>Editar alvo</button>
                    <button className="icon-btn" onClick={() => remove(reservaGoal)}>Remover</button>
                  </>
                )}
              </span>
            </div>
            <ProgressBar atual={reservaAtual} alvo={reservaGoal.target_value} />
            {reservaAtual < reservaGoal.target_value && (
              <p style={{ color: 'var(--ink-faint)', fontSize: 13, marginTop: 8 }}>Faltam {fmtBRL(reservaGoal.target_value - reservaAtual)} — edite o valor guardado na aba Patrimônio, categoria "Reserva de emergência".</p>
            )}
          </div>
        )}
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Nova meta</h3>
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Nome"><input required value={name} placeholder="Viagem, carro, entrada do apê..." onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Valor-alvo (R$)"><input required type="text" inputMode="decimal" value={targetValue} placeholder="0,00" onChange={(e) => setTargetValue(e.target.value)} /></Field>
          <Field label="Data-alvo (opcional)"><input type="date" value={targetDate} onChange={(e) => setTargetDate(e.target.value)} /></Field>
          <Field label="Já guardado (R$)"><input type="text" inputMode="decimal" value={currentValue} placeholder="0,00" onChange={(e) => setCurrentValue(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>
      </div>

      <div className="section-gap">
        {loading ? <Banner type="info">Carregando...</Banner> : customGoals.length === 0 ? (
          <div className="card"><Empty title="Nenhuma meta cadastrada ainda" body="Adicione objetivos como viagem, carro ou entrada de imóvel para acompanhar o progresso." /></div>
        ) : customGoals.map((g) => (
          <div className="card" key={g.id} style={{ marginBottom: 14 }}>
            {editingId === g.id ? (
              <div>
                <div className="entry-form cols-6" style={{ marginBottom: 10 }}>
                  <Field label="Nome"><input value={editRow.name} onChange={(e) => setEditRow({ ...editRow, name: e.target.value })} /></Field>
                  <Field label="Valor-alvo (R$)"><input type="text" inputMode="decimal" value={editRow.targetValue} onChange={(e) => setEditRow({ ...editRow, targetValue: e.target.value })} /></Field>
                  <Field label="Data-alvo"><input type="date" value={editRow.targetDate} onChange={(e) => setEditRow({ ...editRow, targetDate: e.target.value })} /></Field>
                  <Field label="Já guardado (R$)"><input type="text" inputMode="decimal" value={editRow.currentValue} onChange={(e) => setEditRow({ ...editRow, currentValue: e.target.value })} /></Field>
                </div>
                <button className="icon-btn" onClick={() => saveEdit(g.id)}>Salvar</button>
                <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
              </div>
            ) : (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8, flexWrap: 'wrap', gap: 8 }}>
                  <div>
                    <strong>{g.name}</strong>{' '}
                    <span style={{ fontFamily: 'var(--font-mono)', color: 'var(--ink-soft)' }}>{fmtBRL(g.current_value)} de {fmtBRL(g.target_value)}</span>
                  </div>
                  <span>
                    <span className="pill money">{Math.round(Math.min(100, (g.current_value / g.target_value) * 100))}%</span>{' '}
                    <button className="icon-btn" onClick={() => startEdit(g)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(g)}>Remover</button>
                  </span>
                </div>
                <ProgressBar atual={g.current_value} alvo={g.target_value} />
                {g.target_date && (() => {
                  const meses = monthsUntil(g.target_date);
                  const falta = Math.max(0, g.target_value - g.current_value);
                  return meses > 0 && falta > 0 ? (
                    <p style={{ color: 'var(--ink-faint)', fontSize: 13, marginTop: 8 }}>Guarde {fmtBRL(falta / meses)}/mês para chegar lá até {new Date(g.target_date + 'T00:00:00').toLocaleDateString('pt-BR')}.</p>
                  ) : falta === 0 ? (
                    <p style={{ color: 'var(--money-strong)', fontSize: 13, marginTop: 8 }}>Meta atingida! 🎉</p>
                  ) : (
                    <p style={{ color: 'var(--spend-strong)', fontSize: 13, marginTop: 8 }}>Data-alvo já passou — hora de revisar o prazo ou o valor.</p>
                  );
                })()}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Dívidas ----------
function DividasTab() {
  const [list, setList] = useState([]);
  const [customCats, setCustomCats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);

  const [name, setName] = useState('');
  const [category, setCategory] = useState(CATS_PASSIVO[0]);
  const [saldoDevedor, setSaldoDevedor] = useState('');
  const [taxaJuros, setTaxaJuros] = useState('');
  const [pagamentoMinimo, setPagamentoMinimo] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);
  const [extraMensal, setExtraMensal] = useState('');

  const allCats = [...CATS_PASSIVO, ...customCats];

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('debts').select('*').order('created_at', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'liability').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleAdd(ev) {
    ev.preventDefault();
    const saldo = toNumber(saldoDevedor);
    const taxa = toNumber(taxaJuros);
    const minimo = toNumber(pagamentoMinimo);
    if (!name.trim() || !saldo || !minimo) return;
    const { error } = await sb.from('debts').insert({
      name: name.trim(), category, saldo_devedor: saldo, taxa_juros: taxa || 0, pagamento_minimo: minimo,
    });
    if (error) { setErro(error.message); return; }
    setName(''); setSaldoDevedor(''); setTaxaJuros(''); setPagamentoMinimo('');
    load();
  }
  async function remove(row) {
    await sb.from('debts').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, category: row.category, saldoDevedor: String(row.saldo_devedor), taxaJuros: String(row.taxa_juros), pagamentoMinimo: String(row.pagamento_minimo) });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const saldo = toNumber(editRow.saldoDevedor);
    const taxa = toNumber(editRow.taxaJuros);
    const minimo = toNumber(editRow.pagamentoMinimo);
    if (!editRow.name.trim() || !saldo || !minimo) return;
    const { error } = await sb.from('debts').update({
      name: editRow.name.trim(), category: editRow.category, saldo_devedor: saldo, taxa_juros: taxa || 0, pagamento_minimo: minimo,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const totalDevido = list.reduce((s, d) => s + Number(d.saldo_devedor), 0);
  const totalMinimo = list.reduce((s, d) => s + Number(d.pagamento_minimo), 0);
  const extra = toNumber(extraMensal) || 0;
  const neve = list.length >= 1 ? simulateQuitacao(list, extra, 'neve') : null;
  const avalanche = list.length >= 1 ? simulateQuitacao(list, extra, 'avalanche') : null;
  const nameById = (id) => { const d = list.find((x) => x.id === id); return d ? d.name : '?'; };

  function StrategyCard({ title, result, hint }) {
    return (
      <div className="card">
        <h3 className="section-title">{title}</h3>
        {result.estourou ? (
          <Banner type="error">Com esses valores, pelo menos uma dívida nunca se paga sozinha (o juro do mês supera o pagamento mínimo). Aumente o pagamento mínimo ou o aporte extra.</Banner>
        ) : (
          <div>
            <div className="grid grid-2" style={{ marginBottom: 14 }}>
              <div><p className="stat-label">Tempo até quitar tudo</p><p className="stat-value">{result.meses} {result.meses === 1 ? 'mês' : 'meses'}</p></div>
              <div><p className="stat-label">Total pago em juros</p><p className="stat-value spend">{fmtBRL(result.totalJuros)}</p></div>
            </div>
            <p style={{ fontSize: 13, color: 'var(--ink-soft)' }}>Ordem sugerida: {result.ordem.map(nameById).join(' → ')}</p>
          </div>
        )}
        <p style={{ fontSize: 12, color: 'var(--ink-faint)', marginTop: 10 }}>{hint}</p>
      </div>
    );
  }

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Dívidas</h1><div className="page-sub">Taxa de juros, pagamento mínimo e o melhor caminho pra sair delas</div></div></div>

      <Banner type="info">
        Cadastre dívidas com juros (cartão, empréstimo, financiamento) aqui pra ver quanto elas custam de verdade e comparar estratégias de quitação. O saldo somado entra automaticamente em Patrimônio, dentro de Passivos (por categoria) — sem precisar cadastrar de novo. Pra um débito simples, sem juros pra acompanhar, continue usando o formulário de Passivo lá em Patrimônio.
      </Banner>

      <div className="card section-gap">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Cartão Nubank, financiamento do carro..." onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="liability" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Saldo devedor (R$)"><input required type="text" inputMode="decimal" value={saldoDevedor} placeholder="0,00" onChange={(e) => setSaldoDevedor(e.target.value)} /></Field>
          <Field label="Juros (% ao mês)"><input type="text" inputMode="decimal" value={taxaJuros} placeholder="0,00" onChange={(e) => setTaxaJuros(e.target.value)} /></Field>
          <Field label="Pagamento mínimo (R$)"><input required type="text" inputMode="decimal" value={pagamentoMinimo} placeholder="0,00" onChange={(e) => setPagamentoMinimo(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>
      </div>

      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total devido</p><p className="stat-value spend">{fmtBRL(totalDevido)}</p></div>
        <div className="card"><p className="stat-label">Soma dos pagamentos mínimos</p><p className="stat-value">{fmtBRL(totalMinimo)}</p></div>
      </div>

      {list.length === 0 ? (

              <StrategyCard title="⛰️ Avalanche" result={avalanche} hint="Ataca primeiro a dívida de maior taxa de juros. Matematicamente é a rota mais barata no total pago em juros." />

                  <td className="num"><input type="text" inputMode="decimal" value={editRow.taxaJuros} onChange={(ev) => setEditRow({ ...editRow, taxaJuros: ev.target.value })} style={{ width: 70, textAlign: 'right' }} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.pagamentoMinimo} onChange={(ev) => setEditRow({ ...editRow, pagamentoMinimo: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
