  const [aviso, setAviso] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingBiometria, setLoadingBiometria] = useState(false);
  const [openDoc, setOpenDoc] = useState(null);
  const [showResend, setShowResend] = useState(false);
  const [resending, setResending] = useState(false);
  // Só mostra o botão se o navegador/aparelho suporta WebAuthn de verdade
  // (a maioria dos celulares e computadores modernos suporta).
  const suportaBiometria = typeof window !== 'undefined' && !!window.PublicKeyCredential;

  async function handleSubmit(ev) {
    ev.preventDefault();
    setErro(null); setAviso(null); setShowResend(false);
    if (mode === 'signup' && !agreed) {
      setErro('Para criar sua conta, é preciso ler e aceitar a Política de Privacidade e os Termos de Uso.');
      return;
    }
    setLoading(true);
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      setLoading(false);
      if (error) {
        if (error.code === 'email_not_confirmed' || error.message.includes('Email not confirmed')) {
          setErro('Sua conta ainda não foi confirmada. Procure o e-mail de confirmação (às vezes ele cai na caixa de spam/lixo eletrônico), ou peça um novo abaixo.');
          setShowResend(true);
        } else {
          setErro(error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : error.message);
        }
      }
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: senha });
      setLoading(false);
      if (error) { setErro(error.message); return; }
      if (data.session) return;
      setAviso('Conta criada. Verifique seu e-mail para confirmar antes de entrar.');
      setShowResend(true);
    }
  }

  async function handleResend() {
    if (!email) { setErro('Digite o e-mail da conta para reenviar a confirmação.'); return; }
    setResending(true);
    setErro(null);
    const { error } = await sb.auth.resend({ type: 'signup', email });
    setResending(false);
    if (error) setErro('Não foi possível reenviar: ' + error.message);
    else setAviso('E-mail de confirmação reenviado.');
  }

  async function handleBiometria() {
    setErro(null); setAviso(null);
    setLoadingBiometria(true);

    setLoadingBiometria(false);
    if (error) {
      const mensagens = {
        passkey_disabled: 'Login por biometria ainda não está ativado neste sistema.',
        webauthn_credential_not_found: 'Nenhuma biometria cadastrada neste aparelho. Entre com e-mail e senha e ative a biometria depois, na aba Privacidade.',
        webauthn_challenge_expired: 'Demorou demais para confirmar. Tenta de novo.',
      };
      setErro(mensagens[error.code] || 'Não foi possível entrar com biometria. Tenta com e-mail e senha.');
      return;
    }
    // sucesso: o onAuthStateChange do AuthGate já pega a nova sessão sozinho
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--paper)', padding: 20 }}>
      <div className="card auth-card" style={{ width: '100%', maxWidth: 380 }}>
        <div style={{ textAlign: 'center', marginBottom: 24 }}>
          <img src="logo-icon.png" alt="Tonus" style={{ height: 40, margin: '0 auto 14px', display: 'block' }} />
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 24, fontWeight: 600, marginBottom: 2 }}>Tonus Financeiro</div>
          <div className="page-sub">{mode === 'login' ? 'Entrar na sua conta' : 'Criar uma conta'}</div>
        </div>
        {erro && <Banner type="error">{erro}</Banner>}
        {aviso && <Banner type="success">{aviso}</Banner>}
        {aviso && (
          <Banner type="info">
            📩 Não achou o e-mail na caixa de entrada? Dá uma olhada na caixa de <strong>spam/lixo eletrônico</strong> — é comum esse tipo de e-mail cair lá.
          </Banner>
        )}
        {showResend && (
          <button type="button" className="btn ghost" style={{ width: '100%', marginBottom: 14 }} onClick={handleResend} disabled={resending}>
            {resending ? 'Reenviando...' : 'Reenviar e-mail de confirmação'}
          </button>
        )}
        {mode === 'login' && suportaBiometria && (
          <React.Fragment>
            <button type="button" className="btn btn-hero" onClick={handleBiometria} disabled={loadingBiometria}>
              {loadingBiometria ? 'Verificando...' : '🔐 Entrar com biometria'}
            </button>
            <div className="auth-divider">ou entre com e-mail e senha</div>
          </React.Fragment>
        )}
        <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Field label="E-mail">
            <input type="email" required value={email} placeholder="voce@email.com" onChange={(e) => setEmail(e.target.value)} />
          </Field>
          <Field label="Senha">
            <input type="password" required minLength={6} value={senha} placeholder="••••••••" onChange={(e) => setSenha(e.target.value)} />
          </Field>
          {mode === 'signup' && (
            <label className="consent-row">
              <input type="checkbox" checked={agreed} onChange={(e) => setAgreed(e.target.checked)} />
              <span>
                Li e aceito a{' '}
                <a href="#" onClick={(e) => { e.preventDefault(); setOpenDoc('privacy'); }} style={{ color: 'var(--cover)' }}>Política de Privacidade</a>
                {' '}e os{' '}
                <a href="#" onClick={(e) => { e.preventDefault(); setOpenDoc('terms'); }} style={{ color: 'var(--cover)' }}>Termos de Uso</a>.
              </span>
            </label>
          )}
          <button type="submit" className="btn btn-hero" disabled={loading}>
            {loading ? 'Enviando...' : mode === 'login' ? 'Entrar' : 'Criar conta'}
          </button>
        </form>
        <button className="icon-btn" style={{ marginTop: 14, width: '100%', textAlign: 'center' }} onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setErro(null); setAviso(null); }}>
          {mode === 'login' ? 'Não tem conta? Criar uma' : 'Já tem conta? Entrar'}
        </button>
      </div>
      <PolicyModal doc={openDoc} onClose={() => setOpenDoc(null)} />
    </div>
  );
}

function AuthGate({ children }) {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    if (!supabaseReady) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (!supabaseReady) {
    return (
      <div style={{ maxWidth: 520, margin: '60px auto', padding: '0 20px' }}>
        <Banner type="info">Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do script, dentro do index.html, para habilitar o login.</Banner>
      </div>
    );
  }
  if (session === undefined) return null;
  if (session === null) return <LoginScreen />;
  return children(session);
}

// ---------- Carregamento resiliente de bibliotecas via CDN ----------
// jsPDF e SheetJS/XLSX são carregados por <script> no <head>. Na grande
// maioria das vezes isso já basta, mas em conexões instáveis (principalmente
// no celular) aquele script específico pode falhar sem travar o resto da
// página — aí o botão fica ali, clicável, e só na hora de usar a gente
// descobre que a lib não chegou. Em vez de simplesmente falhar, tenta
// carregar a lib de novo, na hora, antes de desistir.
function ensureLibLoaded(checkFn, src, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    if (checkFn()) { resolve(); return; }
    let settled = false;
    const script = document.createElement('script');
    script.src = src;
    script.onload = () => {
      if (settled) return;
      settled = true;
      if (checkFn()) resolve();
      else reject(new Error('A biblioteca não carregou corretamente — verifique sua conexão e tente de novo.'));
    };
    script.onerror = () => {
      if (settled) return;
      settled = true;
      reject(new Error('Não foi possível carregar a biblioteca — verifique sua conexão e tente de novo.'));
    };
    document.head.appendChild(script);
    setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error('A biblioteca demorou demais para carregar — verifique sua conexão e tente de novo.'));
    }, timeoutMs);
  });
}

// ---------- Relatório mensal em PDF (botão no Dashboard) ----------
// Não recalcula nada: só desenha, em PDF, números que o Dashboard já
// calculou pra tela (mesma fonte da verdade, sem duplicar lógica de
// negócio). Roda inteiro no navegador via jsPDF (CDN), sem servidor nem
// serviço pago por trás — mesma filosofia do export de dados da aba
// Privacidade.
function buildRelatorioMensalPdf(jsPDFCtor, fmtBRLFn, params) {
  const { mesLabel, geradoEm, inc, fixed, variableTotal, cardsTotal, balance, comprometimento, taxaPoupanca, categoryEntries, alerts, upcoming } = params;
  const doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
  const marginX = 48;
  const pageHeight = doc.internal.pageSize.getHeight();
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 56;

  function ensureSpace(next) {
    if (y + next > pageHeight - 48) { doc.addPage(); y = 56; }
  }
  function h1(text) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(27, 58, 92);
    doc.text(text, marginX, y); y += 22;
  }
  function h2(text) {
    ensureSpace(28);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(27, 58, 92);
    doc.text(text, marginX, y); y += 16;
    doc.setDrawColor(228, 223, 211); doc.line(marginX, y - 10, pageWidth - marginX, y - 10);
  }
  function row(label, value) {
    ensureSpace(16);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(20, 20, 20);
    doc.text(String(label), marginX, y);
    doc.setFont('helvetica', 'bold');
    doc.text(String(value), pageWidth - marginX, y, { align: 'right' });
    y += 15;
  }
  function sub(text) {
    ensureSpace(14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(120, 120, 120);
    doc.text(text, marginX, y); y += 16;
  }

  h1('Tonus Financeiro — Relatório mensal');
  sub(`${mesLabel} · gerado em ${geradoEm}`);
  y += 6;

  h2('Resumo do mês');
  row('Receitas', fmtBRLFn(inc));
  row('Despesas fixas', fmtBRLFn(fixed));
  row('Despesas variáveis', fmtBRLFn(variableTotal));
  row('Faturas de cartão', fmtBRLFn(cardsTotal));
  row('Saldo do mês', fmtBRLFn(balance));
  y += 6;

  h2('Saúde financeira');
  row('Comprometimento de renda', comprometimento == null ? '—' : comprometimento.toFixed(0) + '%');
  row('Taxa de poupança', taxaPoupanca == null ? '—' : taxaPoupanca.toFixed(0) + '%');
  y += 6;

  h2('Gastos por categoria');
  if (categoryEntries.length === 0) {
    sub('Nada lançado neste mês.');
  } else {
    const despesaTotalMes = categoryEntries.reduce((s, [, v]) => s + v, 0);
    categoryEntries.forEach(([cat, val]) => {
      const pct = despesaTotalMes > 0 ? (val / despesaTotalMes) * 100 : 0;
      row(cat, `${fmtBRLFn(val)}  (${pct.toFixed(0)}%)`);
    });
  }
  y += 6;

  if (alerts.length > 0) {
    h2('Alertas de variação');
    alerts.forEach((a) => {
      row(a.cat, `${fmtBRLFn(a.val)} (${a.pct > 0 ? '+' : ''}${a.pct.toFixed(0)}% vs média)`);
    });
    y += 6;
  }

  if (upcoming.length > 0) {
    h2('Próximos vencimentos');
    upcoming.forEach((u) => {
      const dataFmt = new Date(u.date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      row(`${dataFmt} — ${u.name}`, fmtBRLFn(u.amount));
    });
  }

  return doc;
}

// ---------- Dashboard ----------
function DashboardTab() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [dashMonth, setDashMonth] = useState(monthKey(new Date()));
  const [downloadingPdf, setDownloadingPdf] = useState(false);
  const [pdfError, setPdfError] = useState(null);

  useEffect(() => {
    let active = true;
    (async () => {
      const [fx, inc, crd, pur, exp, ast, inv, dbt] = await Promise.all([
        sb.from('fixed_expenses').select('*'),
        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
        sb.from('expense_entries').select('*'),
        sb.from('assets').select('*'),
        sb.from('investments').select('current_value'),
        sb.from('debts').select('saldo_devedor'),
      ]);
      if (!active) return;
      setData({
        fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [], expenseEntries: exp.data || [], assets: ast.data || [],
        investments: inv.data || [], debts: dbt.data || [],
      });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const todayKey = monthKey(new Date());
  const key = dashMonth;
  const inc = incomeForMonth(data.income, key);
  const fixed = fixedContributionForMonth(data.fixedExpenses, data.expenseEntries, key);
  const cardsTotal = allCardsTotalForMonth(data.purchases, key);
  const variableTotal = nonCardExpenseTotalForMonth(data.expenseEntries, key);
  const balance = inc - fixed - cardsTotal - variableTotal;
  const breakdown = categoryBreakdownForMonth(data.fixedExpenses, data.purchases, data.cards, data.expenseEntries, key);
  const entries = Object.entries(breakdown).sort((a, b) => b[1] - a[1]);
  const maxVal = entries.length ? entries[0][1] : 1;

  // Indicadores de saúde financeira do mês selecionado — os números que um
  // CFO olharia primeiro, não só o quanto entra e sai, mas o quão saudável
  // essa relação está.
  const despesaTotalMes = fixed + cardsTotal + variableTotal;
  const comprometimento = inc > 0 ? (despesaTotalMes / inc) * 100 : null;
  const taxaPoupanca = inc > 0 ? (balance / inc) * 100 : null;
  const trendMonths = healthTrendMonths(data);
  const trendData = trendMonths.map((m) => ({ m, ...healthIndicatorsForMonth(data, m) }));

  // "Desde o início": visão geral que não depende do mês selecionado — total
  // recebido/gasto ao longo de toda a história, patrimônio líquido e reserva
  // de emergência hoje, com a despesa do mês ATUAL (não do mês navegado).
  const lifetime = lifetimeTotals(data);
  const investTotal = data.investments.reduce((s, r) => s + Number(r.current_value), 0);
  const debtTotal = data.debts.reduce((s, d) => s + Number(d.saldo_devedor), 0);
  const totalAtivos = data.assets.filter((a) => a.kind === 'ativo').reduce((s, a) => s + Number(a.value), 0) + investTotal;
  const totalPassivos = data.assets.filter((a) => a.kind === 'passivo').reduce((s, a) => s + Number(a.value), 0) + debtTotal;
  const patrimonioLiquido = totalAtivos - totalPassivos;
  const reservaAtual = data.assets.filter((a) => a.kind === 'ativo' && a.category === 'Reserva de emergência').reduce((s, a) => s + Number(a.value), 0);
  const despesaHoje = fixedContributionForMonth(data.fixedExpenses, data.expenseEntries, todayKey) + allCardsTotalForMonth(data.purchases, todayKey) + nonCardExpenseTotalForMonth(data.expenseEntries, todayKey);
  const mesesReserva = despesaHoje > 0 ? reservaAtual / despesaHoje : null;

  // Alertas de variação por categoria (do mês selecionado) e projeção de
  // saldo dos próximos meses (sempre a partir de hoje — não dá pra "projetar" o passado).
  const alerts = categoryVarianceAlerts(data, key);
  const projection = projectBalance(data, 3);

  let upcoming = data.fixedExpenses.filter((e) => e.active).map((e) => ({ name: e.name, date: nextFixedExpenseOccurrence(e), amount: Number(e.amount) }));
  data.cards.forEach((c) => {
    const total = cardTotalForMonth(data.purchases, c.id, currentInvoiceMonthKey(c));
    if (total > 0) upcoming.push({ name: 'Fatura ' + c.name, date: dueDateForMonth(c.due_day, currentInvoiceMonthKey(c)), amount: total });
  });
  upcoming.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  upcoming = upcoming.slice(0, 6);

  async function handleDownloadPdf() {
    setDownloadingPdf(true);
    setPdfError(null);
    try {
      if (!(window.jspdf && window.jspdf.jsPDF)) {
        await ensureLibLoaded(() => window.jspdf && window.jspdf.jsPDF, 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js');
      }
      const doc = buildRelatorioMensalPdf(window.jspdf.jsPDF, fmtBRL, {
        mesLabel: monthLabel(dashMonth), geradoEm: new Date().toLocaleDateString('pt-BR'),
        inc, fixed, variableTotal, cardsTotal, balance, comprometimento, taxaPoupanca,
        categoryEntries: entries, alerts, upcoming,
      });
      doc.save(`tonus-financeiro-relatorio-${dashMonth}.pdf`);
    } catch (err) {
      setPdfError(err.message);
    }
    setDownloadingPdf(false);
  }

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Dashboard</h1><div className="page-sub">Desde o início até hoje</div></div>
      </div>
      <div className="grid grid-4">
        <div className="card"><p className="stat-label">Total recebido desde o início</p><p className="stat-value money">{fmtBRL(lifetime.totalRecebido)}</p></div>
        <div className="card"><p className="stat-label">Total gasto desde o início</p><p className="stat-value spend">{fmtBRL(lifetime.totalGasto)}</p></div>
        <div className="card"><p className="stat-label">Patrimônio líquido</p><p className={'stat-value ' + (patrimonioLiquido >= 0 ? 'money' : 'spend')}>{fmtBRL(patrimonioLiquido)}</p></div>
        <div className="card">
          <p className="stat-label">Meses de reserva cobertos</p>
          <p className={'stat-value' + (mesesReserva == null ? '' : mesesReserva >= 6 ? ' money' : mesesReserva >= 3 ? ' gold' : ' spend')}>{mesesReserva == null ? '—' : mesesReserva.toFixed(1) + 'x'}</p>
        </div>
      </div>

      <div className="page-head section-gap" style={{ marginBottom: 18 }}>
        <div><h3 className="section-title" style={{ margin: 0 }}>Indicadores do mês</h3><div className="page-sub" style={{ margin: 0 }}>Escolha o mês para ver os números daquele período</div></div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <div className="month-nav">
            <button onClick={() => setDashMonth(shiftMonth(dashMonth, -1))}>&#8592;</button>
            <input type="month" value={dashMonth} onChange={(e) => e.target.value && setDashMonth(e.target.value)}
              style={{ fontFamily: 'var(--font-mono)', fontSize: 13, border: '1px solid var(--paper-line)', borderRadius: 7, padding: '5px 8px', textTransform: 'capitalize' }} />
            <button onClick={() => setDashMonth(shiftMonth(dashMonth, 1))}>&#8594;</button>
          </div>
          <button className="btn ghost" onClick={handleDownloadPdf} disabled={downloadingPdf}>{downloadingPdf ? 'Gerando PDF...' : 'Baixar relatório (PDF)'}</button>
        </div>
      </div>
      {pdfError && <Banner type="error">{pdfError}</Banner>}
      <div className="grid grid-5">
        <div className="card"><p className="stat-label">Receitas do mês</p><p className="stat-value money">{fmtBRL(inc)}</p></div>
        <div className="card"><p className="stat-label">Despesas fixas</p><p className="stat-value spend">{fmtBRL(fixed)}</p></div>
        <div className="card"><p className="stat-label">Despesas variáveis</p><p className="stat-value spend">{fmtBRL(variableTotal)}</p></div>
        <div className="card"><p className="stat-label">Faturas de cartão</p><p className="stat-value gold">{fmtBRL(cardsTotal)}</p></div>
        <div className="card"><p className="stat-label">Saldo do mês</p><p className={'stat-value ' + (balance >= 0 ? 'money' : 'spend')}>{fmtBRL(balance)}</p></div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Saúde financeira</h3>
        <div className="grid grid-2" style={{ marginBottom: trendData.length > 1 ? 18 : 0 }}>
          <div className="card">
            <p className="stat-label">Comprometimento de renda</p>
            <p className={'stat-value' + (comprometimento == null ? '' : comprometimento <= 50 ? ' money' : comprometimento <= 70 ? ' gold' : ' spend')}>{comprometimento == null ? '—' : comprometimento.toFixed(0) + '%'}</p>
            <p style={{ fontSize: 12, color: 'var(--ink-faint)', marginTop: 4 }}>Quanto da renda do mês já vai pra despesas</p>
          </div>
          <div className="card">
            <p className="stat-label">Taxa de poupança</p>
            <p className={'stat-value' + (taxaPoupanca == null ? '' : taxaPoupanca >= 20 ? ' money' : taxaPoupanca >= 0 ? ' gold' : ' spend')}>{taxaPoupanca == null ? '—' : (taxaPoupanca >= 0 ? '+' : '') + taxaPoupanca.toFixed(0) + '%'}</p>
            <p style={{ fontSize: 12, color: 'var(--ink-faint)', marginTop: 4 }}>Quanto sobra da renda depois das despesas</p>
          </div>
        </div>
        {trendData.length > 1 && (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: 'auto', minWidth: 0 }}>
              <thead><tr><th style={{ minWidth: 150 }}>Últimos meses</th>{trendData.map((t) => <th key={t.m} className="num" style={{ minWidth: 80 }}>{shortMonthLabel(t.m)}</th>)}</tr></thead>
              <tbody>
                <tr className="row-hover"><td>Comprometimento de renda</td>{trendData.map((t, i) => <td key={i} className="num">{t.comprometimento == null ? '—' : t.comprometimento.toFixed(0) + '%'}</td>)}</tr>
                <tr className="row-hover"><td>Taxa de poupança</td>{trendData.map((t, i) => <td key={i} className="num">{t.poupanca == null ? '—' : t.poupanca.toFixed(0) + '%'}</td>)}</tr>
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="grid grid-2 section-gap">
        <div className="card">
          <h3 className="section-title">Alertas de {monthLabel(dashMonth)}</h3>
          <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Categorias que fugiram da própria média dos 3 meses anteriores</div>
          {alerts.length === 0 ? <Empty title="Nada fora do padrão" body="Nenhuma categoria variou 30% ou mais frente à própria média recente." /> : alerts.map((a) => (
            <div key={a.cat} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '8px 0', borderBottom: '1px solid var(--paper-line)' }}>
              <div>
                <strong>{a.cat}</strong>
                <div style={{ fontSize: 12, color: 'var(--ink-faint)' }}>{fmtBRL(a.val)} nesse mês, média de {fmtBRL(a.media)}</div>
              </div>

        </div>
        <div className="card">
          <h3 className="section-title">Projeção de saldo</h3>
          <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Renda recorrente e despesas já conhecidas, com despesa variável estimada pela média recente</div>
          <div style={{ overflowX: 'auto' }}>
            <table><tbody>

                <tr key={p.m}><td>{monthLabel(p.m)}</td><td className="num"><span className={p.saldo >= 0 ? 'money' : 'spend'}>{fmtBRL(p.saldo)}</span></td></tr>

      <div className="grid grid-2 section-gap">
        <div className="card">
          <h3 className="section-title">Gastos por categoria em {monthLabel(dashMonth)}</h3>

            <div className="bar-row" key={cat}>

              <div className="bar-value">{fmtBRL(val)}</div>

          ))}

        <div className="card">
          <h3 className="section-title">Próximos vencimentos</h3>

      </div>
      <CategoryPivotCard entries={data.expenseEntries} />
    </div>
  );

// ---------- Despesas fixas ----------
function FixedExpensesTab() {
  const [list, setList] = useState([]);
  const [monthEntries, setMonthEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [category, setCategory] = useState(CATS_EXP[0]);
  const [customCats, setCustomCats] = useState([]);
  const [amount, setAmount] = useState('');
  const [frequency, setFrequency] = useState('mensal');
  const [dueDay, setDueDay] = useState('');
  const [dueWeekday, setDueWeekday] = useState('1');
  const [dueDate, setDueDate] = useState(todayLocalISO());
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const allCats = [...CATS_EXP, ...customCats];

  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  async function load() {
    setLoading(true);
    const nowKey = monthKey(new Date());
    const [rows, cats, exp] = await Promise.all([
      sb.from('fixed_expenses').select('*').order('due_day'),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
      sb.from('expense_entries').select('id, entry_date, description, category, payment_method, amount, fixed_expense_id'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    if (exp.data) setMonthEntries(exp.data.filter((e) => e.entry_date && e.entry_date.slice(0, 7) === nowKey));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = toNumber(amount);
    if (!name.trim() || !amt) return;
    if (frequency === 'mensal' && !parseInt(dueDay)) return;
    if (frequency === 'quinzenal' && !dueDate) return;
    const { error } = await sb.from('fixed_expenses').insert({
      name: name.trim(), category, amount: amt, payment_method: paymentMethod, frequency,
      due_day: frequency === 'mensal' ? parseInt(dueDay) : null,
      due_weekday: frequency === 'semanal' ? parseInt(dueWeekday) : null,
      due_date: frequency === 'quinzenal' ? dueDate : null,
    });
    if (error) { setErro(error.message); return; }
    setName(''); setAmount(''); setDueDay('');
    load();
  }
  async function toggleActive(row) {
    await sb.from('fixed_expenses').update({ active: !row.active }).eq('id', row.id);
    load();
  }
  async function remove(row) {
    await sb.from('fixed_expenses').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({
      name: row.name, category: row.category, amount: row.amount, payment_method: row.payment_method || PAYMENT_METHODS[0],
      frequency: row.frequency || 'mensal', due_day: row.due_day || '', due_weekday: row.due_weekday != null ? String(row.due_weekday) : '1',
      due_date: row.due_date || todayLocalISO(),
    });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const amt = toNumber(editRow.amount);
    if (!editRow.name.trim() || !amt) return;
    if (editRow.frequency === 'mensal' && !parseInt(editRow.due_day)) return;
    if (editRow.frequency === 'quinzenal' && !editRow.due_date) return;
    const { error } = await sb.from('fixed_expenses').update({
      name: editRow.name.trim(), category: editRow.category, amount: amt, payment_method: editRow.payment_method, frequency: editRow.frequency,
      due_day: editRow.frequency === 'mensal' ? parseInt(editRow.due_day) : null,
      due_weekday: editRow.frequency === 'semanal' ? parseInt(editRow.due_weekday) : null,
      due_date: editRow.frequency === 'quinzenal' ? editRow.due_date : null,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  // ---------- "Contas do mês": painel de revisão, sempre visível, nunca
  // silencioso — cada ação abaixo é um clique explícito da pessoa. ----------
  const [ambiguousChoice, setAmbiguousChoice] = useState({});
  const [busyKey, setBusyKey] = useState(null);
  function occKey(occ) { return occ.fixedExpenseId + '|' + occ.expectedDate; }
  async function confirmSuggestion(occ) {
    setBusyKey(occKey(occ));
    await sb.from('expense_entries').update({ fixed_expense_id: occ.fixedExpenseId }).eq('id', occ.candidate.id);
    setBusyKey(null);
    load();
  }
  async function confirmAmbiguous(occ) {
    const entryId = ambiguousChoice[occKey(occ)];
    if (!entryId) return;
    setBusyKey(occKey(occ));
    await sb.from('expense_entries').update({ fixed_expense_id: occ.fixedExpenseId }).eq('id', entryId);
    setBusyKey(null);
    load();
  }
  async function launchNow(occ) {
    setBusyKey(occKey(occ));
    await sb.from('expense_entries').insert({
      entry_date: occ.expectedDate, description: occ.name, category: occ.category,
      payment_method: occ.paymentMethod, amount: occ.estimatedAmount, fixed_expense_id: occ.fixedExpenseId,
    });
    setBusyKey(null);
    load();
  }
  async function unlinkOccurrence(occ) {
    setBusyKey(occKey(occ));
    await sb.from('expense_entries').update({ fixed_expense_id: null }).eq('id', occ.entry.id);
    setBusyKey(null);
    load();
  }

  const refKey = monthKey(new Date());
  const total = list.filter((e) => e.active).reduce((s, e) => s + fixedExpenseMonthlyEstimate(e, refKey), 0);
  const sortedList = [...list].sort((a, b) => {
    const pay = (a.payment_method || '').localeCompare(b.payment_method || '', 'pt-BR');
    return pay !== 0 ? pay : a.name.localeCompare(b.name, 'pt-BR');
  });

  // Evolução do total comprometido: soma acumulada por mês de cadastro das
  // despesas ativas — cresce conforme novas despesas fixas vão sendo adicionadas.
  const growthByMonth = {};
  list.filter((e) => e.active).forEach((e) => {
    const mk = e.created_at ? e.created_at.slice(0, 7) : refKey;
    growthByMonth[mk] = (growthByMonth[mk] || 0) + fixedExpenseMonthlyEstimate(e, refKey);
  });
  const growthMonths = Object.keys(growthByMonth).sort();
  let runningTotal = 0;
  const growthSeries = growthMonths.map((m) => { runningTotal += growthByMonth[m]; return { m, total: runningTotal }; });
  const growthMax = Math.max(1, ...growthSeries.map((g) => g.total));

  // Total por categoria, só entre as despesas ativas.
  const catTotals = {};
  list.filter((e) => e.active).forEach((e) => { catTotals[e.category] = (catTotals[e.category] || 0) + fixedExpenseMonthlyEstimate(e, refKey); });
  const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const catMax = catEntries.length ? catEntries[0][1] : 1;

  // Total por forma de pagamento, só entre as despesas ativas.
  const payTotals = {};
  list.filter((e) => e.active).forEach((e) => { const p = e.payment_method || 'Não informada'; payTotals[p] = (payTotals[p] || 0) + fixedExpenseMonthlyEstimate(e, refKey); });
  const payEntries = Object.entries(payTotals).sort((a, b) => b[1] - a[1]);
  const payMax = payEntries.length ? payEntries[0][1] : 1;

  const reviewOccurrences = planFixedExpenseReview(list, monthEntries, refKey);

  const pendingCount = reviewOccurrences.filter((o) => o.status !== 'linked').length;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Fixas</h1><div className="page-sub">Contas que se repetem todo mês</div></div></div>

      {reviewOccurrences.length > 0 && (
        <div className="card">
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 4 }}>
            <h3 className="section-title" style={{ margin: 0 }}>Contas de {monthLabel(refKey)}</h3>
            {pendingCount > 0 ? (
              <span className="pill">{pendingCount} {pendingCount === 1 ? 'pendência' : 'pendências'}</span>
            ) : (
              <span className="pill money">Tudo em dia</span>
            )}
          </div>
          <div className="page-sub" style={{ margin: '-4px 0 16px' }}>
            Cada conta esperada este mês, com o que o app encontrou em Despesas — nada é lançado ou vinculado sozinho, você confirma cada uma com 1 clique.
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {reviewOccurrences.map((occ) => {
              const key = occKey(occ);
              const busy = busyKey === key;
              const dateLabel = new Date(occ.expectedDate + 'T00:00:00').toLocaleDateString('pt-BR');
              return (
                <div key={key} style={{ border: '1px solid var(--paper-line)', borderRadius: 10, padding: '10px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10 }}>
                  <div>
                    <div style={{ fontWeight: 500 }}>{occ.name} <span className="pill" style={{ marginLeft: 6 }}>{occ.category}</span></div>
                    <div className="page-sub" style={{ margin: '2px 0 0' }}>Esperado em {dateLabel} · estimado {fmtBRL(occ.estimatedAmount)} · {occ.paymentMethod || 'forma não informada'}</div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    {occ.status === 'linked' && (
                      <>
                        <span className="pill money">✓ Lançado — {fmtBRL(occ.entry.amount)}</span>
                        <button className="icon-btn" disabled={busy} onClick={() => unlinkOccurrence(occ)}>Desvincular</button>
                      </>
                    )}
                    {occ.status === 'suggested' && (
                      <>
                        <span className="pill gold">Sugestão: {occ.candidate.description} — {new Date(occ.candidate.entry_date + 'T00:00:00').toLocaleDateString('pt-BR')} — {fmtBRL(occ.candidate.amount)}</span>
                        <button className="btn" disabled={busy} onClick={() => confirmSuggestion(occ)}>Confirmar vínculo</button>
                        <button className="icon-btn" disabled={busy} onClick={() => launchNow(occ)}>Não é esse, lançar novo</button>
                      </>
                    )}
                    {occ.status === 'ambiguous' && (
                      <>
                        <select value={ambiguousChoice[key] || ''} onChange={(ev) => setAmbiguousChoice({ ...ambiguousChoice, [key]: ev.target.value })} style={{ minWidth: 220 }}>
                          <option value="">— escolher lançamento —</option>
                          {occ.candidates.map((c) => (
                            <option key={c.id} value={c.id}>{c.description} — {new Date(c.entry_date + 'T00:00:00').toLocaleDateString('pt-BR')} — {fmtBRL(c.amount)}</option>
                          ))}
                        </select>
                        <button className="btn" disabled={busy || !ambiguousChoice[key]} onClick={() => confirmAmbiguous(occ)}>Vincular</button>
                        <button className="icon-btn" disabled={busy} onClick={() => launchNow(occ)}>Nenhum, lançar novo</button>
                      </>
                    )}
                    {occ.status === 'pending' && (
                      <>
                        <span className="pill">Pendente</span>
                        <button className="btn" disabled={busy} onClick={() => launchNow(occ)}>Lançar agora ({fmtBRL(occ.estimatedAmount)})</button>
                      </>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="card section-gap">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form ef-fixed" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Aluguel" onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="text" inputMode="decimal" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <Field label="Frequência">
            <select value={frequency} onChange={(e) => setFrequency(e.target.value)}>
              <option value="mensal">Mensal</option>
              <option value="quinzenal">Quinzenal</option>
              <option value="semanal">Semanal</option>
            </select>
          </Field>
          {frequency === 'mensal' && (
            <Field label="Dia venc."><input required type="number" min="1" max="31" value={dueDay} placeholder="10" onChange={(e) => setDueDay(e.target.value)} /></Field>
          )}
          {frequency === 'semanal' && (
            <Field label="Dia da semana"><select value={dueWeekday} onChange={(e) => setDueWeekday(e.target.value)}>{WEEKDAY_NAMES.map((w, i) => <option key={i} value={i}>{w}</option>)}</select></Field>
          )}
          {frequency === 'quinzenal' && (
            <Field label="Data de referência"><input required type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} /></Field>
          )}
          <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <button type="submit" className="btn">Adicionar</button>
        </form>
        {frequency === 'semanal' && (
          <div className="page-sub" style={{ margin: '-14px 0 16px' }}>O valor acima é POR OCORRÊNCIA (ex.: R$200 por sessão) — o app calcula sozinho o total do mês somando quantas {WEEKDAY_NAMES[dueWeekday].toLowerCase()}s caem nele.</div>
        )}
        {frequency === 'quinzenal' && (
          <div className="page-sub" style={{ margin: '-14px 0 16px' }}>O valor acima é POR OCORRÊNCIA — o app calcula as datas a cada 14 dias a partir da referência (nos dois sentidos, passado e futuro), então pode usar qualquer data em que ela realmente acontece.</div>
        )}

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 4px', flexWrap: 'wrap' }}>
          <span className="page-sub" style={{ margin: 0 }}>TOTAL MENSAL (PREVISIBILIDADE)</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(nonCardFixedTotal(list, refKey))}</span>
        </div>
        {cardFixedTotal(list) > 0 && (
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 14px' }}>
            <span className="page-sub" style={{ margin: 0 }}>+ NO CARTÃO (NÃO CONTA AQUI)</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--ink-faint)' }}>{fmtBRL(cardFixedTotal(list))}</span>
          </div>
        )}
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nenhuma despesa fixa cadastrada" body="Comece adicionando aluguel, internet, escola ou outras contas recorrentes." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Descrição</th><th>Categoria</th><th className="num" title="Valor por ocorrência — pra despesas semanais, é o valor de UMA sessão/ocorrência, não do mês inteiro">Valor ⓘ</th><th className="num" title="% do total mensal estimado de todas as despesas fixas ativas (já considerando quantas ocorrências cada uma tem no mês), incluindo as pagas no cartão — por isso pode não bater com o TOTAL MENSAL (PREVISIBILIDADE) acima, que exclui o que é pago no cartão">% do total ⓘ</th><th>Frequência / vencimento</th><th>Forma de pagamento</th><th>Registrada em</th><th></th><th></th></tr></thead>
            <tbody>
              {sortedList.map((e) => editingId === e.id ? (
                <tr className="row-hover" key={e.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td></td>
                  <td>
                    <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                      <select value={editRow.frequency} onChange={(ev) => setEditRow({ ...editRow, frequency: ev.target.value })} style={{ width: 90 }}>
                        <option value="mensal">Mensal</option>
                        <option value="quinzenal">Quinzenal</option>
                        <option value="semanal">Semanal</option>
                      </select>
                      {editRow.frequency === 'mensal' && (
                        <input type="number" min="1" max="31" value={editRow.due_day} onChange={(ev) => setEditRow({ ...editRow, due_day: ev.target.value })} style={{ width: 60 }} />
                      )}
                      {editRow.frequency === 'semanal' && (
                        <select value={editRow.due_weekday} onChange={(ev) => setEditRow({ ...editRow, due_weekday: ev.target.value })} style={{ width: 110 }}>
                          {WEEKDAY_NAMES.map((w, i) => <option key={i} value={i}>{w.slice(0, 3)}</option>)}
                        </select>
                      )}
                      {editRow.frequency === 'quinzenal' && (
                        <input type="date" value={editRow.due_date} onChange={(ev) => setEditRow({ ...editRow, due_date: ev.target.value })} style={{ width: 140 }} />
                      )}
                    </div>
                  </td>
                  <td>
                    <select value={editRow.payment_method} onChange={(ev) => setEditRow({ ...editRow, payment_method: ev.target.value })}>
                      {PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}
                    </select>
                  </td>
                  <td></td>
                  <td></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(e.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={e.id}>
                  <td>{e.name}</td>
                  <td><span className="pill">{e.category}</span></td>
                  <td className="num">{fmtBRL(e.amount)}</td>
                  <td className="num">{e.active ? (fixedExpenseMonthlyEstimate(e, refKey) / total * 100).toFixed(1) + '%' : '—'}</td>
                  <td>
                    {e.frequency === 'semanal' && 'Toda ' + WEEKDAY_NAMES[e.due_weekday].toLowerCase()}
                    {e.frequency === 'quinzenal' && 'A cada 14 dias (ref. ' + new Date(e.due_date + 'T00:00:00').toLocaleDateString('pt-BR') + ')'}
                    {(!e.frequency || e.frequency === 'mensal') && 'Dia ' + String(e.due_day).padStart(2, '0')}
                  </td>
                  <td>{e.payment_method || '—'}</td>
                  <td>{e.created_at ? shortMonthLabel(e.created_at.slice(0, 7)) : '—'}</td>
                  <td><span className={'pill ' + (e.active ? 'money' : '')}>{e.active ? 'Ativa' : 'Pausada'}</span></td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(e)}>Editar</button>
                    <button className="icon-btn" onClick={() => toggleActive(e)}>{e.active ? 'Pausar' : 'Ativar'}</button>
                    <button className="icon-btn" onClick={() => remove(e)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>

      {catEntries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Despesas fixas por categoria</h3>
          {catEntries.map(([cat, val]) => (
            <div className="bar-row" key={cat}>
              <div className="bar-label">{cat}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / catMax) * 100) + '%', background: 'var(--spend)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)} <span style={{ color: 'var(--ink-faint)' }}>({(val / total * 100).toFixed(0)}%)</span></div>
            </div>
          ))}
        </div>
      )}

      {payEntries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Despesas fixas por forma de pagamento</h3>
          {payEntries.map(([pay, val]) => (
            <div className="bar-row" key={pay}>
              <div className="bar-label">{pay}</div>
              <div className="bar-track"><div className="bar-fill" style={{ width: Math.round((val / payMax) * 100) + '%', background: 'var(--gold)' }}></div></div>
              <div className="bar-value">{fmtBRL(val)} <span style={{ color: 'var(--ink-faint)' }}>({(val / total * 100).toFixed(0)}%)</span></div>
            </div>
          ))}
        </div>
      )}

      {growthSeries.length > 0 && (
        <div className="card section-gap">
          <h3 className="section-title">Evolução do total comprometido</h3>
          <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Soma acumulada das despesas fixas ativas, por mês em que cada uma foi cadastrada</div>
          <div style={{ overflowX: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 120, paddingTop: 10, width: 'max-content', minWidth: '100%' }}>
              {growthSeries.map((g) => {
                const h = Math.max(3, Math.round((g.total / growthMax) * 90));
                return (
                  <div key={g.m} style={{ flex: '0 0 84px', width: 84, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginBottom: 4, whiteSpace: 'nowrap', textAlign: 'center' }}>{fmtBRL(g.total)}</div>
                    <div style={{ width: 34, height: h, background: 'var(--spend)', borderRadius: '4px 4px 0 0' }}></div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginTop: 6, whiteSpace: 'nowrap', textAlign: 'center' }}>{shortMonthLabel(g.m)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Receitas ----------
function IncomeTab({ session }) {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [name, setName] = useState('');
  const [category, setCategory] = useState(CATS_INC[0]);
  const [customCats, setCustomCats] = useState([]);
  const [amount, setAmount] = useState('');
  const [type, setType] = useState('rec');
  const [date, setDate] = useState('');
  const [notes, setNotes] = useState('');
  const [uploading, setUploading] = useState(false);
  const receiptRef = useRef(null);
  const editReceiptRef = useRef(null);
  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);
  const [incomeMonth, setIncomeMonth] = useState(monthKey(new Date()));
  const allCats = [...CATS_INC, ...customCats];

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('income').select('*').order('created_at', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'income').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function uploadReceipt(file) {
    const path = `${session.user.id}/income/${crypto.randomUUID()}-${file.name}`;
    const { error } = await sb.storage.from('comprovantes').upload(path, file);
    if (error) throw error;
    return path;
  }
  async function openReceipt(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir o comprovante.'); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = toNumber(amount);
    if (!name.trim() || !amt) return;
    const recurring = type === 'rec';
    if (!recurring && !date) return;
    setUploading(true);
    let receiptPath = null;
    try {
      const file = receiptRef.current && receiptRef.current.files && receiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('income').insert({
      name: name.trim(), category, amount: amt, recurring, income_date: recurring ? null : date,
      notes: notes.trim() || null, receipt_path: receiptPath,
    });
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setName(''); setAmount(''); setDate(''); setNotes('');
    if (receiptRef.current) receiptRef.current.value = '';
    load();
  }
  async function remove(row) {
    if (row.receipt_path) await sb.storage.from('comprovantes').remove([row.receipt_path]);
    await sb.from('income').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ name: row.name, category: row.category, amount: String(row.amount), recurring: row.recurring, income_date: row.income_date || '', notes: row.notes || '', receipt_path: row.receipt_path || null });
  }
  function cancelEdit() {
    setEditingId(null);
    setEditRow(null);
  }
  async function saveEdit(id) {
    const amt = toNumber(editRow.amount);
    if (!editRow.name.trim() || !amt) return;
    if (!editRow.recurring && !editRow.income_date) return;
    setUploading(true);
    let receiptPath = editRow.receipt_path;
    try {
      const file = editReceiptRef.current && editReceiptRef.current.files && editReceiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('income').update({
      name: editRow.name.trim(), category: editRow.category, amount: amt,
      recurring: editRow.recurring, income_date: editRow.recurring ? null : editRow.income_date,
      notes: editRow.notes.trim() || null, receipt_path: receiptPath,
    }).eq('id', id);
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const totalRec = list.filter((i) => i.recurring).reduce((s, i) => s + Number(i.amount), 0);
  const totalMes = incomeForMonth(list, incomeMonth);
  const avulsoDoMes = list.filter((i) => !i.recurring && i.income_date && i.income_date.slice(0, 7) === incomeMonth).reduce((s, i) => s + Number(i.amount), 0);

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Receitas</h1><div className="page-sub">Fixas (recorrentes) ou avulsas</div></div>
        <div className="month-nav">
          <button onClick={() => setIncomeMonth(shiftMonth(incomeMonth, -1))}>&#8592;</button>
          <input type="month" value={incomeMonth} onChange={(e) => e.target.value && setIncomeMonth(e.target.value)}
            style={{ fontFamily: 'var(--font-mono)', fontSize: 13, border: '1px solid var(--paper-line)', borderRadius: 7, padding: '5px 8px', textTransform: 'capitalize' }} />
          <button onClick={() => setIncomeMonth(shiftMonth(incomeMonth, 1))}>&#8594;</button>
        </div>
      </div>

      <div className="grid grid-3" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total recebido em {monthLabel(incomeMonth)}</p><p className="stat-value money">{fmtBRL(totalMes)}</p></div>
        <div className="card"><p className="stat-label">Recorrente</p><p className="stat-value">{fmtBRL(totalRec)}</p></div>
        <div className="card"><p className="stat-label">Avulso no mês</p><p className="stat-value">{fmtBRL(avulsoDoMes)}</p></div>
      </div>

      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Descrição"><input required value={name} placeholder="Salário" onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="income" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Valor (R$)"><input required type="text" inputMode="decimal" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <Field label="Tipo">
            <select value={type} onChange={(e) => setType(e.target.value)}>
              <option value="rec">Recorrente (todo mês)</option>
              <option value="one">Avulsa (data única)</option>
            </select>
          </Field>
          {type === 'one' && <Field label="Data"><input required type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>}
          <button type="submit" className="btn" disabled={uploading}>{uploading ? 'Enviando...' : 'Adicionar'}</button>
        </form>
        <div className="entry-form ef-2col" style={{ marginTop: -8 }}>
          <Field label="Observações (opcional)"><input value={notes} placeholder="ex: referente a qual serviço, de quem, etc." onChange={(e) => setNotes(e.target.value)} /></Field>
          <Field label="Comprovante (opcional)"><input type="file" accept="image/*,.pdf" ref={receiptRef} /></Field>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '0 4px 14px' }}>
          <span className="page-sub" style={{ margin: 0 }}>TOTAL RECORRENTE MENSAL</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--money-strong)' }}>{fmtBRL(totalRec)}</span>
        </div>
        {loading ? <Banner type="info">Carregando...</Banner> : list.length === 0 ? (
          <Empty title="Nenhuma receita cadastrada" body="Adicione seu salário ou outras fontes de renda para começar." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th>Recorrência</th><th>Observações</th><th>Comprovante</th><th></th></tr></thead>
            <tbody>
              {list.map((i) => editingId === i.id ? (
                <tr className="row-hover" key={i.id}>
                  <td><input value={editRow.name} onChange={(ev) => setEditRow({ ...editRow, name: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="income" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td className="num"><input type="text" inputMode="decimal" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      <select value={editRow.recurring ? 'rec' : 'one'} onChange={(ev) => setEditRow({ ...editRow, recurring: ev.target.value === 'rec' })} style={{ width: 'auto' }}>
                        <option value="rec">Recorrente</option>
                        <option value="one">Avulsa</option>
                      </select>
                      {!editRow.recurring && <input type="date" value={editRow.income_date} onChange={(ev) => setEditRow({ ...editRow, income_date: ev.target.value })} style={{ width: 140 }} />}
                    </div>
                  </td>
                  <td><input value={editRow.notes} onChange={(ev) => setEditRow({ ...editRow, notes: ev.target.value })} style={{ minWidth: 100 }} /></td>
                  <td>
                    {editRow.receipt_path && <div style={{ marginBottom: 4 }}><button type="button" className="icon-btn" onClick={() => openReceipt(editRow.receipt_path)}>Ver atual</button></div>}
                    <input type="file" accept="image/*,.pdf" ref={editReceiptRef} style={{ width: 140, fontSize: 11 }} />
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(i.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={i.id}>
                  <td>{i.name}</td>
                  <td><span className="pill">{i.category}</span></td>
                  <td className="num">{fmtBRL(i.amount)}</td>
                  <td>{i.recurring ? 'Todo mês' : new Date(i.income_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td style={{ color: 'var(--ink-faint)' }}>{i.notes || '—'}</td>
                  <td>{i.receipt_path ? <button className="icon-btn" onClick={() => openReceipt(i.receipt_path)}>Ver</button> : <span style={{ color: 'var(--ink-faint)' }}>—</span>}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(i)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(i)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Cartões de crédito ----------
function CardsTab({ session }) {
  const [cards, setCards] = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [selectedId, setSelectedId] = useState(null);

  const [ccName, setCcName] = useState('');
  const [ccClose, setCcClose] = useState('');
  const [ccDue, setCcDue] = useState('');
  const [ccLimit, setCcLimit] = useState('');

  const [pDesc, setPDesc] = useState('');
  const [pCat, setPCat] = useState(CATS_EXP[0]);
  const [customCats, setCustomCats] = useState([]);
  const [pAmount, setPAmount] = useState('');
  const [pInst, setPInst] = useState('1');
  const [pMonth, setPMonth] = useState(monthKey(new Date()));
  const [pDate, setPDate] = useState(todayLocalISO());
  const [pNotes, setPNotes] = useState('');
  const pReceiptRef = useRef(null);
  const allCats = [...CATS_EXP, ...customCats];

  const [impMonth, setImpMonth] = useState(monthKey(new Date()));
  const [impText, setImpText] = useState('');
  const [impPassword, setImpPassword] = useState('');
  const [pdfNeedsPassword, setPdfNeedsPassword] = useState(false);
  const [impBusy, setImpBusy] = useState(false);
  const [impError, setImpError] = useState(null);
  const [preview, setPreview] = useState(null);
  const fileRef = useRef(null);

  // ---------- Padrão de leitura por cartão ----------
  // Ajustes que a pessoa pode ensinar uma vez pra um cartão (frases extras
  // pra ignorar na fatura, e se ela tem colunas lado a lado por causa de
  // cartão adicional) e reaproveitar em toda importação futura DESSE mesmo
  // cartão, sem precisar reajustar todo mês. `draft*` é o que está no
  // formulário agora (já usado por handleExtract mesmo antes de salvar, pra
  // dar pra testar antes de decidir gravar como padrão); `hasSavedProfile`
  // só controla o texto do botão/aviso.
  const [showImportSettings, setShowImportSettings] = useState(false);
  const [draftSkipText, setDraftSkipText] = useState('');
  const [draftForceMultiColumn, setDraftForceMultiColumn] = useState(false);
  const [hasSavedProfile, setHasSavedProfile] = useState(false);
  const [savingProfile, setSavingProfile] = useState(false);
  const [profileSavedMsg, setProfileSavedMsg] = useState(false);

  useEffect(() => {
    if (!selectedId) return;
    let active = true;
    sb.from('card_import_profiles').select('*').eq('card_id', selectedId).maybeSingle().then(({ data }) => {
      if (!active) return;
      if (data) {
        setHasSavedProfile(true);
        setDraftSkipText((data.extra_skip_keywords || []).join('\n'));
        setDraftForceMultiColumn(!!data.force_multi_column);
      } else {
        setHasSavedProfile(false);
        setDraftSkipText('');
        setDraftForceMultiColumn(false);
      }
    });
    return () => { active = false; };
  }, [selectedId]);

  function draftExtraSkipKeywords() {
    return draftSkipText.split('\n').map((s) => s.trim()).filter(Boolean);
  }
  async function saveImportProfile() {
    setSavingProfile(true);
    setProfileSavedMsg(false);
    const { error } = await sb.from('card_import_profiles').upsert({
      card_id: selectedId, extra_skip_keywords: draftExtraSkipKeywords(), force_multi_column: draftForceMultiColumn,
    });
    setSavingProfile(false);
    if (error) { setImpError(error.message); return; }
    setHasSavedProfile(true);
    setProfileSavedMsg(true);
    setTimeout(() => setProfileSavedMsg(false), 2500);
  }
  async function removeImportProfile() {
    await sb.from('card_import_profiles').delete().eq('card_id', selectedId);
    setHasSavedProfile(false);
    setDraftSkipText('');
    setDraftForceMultiColumn(false);
  }

  const [historyMonth, setHistoryMonth] = useState(monthKey(new Date()));
  const [histCard, setHistCard] = useState('');
  const [histDesc, setHistDesc] = useState('');
  const [histCat, setHistCat] = useState('');
  const [histFrom, setHistFrom] = useState('');
  const [expandedCardHistory, setExpandedCardHistory] = useState(null);
  const [histTo, setHistTo] = useState('');

  async function load() {
    setLoading(true);
    const [c, p, cats] = await Promise.all([
      sb.from('cards').select('*').order('created_at'),
      sb.from('card_purchases').select('*').order('first_month', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (c.error) setErro(c.error.message); else setCards(c.data || []);
    if (p.error) setErro(p.error.message); else setPurchases(p.data || []);
    if (cats.data) setCustomCats(cats.data.map((c2) => c2.name));
    setLoading(false);
    if (!selectedId && c.data && c.data.length) setSelectedId(c.data[0].id);
  }
  useEffect(() => { load(); }, []);

  // O mês da fatura de importação segue sempre a fatura em aberto hoje, pois é
  // sobre isso que trata a importação de fatura fechada.
  useEffect(() => {
    const c = cards.find((c2) => c2.id === selectedId);
    if (c) setImpMonth(currentInvoiceMonthKey(c));
  }, [selectedId, cards.length]);

  // Já a "1ª fatura" do lançamento manual segue a DATA DA COMPRA informada
  // (não o dia de hoje) — importante para lançar compras retroativas certas.
  useEffect(() => {
    const c = cards.find((c2) => c2.id === selectedId);
    if (c && pDate) {
      const d = new Date(pDate + 'T00:00:00');
      if (!isNaN(d.getTime())) setPMonth(currentInvoiceMonthKey(c, d));
    }
  }, [selectedId, cards.length, pDate]);

  // O histórico de compras também abre direto na fatura em aberto (não no mês
  // do calendário), assim que os cartões carregam pela primeira vez.
  const historyInitRef = useRef(false);
  useEffect(() => {
    if (!historyInitRef.current && cards.length > 0) {
      historyInitRef.current = true;
      setHistoryMonth(currentInvoiceMonthKey(cards[0]));
    }
  }, [cards.length]);

  async function addCard(ev) {
    ev.preventDefault();
    const closingDay = parseInt(ccClose), dueDay = parseInt(ccDue);
    if (!ccName.trim() || !closingDay || !dueDay) return;
    const { data, error } = await sb.from('cards').insert({
      name: ccName.trim(), closing_day: closingDay, due_day: dueDay,
      limit_amount: toNumber(ccLimit) || null, color: CARD_COLORS[cards.length % CARD_COLORS.length],
    }).select().single();
    if (error) { setErro(error.message); return; }
    setCcName(''); setCcClose(''); setCcDue(''); setCcLimit('');
    setSelectedId(data.id);
    load();
  }
  async function deleteCard(card) {
    await sb.from('cards').delete().eq('id', card.id);
    setSelectedId(null);
    load();
  }
  async function addPurchase(ev) {
    ev.preventDefault();
    const amt = toNumber(pAmount), inst = parseInt(pInst) || 1;
    if (!pDesc.trim() || !amt || !pMonth) return;
    let receiptPath = null;
    const file = pReceiptRef.current && pReceiptRef.current.files && pReceiptRef.current.files[0];
    if (file) {
      const path = `${session.user.id}/cards/${crypto.randomUUID()}-${file.name}`;
      const { error: upErr } = await sb.storage.from('comprovantes').upload(path, file);
      if (upErr) { setErro('Não foi possível salvar a NF: ' + upErr.message); return; }
      receiptPath = path;
    }
    const { error } = await sb.from('card_purchases').insert({
      card_id: selectedId, description: pDesc.trim(), category: pCat, amount: amt, installments: inst, first_month: monthKeyToDate(pMonth), purchase_date: pDate || null, notes: pNotes.trim() || null, receipt_path: receiptPath,
    });
    if (error) { setErro(error.message); return; }
    setPDesc(''); setPAmount(''); setPInst('1'); setPNotes('');
    if (pReceiptRef.current) pReceiptRef.current.value = '';
    load();
  }
  async function deletePurchase(p) {
    if (p.receipt_path) await sb.storage.from('comprovantes').remove([p.receipt_path]);
    await sb.from('card_purchases').delete().eq('id', p.id);
    load();
  }
  // Remove só a parcela de UM mês específico, "de forma desintegrada" —
  // parcelas de meses anteriores e posteriores da mesma compra continuam
  // intactas. Antes, "Remover" apagava a compra inteira (card_purchases é 1
  // registro só, todas as parcelas calculadas dele) — apagar dezembro também
  // sumia com novembro e janeiro, mesmo sendo a mesma linha na tela por
  // coincidência de mês. Guarda o mês em excluded_months em vez de apagar o
  // registro; cardInstallmentForMonth passa a tratar esse mês como "fora do
  // intervalo" (0), sem afetar a numeração das outras parcelas.
  async function removeInstallmentMonth(p, month) {
    const already = Array.isArray(p.excluded_months) ? p.excluded_months : [];
    if (already.includes(month)) return;
    const next = [...already, month];
    // Se essa era a última parcela que ainda restava (todas as outras já
    // tinham sido removidas antes, uma a uma), não faz sentido deixar um
    // registro "fantasma" sem nenhuma parcela visível em lugar nenhum —
    // apaga a compra inteira, igual já acontece quando ela é "à vista".
    const firstKey = toMonthKey(p.first_month);
    const totalMonths = monthsBetween(firstKey, shiftMonth(firstKey, Number(p.installments || 1) - 1));
    const allExcluded = totalMonths.every((m) => next.includes(m));
    if (allExcluded) {
      await deletePurchase(p);
      return;
    }
    await sb.from('card_purchases').update({ excluded_months: next }).eq('id', p.id);
    load();
  }
  async function openPurchaseReceipt(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir a NF.'); return; }
    window.open(data.signedUrl, '_blank');
  }

  const [editingPurchaseId, setEditingPurchaseId] = useState(null);
  const [editPurchase, setEditPurchase] = useState(null);
  function startEditPurchase(p) {
    setEditingPurchaseId(p.id);
    setEditPurchase({
      description: p.description, category: p.category, amount: p.amount, installments: p.installments,
      first_month: toMonthKey(p.first_month), purchase_date: p.purchase_date || '', notes: p.notes || '',
    });
  }
  function cancelEditPurchase() { setEditingPurchaseId(null); setEditPurchase(null); }
  async function saveEditPurchase(id) {
    const amt = toNumber(editPurchase.amount), inst = parseInt(editPurchase.installments) || 1;
    if (!editPurchase.description.trim() || !amt || !editPurchase.first_month) return;
    const { error } = await sb.from('card_purchases').update({
      description: editPurchase.description.trim(), category: editPurchase.category, amount: amt, installments: inst,
      first_month: monthKeyToDate(editPurchase.first_month), purchase_date: editPurchase.purchase_date || null, notes: editPurchase.notes.trim() || null,
    }).eq('id', id);
    if (error) { setErro(error.message); return; }
    setEditingPurchaseId(null); setEditPurchase(null);
    load();
  }

  async function handleExtract() {
    if (!impMonth) { setImpError('Selecione o mês da fatura antes de importar.'); return; }
    setImpBusy(true); setImpError(null); setPreview(null);
    try {
      let lines = [];
      const file = fileRef.current && fileRef.current.files && fileRef.current.files[0];
      if (file) {
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (!isPdf) throw new Error('Envie um arquivo em PDF, ou cole o texto da fatura no campo abaixo.');
        if (!window.pdfjsLib) throw new Error('Não foi possível carregar o leitor de PDF. Tente colar o texto da fatura.');
        lines = await extractLinesFromPDF(file, impPassword, { forceMultiColumn: draftForceMultiColumn });
        setPdfNeedsPassword(false);
      } else if (impText.trim()) {
        lines = impText.split('\n');
      } else {
        throw new Error('Selecione um PDF ou cole o texto da fatura.');
      }
      const parsed = parseInvoiceLines(lines, impMonth, { extraSkipKeywords: draftExtraSkipKeywords() });
      if (parsed.length === 0) {
        setImpText(lines.map((l) => (typeof l === 'string' ? l : l.text)).join('\n'));
        if (fileRef.current) fileRef.current.value = '';
        throw new Error('Não consegui reconhecer as linhas automaticamente nesse PDF. Mas o texto foi extraído certinho — dá uma olhada na caixa abaixo, ajuste o formato de cada linha para "DD/MM Descrição Valor" (ex: 10/08 Uber 23,90), e clique em "Importar fatura" de novo.');
      }
      // !== 0 (não > 0): um estorno já importado antes também precisa ser
      // reconhecido como "já existe neste mês" na reconciliação — senão,
      // reimportar a mesma fatura trataria o estorno como lançamento novo de
      // novo, arriscando duplicar (mesmo raciocínio do bug corrigido no
      // Histórico de compras).
      const existingForCardMonth = purchases.filter((p) => p.card_id === selectedId && cardInstallmentForMonth(p, impMonth) !== 0);
      const reconciled = reconcilePreview(parsed, existingForCardMonth);
      setPreview(reconciled.map((p, idx) => ({
        _key: idx + '-' + Date.now(),
        description: p.description, category: p.category, amount: p.amount,
        installments: p.installTotal || 1,
        firstMonth: shiftMonth(impMonth, -(((p.installCurrent || 1) - 1))),
        purchaseDate: p.purchaseDate,
        reconcileStatus: p.reconcileStatus,
        matchedPurchase: p.matchedPurchase,
        include: p.reconcileStatus === 'new',
      })));
    } catch (err) {
      if (err && err.name === 'PasswordException') {
        setPdfNeedsPassword(true);
        setImpError(impPassword ? 'Senha incorreta. Tente novamente.' : 'Esta fatura está protegida por senha. Digite a senha abaixo (geralmente os primeiros dígitos do CPF do titular) e clique em "Importar fatura" de novo.');
      } else {
        setImpError(err.message || 'Não consegui ler a fatura.');
      }
    }
    setImpBusy(false);
  }
  function updatePreviewRow(idx, patch) {
    setPreview((prev) => prev.map((r, i) => (i === idx ? { ...r, ...patch } : r)));
  }
  async function confirmImport() {
    const rows = preview.filter((r) => r.include).map((r) => ({
      card_id: selectedId, description: r.description, category: r.category && r.category.trim() ? r.category.trim() : 'Outros',
      amount: toNumber(r.amount) * Number(r.installments || 1), installments: Number(r.installments) || 1,
      first_month: monthKeyToDate(r.firstMonth), purchase_date: r.purchaseDate || null,
    }));
    if (rows.length === 0) { setPreview(null); return; }
    const { error } = await sb.from('card_purchases').insert(rows);
    if (error) { setImpError(error.message); return; }
    setPreview(null); setImpText(''); setImpPassword(''); setPdfNeedsPassword(false);
    if (fileRef.current) fileRef.current.value = '';
    load();
  }

  if (loading) return <Banner type="info">Carregando...</Banner>;

  const selCard = cards.find((c) => c.id === selectedId);

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Cartão de Crédito</h1><div className="page-sub">Cadastre quantos cartões precisar</div></div></div>
      {erro && <Banner type="error">{erro}</Banner>}

      <div className="card">
        <h3 className="section-title">Novo cartão</h3>
        <form className="entry-form" onSubmit={addCard}>
          <Field label="Nome do cartão"><input required value={ccName} placeholder="Nubank" onChange={(e) => setCcName(e.target.value)} /></Field>
          <Field label="Fechamento"><input required type="number" min="1" max="31" value={ccClose} placeholder="20" onChange={(e) => setCcClose(e.target.value)} /></Field>
          <Field label="Vencimento"><input required type="number" min="1" max="31" value={ccDue} placeholder="27" onChange={(e) => setCcDue(e.target.value)} /></Field>
          <Field label="Limite (R$)"><input type="text" inputMode="decimal" value={ccLimit} placeholder="opcional" onChange={(e) => setCcLimit(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar cartão</button>
        </form>
      </div>

      {cards.length === 0 ? (
        <div className="card section-gap"><Empty title="Nenhum cartão cadastrado" body="Adicione seu primeiro cartão acima para começar a lançar compras." /></div>
      ) : (
        <React.Fragment>
          <div className="cc-row section-gap">
            {cards.map((c) => {
              const cardInvoiceKey = currentInvoiceMonthKey(c);
              const total = cardTotalForMonth(purchases, c.id, cardInvoiceKey);
              const pct = c.limit_amount ? Math.min(100, (total / Number(c.limit_amount)) * 100) : null;
              const barColor = pct === null ? 'rgba(255,255,255,0.5)' : pct >= 90 ? '#E0574B' : pct >= 70 ? '#E0B84B' : 'rgba(255,255,255,0.75)';
              return (
                <div key={c.id} className={'card-chip' + (c.id === selectedId ? ' selected' : '')} style={{ background: c.color }} onClick={() => setSelectedId(c.id)}>
                  <div className="cc-name">{c.name}</div>
                  <div className="cc-info">Fecha dia {c.closing_day} · vence dia {c.due_day}</div>
                  <div className="cc-total">{fmtBRL(total)}</div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'rgba(255,255,255,0.65)', marginTop: 3 }}>fatura de {shortMonthLabel(cardInvoiceKey)}</div>
                  {pct !== null && (
                    <div style={{ marginTop: 10 }}>
                      <div style={{ height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.18)', overflow: 'hidden' }}>
                        <div style={{ width: pct + '%', height: '100%', background: barColor, borderRadius: 3 }}></div>
                      </div>
                      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'rgba(255,255,255,0.75)', marginTop: 4 }}>
                        {pct.toFixed(0)}% do limite ({fmtBRL(c.limit_amount)})
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {selCard && (
            <React.Fragment>
              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                  <h3 className="section-title" style={{ margin: 0 }}>Importar fatura — {selCard.name}</h3>
                  <button className="btn danger" onClick={() => deleteCard(selCard)}>Remover cartão</button>
                </div>
                <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Ideal depois que a fatura fechar: envie o PDF (ou cole o texto) e o app confere contra o que você já lançou no mês — o que já está certo não duplica, o que tiver valor diferente é sinalizado, e só o que faltar entra como novo.</div>
                <div className="entry-form ef-import">
                  <Field label="Mês da fatura"><input type="month" value={impMonth} onChange={(e) => setImpMonth(e.target.value)} /></Field>
                  <Field label="Arquivo PDF da fatura"><input type="file" accept=".pdf,application/pdf" ref={fileRef} /></Field>
                  <button type="button" className="btn" onClick={handleExtract}>Importar fatura</button>
                </div>

                <button type="button" className="icon-btn" style={{ margin: '4px 0 10px' }} onClick={() => setShowImportSettings((v) => !v)}>
                  {showImportSettings ? '▾' : '▸'} Ajustar leitura deste cartão{hasSavedProfile ? ' (padrão salvo)' : ''}
                </button>
                {showImportSettings && (
                  <div style={{ background: 'var(--paper)', border: '1px solid var(--paper-line)', borderRadius: 8, padding: 14, marginBottom: 14 }}>
                    <p className="page-sub" style={{ margin: '0 0 10px' }}>
                      Se a leitura automática trouxer linhas que não são compras de verdade (taxas, avisos, resumos que esse banco usa), liste aqui — vale pra toda fatura futura deste cartão, não só a de agora.
                    </p>
                    <Field label="Frases para sempre ignorar nas faturas deste cartão (uma por linha)">
                      <textarea rows={3} value={draftSkipText} onChange={(e) => setDraftSkipText(e.target.value)}
                        placeholder={"taxa de manutencao\nseguro protecao cartao"}
                        style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 12.5, padding: '8px 10px', border: '1px solid var(--paper-line)', borderRadius: 7, resize: 'vertical' }} />
                    </Field>
                    <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, margin: '10px 0' }}>
                      <input type="checkbox" checked={draftForceMultiColumn} onChange={(e) => setDraftForceMultiColumn(e.target.checked)} />
                      Esta fatura tem cartão adicional (compras lado a lado, em colunas)
                    </label>
                    <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
