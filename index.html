  }
  useEffect(() => { load(); }, []);

  // Ao trocar de cartão, já sugere a fatura certa (a que está em aberto agora
  // para aquele cartão específico), em vez de deixar sempre o mês corrente.
  useEffect(() => {
    const c = cards.find((c2) => c2.id === selectedId);
    if (c) {
      const inv = currentInvoiceMonthKey(c);
      setPMonth(inv);
      setImpMonth(inv);
    }
  }, [selectedId, cards.length]);

  // O histórico de compras também abre direto na fatura em aberto (não no mês
  // do calendário), assim que os cartões carregam pela primeira vez.
  const historyInitRef = useRef(false);
  useEffect(() => {
    if (!historyInitRef.current && cards.length > 0) {
      historyInitRef.current = true;
      setHistoryMonth(currentInvoiceMonthKey(cards[0]));
    }
  }, [cards.length]);

  async function addCard(ev) {
    ev.preventDefault();
    const closingDay = parseInt(ccClose), dueDay = parseInt(ccDue);
    if (!ccName.trim() || !closingDay || !dueDay) return;
    const { data, error } = await sb.from('cards').insert({
      name: ccName.trim(), closing_day: closingDay, due_day: dueDay,
      limit_amount: parseFloat(ccLimit) || null, color: CARD_COLORS[cards.length % CARD_COLORS.length],
    }).select().single();
    if (error) { setErro(error.message); return; }
    setCcName(''); setCcClose(''); setCcDue(''); setCcLimit('');
    setSelectedId(data.id);
    load();
  }
  async function deleteCard(card) {
    await sb.from('cards').delete().eq('id', card.id);
    setSelectedId(null);
    load();
  }
  async function addPurchase(ev) {
    ev.preventDefault();
    const amt = parseFloat(pAmount), inst = parseInt(pInst) || 1;
    if (!pDesc.trim() || !amt || !pMonth) return;
    const { error } = await sb.from('card_purchases').insert({
      card_id: selectedId, description: pDesc.trim(), category: pCat, amount: amt, installments: inst, first_month: monthKeyToDate(pMonth), purchase_date: pDate || null,
    });
    if (error) { setErro(error.message); return; }
    setPDesc(''); setPAmount(''); setPInst('1');
    load();
  }
  async function deletePurchase(p) {
    await sb.from('card_purchases').delete().eq('id', p.id);
    load();
  }

  async function handleExtract() {
    if (!impMonth) { setImpError('Selecione o mês da fatura antes de importar.'); return; }
    setImpBusy(true); setImpError(null); setPreview(null);
    try {
      let lines = [];
      const file = fileRef.current && fileRef.current.files && fileRef.current.files[0];
      if (file) {
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (!isPdf) throw new Error('Envie um arquivo em PDF, ou cole o texto da fatura no campo abaixo.');
        if (!window.pdfjsLib) throw new Error('Não foi possível carregar o leitor de PDF. Tente colar o texto da fatura.');
        lines = await extractLinesFromPDF(file);
      } else if (impText.trim()) {
        lines = impText.split('\n');
      } else {
        throw new Error('Selecione um PDF ou cole o texto da fatura.');
      }
      const parsed = parseInvoiceLines(lines, impMonth);
      if (parsed.length === 0) throw new Error('Não encontrei lançamentos reconhecíveis. Tente colar o texto da fatura manualmente.');
      const existingForCardMonth = purchases.filter((p) => p.card_id === selectedId && cardInstallmentForMonth(p, impMonth) > 0);
      const reconciled = reconcilePreview(parsed, existingForCardMonth);
      setPreview(reconciled.map((p, idx) => ({
        _key: idx + '-' + Date.now(),
        description: p.description, category: p.category, amount: p.amount,
        installments: p.installTotal || 1,
        firstMonth: shiftMonth(impMonth, -(((p.installCurrent || 1) - 1))),
        purchaseDate: p.purchaseDate,
        reconcileStatus: p.reconcileStatus,
        matchedPurchase: p.matchedPurchase,
        include: p.reconcileStatus === 'new',
      })));
    } catch (err) {
      setImpError(err.message || 'Não consegui ler a fatura.');
    }
    setImpBusy(false);
  }
  function updatePreviewRow(idx, patch) {
    setPreview((prev) => prev.map((r, i) => (i === idx ? { ...r, ...patch } : r)));
  }
  async function confirmImport() {
    const rows = preview.filter((r) => r.include).map((r) => ({
      card_id: selectedId, description: r.description, category: r.category && r.category.trim() ? r.category.trim() : 'Outros',
      amount: Number(r.amount) * Number(r.installments || 1), installments: Number(r.installments) || 1,
      first_month: monthKeyToDate(r.firstMonth), purchase_date: r.purchaseDate || null,
    }));
    if (rows.length === 0) { setPreview(null); return; }
    const { error } = await sb.from('card_purchases').insert(rows);
    if (error) { setImpError(error.message); return; }
    setPreview(null); setImpText('');
    if (fileRef.current) fileRef.current.value = '';
    load();
  }

  if (loading) return <Banner type="info">Carregando...</Banner>;

  const selCard = cards.find((c) => c.id === selectedId);

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Cartões de crédito</h1><div className="page-sub">Cadastre quantos cartões precisar</div></div></div>
      {erro && <Banner type="error">{erro}</Banner>}

      <div className="card">
        <h3 className="section-title">Novo cartão</h3>
        <form className="entry-form" onSubmit={addCard}>
          <Field label="Nome do cartão"><input required value={ccName} placeholder="Nubank" onChange={(e) => setCcName(e.target.value)} /></Field>
          <Field label="Fechamento"><input required type="number" min="1" max="31" value={ccClose} placeholder="20" onChange={(e) => setCcClose(e.target.value)} /></Field>
          <Field label="Vencimento"><input required type="number" min="1" max="31" value={ccDue} placeholder="27" onChange={(e) => setCcDue(e.target.value)} /></Field>
          <Field label="Limite (R$)"><input type="number" step="0.01" min="0" value={ccLimit} placeholder="opcional" onChange={(e) => setCcLimit(e.target.value)} /></Field>
          <button type="submit" className="btn">Adicionar cartão</button>
        </form>
      </div>

      {cards.length === 0 ? (
        <div className="card section-gap"><Empty title="Nenhum cartão cadastrado" body="Adicione seu primeiro cartão acima para começar a lançar compras." /></div>
      ) : (
        <React.Fragment>
          <div className="cc-row section-gap">
            {cards.map((c) => {
              const cardInvoiceKey = currentInvoiceMonthKey(c);
              const total = cardTotalForMonth(purchases, c.id, cardInvoiceKey);
              const pct = c.limit_amount ? Math.min(100, (total / Number(c.limit_amount)) * 100) : null;
              const barColor = pct === null ? 'rgba(255,255,255,0.5)' : pct >= 90 ? '#E0574B' : pct >= 70 ? '#E0B84B' : 'rgba(255,255,255,0.75)';
              return (
                <div key={c.id} className={'card-chip' + (c.id === selectedId ? ' selected' : '')} style={{ background: c.color }} onClick={() => setSelectedId(c.id)}>
                  <div className="cc-name">{c.name}</div>
                  <div className="cc-info">Fecha dia {c.closing_day} · vence dia {c.due_day}</div>
                  <div className="cc-total">{fmtBRL(total)}</div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'rgba(255,255,255,0.65)', marginTop: 3 }}>fatura de {shortMonthLabel(cardInvoiceKey)}</div>
                  {pct !== null && (
                    <div style={{ marginTop: 10 }}>
                      <div style={{ height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.18)', overflow: 'hidden' }}>
                        <div style={{ width: pct + '%', height: '100%', background: barColor, borderRadius: 3 }}></div>
                      </div>
                      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'rgba(255,255,255,0.75)', marginTop: 4 }}>
                        {pct.toFixed(0)}% do limite ({fmtBRL(c.limit_amount)})
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {selCard && (
            <React.Fragment>
              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                  <h3 className="section-title" style={{ margin: 0 }}>Importar fatura — {selCard.name}</h3>
                  <button className="btn danger" onClick={() => deleteCard(selCard)}>Remover cartão</button>
                </div>
                <div className="page-sub" style={{ margin: '-8px 0 16px' }}>Ideal depois que a fatura fechar: envie o PDF (ou cole o texto) e o app confere contra o que você já lançou no mês — o que já está certo não duplica, o que tiver valor diferente é sinalizado, e só o que faltar entra como novo.</div>
                <div className="entry-form" style={{ gridTemplateColumns: '1fr 1.4fr auto' }}>
                  <Field label="Mês da fatura"><input type="month" value={impMonth} onChange={(e) => setImpMonth(e.target.value)} /></Field>
                  <Field label="Arquivo PDF da fatura"><input type="file" accept=".pdf,application/pdf" ref={fileRef} /></Field>
                  <button type="button" className="btn" onClick={handleExtract}>Importar fatura</button>
                </div>
                <Field label="Ou cole aqui o texto da fatura (opcional, se o PDF não for reconhecido)">
                  <textarea rows={4} value={impText} onChange={(e) => setImpText(e.target.value)}
                    placeholder={"10/08 UBER * TRIP SAO PAULO 23,90\n12/08 SUPERMERCADO BOM PRECO 3/6 145,00"}
                    style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 12.5, padding: '8px 10px', border: '1px solid var(--paper-line)', borderRadius: 7, resize: 'vertical' }} />
                </Field>
                {impBusy && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-faint)' }}>Lendo a fatura...</div>}
                {impError && <Banner type="error">{impError}</Banner>}

                {preview && (() => {
                  const nMatched = preview.filter((r) => r.reconcileStatus === 'matched').length;
                  const nMismatch = preview.filter((r) => r.reconcileStatus === 'mismatch').length;
                  const nNew = preview.filter((r) => r.reconcileStatus === 'new').length;
                  return (
                  <div style={{ marginTop: 18 }}>
                    <h4 style={{ fontFamily: 'var(--font-display)', fontSize: 15, margin: '0 0 10px' }}>Revisar {preview.length} lançamento(s) encontrado(s)</h4>
                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                      {nMatched > 0 && <span className="pill money">✓ {nMatched} já lançado(s) certo</span>}
                      {nMismatch > 0 && <span className="pill spend">⚠ {nMismatch} com valor diferente</span>}
                      {nNew > 0 && <span className="pill gold">🆕 {nNew} novo(s)</span>}
                    </div>
                    <div style={{ overflowX: 'auto' }}>
                    <table>
                      <thead><tr><th></th><th>Status</th><th>Descrição</th><th>Categoria</th><th className="num">Parcela (R$)</th><th>Parcelas</th><th>Data</th><th>1ª fatura</th></tr></thead>
                      <tbody>
                        {preview.map((r, idx) => (
                          <tr className="row-hover" key={r._key}>
                            <td><input type="checkbox" checked={r.include} onChange={(e) => updatePreviewRow(idx, { include: e.target.checked })} /></td>
                            <td>
                              {r.reconcileStatus === 'matched' && <span className="pill money" style={{ whiteSpace: 'nowrap' }}>✓ Já lançado</span>}
                              {r.reconcileStatus === 'mismatch' && (
                                <span className="pill spend" style={{ whiteSpace: 'nowrap' }} title={`Já lançado com ${fmtBRL(r.matchedPurchase ? Number(r.matchedPurchase.amount) / Number(r.matchedPurchase.installments || 1) : 0)}`}>
                                  ⚠ Valor diferente
                                </span>
                              )}
                              {r.reconcileStatus === 'new' && <span className="pill gold" style={{ whiteSpace: 'nowrap' }}>🆕 Novo</span>}
                            </td>
                            <td><input type="text" value={r.description} style={{ minWidth: 160 }} onChange={(e) => updatePreviewRow(idx, { description: e.target.value })} /></td>
                            <td>
                              <CategorySelect value={r.category} onChange={(v) => updatePreviewRow(idx, { category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} />
                            </td>
                            <td className="num"><input type="number" step="0.01" value={r.amount} style={{ width: 90, textAlign: 'right' }} onChange={(e) => updatePreviewRow(idx, { amount: parseFloat(e.target.value) || 0 })} /></td>
                            <td><input type="number" min="1" max="48" value={r.installments} style={{ width: 60 }} onChange={(e) => updatePreviewRow(idx, { installments: parseInt(e.target.value) || 1 })} /></td>
                            <td><input type="date" value={r.purchaseDate || ''} style={{ width: 130 }} onChange={(e) => updatePreviewRow(idx, { purchaseDate: e.target.value })} /></td>
                            <td style={{ textAlign: 'right' }}><span className="pill" style={{ fontFamily: 'var(--font-mono)' }}>{shortMonthLabel(r.firstMonth)}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    </div>
                    <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                      <button className="btn" onClick={confirmImport}>Confirmar importação</button>
                      <button className="btn ghost" onClick={() => setPreview(null)}>Cancelar</button>
                    </div>
                  </div>
                  );
                })()}
              </div>

              <div className="card section-gap">
                <h3 className="section-title">Lançar compra — {selCard.name}</h3>
                <form className="entry-form cols-6" onSubmit={addPurchase}>
                  <Field label="Descrição"><input required value={pDesc} placeholder="Supermercado" onChange={(e) => setPDesc(e.target.value)} /></Field>
                  <Field label="Categoria"><CategorySelect value={pCat} onChange={setPCat} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
                  <Field label="Valor total (R$)"><input required type="number" step="0.01" min="0" value={pAmount} placeholder="0,00" onChange={(e) => setPAmount(e.target.value)} /></Field>
                  <Field label="Data da compra"><input type="date" value={pDate} onChange={(e) => setPDate(e.target.value)} /></Field>
                  <Field label="Parcelas"><input required type="number" min="1" max="48" value={pInst} onChange={(e) => setPInst(e.target.value)} /></Field>
                  <Field label="1ª fatura"><input required type="month" value={pMonth} onChange={(e) => setPMonth(e.target.value)} /></Field>
                  <button type="submit" className="btn">Lançar</button>
                </form>
              </div>
            </React.Fragment>
          )}
        </React.Fragment>
      )}

      {cards.length > 0 && (() => {
        const usingRange = histFrom || histTo;
        const historyEntries = [];
        if (usingRange) {
          let a = histFrom ? histFrom.slice(0, 7) : historyMonth;
          let b = histTo ? histTo.slice(0, 7) : historyMonth;
          if (a > b) { const t = a; a = b; b = t; }
          monthsBetween(a, b).forEach((m) => {
            purchases.forEach((p) => {
              const amt = cardInstallmentForMonth(p, m);
              if (amt <= 0) return;
              const card = cards.find((c) => c.id === p.card_id);
              const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
              const [hy, hm] = m.split('-').map(Number);
              const idx = (hy - sy) * 12 + (hm - sm);
              historyEntries.push({ purchase: p, card, amount: amt, installIdx: idx + 1, invoiceMonth: m });
            });
          });
        } else {
          purchases.forEach((p) => {
            const amt = cardInstallmentForMonth(p, historyMonth);
            if (amt <= 0) return;
            const card = cards.find((c) => c.id === p.card_id);
            const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
            const [hy, hm] = historyMonth.split('-').map(Number);
            const idx = (hy - sy) * 12 + (hm - sm);
            historyEntries.push({ purchase: p, card, amount: amt, installIdx: idx + 1, invoiceMonth: historyMonth });
          });
        }
        const filtered = historyEntries.filter((h) =>
          (!histCard || h.purchase.card_id === histCard) &&
          (!histDesc.trim() || h.purchase.description.toLowerCase().includes(histDesc.trim().toLowerCase())) &&
          (!histCat || h.purchase.category === histCat)
        );
        filtered.sort((a, b) => (b.invoiceMonth + (b.purchase.purchase_date || '')).localeCompare(a.invoiceMonth + (a.purchase.purchase_date || '')));
        const histTotal = filtered.reduce((s, h) => s + h.amount, 0);
        const histCats = [...new Set(purchases.map((p) => p.category))].sort();
        const filtersActive = histCard || histDesc || histCat || usingRange;

        return (
          <div className="card section-gap">
            <div className="page-head" style={{ marginBottom: 18 }}>
              <div><h3 className="section-title" style={{ margin: 0 }}>Histórico de compras</h3><div className="page-sub">Todos os cartões, por fatura</div></div>
              <div className="month-nav">
                <button onClick={() => setHistoryMonth(shiftMonth(historyMonth, -1))} disabled={usingRange}>&#8592;</button>
                <input type="month" value={historyMonth} onChange={(e) => e.target.value && setHistoryMonth(e.target.value)} disabled={usingRange}
                  style={{ fontFamily: 'var(--font-mono)', fontSize: 13, border: '1px solid var(--paper-line)', borderRadius: 7, padding: '5px 8px', textTransform: 'capitalize' }} />
                <button onClick={() => setHistoryMonth(shiftMonth(historyMonth, 1))} disabled={usingRange}>&#8594;</button>
              </div>
            </div>

            <div className="entry-form cols-6" style={{ marginBottom: 4 }}>
              <Field label="Cartão">
                <select value={histCard} onChange={(e) => setHistCard(e.target.value)}>
                  <option value="">Todos</option>
                  {cards.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </Field>
              <Field label="Descrição"><input value={histDesc} placeholder="buscar..." onChange={(e) => setHistDesc(e.target.value)} /></Field>
              <Field label="Categoria">
                <select value={histCat} onChange={(e) => setHistCat(e.target.value)}>
                  <option value="">Todas</option>
                  {histCats.map((c) => <option key={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Fatura de"><input type="month" value={histFrom} onChange={(e) => setHistFrom(e.target.value)} /></Field>
              <Field label="Fatura até"><input type="month" value={histTo} onChange={(e) => setHistTo(e.target.value)} /></Field>
              <button type="button" className="btn ghost" onClick={() => { setHistCard(''); setHistDesc(''); setHistCat(''); setHistFrom(''); setHistTo(''); }} disabled={!filtersActive}>Limpar</button>
            </div>
            {usingRange && <div className="page-sub" style={{ margin: '0 0 10px' }}>Mostrando o intervalo de faturas selecionado — a navegação por mês acima fica pausada até limpar os filtros.</div>}

            <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '14px 4px 14px' }}>
              <span className="page-sub" style={{ margin: 0 }}>{filtersActive ? 'TOTAL FILTRADO' : 'TOTAL DA FATURA'}</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(histTotal)}</span>
            </div>

            {filtered.length === 0 ? (
              <Empty title={filtersActive ? 'Nenhuma compra encontrada com esses filtros' : 'Nenhuma compra nesta fatura'} body={filtersActive ? 'Ajuste ou limpe os filtros acima.' : 'Navegue pelos meses acima ou lance uma nova compra em algum cartão.'} />
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table>
                  <thead><tr><th>Fatura</th><th>Cartão</th><th>Descrição</th><th>Categoria</th><th>Parcela</th><th className="num">Valor</th><th>Data da compra</th><th></th></tr></thead>
                  <tbody>
                    {filtered.map((h, i) => (
                      <tr className="row-hover" key={h.purchase.id + '-' + h.invoiceMonth}>
                        <td>{shortMonthLabel(h.invoiceMonth)}</td>
                        <td><span className="pill gold">{h.card ? h.card.name : '—'}</span></td>
                        <td>{h.purchase.description}</td>
                        <td><span className="pill">{h.purchase.category}</span></td>
                        <td>{h.purchase.installments > 1 ? `${h.installIdx}/${h.purchase.installments}` : 'À vista'}</td>
                        <td className="num">{fmtBRL(h.amount)}</td>
                        <td>{h.purchase.purchase_date ? new Date(h.purchase.purchase_date + 'T00:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                        <td style={{ textAlign: 'right' }}><button className="icon-btn" onClick={() => deletePurchase(h.purchase)}>Remover</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

// ---------- Despesas (histórico, fixas + variáveis) ----------
function ExpenseHistoryTab({ session }) {
  const [list, setList] = useState([]);
  const [customCats, setCustomCats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [month, setMonth] = useState(monthKey(new Date()));

  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [desc, setDesc] = useState('');
  const [category, setCategory] = useState(CATS_EXP[0]);
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const [amount, setAmount] = useState('');
  const [notes, setNotes] = useState('');
  const [uploading, setUploading] = useState(false);
  const receiptRef = useRef(null);
  const editReceiptRef = useRef(null);
  const allCats = [...CATS_EXP, ...customCats];

  const [editingId, setEditingId] = useState(null);
  const [editRow, setEditRow] = useState(null);

  const [filterDesc, setFilterDesc] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterPay, setFilterPay] = useState('');
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const filtersActive = filterDesc || filterCat || filterPay || filterFrom || filterTo;
  function clearFilters() { setFilterDesc(''); setFilterCat(''); setFilterPay(''); setFilterFrom(''); setFilterTo(''); }

  async function load() {
    setLoading(true);
    const [rows, cats] = await Promise.all([
      sb.from('expense_entries').select('*').order('entry_date', { ascending: false }),
      sb.from('custom_categories').select('name').eq('kind', 'expense').order('created_at'),
    ]);
    if (rows.error) setErro(rows.error.message); else setList(rows.data || []);
    if (cats.data) setCustomCats(cats.data.map((c) => c.name));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  async function uploadReceipt(file) {
    const path = `${session.user.id}/${crypto.randomUUID()}-${file.name}`;
    const { error } = await sb.storage.from('comprovantes').upload(path, file);
    if (error) throw error;
    return path;
  }
  async function openReceipt(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir o comprovante.'); return; }
    window.open(data.signedUrl, '_blank');
  }

  async function handleAdd(ev) {
    ev.preventDefault();
    const amt = parseFloat(amount);
    if (!desc.trim() || !amt || !date) return;
    setUploading(true);
    let receiptPath = null;
    try {
      const file = receiptRef.current && receiptRef.current.files && receiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('expense_entries').insert({
      entry_date: date, description: desc.trim(), category, payment_method: paymentMethod, amount: amt, notes: notes.trim() || null, receipt_path: receiptPath,
    });
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setDesc(''); setAmount(''); setNotes('');
    if (receiptRef.current) receiptRef.current.value = '';
    load();
  }
  async function remove(row) {
    if (row.receipt_path) await sb.storage.from('comprovantes').remove([row.receipt_path]);
    await sb.from('expense_entries').delete().eq('id', row.id);
    load();
  }
  function startEdit(row) {
    setEditingId(row.id);
    setEditRow({ entry_date: row.entry_date, description: row.description, category: row.category, payment_method: row.payment_method || PAYMENT_METHODS[0], amount: row.amount, notes: row.notes || '', receipt_path: row.receipt_path || null });
  }
  function cancelEdit() { setEditingId(null); setEditRow(null); }
  async function saveEdit(id) {
    const amt = parseFloat(editRow.amount);
    if (!editRow.description.trim() || !amt || !editRow.entry_date) return;
    setUploading(true);
    let receiptPath = editRow.receipt_path;
    try {
      const file = editReceiptRef.current && editReceiptRef.current.files && editReceiptRef.current.files[0];
      if (file) receiptPath = await uploadReceipt(file);
    } catch (err) {
      setUploading(false);
      setErro('Não foi possível enviar o comprovante: ' + err.message);
      return;
    }
    const { error } = await sb.from('expense_entries').update({
      entry_date: editRow.entry_date, description: editRow.description.trim(), category: editRow.category,
      payment_method: editRow.payment_method, amount: amt, notes: editRow.notes.trim() || null, receipt_path: receiptPath,
    }).eq('id', id);
    setUploading(false);
    if (error) { setErro(error.message); return; }
    setEditingId(null); setEditRow(null);
    load();
  }

  const monthEntries = list.filter((e) => e.entry_date && e.entry_date.slice(0, 7) === month);
  const baseEntries = (filterFrom || filterTo)
    ? list.filter((e) => e.entry_date && (!filterFrom || e.entry_date >= filterFrom) && (!filterTo || e.entry_date <= filterTo))
    : monthEntries;
  const filteredEntries = baseEntries.filter((e) =>
    (!filterDesc.trim() || e.description.toLowerCase().includes(filterDesc.trim().toLowerCase())) &&
    (!filterCat || e.category === filterCat) &&
    (!filterPay || e.payment_method === filterPay)
  );
  const filteredTotal = filteredEntries.reduce((s, e) => s + Number(e.amount), 0);
  const allPaymentMethods = [...new Set([...PAYMENT_METHODS, ...list.map((e) => e.payment_method).filter(Boolean)])];

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Despesas</h1><div className="page-sub">Histórico de despesas fixas e variáveis, mês a mês</div></div>
        <div className="month-nav">
          <button onClick={() => setMonth(shiftMonth(month, -1))}>&#8592;</button>
          <span className="month-label">{monthLabel(month)}</span>
          <button onClick={() => setMonth(shiftMonth(month, 1))}>&#8594;</button>
        </div>
      </div>

      <div className="card">
        {erro && <Banner type="error">{erro}</Banner>}
        <form className="entry-form cols-6" onSubmit={handleAdd}>
          <Field label="Data"><input required type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Descrição"><input required value={desc} placeholder="Aluguel" onChange={(e) => setDesc(e.target.value)} /></Field>
          <Field label="Categoria"><CategorySelect value={category} onChange={setCategory} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></Field>
          <Field label="Forma de pagamento"><select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <Field label="Valor (R$)"><input required type="number" step="0.01" min="0" value={amount} placeholder="0,00" onChange={(e) => setAmount(e.target.value)} /></Field>
          <button type="submit" className="btn" disabled={uploading}>{uploading ? 'Enviando...' : 'Adicionar'}</button>
        </form>
        <div className="entry-form" style={{ gridTemplateColumns: '1fr 2fr', marginTop: -8 }}>
          <Field label="Observações (opcional)"><input value={notes} placeholder="ex: nome de quem prestou o serviço, detalhe da compra..." onChange={(e) => setNotes(e.target.value)} /></Field>
          <Field label="Comprovante (opcional)"><input type="file" accept="image/*,.pdf" capture="environment" ref={receiptRef} /></Field>
        </div>
      </div>

      <div className="card section-gap">
        <div style={{ marginTop: 0, paddingTop: 0 }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--ink-faint)', marginBottom: 8 }}>Filtrar</div>
          <div className="entry-form cols-6" style={{ marginBottom: filtersActive ? 10 : 0 }}>
            <Field label="Descrição"><input value={filterDesc} placeholder="buscar..." onChange={(e) => setFilterDesc(e.target.value)} /></Field>
            <Field label="Categoria">
              <select value={filterCat} onChange={(e) => setFilterCat(e.target.value)}>
                <option value="">Todas</option>
                {allCats.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Forma de pagamento">
              <select value={filterPay} onChange={(e) => setFilterPay(e.target.value)}>
                <option value="">Todas</option>
                {allPaymentMethods.map((p) => <option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="De"><input type="date" value={filterFrom} onChange={(e) => setFilterFrom(e.target.value)} /></Field>
            <Field label="Até"><input type="date" value={filterTo} onChange={(e) => setFilterTo(e.target.value)} /></Field>
            <button type="button" className="btn ghost" onClick={clearFilters} disabled={!filtersActive}>Limpar</button>
          </div>
          {(filterFrom || filterTo) && (
            <div className="page-sub" style={{ margin: 0 }}>Mostrando o intervalo de datas selecionado — a navegação por mês acima fica pausada até limpar os filtros.</div>
          )}
        </div>

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, margin: '18px 4px 14px' }}>
          <span className="page-sub" style={{ margin: 0 }}>{filtersActive ? 'TOTAL FILTRADO' : 'TOTAL DO MÊS'}</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, color: 'var(--spend-strong)' }}>{fmtBRL(filteredTotal)}</span>
        </div>

        {loading ? <Banner type="info">Carregando...</Banner> : filteredEntries.length === 0 ? (
          <Empty title={filtersActive ? 'Nenhuma despesa encontrada com esses filtros' : 'Nenhuma despesa lançada neste mês'} body={filtersActive ? 'Ajuste ou limpe os filtros acima para ver outros lançamentos.' : 'Preencha o formulário acima para lançar uma despesa fixa ou variável.'} />
        ) : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma de pagamento</th><th className="num">Valor</th><th>Observações</th><th>Comprovante</th><th></th></tr></thead>
            <tbody>
              {filteredEntries.map((e) => editingId === e.id ? (
                <tr className="row-hover" key={e.id}>
                  <td><input type="date" value={editRow.entry_date} onChange={(ev) => setEditRow({ ...editRow, entry_date: ev.target.value })} style={{ width: 140 }} /></td>
                  <td><input value={editRow.description} onChange={(ev) => setEditRow({ ...editRow, description: ev.target.value })} style={{ minWidth: 120 }} /></td>
                  <td><CategorySelect value={editRow.category} onChange={(v) => setEditRow({ ...editRow, category: v })} options={allCats} kind="expense" onCreated={(n) => setCustomCats((prev) => [...prev, n])} /></td>
                  <td>
                    <select value={editRow.payment_method} onChange={(ev) => setEditRow({ ...editRow, payment_method: ev.target.value })}>
                      {PAYMENT_METHODS.map((p) => <option key={p}>{p}</option>)}
                    </select>
                  </td>
                  <td className="num"><input type="number" step="0.01" min="0" value={editRow.amount} onChange={(ev) => setEditRow({ ...editRow, amount: ev.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input value={editRow.notes} onChange={(ev) => setEditRow({ ...editRow, notes: ev.target.value })} style={{ minWidth: 100 }} /></td>
                  <td>
                    {editRow.receipt_path && <div style={{ marginBottom: 4 }}><button type="button" className="icon-btn" onClick={() => openReceipt(editRow.receipt_path)}>Ver atual</button></div>}
                    <input type="file" accept="image/*,.pdf" capture="environment" ref={editReceiptRef} style={{ width: 140, fontSize: 11 }} />
                  </td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => saveEdit(e.id)}>Salvar</button>
                    <button className="icon-btn" onClick={cancelEdit}>Cancelar</button>
                  </td>
                </tr>
              ) : (
                <tr className="row-hover" key={e.id}>
                  <td>{new Date(e.entry_date + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                  <td>{e.description}</td>
                  <td><span className="pill">{e.category}</span></td>
                  <td>
                    {e.payment_method || '—'}
                    {e.payment_method === 'Cartão de crédito' && (
                      <div style={{ fontSize: 10.5, color: 'var(--ink-faint)', marginTop: 2 }} title="Este valor não entra no saldo geral nem no fluxo de caixa — quem soma gasto de cartão é a aba Cartões. Lance a compra lá também se ainda não tiver feito.">
                        não soma no saldo ⓘ
                      </div>
                    )}
                  </td>
                  <td className="num">{fmtBRL(e.amount)}</td>
                  <td style={{ color: 'var(--ink-faint)' }}>{e.notes || '—'}</td>
                  <td>{e.receipt_path ? <button className="icon-btn" onClick={() => openReceipt(e.receipt_path)}>Ver</button> : <span style={{ color: 'var(--ink-faint)' }}>—</span>}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                    <button className="icon-btn" onClick={() => startEdit(e)}>Editar</button>
                    <button className="icon-btn" onClick={() => remove(e)}>Remover</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Supermercado ----------
function GroceryTab({ session }) {
  const [receipts, setReceipts] = useState([]);
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);

  const [captureMode, setCaptureMode] = useState(null); // null | 'photo' | 'qr' | 'manual'
  const [preview, setPreview] = useState(null); // array de itens em revisão
  const [storeName, setStoreName] = useState('');
  const [purchaseDate, setPurchaseDate] = useState(new Date().toISOString().slice(0, 10));
  const [paymentMethod, setPaymentMethod] = useState(PAYMENT_METHODS[0]);
  const [accessKey, setAccessKey] = useState(null);
  const [source, setSource] = useState('manual');
  const [saving, setSaving] = useState(false);
  const receiptFileRef = useRef(null);

  const [ocrBusy, setOcrBusy] = useState(false);
  const [ocrError, setOcrError] = useState(null);
  const photoRef = useRef(null);

  const [qrBusy, setQrBusy] = useState(false);
  const [qrError, setQrError] = useState(null);
  const [qrUrl, setQrUrl] = useState(null);
  const [pastedText, setPastedText] = useState('');
  const qrPhotoRef = useRef(null);

  const [priceSearch, setPriceSearch] = useState('');

  async function load() {
    setLoading(true);
    const [r, i] = await Promise.all([
      sb.from('grocery_receipts').select('*').order('purchase_date', { ascending: false }),
      sb.from('grocery_items').select('*').order('created_at', { ascending: false }),
    ]);
    if (r.error) setErro(r.error.message); else setReceipts(r.data || []);
    if (i.error) setErro(i.error.message); else setItems(i.data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function startReview(parsedItems, opts) {
    setPreview(parsedItems.map((it) => ({
      _key: crypto.randomUUID(),
      description: it.description, quantity: it.quantity || 1, unit: it.unit || '',
      unitPrice: it.unitPrice != null ? it.unitPrice : it.totalPrice, totalPrice: it.totalPrice,
    })));
    setStoreName((opts && opts.storeName) || '');
    setPurchaseDate((opts && opts.purchaseDate) || new Date().toISOString().slice(0, 10));
    setAccessKey((opts && opts.accessKey) || null);
    setSource((opts && opts.source) || 'manual');
  }

  async function handlePhoto() {
    const file = photoRef.current && photoRef.current.files && photoRef.current.files[0];
    if (!file) { setOcrError('Escolha ou tire uma foto do cupom primeiro.'); return; }
    setOcrBusy(true); setOcrError(null);
    try {
      const text = await ocrImageToText(file);
      const parsed = parseGroceryLines(text.split('\n'));
      if (parsed.length === 0) throw new Error('Não consegui reconhecer itens nessa foto. Tente tirar de novo com mais luz e foco, ou lance manualmente.');
      startReview(parsed, { source: 'photo' });
    } catch (err) {
      setOcrError(err.message || 'Não consegui ler a foto.');
    }
    setOcrBusy(false);
  }

  async function handleReadQR() {
    const file = qrPhotoRef.current && qrPhotoRef.current.files && qrPhotoRef.current.files[0];
    if (!file) { setQrError('Escolha ou tire uma foto do QR Code primeiro.'); return; }
    setQrBusy(true); setQrError(null);
    try {
      const url = await decodeQRFromImage(file);
      if (!url) throw new Error('Não consegui identificar um QR Code nessa imagem. Tente uma foto mais próxima e nítida.');
      setQrUrl(url);
      setAccessKey(extractAccessKeyFromQRUrl(url));
    } catch (err) {
      setQrError(err.message || 'Não consegui ler o QR Code.');
    }
    setQrBusy(false);
  }
  function handleProcessPastedText() {
    const parsed = parseGroceryLines(pastedText.split('\n'));
    if (parsed.length === 0) { setQrError('Não encontrei itens reconhecíveis no texto colado.'); return; }
    startReview(parsed, { source: 'qrcode', accessKey });
  }

  function updatePreviewRow(idx, patch) {
    setPreview((prev) => prev.map((r, i) => {
      if (i !== idx) return r;
      const merged = { ...r, ...patch };
      if ('quantity' in patch || 'unitPrice' in patch) {
        merged.totalPrice = Math.round(Number(merged.quantity || 1) * Number(merged.unitPrice || 0) * 100) / 100;
      }
      return merged;
    }));
  }
  function addManualRow() {
    setPreview((prev) => [...(prev || []), { _key: crypto.randomUUID(), description: '', quantity: 1, unit: '', unitPrice: 0, totalPrice: 0 }]);
  }
  function removePreviewRow(idx) {
    setPreview((prev) => prev.filter((_, i) => i !== idx));
  }

  const previewTotal = (preview || []).reduce((s, r) => s + Number(r.totalPrice || 0), 0);

  async function saveReceipt() {
    if (!preview || preview.length === 0) { setErro('Adicione ao menos um item antes de salvar.'); return; }
    if (!purchaseDate) { setErro('Informe a data da compra.'); return; }
    setSaving(true); setErro(null);
    try {
      let receiptPhotoPath = null;
      const receiptFile = receiptFileRef.current && receiptFileRef.current.files && receiptFileRef.current.files[0];
      if (receiptFile) {
        const path = `${session.user.id}/grocery/${crypto.randomUUID()}-${receiptFile.name}`;
        const { error: upErr } = await sb.storage.from('comprovantes').upload(path, receiptFile);
        if (upErr) throw new Error('Não foi possível salvar a foto da nota: ' + upErr.message);
        receiptPhotoPath = path;
      }
      const { data: receipt, error: rErr } = await sb.from('grocery_receipts').insert({
        store_name: storeName.trim() || null, purchase_date: purchaseDate, total_amount: previewTotal,
        access_key: accessKey, source, receipt_photo_path: receiptPhotoPath,
      }).select().single();
      if (rErr) throw rErr;
      const itemRows = preview.map((r) => ({
        receipt_id: receipt.id, description: r.description.trim(), quantity: Number(r.quantity) || 1,
        unit: r.unit || null, unit_price: Number(r.unitPrice) || null, total_price: Number(r.totalPrice) || 0,
      }));
      const { error: iErr } = await sb.from('grocery_items').insert(itemRows);
      if (iErr) throw iErr;
      // Integra com o resto do app: entra também como despesa no histórico de Despesas.
      await sb.from('expense_entries').insert({
        entry_date: purchaseDate, description: storeName.trim() || 'Supermercado', category: 'Alimentação',
        payment_method: paymentMethod, amount: previewTotal, notes: 'Nota de supermercado (' + preview.length + ' itens)',
      });
      setPreview(null); setCaptureMode(null); setStoreName(''); setQrUrl(null); setAccessKey(null); setPastedText('');
      if (photoRef.current) photoRef.current.value = '';
      if (qrPhotoRef.current) qrPhotoRef.current.value = '';
      if (receiptFileRef.current) receiptFileRef.current.value = '';
      load();
    } catch (err) {
      setErro(err.message);
    }
    setSaving(false);
  }
  async function openReceiptPhoto(path) {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrl(path, 60);
    if (error) { setErro('Não foi possível abrir a foto da nota.'); return; }
    window.open(data.signedUrl, '_blank');
  }
  async function deleteReceipt(r) {
    if (r.receipt_photo_path) await sb.storage.from('comprovantes').remove([r.receipt_photo_path]);
    await sb.from('grocery_receipts').delete().eq('id', r.id);
    load();
  }

  // Histórico de preço por produto — a peça central pra acompanhar inflação item a item.
  const priceMatches = priceSearch.trim().length >= 2
    ? items.filter((it) => normalizeText(it.description).includes(normalizeText(priceSearch)))
        .map((it) => ({ ...it, receipt: receipts.find((r) => r.id === it.receipt_id) }))
        .filter((it) => it.receipt)
        .sort((a, b) => a.receipt.purchase_date.localeCompare(b.receipt.purchase_date))
    : [];
  const priceFirst = priceMatches[0], priceLast = priceMatches[priceMatches.length - 1];
  const priceChangePct = priceFirst && priceLast && priceFirst.unit_price && priceMatches.length > 1
    ? ((Number(priceLast.unit_price) - Number(priceFirst.unit_price)) / Number(priceFirst.unit_price)) * 100
    : null;
  // Preço médio ponderado pela quantidade — o preço médio que você de fato pagou por unidade,
  // não a média simples entre as compras.
  const priceMatchesWithPrice = priceMatches.filter((it) => it.unit_price);
  const avgPrice = priceMatchesWithPrice.length
    ? priceMatchesWithPrice.reduce((s, it) => s + Number(it.unit_price) * Number(it.quantity || 1), 0) /
      priceMatchesWithPrice.reduce((s, it) => s + Number(it.quantity || 1), 0)
    : null;
  const vsAvgPct = avgPrice && priceLast && priceLast.unit_price ? ((Number(priceLast.unit_price) - avgPrice) / avgPrice) * 100 : null;

  // Radar de preços: entre produtos com pelo menos 3 compras, quais estão hoje
  // mais distantes (pra cima ou pra baixo) da própria média histórica.
  const productGroups = {};
  items.forEach((it) => {
    if (!it.unit_price) return;
    const r = receipts.find((rr) => rr.id === it.receipt_id);
    if (!r) return;
    const key = normalizeText(it.description);
    if (!productGroups[key]) productGroups[key] = [];
    productGroups[key].push({ ...it, receipt: r });
  });
  const radar = Object.values(productGroups)
    .filter((g) => g.length >= 3)
    .map((g) => {
      const sorted = [...g].sort((a, b) => a.receipt.purchase_date.localeCompare(b.receipt.purchase_date));
      const last = sorted[sorted.length - 1];
      const avg = sorted.reduce((s, it) => s + Number(it.unit_price) * Number(it.quantity || 1), 0) / sorted.reduce((s, it) => s + Number(it.quantity || 1), 0);
      const pct = ((Number(last.unit_price) - avg) / avg) * 100;
      return { description: last.description, avg, last: Number(last.unit_price), pct, count: sorted.length };
    })
    .filter((r) => Math.abs(r.pct) >= 5)
    .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))
    .slice(0, 8);

  if (loading) return <Banner type="info">Carregando...</Banner>;

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Supermercado</h1><div className="page-sub">Cada item, para acompanhar preços e a inflação no seu bolso</div></div></div>
      {erro && <Banner type="error">{erro}</Banner>}

      {!preview && (
        <div className="card">
          <h3 className="section-title">Nova nota</h3>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: captureMode ? 20 : 0 }}>
            <button className={'btn' + (captureMode === 'photo' ? '' : ' ghost')} onClick={() => setCaptureMode('photo')}>📷 Tirar foto do cupom</button>
            <button className={'btn' + (captureMode === 'qr' ? '' : ' ghost')} onClick={() => setCaptureMode('qr')}>🔲 Escanear QR Code</button>
            <button className={'btn' + (captureMode === 'manual' ? '' : ' ghost')} onClick={() => { setCaptureMode('manual'); startReview([], { source: 'manual' }); }}>✏️ Lançar manualmente</button>
          </div>

          {captureMode === 'photo' && (
            <div>
              <div className="page-sub" style={{ margin: '0 0 12px' }}>Tire uma foto nítida do cupom, com boa luz. Funciona com qualquer nota, mesmo sem QR Code.</div>
              <div className="entry-form" style={{ gridTemplateColumns: '1fr auto' }}>
                <Field label="Foto do cupom"><input type="file" accept="image/*" capture="environment" ref={photoRef} /></Field>
                <button type="button" className="btn" onClick={handlePhoto} disabled={ocrBusy}>{ocrBusy ? 'Lendo...' : 'Processar foto'}</button>
              </div>
              {ocrBusy && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-faint)' }}>Lendo o cupom — pode levar um tempinho, principalmente na primeira vez.</div>}
              {ocrError && <Banner type="error">{ocrError}</Banner>}
            </div>
          )}

          {captureMode === 'qr' && (
            <div>
              <div className="page-sub" style={{ margin: '0 0 12px' }}>Fotografe o QR Code da nota. Isso não lê os itens sozinho — abre a consulta oficial da Sefaz pra você copiar o texto, e o app organiza pra você.</div>
              <div className="entry-form" style={{ gridTemplateColumns: '1fr auto' }}>
                <Field label="Foto do QR Code"><input type="file" accept="image/*" capture="environment" ref={qrPhotoRef} /></Field>
                <button type="button" className="btn" onClick={handleReadQR} disabled={qrBusy}>{qrBusy ? 'Lendo...' : 'Ler QR Code'}</button>
              </div>
              {qrBusy && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-faint)' }}>Lendo o QR Code...</div>}
              {qrError && <Banner type="error">{qrError}</Banner>}
              {qrUrl && (
                <div style={{ marginTop: 14 }}>
                  <Banner type="success">QR Code lido! Chave de acesso: {accessKey || '—'}</Banner>
                  <a href={qrUrl} target="_blank" rel="noopener noreferrer" className="btn ghost" style={{ display: 'inline-block', textDecoration: 'none', marginBottom: 14 }}>Abrir nota fiscal no site da Sefaz ↗</a>
                  <Field label="Cole aqui o texto dos itens copiado da página da Sefaz">

      {radar.length > 0 && (

                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="card section-gap">
        <h3 className="section-title">Notas registradas</h3>
        {receipts.length === 0 ? (
          <Empty title="Nenhuma nota registrada ainda" body="Use uma das opções acima para lançar sua primeira nota de supermercado." />

              <tbody>

                    <td>{r.store_name || '—'}</td>

    </div>
  );

// ---------- Fluxo de caixa ----------
function CashflowTab({ cashflowMonth, setCashflowMonth }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let active = true;
    (async () => {
      const [fx, inc, crd, pur, exp] = await Promise.all([
        sb.from('fixed_expenses').select('*'),
        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
        sb.from('expense_entries').select('*'),
      ]);
      if (!active) return;
      setData({ fixedExpenses: fx.data || [], income: inc.data || [], cards: crd.data || [], purchases: pur.data || [], expenseEntries: exp.data || [] });
      setLoading(false);
    })();
    return () => { active = false; };
  }, []);

  if (loading || !data) return <Banner type="info">Carregando...</Banner>;

  const key = cashflowMonth;
  let entries = [];
  data.income.forEach((inc) => {
    if (inc.recurring) entries.push({ desc: inc.name, cat: inc.category, day: 1, amount: Number(inc.amount), kind: 'in' });
    else if (inc.income_date && inc.income_date.slice(0, 7) === key) entries.push({ desc: inc.name, cat: inc.category, day: Number(inc.income_date.slice(8, 10)), amount: Number(inc.amount), kind: 'in' });
  });
  data.fixedExpenses.filter((e) => e.active).forEach((e) => {
    entries.push({ desc: e.name, cat: e.category, day: Number(e.due_day), amount: Number(e.amount), kind: 'out' });
  });
  data.purchases.forEach((p) => {
    const amt = cardInstallmentForMonth(p, key);
    if (amt > 0) {
      const card = data.cards.find((c) => c.id === p.card_id);
      const [sy, sm] = toMonthKey(p.first_month).split('-').map(Number);
      const [ky, km] = key.split('-').map(Number);
      const idx = (ky - sy) * 12 + (km - sm);
      entries.push({
        desc: p.description + (p.installments > 1 ? ` (${idx + 1}/${p.installments})` : ''),
        cat: 'Cartão · ' + (card ? card.name : ''), day: card ? Number(card.due_day) : 1, amount: amt, kind: 'out',
      });
    }
  });
  nonCardExpenseEntriesForMonth(data.expenseEntries, key).forEach((e) => {
    entries.push({ desc: e.description, cat: e.category, day: Number(e.entry_date.slice(8, 10)), amount: Number(e.amount), kind: 'out' });
  });
  entries.sort((a, b) => a.day - b.day);

  const totalIn = entries.filter((e) => e.kind === 'in').reduce((s, e) => s + e.amount, 0);
  const totalOut = entries.filter((e) => e.kind === 'out').reduce((s, e) => s + e.amount, 0);
  const net = totalIn - totalOut;

  const months = [];
  for (let i = 5; i >= 0; i--) months.push(shiftMonth(key, -i));
  const nets = months.map((m) => {
    const inc = incomeForMonth(data.income, m);
    const fx = fixedTotalMonthly(data.fixedExpenses);
    const cd = allCardsTotalForMonth(data.purchases, m);
    const vr = nonCardExpenseTotalForMonth(data.expenseEntries, m);
    return { m, val: inc - fx - cd - vr };
  });
  const maxAbs = Math.max(1, ...nets.map((n) => Math.abs(n.val)));

  let runningBalance = 0;

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Fluxo de caixa</h1><div className="page-sub">Entradas e saídas mês a mês</div></div>
        <div className="month-nav">
          <button onClick={() => setCashflowMonth(shiftMonth(key, -1))}>&#8592;</button>
          <span className="month-label">{monthLabel(key)}</span>
          <button onClick={() => setCashflowMonth(shiftMonth(key, 1))}>&#8594;</button>
        </div>
      </div>

      <div className={'balance-strip ' + (net >= 0 ? 'pos' : 'neg')}>
        <span className="label">Saldo do mês</span><span className="value">{fmtBRL(net)}</span>
      </div>
      <div className="grid grid-2" style={{ marginBottom: 22 }}>
        <div className="card"><p className="stat-label">Total de entradas</p><p className="stat-value money">{fmtBRL(totalIn)}</p></div>
        <div className="card"><p className="stat-label">Total de saídas</p><p className="stat-value spend">{fmtBRL(totalOut)}</p></div>
      </div>

      <div className="card">
        <h3 className="section-title">Saldo — últimos 6 meses</h3>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 120, paddingTop: 10 }}>
          {nets.map((n) => {
            const h = Math.max(3, Math.round((Math.abs(n.val) / maxAbs) * 90));
            const color = n.val >= 0 ? 'var(--money)' : 'var(--spend)';
            return (
              <div key={n.m} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginBottom: 4 }}>{fmtBRL(n.val)}</div>
                <div style={{ width: '100%', maxWidth: 34, height: h, background: color, borderRadius: '4px 4px 0 0' }}></div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-faint)', marginTop: 6, textTransform: 'capitalize' }}>{MONTH_NAMES[Number(n.m.split('-')[1]) - 1].slice(0, 3)}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Lançamentos do mês</h3>
        {entries.length === 0 ? <Empty title="Sem lançamentos neste mês" body="Cadastre receitas, despesas fixas ou compras no cartão para ver o fluxo aqui." /> : (
          <div style={{ overflowX: 'auto' }}>
          <table>
            <thead><tr><th>Dia</th><th>Descrição</th><th>Categoria</th><th className="num">Valor</th><th className="num">Saldo acum.</th></tr></thead>
            <tbody>
              {entries.map((e, i) => {
                runningBalance += e.kind === 'in' ? e.amount : -e.amount;
                return (
                  <tr className="row-hover" key={i}>
                    <td>Dia {String(e.day).padStart(2, '0')}</td>
                    <td>{e.desc}</td>
                    <td><span className={'pill ' + (e.kind === 'in' ? 'money' : 'spend')}>{e.cat}</span></td>
                    <td className="num" style={{ color: e.kind === 'in' ? 'var(--money-strong)' : 'var(--spend-strong)' }}>{e.kind === 'in' ? '+' : '−'} {fmtBRL(e.amount)}</td>
                    <td className="num">{fmtBRL(runningBalance)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Privacidade (LGPD) ----------
function PrivacyTab({ session }) {
  const [openDoc, setOpenDoc] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [exportError, setExportError] = useState(null);
  const [deleteStep, setDeleteStep] = useState('idle'); // idle | confirming | scheduling
  const [deleteConfirmText, setDeleteConfirmText] = useState('');
  const [deleteError, setDeleteError] = useState(null);
  const [pendingDeletionAt, setPendingDeletionAt] = useState(undefined); // undefined = carregando
  const [cancelling, setCancelling] = useState(false);

  useEffect(() => {
    sb.from('profiles').select('pending_deletion_at').eq('id', session.user.id).maybeSingle()
      .then(({ data }) => setPendingDeletionAt(data ? data.pending_deletion_at : null));
  }, [session.user.id]);

  async function handleExport() {
    setExporting(true);
    setExportError(null);
    try {
      const [fx, inc, crd, pur, exp, cats] = await Promise.all([
        sb.from('fixed_expenses').select('*'),
        sb.from('income').select('*'),
        sb.from('cards').select('*'),
        sb.from('card_purchases').select('*'),
        sb.from('expense_entries').select('*'),
        sb.from('custom_categories').select('*'),
      ]);
      const payload = {
        exportado_em: new Date().toISOString(),
        conta: session.user.email,
        despesas_fixas: fx.data || [],
        receitas: inc.data || [],
        cartoes: crd.data || [],
        compras_cartao: pur.data || [],
        despesas_lancadas: exp.data || [],
        categorias_personalizadas: cats.data || [],
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tonus-financeiro-meus-dados-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      setExportError('Não foi possível gerar o arquivo: ' + err.message);
    }
    setExporting(false);
  }

  async function handleScheduleDeletion() {
    setDeleteStep('scheduling');
    setDeleteError(null);
    const when = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();
    const { error } = await sb.from('profiles').update({ pending_deletion_at: when }).eq('id', session.user.id);
    if (error) { setDeleteError(error.message); setDeleteStep('confirming'); return; }
    setPendingDeletionAt(when);
    setDeleteStep('idle');
    setDeleteConfirmText('');
  }

  async function handleCancelDeletion() {
    setCancelling(true);
    const { error } = await sb.from('profiles').update({ pending_deletion_at: null }).eq('id', session.user.id);
    setCancelling(false);
    if (!error) setPendingDeletionAt(null);
  }

  return (
    <div>
      <div className="page-head"><div><h1 className="page-title">Privacidade</h1><div className="page-sub">Seus direitos sobre os seus dados, conforme a LGPD</div></div></div>

      <div className="card">
        <h3 className="section-title">Documentos</h3>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn ghost" onClick={() => setOpenDoc('privacy')}>Ver Política de Privacidade</button>
          <button className="btn ghost" onClick={() => setOpenDoc('terms')}>Ver Termos de Uso</button>
        </div>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Baixar meus dados</h3>
        <p style={{ fontSize: 13.5, color: 'var(--ink-soft)', margin: '0 0 14px' }}>
          Gera um arquivo com tudo que você cadastrou no Tonus Financeiro — despesas, receitas, cartões e categorias — para você guardar ou levar a outro serviço.
        </p>
        {exportError && <Banner type="error">{exportError}</Banner>}
        <button className="btn" onClick={handleExport} disabled={exporting}>{exporting ? 'Gerando arquivo...' : 'Baixar meus dados'}</button>
      </div>

      <div className="card section-gap">
        <h3 className="section-title">Excluir minha conta</h3>

        {pendingDeletionAt ? (
          <div>
            <Banner type="error">
              Sua conta está agendada para exclusão definitiva em <strong>{new Date(pendingDeletionAt).toLocaleDateString('pt-BR')}</strong>. Até lá, você pode cancelar quando quiser — inclusive basta entrar de novo com seu login que isso é feito automaticamente.
            </Banner>
            <button className="btn ghost" onClick={handleCancelDeletion} disabled={cancelling}>{cancelling ? 'Cancelando...' : 'Cancelar exclusão agora'}</button>
          </div>
        ) : (
          <React.Fragment>
            <p style={{ fontSize: 13.5, color: 'var(--ink-soft)', margin: '0 0 14px' }}>
              Ao confirmar, sua conta entra num prazo de carência de <strong>7 dias</strong>. Se você não entrar novamente nesse período, ao final dele sua conta, login e todos os dados cadastrados — despesas, receitas, cartões e comprovantes — são apagados permanentemente, sem possibilidade de recuperação. Entrar novamente antes do prazo cancela a exclusão automaticamente. Depois de excluída, você pode se cadastrar de novo quando quiser — só que como uma conta nova, sem o histórico de antes.
            </p>
            {deleteStep === 'idle' && (
              <button className="btn danger" onClick={() => setDeleteStep('confirming')}>Excluir minha conta</button>
            )}
            {deleteStep === 'confirming' && (
              <div>
                {deleteError && <Banner type="error">{deleteError}</Banner>}
                <p style={{ fontSize: 13, color: 'var(--spend-strong)', marginBottom: 10 }}>
                  Para confirmar, digite seu e-mail (<strong>{session.user.email}</strong>) no campo abaixo:
                </p>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <input value={deleteConfirmText} onChange={(e) => setDeleteConfirmText(e.target.value)} placeholder={session.user.email} style={{ maxWidth: 260 }} />
                  <button className="btn danger" disabled={deleteConfirmText !== session.user.email} onClick={handleScheduleDeletion}>
                    Confirmar exclusão (em 7 dias)
                  </button>
                  <button className="btn ghost" onClick={() => { setDeleteStep('idle'); setDeleteConfirmText(''); setDeleteError(null); }}>Cancelar</button>
                </div>
              </div>
            )}
            {deleteStep === 'scheduling' && <Banner type="info">Agendando...</Banner>}
          </React.Fragment>
        )}
      </div>

      <PolicyModal doc={openDoc} onClose={() => setOpenDoc(null)} />
    </div>
  );
}

  const [deletionCancelledNotice, setDeletionCancelledNotice] = useState(false);

    // Garante que exista um registro de consentimento para esta conta — cobre
    // tanto quem aceitou e já entrou direto quanto quem precisou confirmar o
    // e-mail antes do primeiro login.
    (async () => {
      const { data: existing } = await sb.from('profiles').select('id, pending_deletion_at').eq('id', session.user.id).maybeSingle();
      if (!existing) {
        await sb.from('profiles').insert({
          id: session.user.id,
          terms_accepted_at: new Date().toISOString(),
          privacy_accepted_at: new Date().toISOString(),
          policy_version: POLICY_VERSION,
        });
      } else if (existing.pending_deletion_at) {
        // A pessoa tinha pedido exclusão da conta e entrou de novo dentro do
        // prazo de carência — cancela automaticamente, como prometido a ela.
        await sb.from('profiles').update({ pending_deletion_at: null }).eq('id', session.user.id);
        setDeletionCancelledNotice(true);
      }
    })();
  }, [session.user.id]);

  return (
    <div id="app">
      <aside id="sidebar">
        <div className="brand">
          <img src="logo-icon.png" alt="Tonus" style={{ height: 30, marginBottom: 12, display: 'block' }} />
          <div className="brand-mark">Tonus Financeiro</div>
          <div className="brand-sub">Equilíbrio para suas finanças</div>
        </div>
        <nav>
          {TABS.map((t) => (
            <button key={t.id} className={'tab' + (tab === t.id ? ' active' : '')} onClick={() => setTab(t.id)}>
              <span className="num">{t.n}</span><span>{t.label}</span>
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          {session.user.email}
          <br /><button className="icon-btn" style={{ padding: '6px 0', color: 'var(--cream-on-cover-soft)' }} onClick={() => sb.auth.signOut()}>Sair</button>
        </div>
      </aside>
      <main id="main">
        {deletionCancelledNotice && (
          <div style={{ marginBottom: 20 }}>
            <Banner type="success">
              Sua exclusão de conta foi cancelada automaticamente porque você entrou novamente. Seus dados continuam intactos.
              <button className="icon-btn" style={{ marginLeft: 10 }} onClick={() => setDeletionCancelledNotice(false)}>Dispensar</button>
            </Banner>
          </div>
        )}
        {tab === 'dashboard' && <DashboardTab />}
        {tab === 'fixed' && <FixedExpensesTab />}
        {tab === 'expenses' && <ExpenseHistoryTab session={session} />}
        {tab === 'cards' && <CardsTab />}
        {tab === 'grocery' && <GroceryTab session={session} />}
        {tab === 'income' && <IncomeTab />}
        {tab === 'cashflow' && <CashflowTab cashflowMonth={cashflowMonth} setCashflowMonth={setCashflowMonth} />}
        {tab === 'privacy' && <PrivacyTab session={session} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthGate>{(session) => <App session={session} />}</AuthGate>
);

</script>

<script>
  // Registro do service worker (permite "Adicionar à tela inicial" no celular)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
